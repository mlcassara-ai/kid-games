<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castle Quest</title>
<meta name="theme-color" content="#7cc4f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Castle Quest">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2d2a4a; --sky1:#8fd0ff; --sky2:#e6f6ff; --paper:#fffdf6; --red:#ff5a5f; --redd:#c93338; --blue:#4a90ff; --blued:#2a62c9;
  --green:#35c16f; --greend:#1f8a4b; --gold:#ffc83d; --goldd:#c78c00; --muted:#6f6a8a; --line:#2d2a4a;
  --r:18px; --shadow:0 4px 0 rgba(45,42,74,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;}
body{font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);overscroll-behavior:none;}
button{font-family:inherit;color:inherit;cursor:pointer}
input{font-family:inherit}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.on{display:block}
#scr-game.on{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

/* buttons */
.btn{border:3px solid var(--line);border-radius:14px;padding:10px 16px;font-size:17px;font-weight:600;background:#fff;box-shadow:var(--shadow);transition:transform .08s, box-shadow .08s;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(45,42,74,.9)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{font-size:22px;padding:14px 22px;border-radius:18px}
.btn.small{font-size:15px;padding:6px 12px;border-radius:12px}
.btn.icon{width:44px;height:44px;padding:0;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.gold{background:var(--gold)}
.btn.white{background:#fff}
.btn.wide{width:100%}

/* home */
.home-wrap{max-width:560px;margin:0 auto;padding:24px 16px 60px;text-align:center}
.title-art{height:150px;display:flex;justify-content:center}
.title-art svg{height:150px;width:auto;overflow:visible}
.title{font-size:54px;margin:4px 0 0;letter-spacing:1px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.tag{margin:6px 0 20px;font-size:18px;color:var(--ink);font-weight:500}
.home-btns{display:flex;flex-direction:column;gap:14px;max-width:340px;margin:0 auto}
.sub{margin:32px 0 10px;font-size:24px}
.games-list{display:flex;flex-direction:column;gap:12px;text-align:left}
.gcard{background:var(--paper);border:3px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;position:relative}
.gcard .gp{display:flex;gap:4px;font-size:26px}
.gcard .gp span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid;background:#fff}
.gcard .gp span.out{opacity:.35}
.gcard .gi{flex:1;min-width:0}
.gcard .gi b{display:block;font-size:17px}
.gcard .gi small{color:var(--muted);font-size:14px}
.gcard .st{font-size:14px;font-weight:600;padding:4px 10px;border-radius:999px;border:2px solid var(--line);white-space:nowrap}
.st.yours{background:var(--gold);animation:pulse 1.2s infinite}
.st.wait{background:#eee}
.st.done{background:#d6f5e3}
.gcard .x{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.empty-note{color:var(--muted);text-align:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* pages */
.page{max-width:640px;margin:0 auto;padding:16px 16px 60px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.page-head h2{margin:0;font-size:28px}
.card{background:var(--paper);border:3px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin:14px 0}
.card h3{margin:0 0 10px;font-size:20px}
.mode-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode-card{border:3px solid var(--line);border-radius:16px;background:#fff;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow)}
.mode-card .mi{font-size:34px}
.mode-card b{font-size:18px}
.mode-card small{color:var(--muted);font-size:13px}
.mode-card.on{background:#fff4c2;outline:4px solid var(--gold)}
.slot{border-left-width:12px}
.slot-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slot-head .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--line)}
.slot-head b{font-size:20px}
.seg{display:flex;border:3px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;font-size:16px;font-weight:600;border-right:2px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--gold)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.lbl{font-size:14px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.inp{width:100%;font-size:18px;padding:10px 12px;border:3px solid var(--line);border-radius:12px;background:#fff}
.inp.code{text-transform:uppercase;letter-spacing:1px;font-weight:600}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs button{width:42px;height:42px;font-size:24px;border-radius:12px;border:2px solid #ccc;background:#fff;padding:0}
.avs button.on{border:3px solid var(--line);background:#fff4c2}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.err{color:var(--redd);font-weight:600;min-height:1em}

/* game */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--paper);border-bottom:3px solid var(--line);flex-wrap:nowrap}
.turnchip{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px;padding:4px 12px 4px 4px;border-radius:999px;border:3px solid var(--line);min-width:0;overflow:hidden;white-space:nowrap}
.turnchip .av{font-size:22px;width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.turnchip span.nm{overflow:hidden;text-overflow:ellipsis}
.round{font-weight:600;color:var(--muted);font-size:15px;white-space:nowrap}
.gold{font-weight:700;font-size:18px;margin-left:auto;white-space:nowrap}
.gold small{color:var(--greend);font-size:14px}
.endturn{white-space:nowrap}
.scores{display:flex;gap:8px;padding:6px 10px;background:rgba(255,255,255,.6);border-bottom:2px solid rgba(45,42,74,.25);overflow-x:auto}
.sc{display:flex;align-items:center;gap:5px;font-weight:600;font-size:15px;padding:2px 10px 2px 3px;border-radius:999px;border:2px solid;background:#fff;white-space:nowrap}
.sc .av{font-size:18px}
.sc.out{opacity:.35;text-decoration:line-through}
.sc.now{box-shadow:0 0 0 3px var(--gold)}
.banner{display:none;text-align:center;font-weight:700;padding:8px;font-size:16px;background:var(--gold);border-bottom:3px solid var(--line)}
.banner.on{display:block}
.banner.wait{background:#e9e6ff}
.mapwrap{flex:1;overflow:auto;position:relative;background:#86c95d;touch-action:pan-x pan-y}
#mapInner{position:relative}
#mapInner svg{display:block}
.gbody{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
.panel{background:var(--paper);border-top:3px solid var(--line);padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));max-height:46vh;overflow:auto}
.panel .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .ph h3{margin:0;font-size:21px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;border:2px solid var(--line);border-radius:999px;padding:2px 10px;background:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.troops{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.troop{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:700;background:#fff;border:2px solid #d8d3ea;border-radius:12px;padding:3px 10px}
.troop small{font-size:12px;color:var(--muted);font-weight:500}
.recruit{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.rbtn{border:3px solid var(--line);border-radius:14px;background:#fff;padding:6px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 var(--line);line-height:1.15}
.rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.rbtn .e{font-size:28px}
.rbtn b{font-size:14px}
.rbtn small{font-size:13px;font-weight:600}
.rbtn .st2{font-size:11px;color:var(--muted)}
.rbtn:disabled{opacity:.4}
.phint{color:var(--muted);font-size:14px;margin:8px 0 0}
.panel .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,25,60,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal.solid{background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.modal-box{background:var(--paper);border:4px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:18px;position:relative}
.modal-box h2{margin:0 0 8px;font-size:26px;text-align:center}
.modal-box .center{text-align:center}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtns .btn{flex:1}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed #e2ddf2}
.srow .e{font-size:28px;width:36px;text-align:center}
.srow .n{flex:1;font-weight:600}
.srow .n small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;border:3px solid var(--line);background:#fff;font-size:22px;font-weight:700;padding:0}
.step span{min-width:28px;text-align:center;font-size:20px;font-weight:700}
.step .all{width:auto;padding:0 8px;font-size:14px}
.herotog{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px;border:3px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
.herotog.on{background:#fff4c2}
.herotog .box{width:28px;height:28px;border:3px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;background:#fff}
.meter{margin-top:12px;border:3px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;position:relative;height:34px}
.meter i{position:absolute;left:0;top:0;bottom:0;transition:width .25s}
.meter b{position:relative;display:block;text-align:center;line-height:28px;font-size:16px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;margin:10px 0}
.vs .side{border:3px solid var(--line);border-radius:14px;padding:8px;background:#fff;min-height:110px}
.vs .side h4{margin:0 0 6px;font-size:15px;text-align:center}
.vs .mid{font-size:30px;align-self:center}
.units{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:24px}
.units span{display:inline-block;transition:transform .2s,opacity .3s}
.units span.hit{transform:scale(1.5) rotate(-15deg)}
.units span.dead{opacity:.12;transform:scale(.7)}
.units span.fight{transform:scale(1.35)}
.result{text-align:center;font-size:24px;font-weight:700;margin:8px 0;min-height:32px}
.bonus{text-align:center;font-weight:600;color:var(--greend)}
.loglist{max-height:50vh;overflow:auto;text-align:left;margin:8px 0}
.loglist div{padding:6px 4px;border-bottom:2px dashed #e2ddf2;font-size:15px}
.big-emoji{font-size:64px;text-align:center;line-height:1.1}
.helpbox h3{margin:14px 0 4px}
.helpbox p,.helpbox li{font-size:16px;line-height:1.4}
.helpbox table{border-collapse:collapse;width:100%;font-size:15px}
.helpbox td,.helpbox th{border-bottom:2px dashed #e2ddf2;padding:5px;text-align:center}
.codebox{font-size:22px;font-weight:700;text-align:center;letter-spacing:1px;background:#fff;border:3px dashed var(--line);border-radius:14px;padding:10px;margin:10px 0;word-break:break-all}
.menu-list{display:flex;flex-direction:column;gap:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:600;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}

/* map svg bits */
.c-hit{cursor:pointer}
.c-name{font-weight:700;font-size:14px;fill:#2d2a4a;stroke:#fff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.c-badge text{font-weight:700;font-size:15px;fill:#fff;pointer-events:none}
.sel-ring{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.tgt-ring{animation:throb 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes throb{0%,100%{opacity:.55}50%{opacity:1}}

@media (min-width:980px) and (orientation:landscape){
  .gbody{flex-direction:row}
  .panel{width:370px;flex:none;max-height:none;border-top:0;border-left:3px solid var(--line)}
  .recruit{grid-template-columns:repeat(2,1fr)}
}
.warn{background:#fff0c9;border:2px solid #e0a800;border-radius:12px;padding:6px 10px;font-size:14px;font-weight:600;margin-top:10px;text-align:center}
@media (max-width:640px){
  .title{font-size:44px}
  .round{display:none}
  .btn.endturn{padding:8px 10px;font-size:15px}
  .turnchip{font-size:15px}
  .gold{font-size:16px}
  .recruit{grid-template-columns:repeat(4,1fr);gap:5px}
  .rbtn{padding:4px 2px;border-radius:12px}
  .rbtn .e{font-size:22px}
  .rbtn b{font-size:12px}
  .rbtn .st2{display:none}
  .panel{max-height:40vh;padding:8px 10px}
  .panel .ph h3{font-size:18px}
  .chip{font-size:12px;padding:1px 8px}
  .stats{gap:5px;margin:6px 0}
  .troop{font-size:16px;padding:2px 8px}
  .phint{font-size:13px}
}
@media (max-width:400px){ .turnchip span.nm{max-width:70px} }

</style>
</head>
<body>
<div id="app">
  <!-- HOME -->
  <section id="scr-home" class="screen">
    <div class="home-wrap">
      <div class="title-art" id="titleArt"></div>
      <h1 class="title">Castle Quest</h1>
      <p class="tag">Build an army, hatch dragons, conquer the land!</p>
      <div class="home-btns">
        <button class="btn big red" id="btnNew">⚔️ New Game</button>
        <button class="btn big blue" id="btnJoin">🔗 Join a Game</button>
        <button class="btn big white" id="btnHelp">📖 How to Play</button>
      </div>
      <h2 class="sub" id="myGamesH">My Games</h2>
      <div id="myGames" class="games-list"></div>
    </div>
  </section>

  <!-- SETUP -->
  <section id="scr-setup" class="screen">
    <div class="page">
      <div class="page-head"><button class="btn small white" data-go="home">← Back</button><h2>New Game</h2></div>
      <div class="card">
        <h3>How will you play?</h3>
        <div class="mode-pick">
          <button class="mode-card" data-mode="local"><span class="mi">📱</span><b>One device</b><small>Take turns passing it around</small></button>
          <button class="mode-card" data-mode="online"><span class="mi">🌐</span><b>Online</b><small>Everyone plays on their own device</small></button>
        </div>
      </div>
      <div id="slotCards"></div>
      <div class="card">
        <h3>How long?</h3>
        <div class="seg" id="lenSeg">
          <button data-len="short">Short</button><button data-len="normal">Normal</button><button data-len="long">Long</button>
        </div>
        <p class="hint" id="lenHint"></p>
        <h3 style="margin-top:14px">Clouds over the map?</h3>
        <div class="seg" id="fogSeg">
          <button data-fog="1">☁️ Yes, explore!</button><button data-fog="0">🗺️ No, show everything</button>
        </div>
        <p class="hint">With clouds on, you only see the parts of the land your castles and armies have explored.</p>
      </div>
      <p class="err" id="setupErr"></p>
      <button class="btn big red wide" id="btnStart">🏰 Start the Quest!</button>
    </div>
  </section>

  <!-- JOIN -->
  <section id="scr-join" class="screen">
    <div class="page">
      <div class="page-head"><button class="btn small white" data-go="home">← Back</button><h2>Join a Game</h2></div>
      <div class="card" id="joinCodeCard">
        <h3>Type the game code</h3>
        <input id="joinCode" class="inp code" placeholder="DRAGON-PICKLE-TOWER-42" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <p class="err" id="joinErr"></p>
        <button class="btn blue wide" id="btnFind">Find Game</button>
      </div>
      <div id="joinSlots"></div>
    </div>
  </section>

  <!-- GAME -->
  <section id="scr-game" class="screen">
    <header class="topbar">
      <button class="btn icon white" id="btnMenu" aria-label="Menu">☰</button>
      <div class="turnchip" id="turnChip"></div>
      <div class="round" id="roundBox"></div>
      <div class="gold" id="goldBox"></div>
      <button class="btn red endturn" id="btnEnd">End Turn ➜</button>
    </header>
    <div class="scores" id="scores"></div>
    <div class="banner" id="banner"></div>
    <div class="gbody">
      <div class="mapwrap" id="mapWrap"><div id="mapInner"></div></div>
      <div class="zoom"><button class="btn icon white" id="zIn" aria-label="Zoom in">＋</button><button class="btn icon white" id="zOut" aria-label="Zoom out">－</button></div>
      <div class="panel" id="panel"></div>
    </div>
  </section>

  <div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast"></div>
</div>
<script>
/* ===== Castle Quest engine (pure logic, no DOM) ===== */
var CQ = (function () {
  'use strict';

  // ---------- constants ----------
  var UNITS = {
    s: { key: 's', name: 'Squire', plural: 'Squires', emoji: '🗡️', cost: 3, atk: 2, def: 2 },
    a: { key: 'a', name: 'Archer', plural: 'Archers', emoji: '🏹', cost: 4, atk: 2, def: 4 },
    k: { key: 'k', name: 'Knight', plural: 'Knights', emoji: '🐴', cost: 6, atk: 5, def: 3 },
    d: { key: 'd', name: 'Dragon', plural: 'Dragons', emoji: '🐉', cost: 14, atk: 9, def: 8, fly: true }
  };
  var UK = ['s', 'a', 'k', 'd'];
  var SIZES = {
    village: { income: 2, label: 'Village' },
    castle: { income: 3, label: 'Castle' },
    fortress: { income: 5, label: 'Fortress', roost: true }
  };
  var HOME_INCOME = 5;
  var WALL_COST = [8, 12];          // cost to go to level 1, level 2
  var WALL_BONUS = [0, 0.25, 0.5];
  var POW = 1.6;                    // combat sharpness
  var MAX_HERO = 4;
  var COLORS = [
    { key: 'red', name: 'Red', main: '#e5484d', light: '#ffb3b5', dark: '#a8262b' },
    { key: 'blue', name: 'Blue', main: '#3b82f6', light: '#b3d1ff', dark: '#1d4ea8' },
    { key: 'green', name: 'Green', main: '#22a55b', light: '#aef0c6', dark: '#136b39' }
  ];
  var AVATARS = ['🧙', '🧝', '🦸', '🧚', '🤴', '👸', '🥷', '🧛', '🦄', '🐱', '🐶', '🦊', '🐸', '🐼', '🦁', '🤖'];
  var AI_NAMES = ['Sir Grumblebeard', 'Lady Pickles', 'Baron Wobble', 'Queen Snorkel', 'Duke Noodle', 'Count Crumpet'];
  var AI_AVATARS = ['🤖', '👹', '🧌', '🐲', '👺', '🦹'];

  // ---------- rng ----------
  function hashStr(str) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);

    var opts = {

    var e = E(), g = e.g; if (!canMove(e) || S.busy) return;
    if (g.gold[g.turn] >= 6) {
      var v = await modal('<h2>End your turn?</h2><p class="center">You still have <b>💰 ' + g.gold[g.turn] + ' gold</b>. You can save it for next turn, or build troops first.</p><div class="mbtns"><button class="btn white" data-close="no">Keep playing</button><button class="btn red" data-close="yes">End Turn</button></div>');
      if (v !== 'yes') return;
    }
    var prev = g.turn;
    // armies with orders march first (animated)
    var marchers = CQ.armiesOf(g, prev).filter(function (A) { return A.route.length && A.mp > 0; });
    for (var i = 0; i < marchers.length && !g.over; i++) if (CQ.armyById(g, marchers[i].id)) await animateArmy(marchers[i].id);
    if (g.over) return;
    S.busy = true;
    CQ.endTurn(g, prev); S.sel = null; S.selArmy = null; bump(e);
    rerender();
    if (!g.over && g.slots[g.turn].kind === 'ai') await runComputer();
    S.busy = false;
    e.seen = g.logN; save();
    if (e.online) { push(e); }
    rerender();
    if (g.over) { gameOverCheck(); return; }
    if (!e.online && canMove(e) && humansHere(e) > 1 && g.turn !== prev) handoff(e);
  }
  function logFor(e, items) {
    var g = e.g, V = view(e), me = V.slot;
    if (!V.fog) return items;
    return items.filter(function (l) {
      if (l.k === 'round' || l.k === 'win' || l.k === 'out') return true;
      if (l.s === me || l.p === me) return true;
      return l.c != null && V.vis[l.c];
    });
  }
  async function runComputer() {
    var e = E(), g = e.g, n0 = g.logN;
    rerender();
    await sleep(700);
    CQ.runAI(g, 3); bump(e); rerender();
    var items = logFor(e, g.log.filter(function (l) { return l.n > n0 && l.k !== 'round'; }));
    if (items.length) await modal('<div class="big-emoji">🤖</div><h2>The computer played</h2><div class="loglist">' + items.map(logLine).join('') + '</div><div class="mbtns"><button class="btn blue" data-close="ok">OK</button></div>');
  }
  function handoff(e) {
    var g = e.g, s = g.slots[g.turn], c = COLORS[g.turn];
    SFX.turn();
    fogKey = ''; rerender(); fitMap(true);
    return modal('<div class="big-emoji">' + esc(s.avatar) + '</div><h2 style="color:' + c.dark + '">' + esc(s.name) + '\'s turn!</h2><p class="center">Pass the device to <b>' + esc(s.name) + '</b>.' + (g.fogOn ? '<br>No peeking, everyone else! 🙈' : '') + '<br>You have 💰 ' + g.gold[g.turn] + ' gold (+' + g.turnStart.inc + ' this turn).</p><div class="mbtns"><button class="btn green big" data-close="ok">I\'m ready! ⚔️</button></div>', null, { solid: g.fogOn });
  }
  var shownOver = {};
  function gameOverCheck() {
    var e = E(); if (!e) return; var g = e.g; if (!g.over || shownOver[S.cur + g.ver]) return;
    shownOver[S.cur + g.ver] = true;
    var st = CQ.standings(g), w = g.winner;
    var h = '<div class="big-emoji">🏆</div><h2>' + (w >= 0 ? esc(g.slots[w].avatar) + ' ' + esc(g.slots[w].name) + ' wins!' : 'It\'s a tie!') + '</h2>' +
      '<div class="loglist">' + CQ.activeSlots(g).map(function (i) { return '<div style="border-left:5px solid ' + COLORS[i].main + ';padding-left:8px">' + esc(g.slots[i].avatar) + ' <b>' + esc(g.slots[i].name) + '</b> — 🏰 ' + CQ.castlesOf(g, i).length + ' castles' + (g.slots[i].alive ? '' : ' (out)') + '</div>'; }).join('') + '</div>' +
      '<div class="mbtns"><button class="btn white" data-close="home">🏠 Home</button>' + (!e.online ? '<button class="btn green" data-close="again">🔁 Play again</button>' : '<button class="btn white" data-close="map">🗺️ See map</button>') + '</div>';
    if (w >= 0 && mySlots(e).indexOf(w) >= 0) SFX.win();
    modal(h).then(function (v) {
      if (v === 'home') show('home');
      else if (v === 'again') { setup = JSON.parse(JSON.stringify(e.setup || S.store.setup)); setup.mode = 'local'; startGame(); }
    });
  }

  // ---------- MENU / INVITE / HELP ----------
  function showMenu() {
    var e = E();
    var h = '<h2>Menu</h2><div class="menu-list">' +
      '<button class="btn white" data-close="home">🏠 Home</button>' +
      (e && e.online ? '<button class="btn blue" data-close="invite">🔗 Invite link &amp; code</button>' : '') +
      '<button class="btn white" data-close="help">📖 How to Play</button>' +
      '<button class="btn white" data-close="sound">' + (S.store.muted ? '🔇 Sound is off' : '🔊 Sound is on') + '</button>' +
      '<button class="btn white" data-close="x">Close</button></div>';
    modal(h).then(function (v) {
      if (v === 'home') show('home');
      else if (v === 'invite') showInvite();
      else if (v === 'help') showHelp();
      else if (v === 'sound') { S.store.muted = !S.store.muted; save(); toast(S.store.muted ? 'Sound off' : 'Sound on'); }
    });
  }
  function inviteURL(code) { return location.origin + location.pathname + '?game=' + encodeURIComponent(code); }
  function showInvite() {
    var e = E(); if (!e || !e.online) return;
    var url = inviteURL(e.code);
    var h = '<h2>Invite players</h2><p class="center">Send this link to the other players. They open it and pick their kingdom.</p><div class="codebox">' + esc(e.code) + '</div><p class="center hint" style="word-break:break-all">' + esc(url) + '</p>' +
      '<div class="mbtns"><button class="btn blue" id="cpy">📋 Copy link</button>' + (navigator.share ? '<button class="btn green" id="shr">📤 Share</button>' : '') + '</div><div class="mbtns"><button class="btn white" data-close="x">Done</button></div>';
    modal(h, function (box) {
      $('#cpy', box).onclick = function () {
        var done = function () { toast('Link copied!'); };
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { fallbackCopy(url); done(); }); else { fallbackCopy(url); done(); }
      };
      var sh = $('#shr', box); if (sh) sh.onclick = function () { navigator.share({ title: 'Castle Quest', text: 'Join my Castle Quest game! Code: ' + e.code, url: url }).catch(function () { }); };
    });
  }
  function fallbackCopy(t) { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { } ta.remove(); }
  function showHelp() {
    var rows = UK.map(function (k) { var u = U[k]; return '<tr><td style="font-size:24px">' + u.emoji + '</td><td><b>' + u.name + '</b></td><td>💰' + u.cost + '</td><td>⚔️' + u.atk + '</td><td>🛡️' + u.def + '</td></tr>'; }).join('');
    var h = '<h2>How to Play</h2><div class="helpbox">' +
      '<h3>🎯 The goal</h3><p>Take over castles until you rule the land! If time runs out, whoever has the most castles wins.</p>' +
      '<h3>🔁 Your turn</h3><ol><li>You get <b>gold</b> from every castle you own.</li><li>Tap your castle to <b>build troops</b> or stronger <b>walls</b>.</li><li>Tap a glowing castle to <b>march</b> an army there. 🚩</li><li>Tap <b>End Turn</b>.</li></ol>' +
      '<h3>🥾 Marching</h3><p>Armies walk along the roads. Each troop has a speed (🥾): Squires and Archers walk 4 steps a turn, Knights 6, Dragons fly 7. An army moves as fast as its slowest troop. Far-away castles take a few turns to reach.</p>' +
      '<p>Armies keep marching toward their 🚩 every time you end your turn. Tap an army to change where it\'s going, or to stop it. If two enemy armies meet on a road, they fight!</p>' +
      '<p>To reach a castle, your army can only pass through castles you own. Capture the ones in the way first.</p>' +
      '<h3>☁️ Clouds</h3><p>You can only see the land your castles and armies have explored. You can always see the castles right next to yours. To see inside a castle or spot enemy armies, you need to be close by.</p>' +
      '<h3>⚔️ Troops</h3><table><tr><th></th><th>Troop</th><th>Cost</th><th>Attack</th><th>Defend</th></tr>' + rows + '</table>' +
      '<p>⚔️ Attack matters when you charge in. 🛡️ Defend matters when you guard a castle. Archers are great guards; Knights are great attackers.</p>' +
      '<p>New troops rest 💤 until your next turn. 🐉 <b>Dragons</b> hatch only at a castle with a 🥚 dragon nest (Fortresses and Home castles). An army of only dragons can fly straight over rivers and lakes!</p>' +
      '<h3>⭐ Your hero</h3><p>Your hero adds their level to every troop they travel with. Win battles to level up (up to ⭐4). Heroes never die. If they lose, they run away to safety.</p>' +
      '<h3>🏰 Castles</h3><p>Villages give 💰2, Castles 💰3, Fortresses 💰5, and your Home 💰5 each turn. 🧱 Walls make defenders stronger. 💰 on the map means hidden treasure. Capture it to grab the gold!</p>' +
      '<h3>🤖 Computer players</h3><p>😊 Easy is gentle. 😐 Normal plays smart. 😈 Hard plays smart <i>and</i> gets 2 bonus gold every turn.</p>' +
      '</div><div class="mbtns"><button class="btn green" data-close="x">Got it!</button></div>';
    return modal(h);
  }

  // ---------- boot ----------
  function wire() {
    $('#btnNew').onclick = function () { SFX.tap(); newSetup(); renderSetup(); show('setup'); };
    $('#btnJoin').onclick = function () { SFX.tap(); $('#joinSlots').innerHTML = ''; $('#joinErr').textContent = ''; show('join'); };
    $('#btnHelp').onclick = function () { SFX.tap(); showHelp(); };
    $$('[data-go]').forEach(function (b) { b.onclick = function () { SFX.tap(); show(b.getAttribute('data-go')); }; });
    $$('.mode-card').forEach(function (b) {
      b.onclick = function () {
        SFX.tap(); setup.mode = b.getAttribute('data-mode');
        renderSetup();
      };
    });
    $$('#lenSeg button').forEach(function (b) { b.onclick = function () { SFX.tap(); setup.len = b.getAttribute('data-len'); renderSetup(); }; });
    $$('#fogSeg button').forEach(function (b) { b.onclick = function () { SFX.tap(); setup.fog = b.getAttribute('data-fog') === '1'; renderSetup(); }; });
    $('#btnStart').onclick = startGame;
    $('#btnFind').onclick = function () { findGame($('#joinCode').value); };
    $('#joinCode').onkeydown = function (ev) { if (ev.key === 'Enter') findGame($('#joinCode').value); };
    $('#btnEnd').onclick = function () { SFX.tap(); endTurn(); };
    $('#btnMenu').onclick = function () { SFX.tap(); showMenu(); };
    $('#zIn').onclick = function () { zoomBy(1.25); };
    $('#zOut').onclick = function () { zoomBy(0.8); };
    window.addEventListener('resize', function () { if (G()) fitMap(false); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (E() && E().online) pollNow(true); } });
    window.addEventListener('online', function () { var e = E(); if (e && e.online && e.pushed < e.g.ver) push(e); });
  }
  async function boot() {
    S.store = loadLS();
    if (!S.store) { var fromIdb = await idbGet(); S.store = fromIdb && fromIdb.device ? fromIdb : freshStore(); }
    S.store.games = S.store.games || {};
    Object.keys(S.store.games).forEach(function (id) { CQ.migrate(S.store.games[id].g); });
    save();
    wire();
    // unpushed online games
    Object.keys(S.store.games).forEach(function (id) { var e = S.store.games[id]; if (e.online && (e.pushed || 0) < e.g.ver) schedulePush(e, 500); });
    var q = new URLSearchParams(location.search), code = q.get('game');
    if (code) {
      history.replaceState(null, '', location.pathname);
      code = NET.cleanCode(code);
      if (S.store.games['cq_' + code]) { show('home'); openGame('cq_' + code); return; }
      show('join'); $('#joinCode').value = code; findGame(code); return;
    }
    show('home');
  }
  window.CQUI = { S: S, openGame: openGame, rerender: rerender, push: push };
  boot();
})();

</script>
</body>
</html>
