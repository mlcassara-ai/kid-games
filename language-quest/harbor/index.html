<style>
:root{

}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --sand1:#5A4526; --sand2:#43331B; --card:#1D2B45; --ink:#EEF3FA; --muted:#A9B8CC; --line:#3A4B68; } }
:root[data-theme="dark"]{ --sand1:#5A4526; --sand2:#43331B; --card:#1D2B45; --ink:#EEF3FA; --muted:#A9B8CC; --line:#3A4B68; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0; min-height:100%; background:linear-gradient(180deg,#8FC6F0 0,#CFE6F7 140px,var(--sand1) 141px,var(--sand2) 100%); background-attachment:fixed; color:var(--ink); font-family:var(--font); -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
.wrap{max-width:760px; margin:0 auto; padding:10px 14px 28px}
.top{display:flex; align-items:center; gap:8px; justify-content:space-between}
.top h1{font-size:1.3rem; margin:0; font-weight:800; color:#12233D}
.pill{background:var(--card); color:var(--ink); border:0; border-radius:999px; padding:6px 14px; font:inherit; font-weight:800; box-shadow:0 2px 8px rgba(0,0,0,.15); cursor:pointer; min-height:40px}
.coins{background:var(--saffron); color:#12233D}
button:focus-visible{outline:3px solid var(--saffron); outline-offset:3px}
.panel{background:var(--card); border-radius:24px; padding:14px; margin-top:12px; box-shadow:0 4px 16px rgba(70,50,10,.15)}
h2{margin:4px 0 8px; font-size:1.3rem}
.muted{color:var(--muted)}
.camps{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:12px}
.camp{background:var(--card); border:0; border-radius:22px; padding:12px 10px; cursor:pointer; font:inherit; color:var(--ink); text-align:center; box-shadow:0 4px 14px rgba(70,50,10,.15); position:relative}
.camp .tent{font-size:2.4rem}
.camp .ls{font-size:1.6rem; direction:rtl; word-spacing:.15rem; line-height:1.5; white-space:nowrap}
.camp .nm{font-weight:800}
.camp .st{color:var(--saffron); font-size:1.1rem; min-height:1.4rem}
.camp.locked{opacity:.55; cursor:not-allowed}
.camp.locked::after{content:"🔒"; position:absolute; top:8px; right:10px; font-size:1.3rem}
.crew{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:10px}

.mem{background:var(--card); border:3px solid transparent; border-radius:20px; padding:8px; cursor:pointer; font:inherit; color:var(--ink); text-align:center; box-shadow:0 3px 10px rgba(70,50,10,.12)}
.mem svg{width:84px; height:84px}
.mem .nm{font-weight:800}
.mem.done{border-color:var(--mint)}
.mem.done .nm::after{content:" ✓"; color:var(--mint)}
.actions{display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap}
.btn{font:inherit; font-weight:800; font-size:1.05rem; border:0; border-radius:14px; padding:10px 18px; min-height:48px; cursor:pointer; background:var(--sky); color:#fff}

.btn.go{background:var(--mint)}
.btn.boss{background:var(--rose)}

.hero svg{width:104px; height:104px; flex:none; cursor:pointer}
.talk{background:#FFF8E6; color:#12233D; border-radius:18px; padding:10px 14px; font-size:1.05rem; line-height:1.35; position:relative; flex:1}
.talk::before{content:""; position:absolute; left:-8px; top:26px; border:8px solid transparent; border-right-color:#FFF8E6; border-left:0}
.talk .ar{font-size:1.5rem}
.slots{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; direction:rtl; margin:12px 0}
.slot{background:#FFF8E6; color:#12233D; border-radius:16px; text-align:center; padding:6px 2px; border:2px dashed #D9BF85}
.slot b{display:block; font-size:2.4rem; font-weight:500; line-height:1.4; min-height:3.3rem; color:var(--sky)}
.slot span{font-size:.8rem; color:#7A6B45}
.slot.got{border-style:solid; border-color:var(--mint)}
.field{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:4px}
.orb{aspect-ratio:1; border-radius:50%; border:0; cursor:pointer; font-family:var(--font); font-size:2.5rem; line-height:1; color:#12233D;
  background:radial-gradient(circle at 32% 28%, #fff 0 12%, rgba(255,255,255,.9) 13% 40%, rgba(255,255,255,.62) 70%);
  box-shadow:inset 0 -6px 12px rgba(160,110,20,.2), 0 4px 10px rgba(120,80,10,.18)}
.orb.pop{visibility:hidden}
.orb.nope{background:radial-gradient(circle,#FFD6DE,#F7A8B8)}
.orb.glow{box-shadow:0 0 0 5px var(--saffron), 0 0 22px var(--saffron)}
.words{display:grid; gap:10px; margin-top:8px}
.word{display:flex; align-items:center; gap:12px; background:#FFF8E6; color:#12233D; border-radius:18px; padding:10px 14px; border:3px solid transparent; cursor:pointer; font:inherit; text-align:start}
.word .em{font-size:2.2rem}
.word .ar{font-size:2rem; line-height:1.5; direction:rtl}
.word .info{flex:1}
.word .where{font-size:.9rem; color:#7A6B45}
.word .form{font-size:2.1rem; color:var(--sky); min-width:52px; text-align:center}
.word.heard{border-color:var(--mint)}
.bossbar{display:flex; align-items:center; gap:10px; margin:8px 0}
.hp{flex:1; height:16px; background:#F3D6DD; border-radius:999px; overflow:hidden}
.hp i{display:block; height:100%; background:var(--rose); transition:width .3s}
.hearts{font-size:1.3rem; min-width:80px; text-align:right}
.q{font-size:1.2rem; text-align:center; margin:10px 0}
.q .big{font-size:2.8rem; display:block; line-height:1.4}
.opts{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.opt{font-family:var(--font); font-size:2.6rem; min-height:92px; border-radius:20px; border:0; background:#FFF8E6; color:#12233D; cursor:pointer; box-shadow:0 4px 0 #D9BF85}
.opt.right{background:#C9F0E3; box-shadow:0 4px 0 var(--mint)}
.opt.wrong{background:#FFD6DE; box-shadow:0 4px 0 var(--rose)}
.tracewrap{position:relative; margin:10px auto 0; max-width:520px}
.trace{display:block; width:100%; height:auto; background:#FFF8E6; border-radius:20px; border:2px dashed #D9BF85; touch-action:none; cursor:crosshair}
.tbase{stroke:#E3D2A8; stroke-width:2; stroke-dasharray:6 6}
path.tg{fill:none; stroke:#EADBB4; stroke-width:24; stroke-linecap:round; stroke-linejoin:round}
circle.tg{fill:#EADBB4}
path.tg.done{stroke:var(--sky)} circle.tg.done{fill:var(--sky)}
.tink{fill:none; stroke:var(--sky); stroke-width:24; stroke-linecap:round; stroke-linejoin:round}
.tdot{fill:var(--saffron); stroke:#fff; stroke-width:3}
.tnum{fill:var(--mint); stroke:#fff; stroke-width:2}
.tnumt{font:800 15px var(--font); fill:#fff; pointer-events:none}
.tarr{fill:#fff; stroke:#12233D; stroke-width:1.5; stroke-linejoin:round}
.tdemo{fill:none; stroke:var(--rose); stroke-width:10; stroke-linecap:round; stroke-linejoin:round}
.tdemod{fill:var(--rose)}
.tform{position:absolute; top:8px; left:12px; text-align:center; color:#7A6B45; font-size:.8rem; pointer-events:none}
.tform b{display:block; font-size:1.9rem; font-weight:500; color:#12233D; line-height:1.3}
.mem[disabled]{opacity:.5; cursor:not-allowed}
.mem .st{color:var(--saffron); min-height:1.4rem}
.center{text-align:center}
#start{position:fixed; inset:0; background:rgba(18,35,61,.55); display:flex; align-items:center; justify-content:center; z-index:10}
#start .box{background:var(--card); color:var(--ink); border-radius:26px; padding:24px; text-align:center; width:min(88vw,360px)}
@media (prefers-reduced-motion:no-preference){
  .orb{animation:bob 3s ease-in-out infinite}
  .orb:nth-child(2n){animation-delay:-1.2s}.orb:nth-child(3n){animation-delay:-2.1s}
  .orb.nope,.opt.wrong{animation:shake .35s}
  .hero svg.happy{animation:hop .5s}
  .slot.got b{animation:land .4s}
}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes hop{40%{transform:translateY(-14px) rotate(-5deg)}}
@keyframes land{0%{transform:scale(1.8)}100%{transform:scale(1)}}
.stories{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-top:12px}
.shelf{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); row-gap:20px; background:#7A4B22; border:6px solid #4E3018; border-radius:18px; padding:20px 10px 14px; margin-top:12px}
.bslot{display:flex; justify-content:center; align-items:flex-end; border-bottom:14px solid #4E3018; box-shadow:0 6px 0 rgba(0,0,0,.2)}

.bk .ti{font-size:1.15rem; line-height:1.7; direction:rtl; font-weight:700}
.bk .te{font-size:.8rem; line-height:1.2; opacity:.9}
.bk .bs{font-size:1rem; color:#FFE08A; font-weight:800}

.scene{font-size:3rem; text-align:center; line-height:1.3; letter-spacing:.2rem}
.line{font-size:1.9rem; line-height:2; direction:rtl; text-align:center; background:#FFF8E6; color:#12233D; border-radius:18px; padding:8px 12px; margin:8px 0}
.line{position:relative; padding-left:64px; padding-right:64px}
.line .rd{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%; border:0; background:#fff; font-size:1.25rem; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.18)}
.line .gap.wait{border-bottom-color:var(--rose)}
.line .gap{display:inline-block; min-width:4.5rem; border-bottom:4px dashed var(--saffron); margin:0 .3rem; height:1.6rem; vertical-align:baseline}
.line .fill{color:var(--mint); font-weight:700}
.en{text-align:center; color:var(--muted); margin:0 0 10px}
.picks{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.pickw{position:relative}
.pick{width:100%; font-family:var(--font); border:0; border-radius:20px; background:#FFF8E6; color:#12233D; cursor:pointer; box-shadow:0 4px 0 #D9BF85; padding:10px 4px 44px; min-height:150px}
.pick .e{display:block; font-size:2.4rem; line-height:1.2}
.pick .w{display:block; font-size:1.45rem; line-height:1.8; direction:rtl}
.pick .t{display:block; font-size:.85rem; color:#7A6B45}
.pick.right{background:#C9F0E3; box-shadow:0 4px 0 var(--mint)}
.pick.wrong{background:#FFD6DE; box-shadow:0 4px 0 var(--rose)}
.pickw .hear{position:absolute; left:50%; bottom:8px; transform:translateX(-50%); width:44px; height:36px; border-radius:18px; border:0; background:#fff; font-size:1.1rem; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.18)}
.book{display:grid; gap:8px; margin-top:8px}
.book button{font-family:var(--font); font-size:1.5rem; line-height:1.9; direction:rtl; text-align:right; background:#FFF8E6; color:#12233D; border:3px solid transparent; border-radius:16px; padding:6px 12px; cursor:pointer}
.book button small{display:block; direction:ltr; text-align:left; font-size:.9rem; color:#7A6B45; line-height:1.3}
.book button.on{border-color:var(--mint)}
.book button{position:relative}
.book button.miss{background:#FFE9B8; border-color:#F2B134}
.mk{display:inline-block; width:1.7rem; height:1.7rem; line-height:1.7rem; border-radius:50%; text-align:center; font-size:1rem; font-weight:800; color:#fff; direction:ltr}
.mk.ok{background:var(--mint)} .mk.miss{background:#E58A2B}
.book button .mk{position:absolute; left:10px; top:10px}
.step{text-align:center; color:var(--muted); font-weight:800; margin:0}
@media (prefers-reduced-motion:no-preference){ .pick.wrong{animation:shake .35s} }
</style>
</head>

 {ar:"الأَرْنَبُ وَالأَسَدُ وَالبِئْر", en:"The hare, the lion and the well", icon:"🐇", lines:[
  ["كَانَ فِي الغَابَةِ أَسَدٌ {}.","In the forest there was a {} lion.","🌲🦁",[["جَائِع","hungry","🍽️"],["صَغِير","small","🤏"],["نَائِم","sleeping","😴"]]],
  ["قَالَ الأَرْنَب: رَأَيْتُ {} آخَرَ فِي البِئْر!","The hare said: I saw another {} in the well!","🐇💬🕳️",[["أَسَدًا","lion","🦁"],["جَمَلًا","camel","🐪"],["دِيكًا","rooster","🐓"]]],
  ["نَظَرَ الأَسَدُ فِي {}.","The lion looked into {}.","🦁👀",[["المَاء","the water","💧"],["السَّمَاء","the sky","☁️"],["الكِتَاب","the book","📖"]]],
  ["رَأَى الأَسَدُ {} فِي المَاء.","The lion saw {} in the water.","🦁💧",[["صُورَتَهُ","his own reflection","🪞"],["صَدِيقَهُ","his friend","🧑‍🤝‍🧑"],["بَيْتَهُ","his house","🏠"]]],
  ["قَفَزَ الأَسَدُ فِي {}، وَهَرَبَ الأَرْنَبُ الذَّكِيّ.","The lion jumped into {}, and the clever hare escaped.","🦁💦🐇",[["البِئْر","the well","🕳️"],["النَّهْر","the river","🏞️"],["الشَّجَرَة","the tree","🌳"]]]]}
];
const full=l=>l[0].replace("{}",l[3][0][0]);                       // the finished sentence, as it is spoken
// the words before and after the blank, each spoken as its own clip with a pause between them for the missing word
const parts=l=>l[0].split("{}").map(t=>t.trim()).map(t=>/[\u0621-\u064A]/.test(t)?t:"");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ============ save: the signed-in player (shared with the map through lq-core.js) ============ */
const $=id=>document.getElementById(id);
if(!LQ.player()) location.replace("../");               // nobody signed in: go pick a player on the map
const save={ get coins(){ const p=LQ.player(); return p?p.coins||0:0; },
             get harbor(){ const p=LQ.player(); return p?(p.harbor=p.harbor||{}):{}; } };
function persist(){ LQ.update(()=>{}); $("coins").textContent=save.coins; const p=LQ.player(); if(p) $("who").textContent=p.name; }
function addCoins(n){ LQ.addCoins(n); $("coins").textContent=save.coins; }
LQ.onChange(()=>{ const e=$("coins"); if(e) e.textContent=save.coins; });

/* ============ voice: generated Google voice (Puck) with device fallback ============ */
const AUDIO_BASE="https://storage.googleapis.com/kid-games-dc068-voices/lq/ar-XA-Chirp3-HD-Puck/";
function audioKey(t){ let h=0x811c9dc5; for(const b of new TextEncoder().encode(t)){ h^=b; h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,"0"); }
const audio=new Audio(); audio.preload="auto"; let soundOn=true, sid=0;
function deviceSay(t){ if(!("speechSynthesis" in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="ar-SA"; u.rate=0.75;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("ar")); if(v)u.voice=v; speechSynthesis.speak(u); }
// then() runs when the clip finishes (or cannot play), unless something else was said in the meantime
function say(t,then){ const id=++sid; audio.onended=null; if(!soundOn){ if(then) setTimeout(()=>{ if(id===sid) then(); },900); return; }
  audio.pause(); audio.src=AUDIO_BASE+audioKey(t)+".mp3";
  const fail=()=>{ if(id!==sid) return; deviceSay(t); if(then) setTimeout(()=>{ if(id===sid) then(); },2500); };
  audio.onended=()=>{ if(id===sid&&then) then(); }; audio.onerror=fail; const p=audio.play(); if(p&&p.catch) p.catch(fail); }
function hush(){ sid++; audio.onended=null; audio.pause(); if(window.speechSynthesis) speechSynthesis.cancel(); }
$("snd").onclick=e=>{ soundOn=!soundOn; e.target.textContent=soundOn?"🔊":"🔇"; if(!soundOn) hush(); };
try{ audio.volume=LQ.voiceVol()||1; }catch(e){} if(!LQ.voiceVol()){ soundOn=false; $("snd").textContent="🔇"; }      // voice volume comes from the map's sound menu
$("back").onclick=()=>{ location.href="../?from=harbor"; };
// the map already said this zone's name on the way in; say it here only when arriving another way
$("go").onclick=()=>{ let said=false; try{ said=sessionStorage.getItem("lq.said")==="harbor"; sessionStorage.removeItem("lq.said"); }catch(e){} if(!said) say("مِينَاءُ القِصَص"); $("start").remove(); };

/* ============ screens ============ */
const stars3=n=>"★".repeat(n)+"☆".repeat(3-n);
const COVERS=["#C8402F","#1E5AA8","#2FA894","#7A5CD6","#E58A2B","#C2476A"];
// the harbor's bookshelf: every story is a book the child can take down, in any order
function home(){ LQ.mark("Story Harbor: bookshelf"); hush();
  $("app").innerHTML=`<div class="panel"><h2>Welcome to Story Harbor!</h2>
    <p class="muted" style="margin:0">The boats bring old stories with some words missing. Pick a book, listen, and choose the right words to make the story yours.</p>
    <div class="shelf">${STORIES.map((s,i)=>{ const st=save.harbor[i]||0;
      return `<div class="bslot"><button class="bk" data-i="${i}" style="background:${COVERS[i%COVERS.length]}"><span class="ic">${s.icon}</span>
        <span class="ti" lang="ar">${s.ar}</span><span class="te">${s.en}</span><span class="bs">${st?stars3(st):"New!"}</span></button></div>`; }).join("")}</div></div>`;
  document.querySelectorAll(".bk").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; save.harbor[i]?book(i):story(i); });
}
/* ---- one story: a missing word in every line ---- */
function story(i){ LQ.mark("Story "+(i+1)); const S=STORIES[i]; let k=0, misses=0, heardTitle=false; const missed=new Set();
  function line(){
    if(k>=S.lines.length) return done();
    const l=S.lines[k], picks=shuffle(l[3].map((c,j)=>({c,ok:j===0}))); let tried=false, solved=false;
    $("app").innerHTML=`<div class="panel"><p class="step">${S.icon} ${S.en} · line ${k+1} of ${S.lines.length}</p>
      <div class="scene" aria-hidden="true">${l[2]}</div>
      <div class="line" lang="ar"><button class="rd" id="rd" aria-label="Hear the sentence again">🔊</button><span id="ln">${l[0].replace("{}",`<span class="gap"></span>`)}</span></div>
      <p class="en" id="en">${l[1].replace("{}","_____")}</p>
      <div class="picks">${picks.map((o,j)=>`<div class="pickw"><button class="pick" data-j="${j}"><span class="e">${o.c[2]}</span><span class="w" lang="ar">${o.c[0]}</span><span class="t">${o.c[1]}</span></button>
        <button class="hear" data-j="${j}" aria-label="Hear this word">🔊</button></div>`).join("")}</div>
      <div class="actions"><button class="btn ghost" id="quit">All stories</button><button class="btn go" id="next" disabled>Next ▶</button></div></div>`;
    $("quit").onclick=home;
    // read the line aloud: the words before the blank, a pause where the missing word goes, then the rest
    const read=()=>{ if(solved) return say(full(l)); const [a,b]=parts(l), g=$("ln").querySelector(".gap"), gapOn=on=>{ if(g&&g.isConnected) g.classList.toggle("wait",on); };
      const rest=()=>{ gapOn(true); const id=sid; setTimeout(()=>{ gapOn(false); if(id===sid&&b) say(b); },900); };
      a?say(a,rest):rest(); };
    $("rd").onclick=read; if(k===0&&!heardTitle){ heardTitle=true; say(S.ar,()=>setTimeout(read,400)); } else read();
    document.querySelectorAll(".hear").forEach(b=>b.onclick=()=>say(picks[+b.dataset.j].c[0]));
    document.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{ if(solved) return; const o=picks[+b.dataset.j];
      if(!o.ok){ misses++; tried=true; missed.add(k); LQ.record("words",l[3][0][0],false,o.c[0]); b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); say(o.c[0]); return; }
      solved=true; b.classList.add("right"); LQ.record("words",l[3][0][0],true); if(!tried) addCoins(4);
      $("ln").innerHTML=l[0].replace("{}",`<span class="fill">${o.c[0]}</span>`); $("en").textContent=l[1].replace("{}",o.c[1]);
      $("next").disabled=false; say(full(l)); });
    $("next").onclick=()=>{ if(!solved) return; k++; line(); };
  }
  function done(){ const stars=misses<=1?3:misses<=4?2:1, first=!save.harbor[i];
    LQ.update(p=>{ p.harbor=p.harbor||{}; p.harbor[i]=Math.max(p.harbor[i]||0,stars); }); addCoins(first?20:5); persist(); LQ.mark("Story "+(i+1)+" finished");
    book(i,stars,missed); }
  line();
}
/* ---- the finished story, to read and hear again ---- */
// missed = the lines that took more than one try this time (only known straight after playing)
function book(i,stars,missed){ const S=STORIES[i], last=i===STORIES.length-1; hush();
  $("app").innerHTML=`<div class="panel">${stars?`<div class="center"><div style="font-size:3rem">🏆</div><p style="font-size:2rem;color:var(--saffron);margin:0">${stars3(stars)}</p></div>`:""}
    <h2 class="center" lang="ar" style="font-size:1.7rem;line-height:1.8;margin:0">${S.ar}</h2><p class="en">${S.en}</p>
    ${missed?`<p class="en" style="margin:8px 0 0"><span class="mk ok">✓</span> right first time${missed.size?` · <span class="mk miss">↻</span> listen to this one again`:""}</p>`:""}
    <div class="book">${S.lines.map((l,j)=>`<button data-j="${j}" lang="ar" class="${missed?(missed.has(j)?"miss":"ok"):""}">${missed?`<span class="mk ${missed.has(j)?"miss":"ok"}">${missed.has(j)?"↻":"✓"}</span>`:""}${full(l)}<small>${l[1].replace("{}",l[3][0][1])}</small></button>`).join("")}</div>
    <div class="actions"><button class="btn go" id="all">🔊 Hear the whole story</button><button class="btn ghost" id="again">Play it again</button>
      <button class="btn ghost" id="home">${stars&&!last?"Next story":"All stories"}</button></div></div>`;
  const rows=[...document.querySelectorAll(".book button")], light=j=>rows.forEach((r,x)=>r.classList.toggle("on",x===j));
  rows.forEach(r=>r.onclick=()=>{ const j=+r.dataset.j; light(j); say(full(S.lines[j]),()=>light(-1)); });
  const play=j=>{ if(j>=S.lines.length) return light(-1); light(j); rows[j].scrollIntoView({block:"nearest"}); say(full(S.lines[j]),()=>setTimeout(()=>play(j+1),350)); };
  $("all").onclick=()=>play(0); $("again").onclick=()=>story(i); $("home").onclick=()=>stars&&!last?story(i+1):home();
  if(stars) say("أَحْسَنْتَ");
}
persist(); home();
</script>
</body>
</html>
