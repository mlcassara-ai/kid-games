<style>
:root{

*,*::before,*::after{box-sizing:inherit}
html,body{height:100%; margin:0; overflow:hidden; background:#2a5d8f; font-family:var(--font); -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none}

button.pill{border:0; font:inherit; font-weight:800; cursor:pointer}

#zone{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 62px); transform:translate(-50%,-20px); opacity:0; background:var(--card); color:var(--ink); border-radius:18px; padding:8px 20px; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:2; pointer-events:none; transition:opacity .4s, transform .4s}

<script>
/* ============ world setup ============ */
const W=3200, H=2400;
const BIOMES={
  oasis:{en:"Oasis Town", ar:"الوَاحَة", c1:[128,184,98], c2:[176,204,120]},
  desert:{en:"The Desert", ar:"الصَّحْرَاء", c1:[226,188,122], c2:[248,222,164]},
  forest:{en:"Cedar Forest", ar:"غَابَةُ الأَرْز", c1:[38,92,52], c2:[74,132,72]},
  mountain:{en:"The Mountains", ar:"الجِبَال", c1:[128,110,94], c2:[172,154,132]},
  snow:{en:"Snowy Peak", ar:"القِمَّةُ الثَّلْجِيَّة", c1:[214,228,246], c2:[252,253,255]},
  falls:{en:"The Waterfalls", ar:"الشَّلَّالَات", c1:[74,146,82], c2:[122,182,102]},
  coast:{en:"The Coast", ar:"الشَّاطِئ", c1:[236,214,166], c2:[250,236,196]},
  sea:{en:"The Sea", ar:"البَحْر", c1:[28,100,172], c2:[64,152,212]},
  farm:{en:"Farms of Palestine", ar:"مَزَارِعُ فِلَسْطِين", c1:[118,150,72], c2:[170,176,96]},
  marsh:{en:"The Marshes", ar:"الأَهْوَار", c1:[92,138,94], c2:[86,140,150]}
};
const SEEDS=[
 ["oasis",1600,1250],
 ["farm",860,1130],["farm",1120,1050],["farm",520,1100],["farm",820,1400],["farm",1120,1320],["farm",300,1250],
 ["desert",700,1500],["desert",1100,2000],["desert",1700,2080],["desert",380,2050],["desert",200,1500],["desert",1250,1650],
 ["forest",450,450],["forest",820,760],["forest",220,760],["forest",700,250],
 ["mountain",1250,560],["mountain",1720,700],["mountain",2050,420],["mountain",950,450],
 ["snow",1500,190],["snow",1150,140],["snow",1850,180],
 ["falls",2380,720],["falls",2250,1050],
 ["coast",2620,1200],["coast",2640,1700],["coast",2680,2150],["coast",2700,450],
 ["sea",3120,300],["sea",3120,900],["sea",3120,1500],["sea",3120,2100],["sea",3050,2380],["sea",3050,40],
 ["marsh",2150,1900],["marsh",2250,2250],["marsh",1950,2250]
];
/* ---- noise ---- */
function hash(ix,iy){ let h=Math.imul(ix,374761393)+Math.imul(iy,668265263)|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967295; }
function vnoise(x,y){ const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy; const u=fx*fx*(3-2*fx), v=fy*fy*(3-2*fy);
  const a=hash(ix,iy), b=hash(ix+1,iy), c=hash(ix,iy+1), d=hash(ix+1,iy+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ return (vnoise(x,y)*0.55+vnoise(x*2.1,y*2.1)*0.3+vnoise(x*4.3,y*4.3)*0.15); }
function biomeAt(x,y){
  const nx=x+(fbm(x*0.003,y*0.003)-0.5)*320, ny=y+(fbm(x*0.003+17,y*0.003+9)-0.5)*320;
  let best=null, bd=1e18;
  for(const s of SEEDS){ const dx=nx-s[1], dy=ny-s[2], d=dx*dx+dy*dy; if(d<bd){bd=d; best=s[0];} }
  return best;
}
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];

/* ---- ground buffer ----
   Painted once at 1/3 scale. Every colour change is a soft blend (never a hard threshold), so the picture
   stays smooth when the canvas scales it up; hard edges are what made the old map look blocky. */
const S=3, BW=Math.ceil(W/S), BH=Math.ceil(H/S);
const ground=document.createElement("canvas"); ground.width=BW; ground.height=BH;
const ss=(a,b,x)=>{ x=Math.max(0,Math.min(1,(x-a)/(b-a))); return x*x*(3-2*x); };
function groundColor(b,x,y,n){
  const B=BIOMES[b]; let c=mix(B.c1,B.c2,n);
  if(b==="desert"){ const r=Math.sin(x*0.022+y*0.009+n*7)*0.5+0.5; c=mix(c,[252,230,176],r*0.35); }
  else if(b==="sea"){ const r=Math.sin(x*0.05+y*0.02+n*9)*0.5+0.5; c=mix(c,[110,190,230],r*0.18); }
  else if(b==="mountain"){ const r=fbm(x*0.03,y*0.03); c=mix(c,[96,84,74],Math.max(0,r-0.55)*1.6); }
  else if(b==="farm"){
    const f=fbm(x*0.004+31,y*0.004+7);
    const olive=mix([112,138,70],[140,150,84],n);
    const wheat=mix(mix([214,184,96],[232,204,120],n),[246,222,140],0.4*ss(0.3,0.9,Math.sin(y*0.12+x*0.03)));
    const plow=mix(mix([150,108,70],[170,126,84],n),[120,84,54],0.5*ss(0,0.6,Math.sin(y*0.16+x*0.02)));     // plowed rows
    c=mix(mix(olive,wheat,ss(0.405,0.435,f)),plow,ss(0.535,0.565,f));
    const ty=(y+fbm(x*0.006,y*0.006)*80)%95; c=mix(c,[200,190,170],0.85*(1-ss(1.5,5,Math.abs(ty-3))));       // stone terrace walls
  }
  else if(b==="marsh"){ c=mix(c,[70,130,165],0.7*ss(0.56,0.64,fbm(x*0.02+50,y*0.02))); }
  return c;
}
(function paint(){
  const g=ground.getContext("2d"), img=g.createImageData(BW,BH), d=img.data;
  for(let py=0;py<BH;py++) for(let px=0;px<BW;px++){
    const x=px*S, y=py*S, n=fbm(x*0.008,y*0.008);
    // nearest biome and the nearest different one; half the gap between them is the distance to the border
    const nx=x+(fbm(x*0.003,y*0.003)-0.5)*320, ny=y+(fbm(x*0.003+17,y*0.003+9)-0.5)*320;
    let b1=null, d1=1e18; for(const sd of SEEDS){ const dx=nx-sd[1], dy=ny-sd[2], q=dx*dx+dy*dy; if(q<d1){ d1=q; b1=sd[0]; } }
    let b2=null, d2=1e18; for(const sd of SEEDS){ if(sd[0]===b1) continue; const dx=nx-sd[1], dy=ny-sd[2], q=dx*dx+dy*dy; if(q<d2){ d2=q; b2=sd[0]; } }
    const edge=(Math.sqrt(d2)-Math.sqrt(d1))/2;
    let c=groundColor(b1,x,y,n);
    if(b1==="sea"){ c=mix(c,[150,214,232],0.75*(1-ss(0,34,edge))); c=mix(c,[250,252,250],0.8*(1-ss(1,7,edge))); }   // shallows, then foam
    else if(b2==="sea"){ c=mix(c,[240,224,180],0.9*(1-ss(4,26,edge))); c=mix(c,[250,252,250],0.5*(1-ss(0,4,edge))); } // beach
    else if(edge<26) c=mix(c,groundColor(b2,x,y,n),0.5*(1-ss(0,26,edge)));                                           // land meets land
    const k=0.975+0.05*vnoise(x*0.045,y*0.045);                                                                          // fine grain
    const i=(py*BW+px)*4; d[i]=c[0]*k; d[i+1]=c[1]*k; d[i+2]=c[2]*k; d[i+3]=255;
  }
  g.putImageData(img,0,0);
})();

/* ---- river from waterfall to marshes ---- */
const RIVER=[[2380,800],[2330,1000],[2400,1200],[2330,1420],[2250,1620],[2200,1820]];
function riverDist(x,y){ let m=1e9; for(let i=0;i<RIVER.length-1;i++){ const [ax,ay]=RIVER[i],[bx,by]=RIVER[i+1]; const dx=bx-ax, dy=by-ay;
  let t=((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy); t=Math.max(0,Math.min(1,t)); const px=ax+t*dx-x, py=ay+t*dy-y; m=Math.min(m,Math.hypot(px,py)); } return m; }
const POND={x:1760,y:1180,rx:130,ry:70};

/* ---- landmarks (learning zones) ---- */
const LANDMARKS=[
 {id:"souq",  x:1480,y:1130, icon:"🛍️", en:"The Souq", ar:"السُّوق", desc:"Open now! Count with the shopkeepers and learn the numbers from one to one hundred."},
 {id:"farm",  x:880, y:1080, icon:"🏡", en:"Olive Farm", ar:"مَزْرَعَةُ الزَّيْتُون", desc:"Harvest time! Hear a word, then pick the right fruit or vegetable to fill your basket."},
 {id:"dunes", x:760, y:1850, icon:"⛺", en:"Letter Dunes", ar:"كُثْبَانُ الحُرُوف", desc:"Open now! Meet the letter shapeshifters and learn all 28 letters and their shapes."},
 {id:"forest",x:640, y:600,  icon:"🌳", en:"Word Forest", ar:"غَابَةُ الكَلِمَات", desc:"Learn new words with pictures. This week's words from your teacher live here."},
 {id:"falls", x:2380,y:640,  icon:"💦", en:"Sound Falls", ar:"شَلَّالُ الأَصْوَات", desc:"Open now! Vowel marks make letters sing: بَ ... بِ ... بُ — then join sounds into words."},
 {id:"tower", x:1640,y:640,  icon:"🏰", en:"Spelling Tower", ar:"بُرْجُ التَّهْجِئَة", desc:"Spell words to climb. Every floor gets a little harder."},
 {id:"arena", x:1450,y:250,  icon:"🏟️", en:"Frost Arena", ar:"سَاحَةُ الجَلِيد", desc:"Spell words correctly to beat the snow monsters!"},
 {id:"harbor",x:2640,y:1420, icon:"⛵", en:"Story Harbor", ar:"مِينَاءُ القِصَص", desc:"Read short stories aloud together. Coming in part two."},
 {id:"reeds", x:2180,y:2080, icon:"🛖", en:"Reed Village", ar:"قَرْيَةُ القَصَب", desc:"Build sentences word by word. Coming in part two."}
];

/* ---- props: things on the ground ---- */
const PROPS={
 oasis:[["🌴","نَخْلَة","palm tree",6,58],["🐓","دِيك","rooster",1,34],["🐈","قِطَّة","cat",1,32],["🍉","بِطِّيخ","watermelon",1,30],["🐑","خَرُوف","sheep",2,36],["🌼","زَهْرَة","flower",2,24]],
 desert:[["🐪","جَمَل","camel",2,52],["🦎","سِحْلِيَّة","lizard",2,28],["🪨","صَخْرَة","rock",4,34],["🦂","عَقْرَب","scorpion",1,26],["🏺","جَرَّة","clay jar",1,30],["🌵","صَبَّار","cactus",1,40],["🌴","نَخْلَة","palm tree",1,54]],
 forest:[["🌲","أَرْزَة","cedar tree",10,64],["🍄","فُطْر","mushroom",2,26],["🦊","ثَعْلَب","fox",1,36],["🐿️","سِنْجَاب","squirrel",1,28],["🦉","بُومَة","owl",1,30],["🦔","قُنْفُذ","hedgehog",1,28]],
 mountain:[["🪨","صَخْرَة","rock",6,40],["🐐","وَعْل","ibex",2,40],["🦅","نَسْر","eagle",1,36],["🌸","زَهْرَة","flower",2,24],["🐇","أَرْنَب","rabbit",1,28],["🌲","شَجَرَة","tree",2,50]],
 snow:[["⛄","رَجُلُ ثَلْج","snowman",1,44],["❄️","ثَلْج","snow",3,26],["🌲","شَجَرَة","tree",4,54],["🧊","جَلِيد","ice",2,30],["🐺","ذِئْب","wolf",1,38]],
 falls:[["🐸","ضِفْدَع","frog",2,28],["🦋","فَرَاشَة","butterfly",2,26],["🐢","سُلَحْفَاة","turtle",1,32],["🌿","عُشْب","grass",4,30],["🪨","صَخْرَة","rock",2,32],["🌳","شَجَرَة","tree",3,56]],

function toWorld(sx,sy){ return [cam.x+sx/ZOOM, cam.y+sy/ZOOM]; }
function walkable(x,y){ return x>20&&y>40&&x<W-20&&y<H-20 && biomeAt(x,y)!=="sea"; }
function setTarget(x,y){ player.tx=Math.max(20,Math.min(W-20,x)); player.ty=Math.max(40,Math.min(H-20,y)); player.moving=true; marker={x:player.tx,y:player.ty,t:0}; }
let hintHidden=false;
cv.addEventListener("pointerup",e=>{
  if(!hintHidden){ document.getElementById("hint").style.opacity=0; hintHidden=true; }
  const [wx,wy]=toWorld(e.clientX,e.clientY);
  closeCard();
  pendingFriend=null; pendingTeta=false; pendingFountain=false;
  cancelEnter();
  for(const l of LANDMARKS){ const pd=padOf(l), onPad=Math.hypot((wx-pd.x)/1.6,wy-pd.y)<55, onBld=Math.abs(wx-l.x)<100 && wy>l.y-(l.id==="falls"?260:150) && wy<l.y+100;
    if(onPad||onBld){ pendingFriend=null; pendingTeta=false;
      if(OPEN[l.id]){ pendingLandmark=null; pendingEnterL=l; setTarget(pd.x,pd.y); }
      else { pendingEnterL=null; pendingLandmark=l; setTarget(pd.x,pd.y+40); }
      return; } }
  pendingEnterL=null;
  if(Math.abs(wx-TETA.x)<75 && wy>TETA.y-130 && wy<TETA.y+40){ pendingLandmark=null; pendingTeta=true; setTarget(TETA.x,TETA.y+60); return; }
  if(Math.abs(wx-FOUNTAIN.x)<80 && wy>FOUNTAIN.y-130 && wy<FOUNTAIN.y+40){ pendingLandmark=null; pendingFountain=true; setTarget(FOUNTAIN.x,FOUNTAIN.y+60); return; }
  for(const f of FRIENDS){ if(Math.hypot(wx-f.x,wy-(f.y-30))<68){ pendingLandmark=null; pendingFriend=f; setTarget(f.x,f.y+45); return; } }
  let hit=null, hd=1e9;
  for(const p of props){ const cx=p.x, cy=p.y-p.s*0.45, d=Math.hypot(wx-cx,wy-cy); if(d<p.s*0.7 && d<hd){hit=p; hd=d;} }
  if(hit){ bubble={p:hit,t:0}; say(hit.ar); if(hit.b!=="sea") setTarget(hit.x, hit.y+28); return; }
  pendingLandmark=null; setTarget(wx,wy);
});

const zoneEl=document.getElementById("zone"); let zoneTimer=null;
function showZone(b){ const B=BIOMES[b]; zoneEl.querySelector("b").textContent=B.en; zoneEl.querySelector("span").textContent=B.ar;
  zoneEl.classList.add("show"); clearTimeout(zoneTimer); zoneTimer=setTimeout(()=>zoneEl.classList.remove("show"),2600);
  // say a region's name only the first time it is visited in this sitting; after that the banner is enough
  let heard=[]; try{ heard=JSON.parse(sessionStorage.getItem("lq.zones")||"[]"); }catch(e){}
  if(!heard.includes(b)){ say(B.ar); heard.push(b); try{ sessionStorage.setItem("lq.zones",JSON.stringify(heard)); }catch(e){} } }

const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function shadow(x,y,w){ ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(x,y,w,w*0.32,0,0,7); ctx.fill(); }
function drawEmoji(e,x,y,s){ ctx.fillStyle="#000"; ctx.font=`${s}px ${EMOJI}`; ctx.textAlign="center"; ctx.textBaseline="bottom"; ctx.fillText(e,x,y+s*0.12); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }

function drawRiver(time){
  ctx.lineCap="round"; ctx.lineJoin="round";
  const path=()=>{ ctx.beginPath(); ctx.moveTo(...RIVER[0]); for(let i=1;i<RIVER.length-1;i++){ const mx=(RIVER[i][0]+RIVER[i+1][0])/2, my=(RIVER[i][1]+RIVER[i+1][1])/2; ctx.quadraticCurveTo(RIVER[i][0],RIVER[i][1],mx,my);} ctx.lineTo(...RIVER[RIVER.length-1]); };
  path(); ctx.strokeStyle="rgba(60,84,58,.4)"; ctx.lineWidth=58; ctx.stroke();
  path(); ctx.strokeStyle="#2F7FC4"; ctx.lineWidth=46; ctx.stroke();
  path(); ctx.strokeStyle="#5BAEE6"; ctx.lineWidth=30; ctx.stroke();
  ctx.setLineDash([18,26]); ctx.lineDashOffset=-time*40; path(); ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=4; ctx.stroke(); ctx.setLineDash([]);
}
function drawPond(){ ctx.fillStyle="rgba(60,84,58,.4)"; ctx.beginPath(); ctx.ellipse(POND.x,POND.y,POND.rx+15,POND.ry+14,0,0,7); ctx.fill(); ctx.fillStyle="#2F7FC4"; ctx.beginPath(); ctx.ellipse(POND.x,POND.y,POND.rx+8,POND.ry+8,0,0,7); ctx.fill();
  ctx.fillStyle="#63B6EA"; ctx.beginPath(); ctx.ellipse(POND.x,POND.y,POND.rx,POND.ry,0,0,7); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.35)"; ctx.beginPath(); ctx.ellipse(POND.x-30,POND.y-18,40,10,0,0,7); ctx.fill(); }
function drawWaterfall(l,time){
  const x=l.x, y=l.y+40;
  ctx.fillStyle="#7A6A5C"; rr(x-120,y-230,240,200,40); ctx.fill();
  ctx.fillStyle="#8E7D6D"; rr(x-100,y-220,200,60,30); ctx.fill();
  ctx.fillStyle="#5BAEE6"; ctx.fillRect(x-45,y-200,90,170);
  ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=5;
  for(let i=0;i<6;i++){ const lx=x-38+i*15, off=(time*160+i*37)%60; ctx.setLineDash([22,38]); ctx.lineDashOffset=-off; ctx.beginPath(); ctx.moveTo(lx,y-200); ctx.lineTo(lx,y-30); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.fillStyle="#2F7FC4"; ctx.beginPath(); ctx.ellipse(x,y-10,120,42,0,0,7); ctx.fill();
  ctx.fillStyle="#63B6EA"; ctx.beginPath(); ctx.ellipse(x,y-12,105,34,0,0,7); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.7)"; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(x-40+i*20+Math.sin(time*3+i)*4,y-28,6,0,7); ctx.fill(); }
}
function drawFarmhouse(l){
  const x=l.x, y=l.y; shadow(x,y,90);
  ctx.fillStyle="#E8DCC2"; rr(x-80,y-100,160,100,6); ctx.fill();               // limestone walls
  ctx.strokeStyle="rgba(120,100,70,.35)"; ctx.lineWidth=2;
  for(let r=1;r<5;r++){ ctx.beginPath(); ctx.moveTo(x-80,y-100+r*20); ctx.lineTo(x+80,y-100+r*20); ctx.stroke(); }
  ctx.fillStyle="#D9CBAE"; ctx.beginPath(); ctx.ellipse(x,y-100,54,34,0,Math.PI,0); ctx.fill(); // dome
  ctx.fillStyle="#5B3A22"; ctx.beginPath(); ctx.moveTo(x-18,y); ctx.lineTo(x-18,y-38); ctx.arc(x,y-38,18,Math.PI,0); ctx.lineTo(x+18,y); ctx.fill(); // arched door
  ctx.fillStyle="#2F7FC4"; for(const dx of[-52,40]){ ctx.beginPath(); ctx.moveTo(dx+x,y-44); ctx.lineTo(dx+x,y-66); ctx.arc(dx+x+6,y-66,6,Math.PI,0); ctx.lineTo(dx+x+12,y-44); ctx.fill(); }

function drawStall(l){

  const cols=["#E0607E","#FFFFFF"]; for(let i=0;i<6;i++){ ctx.fillStyle=cols[i%2]; ctx.beginPath(); ctx.moveTo(x-72+i*24,y-86); ctx.lineTo(x-48+i*24,y-86); ctx.lineTo(x-48+i*24,y-112); ctx.lineTo(x-72+i*24,y-112); ctx.fill();
    ctx.beginPath(); ctx.arc(x-60+i*24,y-86,12,0,Math.PI); ctx.fill(); }
  drawEmoji("🍊",x-40,y-30,26); drawEmoji("🏺",x-8,y-30,30); drawEmoji("🧺",x+30,y-30,28);

function drawFriend(f,got,time){

  if(!got){ const r=34+Math.sin(time*3+f.y)*4; ctx.fillStyle="rgba(242,177,52,.28)"; ctx.beginPath(); ctx.ellipse(f.x,f.y-4,r,r*0.42,0,0,7); ctx.fill(); }
  shadow(f.x,f.y,22); drawEmoji(f.e,f.x,f.y+bob,60);
  if(!got){ ctx.font=`26px ${EMOJI}`; ctx.fillStyle="#000"; ctx.textAlign="center"; ctx.textBaseline="bottom"; ctx.fillText("✨",f.x+30,f.y-48+bob); }
  else { ctx.fillStyle="#F2B134"; ctx.strokeStyle="#fff"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(f.x+28,f.y-58+bob,16,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#12233D"; ctx.font='500 20px "Baloo Bhaijaan 2","Geeza Pro",sans-serif'; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.direction="rtl"; ctx.fillText(f.ch,f.x+28,f.y-56+bob); ctx.direction="ltr"; }
}
/* Teta, drawn in the same style as the scenery: grey bun, round glasses, cream shawl and an embroidered dress.
   Draws on any 2D context with her feet at (0,0), about 112 units tall. */
function tetaArt(c,t){
  const O="rgba(46,36,26,.7)", inked=f=>{ c.fillStyle=f; c.fill(); c.strokeStyle=O; c.lineWidth=2; c.lineJoin="round"; c.lineCap="round"; c.stroke(); };
  const dot=(x,y,r,f)=>{ c.beginPath(); c.arc(x,y,r,0,7); c.fillStyle=f; c.fill(); };
  c.beginPath(); c.ellipse(-8,-2,8,4,0,0,7); inked("#5B3A22"); c.beginPath(); c.ellipse(8,-2,8,4,0,0,7); inked("#5B3A22");                 // shoes
  c.beginPath(); c.moveTo(-15,-68); c.lineTo(15,-68); c.quadraticCurveTo(24,-34,25,-6); c.quadraticCurveTo(0,0,-25,-6); c.quadraticCurveTo(-24,-34,-15,-68); c.closePath(); inked("#2E3350");   // dress
  c.save(); c.clip(); c.fillStyle="#C8402F"; c.fillRect(-30,-17,60,9); c.fillStyle="#F7E2B5"; for(let i=-4;i<=4;i++){ c.beginPath(); c.moveTo(i*6,-16); c.lineTo(i*6+3,-12.5); c.lineTo(i*6,-9); c.lineTo(i*6-3,-12.5); c.fill(); } c.restore();
  c.beginPath(); c.rect(-7,-64,14,30); inked("#C8402F"); for(let r=0;r<4;r++) for(const k of [-3,3]) dot(k,-59+r*7,1.5,"#F7E2B5");            // embroidered chest panel
  const wave=Math.sin(t*3)*0.25;
  c.save(); c.translate(-15,-62); c.rotate(0.28); c.beginPath(); c.roundRect?c.roundRect(-6,0,12,30,6):c.rect(-6,0,12,30); inked("#2E3350"); dot(0,31,5.5,"#E9B98E"); c.restore();   // resting arm
  c.save(); c.translate(15,-62); c.rotate(-2.3+wave); c.beginPath(); c.roundRect?c.roundRect(-6,0,12,28,6):c.rect(-6,0,12,28); inked("#2E3350"); c.fillStyle="#C8402F"; c.fillRect(-6,22,12,5); dot(0,31,5.5,"#E9B98E"); c.restore();   // waving arm
  c.beginPath(); c.moveTo(-21,-60); c.quadraticCurveTo(-18,-76,0,-74); c.quadraticCurveTo(18,-76,21,-60); c.quadraticCurveTo(10,-56,0,-50); c.quadraticCurveTo(-10,-56,-21,-60); c.closePath(); inked("#F6ECD6");   // shawl
  c.beginPath(); c.arc(0,-106,8,0,7); inked("#D8D8DE");                                                                                      // bun
  c.beginPath(); c.arc(0,-88,17,0,7); inked("#E9B98E");                                                                                      // face
  c.beginPath(); c.arc(0,-91,17.5,Math.PI*1.02,Math.PI*1.98); c.quadraticCurveTo(8,-98,0,-99); c.quadraticCurveTo(-8,-98,-17.4,-90); c.closePath(); inked("#D8D8DE");   // hair
  dot(-10,-82,3.4,"rgba(232,120,120,.45)"); dot(10,-82,3.4,"rgba(232,120,120,.45)");
  c.strokeStyle="#3B2A20"; c.lineWidth=1.8; c.lineCap="round";
  for(const k of [-6.5,6.5]){ c.beginPath(); c.arc(k,-86,2.6,Math.PI*1.1,Math.PI*1.9); c.stroke(); }                                          // smiling eyes
  c.beginPath(); c.arc(0,-82,6,Math.PI*0.2,Math.PI*0.8); c.stroke();                                                                           // smile
  c.strokeStyle="#7A5230"; c.lineWidth=1.6; for(const k of [-6.5,6.5]){ c.beginPath(); c.arc(k,-87,5.2,0,7); c.stroke(); } c.beginPath(); c.moveTo(-1.3,-87); c.lineTo(1.3,-87); c.stroke();   // glasses
}

function drawFountain(time){

/* ============ drawn scenery: one outlined, two-tone cartoon style for everything that is not a character ============ */
const OUT="rgba(46,36,26,.62)";
function ink(fill){ ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=OUT; ctx.lineWidth=2.5; ctx.lineJoin="round"; ctx.lineCap="round"; ctx.stroke(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); }
function poly(pts){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath(); }
function sprPalm(x,y,s){ const h=s*1.1, tx=x+s*0.08, ty=y-h*0.78;
  ctx.beginPath(); ctx.moveTo(x-s*0.07,y); ctx.quadraticCurveTo(x-s*0.02,y-h*0.4,tx-s*0.05,ty); ctx.lineTo(tx+s*0.05,ty); ctx.quadraticCurveTo(x+s*0.1,y-h*0.4,x+s*0.09,y); ctx.closePath(); ink("#B07F45");
  for(const [a,l] of [[2.75,.46],[0.4,.46],[-2.75,.56],[-0.4,.56],[-2.1,.56],[-1.05,.56]]){ const cx=Math.cos(a)*s*l, cy=Math.sin(a)*s*l*0.75;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.quadraticCurveTo(tx+cx*0.55,ty+cy*0.55-s*0.2,tx+cx,ty+cy+s*0.1); ctx.quadraticCurveTo(tx+cx*0.5,ty+cy*0.5+s*0.02,tx,ty); ink(a<-0.9&&a>-2.3?"#5CBF63":"#3F9E4D"); }
  circ(tx-s*0.05,ty+s*0.05,s*0.055); ink("#7A4B22"); circ(tx+s*0.05,ty+s*0.06,s*0.055); ink("#7A4B22"); }
function sprPine(x,y,s){ const h=s*1.15; ctx.beginPath(); ctx.rect(x-s*0.06,y-h*0.2,s*0.12,h*0.2); ink("#7A5230");
  for(let i=0;i<3;i++){ const by=y-h*(0.15+i*0.25), w=s*(0.42-i*0.09), top=by-h*0.36; ctx.beginPath(); ctx.moveTo(x-w,by); ctx.quadraticCurveTo(x,by+s*0.1,x+w,by); ctx.lineTo(x,top); ctx.closePath(); ink(["#2C7A4C","#35905A","#41A668"][i]); } }
function sprTree(x,y,s,c1,c2,fruit){ const h=s*1.1; poly([x-s*0.08,y, x-s*0.05,y-h*0.42, x+s*0.05,y-h*0.42, x+s*0.08,y]); ink("#8A5A33");
  ctx.beginPath(); ctx.ellipse(x,y-h*0.62,s*0.44,s*0.37,0,0,7); ink(c1);
  ctx.fillStyle=c2; ctx.beginPath(); ctx.ellipse(x-s*0.12,y-h*0.72,s*0.24,s*0.17,-0.3,0,7); ctx.fill();
  if(fruit){ ctx.fillStyle=fruit; for(const [dx,dy] of [[-.2,-.5],[.14,-.58],[.22,-.74],[-.02,-.82],[-.26,-.7]]){ circ(x+dx*s,y+dy*h,s*0.04); ctx.fill(); } } }
function sprRock(x,y,s){ ctx.beginPath(); ctx.moveTo(x-s*0.5,y); ctx.quadraticCurveTo(x-s*0.58,y-s*0.5,x-s*0.15,y-s*0.72); ctx.quadraticCurveTo(x+s*0.38,y-s*0.82,x+s*0.5,y-s*0.3); ctx.quadraticCurveTo(x+s*0.56,y,x+s*0.3,y); ctx.closePath(); ink("#9A958F");
  ctx.beginPath(); ctx.moveTo(x-s*0.3,y-s*0.36); ctx.quadraticCurveTo(x-s*0.15,y-s*0.6,x+s*0.14,y-s*0.6); ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=3; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+s*0.1,y-s*0.12); ctx.lineTo(x+s*0.34,y-s*0.2); ctx.strokeStyle="rgba(40,36,32,.3)"; ctx.stroke(); }
function sprCactus(x,y,s){ const h=s*1.05; ctx.lineCap="round"; ctx.lineJoin="round";

function distractors(ch){ const g=(LIKE.find(x=>x.includes(ch))||[]).filter(x=>x!==ch); const pool=[...g]; const all=Object.keys(LNAME).filter(x=>x!==ch&&!g.includes(x));
  while(pool.length<2) pool.push(all.splice(Math.random()*all.length|0,1)[0]); return pool.sort(()=>Math.random()-.5).slice(0,2); }
function meetFriend(f){
  closeCard(); const got=!!found()[f.ch]; say(f.ar);
  const head=`<div class="big">${f.e}</div><div class="arw" lang="ar">${f.ar}</div><p style="margin:0">Marhaba! I'm a <b>${f.en}</b>.</p>`;
  if(got){ openFm(`${head}<div class="ltr" lang="ar">${f.ch}</div><p>My name starts with <b>${LNAME[f.ch]}</b> <span lang="ar">${LNAME[f.ch]}</span>. I'm already in your album! ⭐</p>
      <div class="row"><button class="btn ghost" id="fHear">🔊 Hear again</button><button class="btn go" id="fOk">OK</button></div>`);
    document.getElementById("fHear").onclick=()=>say(f.ar); document.getElementById("fOk").onclick=closeFm; return; }
  const opts=[f.ch,...distractors(f.ch)].sort(()=>Math.random()-.5);
  openFm(`${head}<p><b>Which letter does my name start with?</b></p>
    <div class="opts">${opts.map(o=>`<button class="opt" lang="ar" data-o="${o}">${o}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="fHear">🔊 Hear my name</button><button class="btn ghost" id="fLater">Later</button></div>`);
  document.getElementById("fHear").onclick=()=>say(f.ar); document.getElementById("fLater").onclick=closeFm;
  fmBox.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const o=b.dataset.o;
    if(o===f.ch){ b.classList.add("right"); LQ.record("letters",f.ch,true); say(LNAME[f.ch]);
      LQ.update(p=>{ p.friends=p.friends||{}; p.friends[f.ch]=Date.now(); p.friendsStarted=true; }); LQ.addCoins(15); hud();
      const n=Object.keys(found()).length;
      setTimeout(()=>{ openFm(`<div class="big">${f.e}</div><div class="ltr" lang="ar">${f.ch}</div>
        <p style="font-size:1.15rem"><b>Yes!</b> <span lang="ar">${f.ar}</span> starts with <b>${LNAME[f.ch]}</b> <span lang="ar">${LNAME[f.ch]}</span>.</p>
        <p>⭐ I'm in your Letter Friends album now! <b>+15 🪙</b><br><span class="muted" style="color:var(--muted)">${n} of 28 friends found</span></p>
        <div class="row"><button class="btn ghost" id="fAlb">📒 Album</button><button class="btn go" id="fOk">Yalla!</button></div>`);

  });
}
function hintFor(){ const fd=found(); let best=null,bd=1e9; FRIENDS.forEach(f=>{ if(fd[f.ch]) return; const d=Math.hypot(f.x-player.x,f.y-player.y); if(d<bd){bd=d;best=f;} }); return best; }
function tetaTalk(){
  closeCard(); const p=LQ.player(); const n=Object.keys(found()).length; say("أَهْلًا وَسَهْلًا");
  if(!p||!p.friendsStarted){
    openFm(`${tetaPic}<h2 style="margin:4px 0">Ahlan, habibi! I'm Teta.</h2>
      <p>My <b>28 animal friends</b> are hiding all over this land, one for every letter of the alphabet. Each friend's name starts with their letter: <b>أَسَد</b> the lion starts with <b>أَلِف</b>!</p>
      <p>Look for animals with a ✨ sparkle. Tap one, say hello, and find the letter their name starts with. Can you find them all?</p>
      <div class="row"><button class="btn go" id="tGo">Let's go! 📒</button></div>`);
    document.getElementById("tGo").onclick=()=>{ LQ.update(q=>{ q.friendsStarted=true; }); album(); }; return; }
  if(n>=28){ openFm(`${tetaPic}<h2>🎉 You found all 28 friends!</h2><p>Teta is so proud of you. You know every letter of the alphabet!</p><div class="row"><button class="btn go" id="tOk">Shukran, Teta!</button></div>`);
    document.getElementById("tOk").onclick=closeFm; return; }
  const h=hintFor(), where=h?BIOMES[biomeAt(h.x,h.y)].en:"";
  openFm(`${tetaPic}<h2 style="margin:4px 0">You've found ${n} of 28 friends!</h2>
    <p>${h?`I think someone is waiting near <b>${where}</b>. Look for the ✨ sparkle!`:""}</p>
    <div class="row"><button class="btn ghost" id="tAlb">📒 Album</button><button class="btn go" id="tOk">OK, Teta!</button></div>`);
  document.getElementById("tOk").onclick=closeFm; document.getElementById("tAlb").onclick=album;
}
function album(){
  const fd=found(), n=Object.keys(fd).length;
  openFm(`<h2 style="margin:0">📒 Letter Friends <span style="color:var(--muted);font-size:1rem">${n}/28</span></h2>
    <p style="margin:4px 0 0;color:var(--muted)">Tap a friend you've found to hear them again.</p>
    <div class="alb">${FRIENDS.map((f,i)=>fd[f.ch]?`<button class="slot got" data-i="${i}"><div class="e">${f.e}</div><div class="l" lang="ar">${f.ch}</div><div class="w" lang="ar">${f.ar}</div></button>`
      :`<button class="slot" data-i="${i}"><div class="e">❔</div><div class="l" lang="ar">${f.ch}</div><div class="w" style="color:var(--muted)">&nbsp;</div></button>`).join("")}</div>
    <p id="albHint" style="min-height:1.4rem;color:var(--muted)"></p>
    <div class="row"><button class="btn go" id="aOk">Close</button></div>`);
  document.getElementById("aOk").onclick=closeFm;
  fmBox.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{ const f=FRIENDS[+b.dataset.i];
    if(fd[f.ch]){ say(f.ar); document.getElementById("albHint").innerHTML=`${f.e} <span lang="ar">${f.ar}</span> (${f.en}) starts with <span lang="ar">${LNAME[f.ch]}</span>`; }
    else { say(LNAME[f.ch]); document.getElementById("albHint").innerHTML=`The <b><span lang="ar">${LNAME[f.ch]}</span></b> friend is hiding in <b>${BIOMES[biomeAt(f.x,f.y)].en}</b>.`; } });
}
function allFound(){ const p=LQ.player(); if(!p||p.friendsAll) return; LQ.update(q=>{ q.friendsAll=Date.now(); }); LQ.addCoins(100); hud(); say("أَحْسَنْتَ");
  openFm(`<div class="big">🏆</div><h2>All 28 Letter Friends!</h2><p>You found every friend and know every letter. <b>+100 🪙</b> from Teta!</p><div class="row"><button class="btn go" id="wOk">Yay!</button></div>`);
  document.getElementById("wOk").onclick=closeFm; }
/* ---- Wisdom Fountain ---- */
// Each toss costs one coin more than the last (1, 2, 3...). The fountain answers on a secret toss between
// the 1st and the 10th, then the price goes back to 1 and it picks a new secret number.
const well=()=>{ const p=LQ.player(); return p&&p.well?p.well:{got:{}}; };
const tossCost=()=>(well().n||0)+1;
// counting coins: one coin, two coins (dual), three to ten coins (plural)
const NUMS=[["عُمْلَةٌ وَاحِدَة","١"],["عُمْلَتَان","٢"],["ثَلَاثُ عُمْلَات","٣"],["أَرْبَعُ عُمْلَات","٤"],["خَمْسُ عُمْلَات","٥"],["سِتُّ عُمْلَات","٦"],["سَبْعُ عُمْلَات","٧"],["ثَمَانِي عُمْلَات","٨"],["تِسْعُ عُمْلَات","٩"],["عَشْرُ عُمْلَات","١٠"]];
// miss = the number of the toss that just got no answer; the fountain counts it out loud in Arabic
function fountain(first,miss){
  closeCard(); const p=LQ.player(); if(!p) return; if(first!==false) say(FOUNTAIN.ar);
  const num=miss?NUMS[miss-1]:null; if(num) say(num[0]);
  const n=Object.keys(well().got).length, left=SAYINGS.length-n, cost=tossCost(), coins=p.coins||0;
  openWell(`<div class="big">${num?"💦":"⛲"}</div>${num?`<div class="arw" lang="ar">${num[0]} <span style="color:var(--muted)">${num[1]}</span></div><h2 style="margin:0">${miss===1?"One coin":miss+" coins"}… splash!</h2>`:`<h2 style="margin:4px 0">${FOUNTAIN.en}</h2><div class="saying" lang="ar">${FOUNTAIN.ar}</div>`}
    <p>${!left?`You have found all <b>${SAYINGS.length}</b>! Open your book to hear them again.`:num?`Keep tossing! Each toss costs one more coin until the fountain answers.`:`Toss coins into the fountain. Sometimes it answers on the first toss, sometimes it takes a few! It gives you a proverb, a riddle or a surprising word. <b>${n} of ${SAYINGS.length}</b> found.`}</p>
    ${left?`<p style="margin:0">Next toss: <b>${cost} 🪙</b> · You have <b>${coins} 🪙</b>${coins<cost?`<br><span style="color:var(--muted)">Earn more coins in the Letter Dunes and Sound Falls.</span>`:""}</p>`:""}
    <div class="row">${num?`<button class="btn ghost" id="wHear">🔊 ${miss}</button>`:""}${left?`<button class="btn go" id="wToss" ${coins<cost?"disabled":""}>Toss ${cost} 🪙</button>`:""}<button class="btn ghost" id="wBook">📖 My sayings</button><button class="btn ghost" id="wOk">Close</button></div>`);
  document.getElementById("wOk").onclick=closeFm; document.getElementById("wBook").onclick=sayingBook;
  if(left) document.getElementById("wToss").onclick=toss; if(num) document.getElementById("wHear").onclick=()=>say(num[0]);
}
function toss(){
  const p=LQ.player(), cost=tossCost(); if(!p||(p.coins||0)<cost) return;
  const got=well().got, pool=SAYINGS.filter(s=>!got[s.id]); if(!pool.length) return;
  let hit=null, k=0;
  LQ.update(q=>{ const w=q.well=q.well||{got:{}}; if(!w.need) w.need=1+(Math.random()*10|0); w.n=(w.n||0)+1; k=w.n; q.coins=(q.coins||0)-cost;
    if(w.n>=w.need){ hit=pool[Math.random()*pool.length|0]; w.got[hit.id]=Date.now(); w.n=0; w.need=0; } }); hud();
  if(hit) showSaying(hit,true); else fountain(false,k);
}
function showSaying(s,fresh){
  const head=`<div style="color:var(--muted);font-weight:800">${KIND[s.k][0]} ${KIND[s.k][1]}</div><div class="saying" lang="ar">${s.ar}</div>`;
  const foot=`<div class="row"><button class="btn ghost" id="sHear">🔊 Hear again</button>${fresh?`<button class="btn go" id="sBack">⛲ Fountain</button>`:`<button class="btn go" id="sBack">📖 Back</button>`}</div>`;
  const wire=()=>{ document.getElementById("sHear").onclick=()=>say(s.ar); document.getElementById("sBack").onclick=()=>fresh?fountain(false):sayingBook(); };
  say(s.ar);
  if(s.k==="p"){ openWell(`${head}<p style="margin:0"><b>${escH(s.lit)}</b></p><p style="margin:4px 0 0">${escH(s.mean)}</p>${foot}`); wire(); return; }
  if(s.k==="w"){ openWell(`${head}<p style="margin:0">English got the word <b>${escH(s.en)}</b> from Arabic!</p>${s.note?`<p style="margin:4px 0 0">${escH(s.note)}</p>`:""}${foot}`); wire(); return; }
  const opts=[[s.e,s.ansEn.replace(/ \(.*/,""),true],...s.wrong.map(w=>[w[0],w[1],false])].sort(()=>Math.random()-.5);
  openWell(`${head}<p style="margin:0"><b>${escH(s.en)}</b></p>
    <div class="opts">${opts.map(o=>`<button class="opt pic" data-ok="${o[2]}">${o[0]}<small>${escH(o[1])}</small></button>`).join("")}</div>${foot}`); wire();
  fmBox.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(b.dataset.ok!=="true"){ b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); return; }
    b.classList.add("right"); say(s.ans);
    setTimeout(()=>{ openWell(`${head}<div class="big">${s.e}</div><div class="saying" lang="ar" style="color:var(--ink)">${s.ans}</div><p style="margin:0"><b>Yes!</b> It is ${escH(s.ansEn)}.</p>
      <div class="row"><button class="btn ghost" id="sHear">🔊 Hear the answer</button><button class="btn go" id="sBack">${fresh?"⛲ Fountain":"📖 Back"}</button></div>`);
      document.getElementById("sHear").onclick=()=>say(s.ans); document.getElementById("sBack").onclick=()=>fresh?fountain(false):sayingBook(); },700); });
}
function sayingBook(){
  const got=well().got, n=Object.keys(got).length;
  openFm(`<h2 style="margin:0">📖 My sayings <span style="color:var(--muted);font-size:1rem">${n}/${SAYINGS.length}</span></h2>
    <p style="margin:4px 0 0;color:var(--muted)">Tap one you have found to hear it again. It's free!</p>
    <div class="book">${SAYINGS.map((s,i)=>got[s.id]?`<button class="got" data-i="${i}"><span>${KIND[s.k][0]}</span><span lang="ar">${s.ar}</span></button>`:`<button data-i="${i}" disabled><span>${KIND[s.k][0]}</span><span style="color:var(--muted)">Not found yet</span></button>`).join("")}</div>
    <div class="row"><button class="btn go" id="bOk">⛲ Fountain</button></div>`);
  document.getElementById("bOk").onclick=()=>fountain(false);
  fmBox.querySelectorAll(".book button.got").forEach(b=>b.onclick=()=>showSaying(SAYINGS[+b.dataset.i],false));
}
document.getElementById("enterCancel").onclick=e=>{ e.stopPropagation(); cancelEnter(); };
document.getElementById("albumBtn").onclick=()=>{ closeCard(); album(); };

/* ============ loop ============ */
let last=performance.now(), T=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt;
  // move
  if(player.moving){
    const dx=player.tx-player.x, dy=player.ty-player.y, d=Math.hypot(dx,dy), step=280*dt;
    if(Math.abs(dx)>2) player.face=dx>0?1:-1;
    if(d<=step){ player.x=player.tx; player.y=player.ty; player.moving=false; marker=null;
      if(pendingLandmark){ openCard(pendingLandmark); pendingLandmark=null; }
      if(pendingEnterL){ startEnter(pendingEnterL); pendingEnterL=null; }
      else { const onPad=LANDMARKS.find(l=>OPEN[l.id]&&Math.hypot((player.x-padOf(l).x)/1.6,player.y-padOf(l).y)<45); if(onPad) startEnter(onPad); }
      if(pendingFriend){ meetFriend(pendingFriend); pendingFriend=null; }
      if(pendingTeta){ tetaTalk(); pendingTeta=false; }
      if(pendingFountain){ fountain(); pendingFountain=false; } }
    else { const nx=player.x+dx/d*step, ny=player.y+dy/d*step;
      if(walkable(nx,ny)){ player.x=nx; player.y=ny; } else { player.moving=false; marker=null; } }
  }
  const z=biomeAt(player.x,player.y); if(z!==currentZone){ if(currentZone!==null) showZone(z); currentZone=z; }
  // camera
  const tx=player.x-VW/2/ZOOM, ty=player.y-VH/2/ZOOM;
  cam.x+=(tx-cam.x)*Math.min(1,dt*5); cam.y+=(ty-cam.y)*Math.min(1,dt*5);
  cam.x=Math.max(0,Math.min(W-VW/ZOOM,cam.x)); cam.y=Math.max(0,Math.min(H-VH/ZOOM,cam.y));
  if(bubble) bubble.t+=dt;

  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,-cam.x*DPR*ZOOM,-cam.y*DPR*ZOOM);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  ctx.drawImage(ground,0,0,W,H);
  const vx0=cam.x-120, vx1=cam.x+VW/ZOOM+120, vy0=cam.y-60, vy1=cam.y+VH/ZOOM+160;
  drawDecor(T,vx0,vx1,vy0,vy1); drawTrails();
  drawRiver(T); drawPond(); drawBridges();
  for(const l of LANDMARKS) drawPad(l,T);
  if(marker){ marker.t+=dt; const r=14+Math.sin(marker.t*6)*4; ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=4; ctx.beginPath(); ctx.ellipse(marker.x,marker.y,r,r*0.45,0,0,7); ctx.stroke(); }
  const list=[];
  for(const p of props) if(p.x>vx0&&p.x<vx1&&p.y>vy0&&p.y<vy1) list.push({y:p.y,f:()=>{ if(p.b!=="sea") shadow(p.x,p.y,p.s*0.32); const bob=(p.b==="sea")?Math.sin(T*2+p.x)*3:0; drawProp(p,bob);} });
  for(const q of PEAKS) if(q.x>vx0-100&&q.x<vx1+100&&q.y>vy0&&q.y<vy1+200) list.push({y:q.y,f:()=>sprPeak(q)});
  for(const l of LANDMARKS) list.push({y:l.y,f:()=>drawLandmark(l,T)});
  const fd=found();
  for(const f of FRIENDS) if(f.x>vx0&&f.x<vx1&&f.y>vy0&&f.y<vy1) list.push({y:f.y,f:()=>drawFriend(f,!!fd[f.ch],T)});
  list.push({y:TETA.y,f:()=>drawTeta(T)});
  list.push({y:FOUNTAIN.y,f:()=>drawFountain(T)});
  list.push({y:player.y,f:()=>drawPlayer(T)});
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  for(const l of LANDMARKS) drawArrow(l,T);
  drawBubble();
  drawMini();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.getElementById("startBtn").onclick=()=>{
  pickVoice(); say("أَهْلًا وَسَهْلًا");            // first sound inside a tap unlocks speech on iPad
  document.getElementById("start").remove();
  LQ.profiles(()=>{ hud(); setTimeout(()=>showZone(biomeAt(player.x,player.y)),400); });
};
function hud(){ const p=LQ.player(); document.getElementById("coinPill").textContent="🪙 "+(p?p.coins||0:0); document.getElementById("albumN").textContent=Object.keys(found()).length; }
LQ.onChange(hud); hud();
document.getElementById("whoBtn").onclick=()=>{ closeCard(); LQ.leave(); LQ.profiles(()=>hud()); };
/* coming back from a zone (same tab, same player): go straight back onto the map next to that zone */
(function resume(){
  const p=LQ.sessionPlayer(); if(!p) return;
  const from=new URLSearchParams(location.search).get("from"); const l=LANDMARKS.find(x=>x.id===from);
  if(l){ player.x=player.tx=l.x; player.y=player.ty=l.y+215; cam.x=player.x-VW/2/ZOOM; cam.y=player.y-VH/2/ZOOM; currentZone=biomeAt(player.x,player.y); }
  const st=document.getElementById("start"); if(st) st.remove();
  const h=document.getElementById("hint"); if(h) h.style.opacity=0;
  hud();
})();
document.getElementById("soundBtn").onclick=e=>{ soundOn=!soundOn; e.target.textContent=soundOn?"🔊":"🔇"; if(!soundOn){ player_audio.pause(); if(window.speechSynthesis) speechSynthesis.cancel(); } };

</script>
