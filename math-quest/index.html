/* The save is turned into text at the moment of the call, before any waiting, and that exact text is returned.
   The caller stores it as BASE ("what this device and the cloud last agreed on"). Anything the kid does while the
   upload is still in the air is NOT in it, so the next sync sees it as a new local change and keeps it. */
function cloudPut(code,obj){const data=JSON.stringify(obj);return (async()=>{
 const t=await fbToken();
 const body={fields:{data:{stringValue:data},updated:{integerValue:String(Date.now())},v:{integerValue:'1'}}};
 const r=await fetch(famUrl(code),{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error('put '+r.status);
 return data;})();}
const cloudPayload=()=>({v:1,live:state.live||{},gifts:state.gifts||{},ownGroups:state.ownGroups||{},players:state.players,pin:state.pin||null,pinUpd:state.pinUpd||0,deleted:state.deleted||{},upd:Date.now()});

/* each player remembers when it last changed, so the newest copy of each kid wins */
const HASH=new Map();
/* the play-time clock ('tb') ticks on every open device for every kid, so it must NOT count as a change — otherwise a stale device
   (a background tab, a sibling's iPad) marks everyone as 'newest' and overwrites real progress. The device a kid is actively playing on stamps them directly. */
function stampChanges(init){state.players.forEach(p=>{const h=JSON.stringify(p,(k,v)=>k==='upd'||k==='tb'||k==='ins'?undefined:v); /* 'ins' (play insights) is bookkeeping: it rides along with real changes but never counts as one */if(!init&&HASH.has(p.id)&&HASH.get(p.id)!==h)p.upd=Date.now();if(!init&&!HASH.has(p.id)&&!p.upd)p.upd=Date.now();HASH.set(p.id,h);});}
/* ---- field-by-field merge ----
   BASE = each player as it was the last time this device and the cloud agreed. When two devices both changed a kid,
   every field only one side touched is kept (coins earned on the iPad AND a pet fed on the laptop both survive).
   Only a field BOTH sides changed falls back to "newest device wins". Lists of things with ids (pets, eggs…) merge item by item. */
let BASE={};let baseReady=null;const BASE_KEY='base';
function loadBase(){if(!baseReady)baseReady=IDB.getK(BASE_KEY).then(s=>{try{BASE=s?JSON.parse(s):{};}catch(e){BASE={};}if(BASE.__fam&&BASE.__fam!==cloud.code)BASE={};});return baseReady;}
/* sent = the exact text cloudPut uploaded. BASE must be that, never the live state: the live state may already hold an answer
   given during the upload, and calling that 'agreed' made the next sync throw the answer away (progress went back a step). */
function saveBase(sent){const b={__fam:cloud.code};let list=null;try{list=sent?JSON.parse(sent).players:null;}catch(e){}(list||JSON.parse(JSON.stringify(state.players))).forEach(p=>{if(p&&p.id)b[p.id]=p;});BASE=b;IDB.putK(BASE_KEY,JSON.stringify(b));}
const _j=v=>v===undefined?'\u0000':JSON.stringify(v);
const _obj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const _idList=v=>Array.isArray(v)&&v.length>0&&v.every(x=>_obj(x)&&x.id!=null);
function merge3(b,l,r,preferL){
 if(l===r)return l;const jl=_j(l),jr=_j(r);if(jl===jr)return l;
 const jb=_j(b);if(jb===jl)return r;if(jb===jr)return l;
 if(_obj(l)&&_obj(r)){const B=_obj(b)?b:{},out={};const keys=new Set([...Object.keys(l),...Object.keys(r)]);
  keys.forEach(k=>{const v=merge3(B[k],l[k],r[k],preferL);if(v!==undefined)out[k]=v;});return out;}
 if((_idList(l)||!l||!l.length)&&(_idList(r)||!r||!r.length)&&Array.isArray(l)&&Array.isArray(r)){
  const bm=new Map((Array.isArray(b)?b:[]).filter(_obj).map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x]));
  const ids=[...l.map(x=>x.id),...r.map(x=>x.id).filter(id=>!lm.has(id))],out=[];
  ids.forEach(id=>{const v=merge3(bm.get(id),lm.get(id),rm.get(id),preferL);if(v!==undefined)out.push(v);});return out;}
 return preferL?l:r;
}
/* how many times the Troll and the Eagle have visited only ever goes up, whichever device wins */
function visitsUp(m,l,r){['troll','eagle'].forEach(k=>{const v=Math.max((l[k]||{}).visits||0,(r[k]||{}).visits||0);if(v>((m[k]||{}).visits||0)){m[k]=m[k]||{};m[k].visits=v;}});return m;}
function mergePlayer(b,l,r,preferL){
 if(!b)return visitsUp(preferL?l:r,l,r); // never agreed before: keep the old whole-player rule
 const m=visitsUp(merge3(b,l,r,preferL),l,r);
 /* play-time bank: a parent's change (+15, refill, limit) always beats a kid device's ticking clock */
 const lt=l.tb||{},rt=r.tb||{};if((lt.ps||0)!==(rt.ps||0))m.tb=JSON.parse(JSON.stringify((lt.ps||0)>(rt.ps||0)?l.tb:r.tb));
 m.upd=Math.max(l.upd||0,r.upd||0);return m;
}
/* Write a merged player back INTO the object this device already holds (and into its nested objects), instead of swapping in
   a new one. Code that is in the middle of something (a cave trip, a question popup, Dr. Quartz handing over the Lab Key)
   keeps working on the same hero, so what it writes next is not thrown away. The merged values are exactly the same. */
function adoptInto(t,s){if(t===s||!_obj(t)||!_obj(s))return s;
 Object.keys(t).forEach(k=>{if(!(k in s))delete t[k];});
 Object.keys(s).forEach(k=>{const a=t[k],b=s[k];if(a!==b&&_obj(a)&&_obj(b))adoptInto(a,b);else t[k]=b;});return t;}
function mergeStates(remote,joining,keepId){
 const del=Object.assign({},remote.deleted||{},state.deleted||{});
 const map=new Map(),order=[];
 (remote.players||[]).forEach(p=>{map.set(p.id,p);order.push(p.id);});
 state.players.forEach(p=>{const r=map.get(p.id);if(!r){map.set(p.id,p);order.push(p.id);}else map.set(p.id,adoptInto(p,mergePlayer(BASE[p.id],p,r,p.id===keepId||(p.upd||0)>(r.upd||0))));});
 let list=order.map(id=>map.get(id)).filter(p=>!(del[p.id]&&del[p.id]>=(p.upd||0)));
 if(joining){const score=p=>(p.setup?1e9:0)+(p.level||1)*1e5+(p.battles||0)*10+((p.upd||0)/1e13);const best={};
  list.forEach(p=>{const k=(p.name||'').trim().toLowerCase();if(!best[k]||score(p)>score(best[k]))best[k]=p;});/* the weaker same-name hero is removed for good (recorded as deleted), so it cannot come back on the next sync */
  list=list.filter(p=>{if(best[(p.name||'').trim().toLowerCase()]===p)return true;del[p.id]=Date.now();return false;});}
 const sig_=()=>JSON.stringify(state.players,(k,v)=>k==='tb'||k==='upd'?undefined:v)+JSON.stringify(state.gifts||{});const before=sig_();
 state.players=list;state.deleted=del;mergeGifts(remote);if(remote.ownGroups){const lg=state.ownGroups||{},rg=remote.ownGroups;state.ownGroups=Object.assign({},rg,lg);
  /* '' = this class group was removed: a removal on any device wins everywhere */
  Object.keys(state.ownGroups).forEach(k=>{if(lg[k]===''||rg[k]==='')state.ownGroups[k]='';});}
 if(remote.pin&&(!state.pin||(remote.pinUpd||0)>(state.pinUpd||0))){state.pin=remote.pin;state.pinUpd=remote.pinUpd||0;}
 if(state.cur&&!state.players.find(p=>p.id===state.cur))state.cur=null;
 mergeLive(remote);migrate();stampChanges(true);saveLocal();keepPin();
 return before!==sig_();
}
function scheduleSync(){if(!cloud.code)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(syncNow,3000);}
async function syncNow(){
 if(!cloud.code)return;if(cloud.busy){cloud.again=true;return;}
 cloud.busy=true;let changed=false;
 try{const remote=await cloudGet(cloud.code);
  await loadBase();
  if(remote)changed=mergeStates(remote,false,curScreen==='battle'||curScreen==='create'?state.cur:null);
  liveBeat();
  saveBase(await cloudPut(cloud.code,cloudPayload()));cloud.status='ok';cloud.last=Date.now();}
 catch(e){cloud.status='offline';}
 cloud.busy=false;updateCloudBadge();
 if(changed&&['profiles','map','parent','me','shop','pethome','quests','zone'].includes(curScreen)&&!$('#modal.show')&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))){const y=window.scrollY;go(curScreen,curArg);window.scrollTo(0,y);}
 if(changed&&state.cur&&['world','map','me','pethome'].includes(curScreen))setTimeout(showGift,400);
 liveRefresh();
 if(cloud.again){cloud.again=false;scheduleSync();}
}
function updateCloudBadge(){const e=$('#cloudBadge');if(e)e.innerHTML=cloudBadgeText();}
function cloudBadgeText(){

 if(cloud.status==='ok')return `☁️ Saved online ${agoText(cloud.last)}`;
 if(cloud.status==='offline')return '☁️ Offline — will save online when connected';
 return '☁️ Connecting…';
}
function agoText(t){const s=Math.round((Date.now()-t)/1000);return s<60?'just now':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago';}
function setFamily(code){cloud.code=code;try{if(code)localStorage.setItem(FAM_KEY,code);else localStorage.removeItem(FAM_KEY);}catch(e){}state.family=code||null;saveLocal();}
async function createFamily(){
 const code=genCode();
 try{await fbToken();setFamily(code);stampChanges(false);state.players.forEach(p=>{p.upd=p.upd||Date.now();});saveBase(await cloudPut(code,cloudPayload()));cloud.status='ok';cloud.last=Date.now();
  refreshParent('cloudbox',true);showFamilyCode();}
 catch(e){setFamily(null);toast("Couldn't reach the online save. Check the internet and try again.");}
}
async function joinFamily(raw,fromLink){
 const code=normCode(raw);if(famId(code).length<16){toast('That family code looks too short.');return;}
 try{const remote=await cloudGet(code);if(!remote){toast('No family found with that code. Check the spelling.');return;}
  snapTake('Before joining a family');setFamily(code);mergeStates(remote,true,null);saveBase(await cloudPut(code,cloudPayload()));cloud.status='ok';cloud.last=Date.now();
  closeModal();toast('✅ This device is now joined to your family!');
  if(fromLink){history.replaceState(null,'',location.pathname);go('profiles');}else refreshParent('cloudbox',true);}
 catch(e){toast("Couldn't reach the online save. Check the internet and try again.");}
}

(function(){const s=$('#stars');let h='';for(let i=0;i<70;i++)h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*3).toFixed(2)}s;opacity:${(.3+Math.random()*.6).toFixed(2)}"></i>`;s.innerHTML=h;})();
(async function boot(){
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
 await IDB.open();
 if(!state||!Array.isArray(state.players)){const s=await IDB.get();if(s){try{state=JSON.parse(s);}catch(e){state=null;window.MQ_BAD=window.MQ_BAD||s;}}}
 let badSave=false;if(!state||!Array.isArray(state.players)){state={v:1,players:[],cur:null,sound:true};
  if(window.MQ_BAD){badSave=true;try{IDB.putK('bad',JSON.stringify({t:Date.now(),raw:String(window.MQ_BAD)}));}catch(e){}}}
 await recallPin();migrate();if(state.sndV!==2){state.sndV=2;state.fxVol=SND_DEFAULT.fx;state.musicVol=SND_DEFAULT.mu;state.sound=true;}stampChanges(true);saveLocal();keepPin();snapDaily();go('profiles');if(badSave)toast("⚠️ This device's saved game could not be read. Grown-ups: Parent Corner → Backups can bring it back.");cloudBoot();try{Upd.afterBoot();}catch(e){}
})();
</script>
