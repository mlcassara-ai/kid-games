<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Math Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math Quest">
<meta name="theme-color" content="#1d3a8a">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon-192.png?v=1">
<style>
:root{--ink:#241a3d;--accent:#7c5cff;--gold:#ffc83d;--good:#2ecc71;--bad:#ff5a5f;--muted:#7a6fa0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka',system-ui,-apple-system,sans-serif;color:var(--ink);background:#1b1446 radial-gradient(ellipse at top,#4b3aa8,#1b1446 70%) fixed;min-height:100dvh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation;color:inherit}
input,select{font-family:inherit}
.starfield{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.starfield i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.1}}
.page{max-width:1000px;margin:0 auto;padding:16px}
.title{color:#fff;text-align:center;margin:8px 0 16px;font-size:clamp(24px,4vw,32px)}
.center{text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.muted{color:var(--muted)}
.btn{background:var(--accent);color:#fff;font-size:18px;font-weight:600;padding:12px 20px;border-radius:14px;box-shadow:0 4px 0 #4a31c9;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4a31c9}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 4px 0 #c98f00}
.btn.green{background:var(--good);box-shadow:0 4px 0 #1e9a53}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 #b3262b}
.btn.ghost{background:rgba(255,255,255,.15);box-shadow:none}
.btn.ghost.dark{background:#eee9ff;color:var(--ink)}
.btn.small{font-size:15px;padding:8px 14px}
.btn.big{font-size:22px;padding:14px 26px}
/* top bar */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 14px;color:#fff;position:sticky;top:0;z-index:5;background:rgba(20,12,50,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tb-hero{width:46px;height:54px;background:rgba(255,255,255,.12);border-radius:12px;padding:0;overflow:hidden;flex:none}
.tb-hero svg{width:60px;height:78px;margin:-4px 0 0 -7px}
.tb-info{flex:1;min-width:0}
.tb-name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{background:var(--accent);border-radius:8px;padding:0 6px;font-size:14px;margin-left:4px}
.xpbar{height:8px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden;max-width:200px;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#6ef0ff,#7c5cff)}
.coins{background:rgba(0,0,0,.35);padding:6px 12px;border-radius:20px;font-weight:700;color:var(--gold);white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.15);color:#fff;font-size:20px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;position:relative;flex:none}
.iconbtn .dot{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
@media(max-width:520px){.iconbtn{width:38px;height:38px;font-size:17px}.coins{padding:5px 8px;font-size:14px}.tb-name{font-size:15px}.topbar{gap:5px;padding:8px}}
/* logo + profiles */
.logo{text-align:center;margin:22px 0 4px;color:#fff;line-height:.9}
.logo-top{font-size:26px;letter-spacing:14px;color:#6ef0ff;font-weight:700;padding-left:14px}
.logo-main{font-size:clamp(64px,15vw,120px);font-weight:700;background:linear-gradient(180deg,#ffe066,#ff8c1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #5a2a00)}
.logo-sub{font-size:20px;letter-spacing:3px;opacity:.85;margin-top:8px}
.floaty{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;max-width:720px;margin:0 auto 20px}
.pcard{background:#fff;border-radius:22px;padding:12px 10px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .15s}
.pcard:hover{transform:translateY(-4px) rotate(-1deg)}
.pcard svg{width:100px;height:130px}
.pname{font-size:22px;font-weight:700}
.plv{font-size:15px;color:var(--muted)}
.lockgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:12px auto}
.lockgrid button{font-size:44px;background:#f1edff;border-radius:18px;padding:8px 0;box-shadow:0 4px 0 #cfc6f2}
.chip.pic{font-size:22px;padding:3px 10px}
.contcard{width:100%;min-height:110px;margin-bottom:16px}
.contcard .zart{font-size:70px}
.mf.done{background:#e8f9ee}.mf.done em{color:#1e9a53}
.mf.lvlog{background:#f1edff}
.questbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;background:rgba(255,255,255,.12);color:#fff;border-radius:16px;padding:10px 16px;margin-bottom:14px;font-size:17px}
.pbest{margin-top:10px;font-weight:700;color:#1e9a53;font-size:18px}.pbest.dim{color:var(--muted);font-weight:600}
.downnote{margin-top:12px;background:#fff6e0;border-radius:14px;padding:10px;font-size:16px;color:#6b4a00}
.lockdots{font-size:28px;letter-spacing:6px;color:var(--accent)}
.chip.big{font-size:18px;padding:10px 18px}
.chip.pic sup{font-size:12px;color:var(--accent);font-weight:700}
.zmap.champ{box-shadow:0 0 0 5px var(--gold),0 6px 0 rgba(0,0,0,.3)}
tr.flash td,.pp.flash{animation:flashbg .9s}
@keyframes flashbg{0%,40%{background:#fff3b0}100%{background:transparent}}
.pp.flash{animation:flashcard .9s}@keyframes flashcard{0%,40%{box-shadow:0 0 0 4px #ffc83d}100%{box-shadow:none}}
.z-spell{background:linear-gradient(160deg,#f7b733,#fc4a1a)}
.z-quiz{background:linear-gradient(160deg,#7f7fd5,#86a8e7 50%,#91eae4)}
.z-hw{background:linear-gradient(160deg,#56ab2f,#a8e063)}
.questmode #heroF .hp,.questmode #hhpn{visibility:hidden}
.spellq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.lboxes{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.lbox{width:clamp(24px,5.5vw,38px);height:clamp(34px,6.5vh,48px);border-bottom:4px solid #cfc6f2;font-size:clamp(22px,4.5vh,34px);font-weight:700;color:var(--accent);display:grid;place-items:center;text-transform:lowercase}
.lbox.on{border-color:var(--accent)}
.kbd{width:min(620px,98vw);margin:8px auto calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.krow{display:flex;gap:5px;justify-content:center}
.krow button{flex:1;max-width:56px;font-size:clamp(18px,3.2vh,26px);font-weight:700;padding:clamp(8px,1.6vh,14px) 0;border-radius:10px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #b9b0d9}
.krow button.wide{max-width:none;flex:1.5}.krow .go{background:var(--good);color:#fff;box-shadow:0 3px 0 #1e9a53}.krow .del{background:#ffe1e2}
.quizq{font-size:clamp(18px,3.2vh,24px);font-weight:600;letter-spacing:0;line-height:1.3;text-align:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(620px,96vw);margin:10px auto calc(12px + env(safe-area-inset-bottom))}
@media(max-width:560px){.choices{grid-template-columns:1fr}}
.choices button{background:#fff;color:var(--ink);border-radius:14px;padding:12px;font-size:18px;font-weight:600;text-align:left;box-shadow:0 4px 0 #b9b0d9;min-height:56px}
.choices b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;margin-right:6px;font-size:15px}
.hwq{font-size:clamp(26px,5vh,44px)}.hwq.long{font-size:clamp(17px,2.8vh,22px);font-weight:600;letter-spacing:0;text-align:left}
.pad .xk{grid-column:span 3;background:#eef6ff;font-size:20px}
.spellans{font-size:44px;font-weight:700;letter-spacing:4px;margin:8px 0;color:#1e9a53}.spellans .bad{color:var(--bad);text-decoration:underline}
.mf.new{background:#f1edff}
.wordbox summary{cursor:pointer;font-weight:600;color:var(--accent);margin:8px 0}
.ta{font-size:16px;resize:vertical;min-height:120px}
.qlist{margin:4px 0 8px;padding-left:20px}
.qcard{position:relative}
.hintbtn{position:absolute;top:-14px;right:-8px;background:#fff6d6;border:3px solid var(--gold);border-radius:999px;padding:4px 10px;font-size:15px;font-weight:700;color:#6b4a00;box-shadow:0 3px 0 rgba(0,0,0,.2);z-index:2;white-space:nowrap}
.hintbtn.off{background:#eee;border-color:#ccc;color:#888}
.hintbtn small{font-weight:600}
.dimbulb{filter:grayscale(1);opacity:.35}
.hintcard .pethead{display:flex;align-items:center;gap:12px;text-align:left}
.bigpet{font-size:54px;animation:bob 1.6s ease-in-out infinite}
.choices .gone{opacity:.3;text-decoration:line-through}
.petpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.petpick .item{cursor:pointer}
.famcode{font-size:24px;font-weight:700;letter-spacing:2px;background:#f1edff;border-radius:12px;padding:10px;margin:8px 0;word-break:break-word;color:var(--accent)}
.famcode.small{font-size:17px;padding:3px 8px}
.famlink{font-size:13px;word-break:break-all;background:#f6f3ff;border-radius:10px;padding:8px;color:#4c3f78}
.battle.z-forest{background:linear-gradient(180deg,#3f8f2c,#1f4a18)}
.battle.z-caves{background:linear-gradient(180deg,#22203a,#110e22)}
.battle.z-volcano{background:linear-gradient(180deg,#1a0f0d,#3a120c)}
.battle.z-castle{background:linear-gradient(180deg,#3c3458,#1c1630)}
.battle.z-tower{background:linear-gradient(180deg,#3b2a8a,#0b0826)}
.battle.z-spell{background:linear-gradient(180deg,#8a6a2a,#4a3614)}
.battle.z-quiz{background:linear-gradient(180deg,#f1f6ff,#9bb3e8)}
.battle.z-hw{background:linear-gradient(180deg,#4c9a3a,#23501b)}
.battle .bhud{background:rgba(0,0,0,.35);position:relative;z-index:2}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-500px)}}
.scene-svg .drift{animation:drift 70s linear infinite}.scene-svg .drift.slow{animation-duration:120s}
@keyframes twk{50%{opacity:.25}}.scene-svg .twk{animation:twk 2.8s ease-in-out infinite}.scene-svg .twk.slow{animation-duration:5s}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(40px,-20px)}50%{transform:translate(90px,5px)}75%{transform:translate(40px,25px)}100%{transform:translate(0,0)}}
.scene-svg .flutter{animation:flutter 12s ease-in-out infinite}
@keyframes drip{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(220px);opacity:0}}.scene-svg .drip{animation:drip 4s ease-in infinite}
@keyframes glowp{50%{opacity:.7}}.scene-svg .glow{animation:glowp 3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.12,.9)}}.scene-svg .flick{animation:flick .35s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes ember{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translate(20px,-260px);opacity:0}}.scene-svg .ember{animation:ember 6s linear infinite}
@keyframes lava{50%{opacity:.75}}.scene-svg .lavaglow,.scene-svg .lavaflow{animation:lava 2.2s ease-in-out infinite}
@keyframes smoke{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-40px);opacity:.2}}.scene-svg .smoke{animation:smoke 4s ease-out infinite}
@keyframes bat{0%{transform:translate(0,0)}50%{transform:translate(-120px,20px)}100%{transform:translate(0,0)}}.scene-svg .bat{animation:bat 9s ease-in-out infinite}
@keyframes fog{from{transform:translateX(0)}to{transform:translateX(200px)}}.scene-svg .fog{animation:fog 20s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}.scene-svg .spin{animation:spin 30s linear infinite}
@keyframes floaty{50%{transform:translateY(-12px)}}.scene-svg .float{animation:floaty 5s ease-in-out infinite}
@keyframes leaf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-80px,420px) rotate(540deg)}}.scene-svg .leaf{animation:leaf 9s linear infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.scene-svg *{animation:none!important}}
.pcard.add{background:rgba(255,255,255,.1);color:#fff;border:3px dashed rgba(255,255,255,.4);box-shadow:none}
.pcard.add .plv{color:#cfc6ff}
.plus{font-size:64px;height:130px;display:grid;place-items:center}
/* creator */
.creator{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;background:#fff;border-radius:24px;padding:20px;max-width:780px;margin:0 auto 16px}
.preview{width:210px;flex:none;display:grid;place-items:center;background:radial-gradient(circle,#efeaff,#fff 70%);border-radius:20px}
.preview svg{width:190px;height:247px;animation:bob 2.4s ease-in-out infinite}
.opts{flex:1;min-width:260px}
.lbl{display:block;font-weight:600;margin:12px 0 6px;color:#5b4d8a}
.inp{width:100%;font-size:20px;padding:10px 14px;border-radius:12px;border:3px solid #ddd5ff;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#f1edff;padding:7px 14px;border-radius:999px;font-size:16px;font-weight:600;border:3px solid transparent}
.chip.on{border-color:var(--accent);background:#e3dbff}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ddd}
.sw.on{box-shadow:0 0 0 4px var(--accent)}
.shake-x{animation:shakex .4s}
/* map */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.zone-card{position:relative;border-radius:22px;padding:18px;min-height:175px;color:#fff;text-align:left;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.3);font-size:16px;transition:transform .15s}
.zone-card:hover{transform:translateY(-4px)}
.zone-card>*:not(.zart):not(.crowned){position:relative;z-index:1}
.zone-card .crowned{z-index:1}
.zone-card .zart{z-index:0;opacity:.85;position:absolute;right:8px;bottom:-6px;font-size:88px;animation:bob 3s ease-in-out infinite}
.zone-card h3{margin:0 0 4px;font-size:25px;text-shadow:0 2px 0 rgba(0,0,0,.25);max-width:75%}
.zone-card .op{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.28);font-size:30px;font-weight:700;margin-bottom:8px}
.zsub{font-weight:600;opacity:.95}
.zlv{font-size:14px;opacity:.85;margin-top:4px;max-width:65%}
.crowned{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.3);border-radius:12px;padding:3px 10px;font-size:14px;font-weight:600}
.zone-card.locked{filter:grayscale(.9) brightness(.6)}
.z-forest{background:linear-gradient(160deg,#4fd07a,#1d7a44)}
.z-caves{background:linear-gradient(160deg,#6a7ae0,#262a6e)}
.z-volcano{background:linear-gradient(160deg,#ff9a4d,#a8231b)}
.z-castle{background:linear-gradient(160deg,#a77be0,#44246f)}
.z-tower{background:linear-gradient(160deg,#16c2c9,#1d3a8a 55%,#c93fa6)}
.zhead{display:flex;align-items:center;gap:12px}
.zhead .title{flex:1;margin-right:70px}
.zmap{position:relative;width:100%;aspect-ratio:16/10;max-height:calc(100dvh - 190px);min-height:380px;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.3)}
@media(max-width:640px){.zmap{aspect-ratio:3/4}.zmap .node{width:62px;height:62px;font-size:30px}.zmap .node.boss{width:84px;height:84px;font-size:44px}.zhead .title{margin-right:0}}
.zpath{position:absolute;inset:0;width:100%;height:100%}
.decor{position:absolute;opacity:.35;pointer-events:none;transform:translate(-50%,-50%)}
.node{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:38px;box-shadow:0 5px 0 rgba(0,0,0,.3);border:4px solid #fff;z-index:2}
.node.boss{width:100px;height:100px;font-size:54px;border-color:var(--gold);background:#fff6d6}
.node.locked{background:#bbb;opacity:.75;font-size:28px}
.node.done{border-color:var(--good)}
.node.next{animation:pulse 1.1s ease-in-out infinite}
.nstars{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:15px;white-space:nowrap;text-shadow:0 1px 2px #000}
.go-tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--gold);color:#5a3b00;font-size:14px;font-weight:700;padding:1px 9px;border-radius:9px}
.ztip{color:#fff;text-align:center;opacity:.9;font-size:17px}
/* battle */
.battle{height:100dvh;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.bhud{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(0,0,0,.2)}
.bname{flex:1;font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{font-weight:700;color:#ffe066;font-size:18px;white-space:nowrap}
.bmain{flex:1;display:flex;flex-direction:column;min-height:0}
.arena{position:relative;flex:1 1 auto;min-height:160px;display:flex;justify-content:space-between;align-items:flex-end;padding:8px 7% 14px}
.arena{overflow:hidden}
.arena::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.18));pointer-events:none;z-index:0}
.scene{position:absolute;inset:0;z-index:0;pointer-events:none}
.scene-svg{width:100%;height:100%;display:block}
.zscene{z-index:0}.zmap .zpath{z-index:1}.zmap .node{z-index:2}
.hpnum{text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.6)}
.fighter{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1}
.hp{width:clamp(110px,26vw,200px);height:16px;background:rgba(0,0,0,.4);border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.7)}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2ecc71,#a6f36b);transition:width .4s}
.mon .hp i{background:linear-gradient(90deg,#ff5a5f,#ffb13d)}
.hpnum{font-size:14px;font-weight:600;text-shadow:0 1px 2px #000}
.hero-sprite svg{width:clamp(80px,17vh,150px);height:auto;display:block}
.hero-sprite{animation:bob 2.4s ease-in-out infinite}
.petf{position:absolute;left:-26px;bottom:4px;font-size:clamp(28px,5vh,42px);animation:bob 1.6s ease-in-out infinite .3s}
.mon-sprite{font-size:clamp(66px,15vh,130px);line-height:1.05;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.boss .mon-sprite{font-size:clamp(88px,20vh,170px)}
.qcard{margin:0 auto;width:min(560px,94vw);background:#fff;color:var(--ink);border-radius:20px;padding:10px 16px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:background .2s}
.qcard.right{background:#e2ffe9}
.qlabel{font-size:15px;font-weight:600;color:var(--accent);min-height:0}
.qtext{font-size:clamp(30px,6vh,52px);font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.ansbox{display:inline-block;min-width:1.6em;padding:0 .2em;border-bottom:4px solid var(--accent);color:var(--accent)}
.vq{display:inline-grid;font-size:clamp(26px,4.6vh,40px);line-height:1.15;justify-items:center}
.vq span{width:.72em;text-align:center}
.vq .ansrow{border-top:4px solid var(--ink);color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(420px,94vw);margin:10px auto calc(12px + env(safe-area-inset-bottom))}
.pad button{font-size:clamp(22px,4vh,32px);font-weight:700;padding:clamp(6px,1.5vh,16px) 0;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 4px 0 #b9b0d9}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #b9b0d9}

.item{background:#f6f3ff;border-radius:16px;padding:8px 6px;border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:600}
.item.eq{border-color:var(--good);background:#eafff2}
.item.need{opacity:.6}
.item .ie{font-size:40px;height:60px;display:grid;place-items:center}
.item svg{width:60px;height:60px}
.item .ip{font-weight:700;color:#8a6d00}
.item.eq .ip{color:#1e9a53}
.item .isw{width:46px;height:46px;border-radius:50%;margin:7px;border:3px solid #fff;box-shadow:0 0 0 2px #ddd}
.item small{font-weight:500;color:var(--muted);font-size:12px;text-align:center}
.eggrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.eggrow .n{font-size:18px;font-weight:600}
/* parent */
.pp{background:#fff;border-radius:22px;padding:18px;margin-bottom:18px}
.pp-head{display:flex;align-items:center;gap:14px}
.pp-head svg{width:64px;height:83px}
.pp-head h3{margin:0;font-size:26px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.kpis div{background:#f6f3ff;border-radius:14px;padding:10px;text-align:center}
.kpis b{display:block;font-size:26px}
.kpis span{font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto}
.optable{min-width:420px;width:100%;border-collapse:collapse;font-size:15px}
.optable th{text-align:left;color:var(--muted);font-weight:600;padding:6px;border-bottom:2px solid #eee}
.optable td{padding:8px 6px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.mini{width:34px;height:34px;border-radius:10px;background:#eee9ff;font-size:20px;font-weight:700;margin:0 2px}
.missed{display:flex;flex-wrap:wrap;gap:8px}
.mf{background:#fff1e6;border-radius:10px;padding:6px 10px;font-weight:600}
.mf em{font-style:normal;color:#c2410c;font-weight:500;font-size:13px}
.days{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:8px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.dbar{flex:1;width:70%;max-width:40px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;background:#f6f3ff}
.dbar .dr{background:#2ecc71}.dbar .dw{background:#ff8c42}
.dn{font-size:13px;font-weight:600}.dl{font-size:12px;color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}
.note{color:#cfc6ff;text-align:center;font-size:14px}
.sel{font-size:16px;padding:6px 8px;border-radius:10px;border:2px solid #ddd5ff}
.pp h4{margin:18px 0 6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(150px);background:#241a3d;color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;transition:transform .3s;z-index:60;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.top{bottom:auto;top:70px;transform:translateX(-50%) translateY(-200px)}
#toast.top.show{transform:translateX(-50%) translateY(0)}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.1)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes shakex{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes wobble{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
</style>

<script>
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ================= new math worlds: fractions, money, time ================= */
const XOPS=['frac','money','time'];
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const frA=b=>`<span class="fr"><span>{A}</span><span>${b}</span></span>`;
const pad2=n=>String(n).padStart(2,'0');
const tfmt=(h,m)=>`${h}:${pad2(m)}`;
const wrapH=h=>((h-1)%12+12)%12+1;
const cents=c=>c>=100?`$${Math.floor(c/100)}.${pad2(c%100)}`:`${c}¢`;
const COIN={1:{n:'penny',l:'1¢',c:'#c77d3a'},5:{n:'nickel',l:'5¢',c:'#b8bec7'},10:{n:'dime',l:'10¢',c:'#d5dae0'},25:{n:'quarter',l:'25¢',c:'#c3c9d1'},100:{n:'dollar',l:'$1',c:'#6fbf73'}};
function visHTML(v){
 if(!v)return '';
 if(v.t==='pie'){const {n,k}=v;const cx=50,cy=50,r=44;let s='';
  for(let i=0;i<n;i++){const a0=i/n*2*Math.PI-Math.PI/2,a1=(i+1)/n*2*Math.PI-Math.PI/2;
   const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
   s+=n===1?`<circle cx="50" cy="50" r="44" fill="${i<k?'#ff9f43':'#fff'}"/>`:`<path d="M50 50 L${x0.toFixed(1)} ${y0.toFixed(1)} A44 44 0 ${1/n>.5?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${i<k?'#ff9f43':'#fff'}" stroke="#5a3b00" stroke-width="2"/>`;}
  return `<svg class="vis pie" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#5a3b00"/>${s}</svg>`;}
 if(v.t==='bar'){let s='';for(let i=0;i<v.n;i++)s+=`<i class="${i<v.k?'on':''}"></i>`;return `<div class="vis fbar" style="grid-template-columns:repeat(${v.n},1fr)">${s}</div>`;}
 if(v.t==='set'){return `<div class="vis vset">${Array.from({length:v.n},(_,i)=>`<span class="${v.k&&i<v.k?'hl':''}">${v.e}</span>`).join('')}</div>`;}
 if(v.t==='coins'){return `<div class="vis coins">${v.list.map(c=>c===100?`<span class="bill">$1</span>`:`<span class="coin c${c}" style="background:${COIN[c].c}">${COIN[c].l}</span>`).join('')}</div>`;}
 if(v.t==='clock'){const {h,m}=v;const ha=((h%12)+m/60)/12*2*Math.PI,ma=m/60*2*Math.PI;
  let ticks='';for(let i=1;i<=12;i++){const a=i/12*2*Math.PI;ticks+=`<text x="${(50+36*Math.sin(a)).toFixed(1)}" y="${(50-36*Math.cos(a)+4.5).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#2b2250">${i}</text>`;}
  let mins='';for(let i=0;i<60;i++){if(i%5===0)continue;const a=i/60*2*Math.PI;mins+=`<line x1="${(50+44*Math.sin(a)).toFixed(1)}" y1="${(50-44*Math.cos(a)).toFixed(1)}" x2="${(50+46*Math.sin(a)).toFixed(1)}" y2="${(50-46*Math.cos(a)).toFixed(1)}" stroke="#b9b0d9" stroke-width="1"/>`;}
  return `<svg class="vis clock" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fff" stroke="#7c5cff" stroke-width="4"/>${mins}${ticks}
  <line x1="50" y1="50" x2="${(50+22*Math.sin(ha)).toFixed(1)}" y2="${(50-22*Math.cos(ha)).toFixed(1)}" stroke="#2b2250" stroke-width="5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="${(50+34*Math.sin(ma)).toFixed(1)}" y2="${(50-34*Math.cos(ma)).toFixed(1)}" stroke="#ff5fa2" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="#2b2250"/></svg>`;}
 return '';
}
function genX(op,L){
 const q={op,L,fast:9};
 const fin=(o)=>Object.assign(q,o);
 if(op==='frac'){
  if(L<=2){const n=L===1?pick([2,3,4]):pick([3,4,5,6,8]),k=rnd(1,n-1);const not=L===2&&Math.random()<.4;
   return fin({vis:{t:Math.random()<.5?'pie':'bar',n,k},prompt:`What fraction is ${not?'<b>NOT</b> ':''}shaded?`,tpl:frA(n),answer:not?n-k:k,text:`${not?'Unshaded':'Shaded'}: ${k} of ${n} parts`,
    explain:`<p>There are <b>${n}</b> equal parts, so the bottom number is ${n}.</p><p>${not?`${n-k} parts are white`:`${k} parts are shaded`}, so the answer is <b>${fr(not?n-k:k,n)}</b>.</p>`,
    nudge:`<p>Count the <b>${not?'white':'orange'}</b> parts. That number goes on top!</p>`});}
  if(L<=4){const d=L===3?pick([2,4]):pick([2,3,4,5]);const N=d*rnd(L===3?1:2,L===3?3:6);const e=pick(['🍎','🍓','⭐','🐟','🍪','🎈']);
   return fin({vis:{t:'set',n:N,e},prompt:`${fr(1,d)} of ${N} ${e}`,tpl:`${fr(1,d)} of ${N} = {A}`,answer:N/d,text:`1/${d} of ${N}`,
    explain:`<p>${fr(1,d)} means split into <b>${d}</b> equal groups.</p><p>${N} ÷ ${d} = <b>${N/d}</b></p>`,nudge:`<p>Share the ${N} ${e} into <b>${d}</b> equal groups. How many in one group?</p>`});}
  if(L<=6){const n=pick([4,5,6,8,10]);let a,b,ans,t;
   if(L===5){a=rnd(1,n-2);b=rnd(1,n-1-a);ans=a+b;t=`${fr(a,n)} + ${fr(b,n)} = ${frA(n)}`;}else{a=rnd(2,n);b=rnd(1,a-1);ans=a-b;t=`${fr(a,n)} − ${fr(b,n)} = ${frA(n)}`;}
   return fin({vis:{t:'bar',n,k:L===5?a:a},tpl:t,answer:ans,text:`${a}/${n} ${L===5?'+':'−'} ${b}/${n}`,
    explain:`<p>The bottom numbers match, so just ${L===5?'add':'subtract'} the top numbers:</p><p>${a} ${L===5?'+':'−'} ${b} = <b>${ans}</b>, so it's ${fr(ans,n)}</p>`,nudge:`<p>Keep the bottom number (${n}). Just ${L===5?'add':'take away'} the top numbers!</p>`});}
  if(L===7){const b=pick([2,3,4,5]),a=rnd(1,b-1),m=rnd(2,4);
   return fin({vis:{t:'bar',n:b,k:a},tpl:`${fr(a,b)} = ${frA(b*m)}`,answer:a*m,text:`${a}/${b} = ?/${b*m}`,
    explain:`<p>${b} × <b>${m}</b> = ${b*m}, so multiply the top by ${m} too:</p><p>${a} × ${m} = <b>${a*m}</b></p>`,nudge:`<p>What do you multiply ${b} by to get ${b*m}? Do the same to the top!</p>`});}
  if(L===8){const n=pick([3,4,5,6,8,10]),k=rnd(2,n-1),N=n*rnd(2,8);
   return fin({tpl:`${fr(k,n)} of ${N} = {A}`,answer:N/n*k,text:`${k}/${n} of ${N}`,
    explain:`<p>First find ${fr(1,n)}: ${N} ÷ ${n} = ${N/n}.</p><p>Then take ${k} of them: ${N/n} × ${k} = <b>${N/n*k}</b></p>`,nudge:`<p>Find ${fr(1,n)} of ${N} first (divide by ${n}), then multiply by ${k}.</p>`});}
  if(L===9){const n=pick([2,3,4,5,6,8]);if(Math.random()<.5){const w=rnd(2,4);return fin({prompt:`How many ${fr(1,n)} pieces make ${w} wholes?`,tpl:'{A}',answer:n*w,text:`${w} wholes in 1/${n}s`,explain:`<p>1 whole = ${n} pieces, so ${w} wholes = ${w} × ${n} = <b>${n*w}</b></p>`,nudge:`<p>How many pieces are in ONE whole? Now do that ${w} times.</p>`});}
   const w=rnd(1,3),r=rnd(1,n-1),top=w*n+r;return fin({tpl:`${fr(top,n)} = ${w} and ${frA(n)}`,answer:r,text:`${top}/${n} as a mixed number`,explain:`<p>${w} wholes use ${w} × ${n} = ${w*n} pieces.</p><p>${top} − ${w*n} = <b>${r}</b> left over.</p>`,nudge:`<p>How many pieces do ${w} wholes use? What is left over?</p>`});}
  const b=pick([2,3,4,5]),m=pick([2,3]),d=b*m,a=rnd(1,b-1),c=rnd(1,d-1);const ans=a*m+c;
  return fin({tpl:`${fr(a,b)} + ${fr(c,d)} = ${frA(d)}`,answer:ans,text:`${a}/${b} + ${c}/${d}`,explain:`<p>Change ${fr(a,b)} into ${d}ths: ${fr(a,b)} = ${fr(a*m,d)}</p><p>${a*m} + ${c} = <b>${ans}</b>, so it's ${fr(ans,d)}</p>`,nudge:`<p>Make the bottoms match first: ${fr(a,b)} = ?/${d}</p>`});
 }
 if(op==='money'){
  const coinsQ=(pool,cnt,max)=>{let list,t;do{list=Array.from({length:rnd(cnt[0],cnt[1])},()=>pick(pool)).sort((x,y)=>y-x);t=list.reduce((a,b)=>a+b,0);}while(t>max);return {list,t};};
  if(L<=4){const {list,t}=L===1?coinsQ([1,5],[2,4],20):L===2?coinsQ([1,5,10],[3,5],50):L===3?coinsQ([1,5,10,25],[3,6],100):coinsQ([5,10,25,100],[4,7],200);
   return fin({vis:{t:'coins',list},prompt:'How much money is this?',tpl:'{A} ¢',answer:t,text:`Coins: ${list.map(c=>c===100?'$1':c+'¢').join(' + ')}`,
    explain:`<p>Start with the biggest: ${list.map(c=>c===100?'100':c).join(' + ')} = <b>${t}¢</b>${t>=100?` (that's ${cents(t)})`:''}</p>`,
    nudge:`<p>Remember: 🪙 penny = 1¢, nickel = 5¢, dime = 10¢, quarter = 25¢, $1 = 100¢. Count the big ones first!</p>`});}
  const items=[['🍎','apple'],['🍪','cookie'],['🧃','juice box'],['🍫','candy bar'],['🎈','balloon'],['✏️','pencil'],['🍦','ice cream'],['🧸','teddy']];
  if(L===5){const [e1,n1]=pick(items);let [e2,n2]=pick(items);if(n2===n1)[e2,n2]=items[(items.findIndex(x=>x[1]===n1)+1)%items.length];const a=5*rnd(2,12),b=5*rnd(2,12);
   return fin({prompt:`A ${e1} ${n1} costs ${a}¢. A ${e2} ${n2} costs ${b}¢.`,tpl:'Both together: {A} ¢',answer:a+b,text:`${a}¢ + ${b}¢`,explain:`<p>${a} + ${b} = <b>${a+b}¢</b></p>`,nudge:`<p>Add the two prices. Try the tens first: ${Math.floor(a/10)*10} + ${Math.floor(b/10)*10}.</p>`});}
  if(L===6){const [e,n]=pick(items);const pr=5*rnd(3,19);
   return fin({vis:{t:'coins',list:[100]},prompt:`You pay <b>$1</b> for a ${e} ${n} that costs <b>${pr}¢</b>.`,tpl:'Your change: {A} ¢',answer:100-pr,text:`Change from $1 for ${pr}¢`,explain:`<p>$1 = 100¢. &nbsp;100 − ${pr} = <b>${100-pr}¢</b></p><p class="tip">Count up from ${pr} to 100!</p>`,nudge:`<p>Count up from ${pr}¢ to 100¢. How far is it?</p>`});}
  if(L===7){const d=rnd(1,9),c=5*rnd(1,19);const v=d*100+c;
   return fin({tpl:`$${d}.${pad2(c)} = {A} ¢`,answer:v,text:`$${d}.${pad2(c)} in cents`,explain:`<p>Each dollar is 100¢: ${d} × 100 = ${d*100}.</p><p>${d*100} + ${c} = <b>${v}¢</b></p>`,nudge:`<p>How many cents is ${d} dollar${d>1?'s':''}? Then add the ${c}¢.</p>`});}
  if(L===8){const [e,n]=pick(items);const pr=rnd(1,4)*100+25*rnd(0,3)+(Math.random()<.5?0:10);const v=500-pr;
   return fin({prompt:`You pay <b>$5</b> for a ${e} ${n} that costs <b>${cents(pr)}</b>.`,tpl:'Change in cents: {A} ¢',answer:v,text:`Change from $5 for ${cents(pr)}`,explain:`<p>$5 = 500¢, ${cents(pr)} = ${pr}¢.</p><p>500 − ${pr} = <b>${v}¢</b> (${cents(v)})</p>`,nudge:`<p>Turn both into cents: $5 = 500¢. Then subtract.</p>`});}
  if(L===9){const [e,n]=pick(items);const k=rnd(2,9),pr=rnd(2,12);
   return fin({prompt:`${e.repeat(Math.min(k,6))}<br>${k} ${n}${k>1?'s':''} cost <b>$${pr}</b> each.`,tpl:'Total: $ {A}',answer:k*pr,text:`${k} × $${pr}`,explain:`<p>${k} × ${pr} = <b>$${k*pr}</b></p>`,nudge:`<p>Multiply how many by the price: ${k} × ${pr}</p>`});}
  const have=pick([10,20,20,50]),a=rnd(2,Math.floor(have/3)),b=rnd(2,Math.floor(have/3));
  return fin({prompt:`You have <b>$${have}</b>. You buy a toy for <b>$${a}</b> and a book for <b>$${b}</b>.`,tpl:'Money left: $ {A}',answer:have-a-b,text:`$${have} − $${a} − $${b}`,explain:`<p>Spent: ${a} + ${b} = ${a+b}.</p><p>${have} − ${a+b} = <b>$${have-a-b}</b></p>`,nudge:`<p>Add up what you spent first, then take it away from $${have}.</p>`});
 }
 // time
 const clockQ=(h,m,extra)=>fin(Object.assign({vis:{t:'clock',h,m},prompt:'What time is it?',tpl:'{A}',kind:'clock',answer:h*100+m,alt:m===0?[h]:undefined,text:`Clock ${tfmt(h,m)}`,
  explain:`<p>The short hand shows the <b>hour</b>: ${m===0?`it's on the ${h}`:`it's just past the ${h}`}.</p><p>The long pink hand shows the <b>minutes</b>: ${m===0?"straight up = o'clock":`${m/5===Math.floor(m/5)?`${m/5} × 5 = `:''}${m} minutes`}.</p><p>It's <b>${tfmt(h,m)}</b></p>`,
  nudge:`<p>Short hand = hour. Long pink hand = minutes. Count by 5s around the clock for the long hand!</p><p class="tip">Type 3:45 as 3 4 5</p>`},extra||{}));
 if(L===1)return clockQ(rnd(1,12),0);
 if(L===2)return clockQ(rnd(1,12),pick([0,30,30]));
 if(L===3)return clockQ(rnd(1,12),pick([15,30,45]));
 if(L===4)return clockQ(rnd(1,12),5*rnd(1,11));
 if(L===5)return clockQ(rnd(1,12),rnd(1,59));
 if(L===6){const opts=[[`1 hour`,60],[`half an hour`,30],[`2 hours`,120],[`a quarter of an hour`,15]];const h=rnd(1,3),m=pick([15,30,45]);opts.push([`${h} hour${h>1?'s':''} and ${m} minutes`,h*60+m]);const [t,v]=pick(opts);
  return fin({prompt:`How many minutes are in <b>${t}</b>?`,tpl:'{A} minutes',answer:v,text:`Minutes in ${t}`,explain:`<p>1 hour = 60 minutes.</p><p>${t} = <b>${v} minutes</b></p>`,nudge:`<p>Remember: 1 hour = 60 minutes, half an hour = 30.</p>`});}
 if(L===7||L===9){const h=rnd(1,12),m=5*rnd(0,11),d=pick([15,30,45,60,20,40]);const later=L===7;let tot=h*60+m+(later?d:-d);tot=((tot%720)+720)%720;const H=wrapH(Math.floor(tot/60)||12),M=tot%60;
  return clockQ(h,m,{prompt:later?`What time will it be <b>${d} minutes later</b>?`:`What time was it <b>${d} minutes earlier</b>?`,answer:(H===0?12:H)*100+M,alt:M===0?[H]:undefined,text:`${tfmt(h,m)} ${later?'+':'−'} ${d} min`,
   explain:`<p>The clock says ${tfmt(h,m)}.</p><p>${later?'Add':'Go back'} ${d} minutes → <b>${tfmt(H,M)}</b></p>`,nudge:`<p>It's ${tfmt(h,m)} now. Count ${later?'forward':'back'} ${d} minutes by 5s!</p><p class="tip">Type 3:45 as 3 4 5</p>`});}
 if(L===8){const h=rnd(1,10),m=5*rnd(0,11),d=5*rnd(3,23);const e=h*60+m+d;const H=wrapH(Math.floor(e/60)),M=e%60;
  return fin({prompt:`Soccer starts at <b>${tfmt(h,m)}</b> and ends at <b>${tfmt(H,M)}</b>.`,tpl:'It lasts {A} minutes',answer:d,text:`${tfmt(h,m)} to ${tfmt(H,M)}`,explain:`<p>From ${tfmt(h,m)} count up to ${tfmt(H,M)}: <b>${d} minutes</b></p><p class="tip">Jump to the next o'clock first, then add the rest!</p>`,nudge:`<p>Count from ${tfmt(h,m)} to the next o'clock, then keep going to ${tfmt(H,M)}.</p>`});}
 const h=rnd(1,9),m=5*rnd(0,11),dh=rnd(1,2),dm=5*rnd(1,11);const e=h*60+m+dh*60+dm;const H=wrapH(Math.floor(e/60)),M=e%60;

const PICS=['🐶','🐱','🦊','🐸','🦄','🐙','🚀','🍕','⚽'];
function choose(id){
 SFX.tap();const p=state.players.find(x=>x.id===id);
 if(p.setup&&p.lock){askLock(p);return;}
 enter(p);
}
let lockTry=[];
function askLock(p){
 lockTry=[];const pics=[...PICS].sort(()=>Math.random()-.5);
 modal(`<div class="mcard"><h2>Hi ${esc(p.name)}! 🔒</h2><p>Tap your ${p.lock.length>1?p.lock.length+' secret pictures in order':'secret picture'}.</p><div class="lockdots" id="lockdots">${p.lock.map(()=>'○').join(' ')}</div><div class="lockgrid" id="lockgrid">${pics.map(e=>`<button onclick="tryLock('${p.id}','${e}')">${e}</button>`).join('')}</div><div class="row"><button class="btn ghost dark small" onclick="closeModal()">That's not me</button></div></div>`);
}
function tryLock(id,e){
 const p=state.players.find(x=>x.id===id);
 lockTry.push(e);SFX.tap();
 const dots=$('#lockdots');if(dots)dots.textContent=p.lock.map((_,i)=>i<lockTry.length?'●':'○').join(' ');
 if(lockTry.length<p.lock.length)return;
 if(lockTry.join('')===p.lock.join('')){closeModal();enter(p);return;}
 lockTry=[];if(dots)dots.textContent=p.lock.map(()=>'○').join(' ');
 SFX.wrong();const g=$('#lockgrid');g.classList.remove('shake-x');void g.offsetWidth;g.classList.add('shake-x');toast('Oops! Try again.');
}
function enter(p){
 state.cur=p.id;save();
 if(!p.setup){go('create',p.id);return;}
 go('world');
 if(!p.welcomed){welcomeIfNew(p);return;}
 if(p.battle){const b=p.battle,z=ZONES.find(x=>x.id===b.zid);const f0=b.foes&&b.foes[b.ti||0];const m=f0?[f0.n,f0.e]:z.mons[b.i];
  modal(`<div class="mcard"><div class="big-emoji">${m[1]}</div><h2>Welcome back, ${esc(p.name)}!</h2><p>You were in the middle of a battle with <b>${esc(m[0])}</b>. Want to finish it?</p><div class="row"><button class="btn ghost dark" onclick="P().battle=null;save();closeModal()">Not now</button><button class="btn green" onclick="resumeBattle()">Keep fighting ⚔️</button></div></div>`);}
 else toast(`Welcome back, ${p.name}! 👋`);
}
function resumeBattle(){const b=P().battle;closeModal();if(b)startBattle(b.zid,b.i,b);}

let draft=null;
SCREENS.create=id=>{
 const ex=id?state.players.find(p=>p.id===id):null;
 draft={id:ex?ex.id:null,name:ex?ex.name:'',grade:ex?ex.grade:3,look:Object.assign({skin:SKINS[0],hair:HAIRS[0],hat:'wizard',robe:'purple'},ex?ex.look:{}),edit:!!(ex&&ex.setup&&ex.welcomed),lock:ex&&ex.lock?[...ex.lock]:[]};
 draft.saved=ex&&ex.setup?heroSnap():null;
 renderCreate();
};
function renderCreate(){
 const ex=draft.id?state.players.find(p=>p.id===draft.id):null;
 const hats=HATS.filter(h=>ex?ex.owned.hats.includes(h.id):!h.price);
 const robes=ROBES.filter(r=>ex?ex.owned.robes.includes(r.id):!r.price);
 const sw=(bg,on,act)=>`<button class="sw ${on?'on':''}" style="background:${bg}" onclick="${act};renderCreate()"></button>`;
 app.innerHTML=`<div class="page"><h2 class="title">${draft.id?(draft.edit?`Change ${esc(draft.name)}'s look`:`Create ${esc(draft.name)}'s hero!`):'Create your hero!'}</h2>
 <div class="creator"><div class="preview">${heroSVG(draft.look)}</div>
 <div class="opts">
  <label class="lbl">Boy or girl?</label><div class="chips"><button class="chip big ${draft.look.kind==='boy'?'on':''}" onclick="draft.look.kind='boy';renderCreate()">🧙‍♂️ Boy wizard</button><button class="chip big ${draft.look.kind==='girl'?'on':''}" onclick="draft.look.kind='girl';renderCreate()">🧙‍♀️ Girl wizard</button></div>
  <label class="lbl">Hero name</label><input id="nm" class="inp" maxlength="16" value="${esc(draft.name)}" placeholder="Type a name" oninput="draft.name=this.value">
  ${draft.id?'':`<label class="lbl">School grade</label><div class="chips">${[1,2,3,4,5,6].map(g=>`<button class="chip ${draft.grade===g?'on':''}" onclick="draft.grade=${g};renderCreate()">${g}</button>`).join('')}</div>`}
  <label class="lbl">Skin</label><div class="chips">${SKINS.map(c=>sw(c,draft.look.skin===c,`draft.look.skin='${c}'`)).join('')}</div>
  <label class="lbl">Hair</label><div class="chips">${HAIRS.map(c=>sw(c,draft.look.hair===c,`draft.look.hair='${c}'`)).join('')}</div>
  <label class="lbl">Robe</label><div class="chips">${robes.map(r=>sw(r.grad?`linear-gradient(135deg,${r.grad.join(',')})`:r.c,draft.look.robe===r.id,`draft.look.robe='${r.id}'`)).join('')}</div>
  <label class="lbl">Secret pictures <span class="muted">(optional: tap 2 in order so only you can play as you)</span></label><div class="chips"><button class="chip ${!draft.lock||!draft.lock.length?'on':''}" onclick="draft.lock=[];renderCreate()">${draft.lock&&draft.lock.length?'Clear':'None'}</button>${PICS.map(e=>{const k=(draft.lock||[]).indexOf(e);return `<button class="chip pic ${k>=0?'on':''}" onclick="pickLock('${e}')">${e}${k>=0?`<sup>${k+1}</sup>`:''}</button>`;}).join('')}</div>
  <label class="lbl">Hat</label><div class="chips">${hats.map(h=>`<button class="chip ${draft.look.hat===h.id?'on':''}" onclick="draft.look.hat='${h.id}';renderCreate()">${h.name}</button>`).join('')}</div>
 </div></div>
 <div class="row"><button class="btn ghost" onclick="leaveCreate()">← Back</button><button class="btn green big" onclick="saveHero('save')">💾 Save${heroDirty()?'':'d ✓'}</button><button class="btn gold big" onclick="saveHero('${draft.edit?'done':'start'}')">${draft.edit?'Done ✓':'Start the adventure! ⚔️'}</button></div></div>`;
}
function pickLock(e){draft.lock=draft.lock||[];if(draft.lock.length>=2||draft.lock.includes(e))draft.lock=[];draft.lock.push(e);renderCreate();}
function heroSnap(){return JSON.stringify({n:draft.name.trim(),l:draft.look,k:draft.lock||[],g:draft.grade});}
function heroDirty(){return draft.saved!==heroSnap();}
function saveHero(mode){
 const name=draft.name.trim();
 if(draft.look.kind!=='boy'&&draft.look.kind!=='girl'){toast('Pick a boy or girl wizard first!');return false;}
 if(draft.lock&&draft.lock.length===1){toast('Pick one more secret picture (or tap Clear).');return false;}
 if(!name){const i=$('#nm');i.classList.remove('shake-x');void i.offsetWidth;i.classList.add('shake-x');i.focus();toast('Give your hero a name!');return false;}
 let p=draft.id?state.players.find(x=>x.id===draft.id):null;
 if(!p){p=newPlayer(name,draft.grade);p.welcomed=false;state.players.push(p);}
 p.name=name;p.look=JSON.parse(JSON.stringify(draft.look));p.lock=draft.lock&&draft.lock.length?[...draft.lock]:null;p.setup=true;state.cur=p.id;save();
 draft.id=p.id;draft.name=name;draft.saved=heroSnap();
 if(mode==='save'){SFX.coin();toast('Saved! ✓');renderCreate();return true;}
 if(mode==='done'){go('backpack');return true;}
 go('world');welcomeIfNew(p);return true;
}
function leaveCreate(){
 const back=()=>{const p=draft.id&&state.players.find(x=>x.id===draft.id);go(draft.edit?'backpack':'profiles');};
 if(!heroDirty()){back();return;}
 modal(`<div class="mcard"><h2>Save your hero?</h2><p>You changed your hero but didn't save yet.</p><div class="row"><button class="btn ghost dark" onclick="closeModal()">Keep editing</button><button class="btn danger" onclick="closeModal();draft.saved=heroSnap();leaveCreate()">Don't save</button><button class="btn green" onclick="closeModal();if(saveHero('save'))leaveCreate()">💾 Save</button></div></div>`);
}
function welcomeIfNew(p){
 if(p.welcomed)return;p.welcomed=true;save();
 modal(`<div class="mcard"><div class="big-emoji">🌟</div><h2>Welcome, ${esc(p.name)}!</h2>
 <p>Number Monsters have taken over the Realm of Numbers. Only a math hero can stop them!</p>
 <div class="hint" style="text-align:left">✅ Right answers cast spells at the monster.<br>⚡ Answer fast for a <b>CRITICAL</b> hit!<br>🔥 Keep a streak going for extra power.<br>💡 Wrong answers let the monster hit back, but you'll see the trick to solve it.</div>
 <p><b>🥚 You found a mystery egg!</b> Hatch it in your backpack.</p>
 <div class="row"><button class="btn green" onclick="closeModal();go('backpack')">Hatch my egg!</button><button class="btn ghost dark" onclick="closeModal()">To the map!</button></div></div>`);
}

function genQ(op,L){
 if(XOPS.includes(op))return genX(op,L);
 let a,b,c,ans,text;
 if(op==='add'){
  switch(L){
   case 1:a=rnd(1,5);b=rnd(1,5);break;
   case 2:a=rnd(2,10);b=rnd(2,10);break;
   case 3:a=rnd(11,89);b=rnd(2,9);break;
   case 4:{const t1=rnd(1,7),o1=rnd(0,8);a=t1*10+o1;b=rnd(1,8-t1)*10+rnd(0,9-o1);}break;
   case 5:do{a=rnd(15,89);b=rnd(12,79);}while(a%10+b%10<10);break;
   case 6:a=rnd(100,899);b=rnd(12,99);break;
   case 7:a=rnd(100,899);b=rnd(100,899);break;
   case 8:a=rnd(1000,8999);b=rnd(100,999);break;
   case 9:a=rnd(1000,8999);b=rnd(1000,8999);break;
   default:a=rnd(100,999);b=rnd(10,99);c=rnd(100,999);
  }
  ans=a+b+(c||0);text=c!==undefined?`${a} + ${b} + ${c}`:`${a} + ${b}`;
 }else if(op==='sub'){
  switch(L){
   case 1:a=rnd(2,9);b=rnd(1,a);break;
   case 2:a=rnd(11,20);b=rnd(2,10);break;
   case 3:a=rnd(20,99);b=rnd(2,9);break;
   case 4:{const t1=rnd(2,9),o1=rnd(1,9);a=t1*10+o1;b=rnd(1,t1-1)*10+rnd(0,o1);}break;
   case 5:do{a=rnd(31,99);b=rnd(12,a-5);}while(a%10>=b%10);break;
   case 6:a=rnd(100,999);b=rnd(12,99);break;
   case 7:a=rnd(300,999);b=rnd(100,a-20);break;
   case 8:a=rnd(1000,9999);b=rnd(100,999);break;
   case 9:a=rnd(3000,9999);b=rnd(1000,a-500);break;
   default:a=rnd(10000,60000);b=rnd(1000,9999);
  }
  ans=a-b;text=`${a} − ${b}`;
 }else if(op==='mul'){
  const sets={1:[0,1,2,10],2:[2,5,10],3:[2,3,4,5,10],4:[2,3,4,5,6],5:[2,3,4,5,6,7,8,9],6:[3,4,6,7,8,9,11,12]};
  if(L===1){const f=pick([0,1,2]),o=rnd(1,4);[a,b]=Math.random()<.5?[f,o]:[o,f];}
  else if(L<=6){const f=pick(sets[L]),o=L===6?rnd(2,12):rnd(1,10);[a,b]=Math.random()<.5?[f,o]:[o,f];}
  else if(L===7){a=rnd(11,19);b=rnd(2,9);}
  else if(L===8){a=rnd(21,99);b=rnd(3,9);}
  else if(L===9){a=rnd(12,29);b=rnd(11,19);}
  else{a=rnd(101,999);b=rnd(3,9);}
  ans=a*b;text=`${a} × ${b}`;
 }else{
  const sets={1:[1,2,10],2:[2,5,10],3:[2,3,4,5,10],4:[2,3,4,5,6],5:[2,3,4,5,6,7,8,9],6:[3,4,6,7,8,9,11,12]};
  let d,q;
  if(L===1){d=rnd(1,3);q=rnd(1,3);}
  else if(L<=6){d=pick(sets[L]);q=L===6?rnd(2,12):rnd(1,10);}
  else if(L===7){d=rnd(2,9);q=rnd(11,19);}
  else if(L===8){d=rnd(3,9);q=rnd(21,99);}
  else if(L===9){d=rnd(11,19);q=rnd(3,12);}
  else{d=rnd(12,25);q=rnd(13,60);}
  a=d*q;b=d;ans=q;text=`${a} ÷ ${b}`;
 }
 const q={op,L,a,b,answer:ans,text};if(c!==undefined)q.c=c;return q;
}
function practiceFact(p,op){

function pickOp(p,zop){
 if(zop!=='mix')return zop;
 const w=BASIC_OPS.map(o=>{const s=p.stats[o];return 1+3*(s.w/(s.r+s.w+2));});
 let r=Math.random()*w.reduce((x,y)=>x+y,0);

const isVertical=q=>((q.op==='add'||q.op==='sub')&&Math.max(q.a,q.b)>=100)||(q.op==='mul'&&(q.a>=100||(q.a>=10&&q.b>=10)));

/* Adaptive difficulty: each skill keeps a window of recent answers.
   Mostly right (and mostly quick) -> level up. Struggling -> level down. */
/* Adaptive difficulty (per player, per skill).
   UP:   5 right in a row at the current level  -> one level harder.
   DOWN: 3 wrong out of the last 4 at the current level -> one level easier.
   The count starts over after every level change, so each level needs a few answers
   before it can move again. Repeats of missed problems and swapped-digit typos don't count. */
const UP_N=5,DOWN_N=3,DOWN_WIN=4;
function adjustSkill(p,op,ok,slip){
 p.recent=p.recent||{};p.recent[op]=p.recent[op]||[];p.log=p.log||[];
 if(slip)return null;
 const w=p.recent[op];w.push(ok?1:0);if(w.length>8)w.shift();
 const L=lvl(p,op);
 if(L<10&&w.length>=UP_N&&w.slice(-UP_N).every(x=>x===1)){applyLevel(p,op,L+1);p.recent[op]=[];return 1;}
 if(L>1&&w.length>=DOWN_N&&w.slice(-DOWN_WIN).filter(x=>x===0).length>=DOWN_N){applyLevel(p,op,L-1);p.recent[op]=[];return -1;}
 return null;
}
function applyLevel(p,op,to){const L=lvl(p,op);p.skill[op]=clamp(to,1,10)+.5;p.log.unshift({d:dayKey(),op,from:L,to:lvl(p,op)});if(p.log.length>30)p.log.pop();}
function isSlip(q,given){
 const a=String(q.answer),g=String(given);if(q.answer<20||a.length!==g.length)return false;
 const diff=[];for(let i=0;i<a.length;i++)if(a[i]!==g[i])diff.push(i);
 return diff.length===2&&diff[1]===diff[0]+1&&a[diff[0]]===g[diff[1]]&&a[diff[1]]===g[diff[0]];
}

function dotsHTML(n,cls){let s='';for(let i=0;i<n;i++)s+=`<i class="${cls||''}"></i>`;return s;}
function arrayHTML(rows,cols){let s='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)s+=`<i class="${r%2?'alt':''}"></i>`;return `<div class="arr" style="grid-template-columns:repeat(${cols},11px)">${s}</div>`;}
function colHTML(q){

  }

 }

  if(a<=12&&b<=12){
   if(a===0||b===0)return `<p>Anything times 0 is 0! Zero groups of anything is nothing at all.</p>`;

   else if(a===2||b===2){trick=`<p class="tip">2s trick: double it! ${other(2)} + ${other(2)} = ${a*b}</p>`;}
   else if(a===4||b===4){const o=other(4);trick=`<p class="tip">4s trick: double, then double again: ${o} → ${o*2} → ${o*4}</p>`;}
   return `${a*b<=40?`<p>${rows} rows of ${cols}:</p>${arrayHTML(rows,cols)}`:''}<p>Count by ${cols}s:<br><b>${Array.from({length:rows},(_,i)=>(i+1)*cols).join(', ')}</b></p>${trick}`;
  }

 }

}

 state.gifts[tid]={id:tid,from:p.id,fromName:p.name,to:g.from,kind:'thanks',item:giftLabel(g).replace(/^\S+ /,'').replace(/^a /,'the '),qty:0,t:Date.now(),claimed:false};save();toast(`❤️ Thank-you sent to ${g.fromName}!`);}

function mergeGifts(remote){const a=state.gifts||{},b=(remote&&remote.gifts)||{};const out={};
 for(const id of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[id],y=b[id];const g=Object.assign({},y||{},x||{});if((x&&x.claimed)||(y&&y.claimed)){g.claimed=true;g.ct=Math.max((x&&x.ct)||0,(y&&y.ct)||0);}if((x&&x.thanked)||(y&&y.thanked))g.thanked=true;out[id]=g;}
 const old=Date.now()-45*864e5;for(const id in out){if(out[id].claimed&&(out[id].ct||out[id].t)<old)delete out[id];}
 state.gifts=out;}

/* ================= rounds: 5 medal rounds per world ================= */
const ROUNDS=[null,{n:'Bronze',m:'🥉'},{n:'Silver',m:'🥈'},{n:'Gold',m:'🥇'},{n:'Diamond',m:'💎'},{n:'Legend',m:'👑'}];
const RMUL={1:{hp:1,dmg:1},2:{hp:1.2,dmg:1.15},3:{hp:1.35,dmg:1.25},4:{hp:1.45,dmg:1.3},5:{hp:1.6,dmg:1.4}};
function medianThink(p){const a=(p.thinkT||[]);if(a.length<5)return 0;const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)];}
const tiredKey=(zid,r,i)=>zid+'-'+r+'-'+i;
function rpeek(p,zid,r){if(r<=1)return p.progress[zid]||[];return ((p.rounds||{})[zid]||{})[r]||[];}
function rstore(p,zid,r){if(r<=1){p.progress[zid]=p.progress[zid]||[0,0,0,0,0,0];return p.progress[zid];}p.rounds=p.rounds||{};const z=p.rounds[zid]=p.rounds[zid]||{};return z[r]=z[r]||[0,0,0,0,0,0];}
function medal(p,zid){let m=0;for(let r=1;r<=5;r++){if((rpeek(p,zid,r)[5]||0)>0)m=r;else break;}return m;}
function curRound(p,zid){const maxOpen=Math.min(5,medal(p,zid)+1);const sel=(p.roundSel||{})[zid];return sel&&sel<=maxOpen?sel:maxOpen;}
function setRound(zid,r){const p=P();p.roundSel=p.roundSel||{};p.roundSel[zid]=r;save();SFX.tap();go('zone',zid);}
function totalMedals(p){return [...ZONES.map(z=>z.id),'spell'].reduce((a,id)=>a+medal(p,id),0);}
function roundNote(z,r){
 if(z.op==='spell')return ['','Hear the word. The boxes show how many letters it has.','No letter boxes! You have to know how long the word is.','No letter boxes, and only <b>2 replays</b> of each word.','Beat the clock! Spell fast for a ⏱️ speed bonus. Only 2 replays.','The boss uses <b>every</b> word and there are no pet hints. Win for a 🌟 Legend egg!'][r];
 return ['','The first adventure!','Tougher monsters, and gangs show up more.','Even tougher! Bigger gangs, and the boss brings a helper.','No free miss! Monsters ⚡ charge up an attack if you take too long (bigger problems give you more time). The boss brings two helpers.','The hardest round! Monsters charge up even faster. Win it for a 🌟 Legend egg!'][r];
}
function roundTabs(p,z){
 const m=medal(p,z.id),cur=curRound(p,z.id);
 return `<div class="rtabs">${[1,2,3,4,5].map(r=>{const open=r<=Math.min(5,m+1),done=r<=m;
  return `<button class="rtab ${r===cur?'on':''} ${open?'':'locked'} ${done?'done':''}" onclick="${open?`setRound('${z.id}',${r})`:`toast('Beat the ${ROUNDS[r-1].n} boss to unlock ${ROUNDS[r].n}!')`}"><span class="rm">${open?ROUNDS[r].m:'🔒'}</span><small>${ROUNDS[r].n}${done?' ✓':''}</small></button>`;}).join('')}</div>
 <div class="rnote">${ROUNDS[cur].m} <b>${ROUNDS[cur].n} round:</b> ${roundNote(z,cur)}</div>`;
}
function roundPrize(p,r,z,B){
 const coin=n=>{p.coins+=n;if(B)B.coins+=n;};let lines=[];
 if(r===2){p.eggs++;coin(150);lines=['🥚 A mystery egg','🪙 150 coins'];}
 else if(r===3){coin(200);const pool=[...HATS.filter(h=>h.price&&!p.owned.hats.includes(h.id)).map(h=>['hat',h]),...ROBES.filter(x=>x.price&&!p.owned.robes.includes(x.id)).map(x=>['robe',x])];
  if(pool.length){const [k,it]=pick(pool);p.owned[k==='hat'?'hats':'robes'].push(it.id);lines=[`🎁 A free ${k==='hat'?'hat':'robe'}: <b>${it.name}</b>`,'🪙 200 coins'];}else{coin(200);lines=['🪙 400 coins'];}}
 else if(r===4){p.eggs+=2;coin(300);lines=['🥚🥚 Two mystery eggs','🪙 300 coins'];}
 else if(r===5){p.legendEggs=(p.legendEggs||0)+1;coin(500);lines=['🌟 A LEGEND EGG (Epic or Legendary pet inside!)','🪙 500 coins'];}
 const title=z.op==='spell'?`${ROUNDS[r].n} Speller`:`${ROUNDS[r].n} Hero of ${z.name}`;
 return `<div class="rdone"><div class="rdm">${ROUNDS[r].m}</div><b>${ROUNDS[r].n.toUpperCase()} ROUND COMPLETE!</b><div>You are now a <b>${esc(title)}</b>!</div>${lines.length?`<div class="rprize">${lines.join('<br>')}</div>`:''}${r<5?`<div class="rnext">${ROUNDS[r+1].m} <b>${ROUNDS[r+1].n}</b> round unlocked!</div>`:'<div class="rnext">👑 You conquered every round! 👑</div>'}</div>`;
}
function checkSpellSig(p){const sig=spellList(p).map(x=>x.w).join('|');if(!sig)return;if(p.spellSig===undefined){p.spellSig=sig;return;}
 if(p.spellSig!==sig){p.spellSig=sig;p.progress.spell=[0,0,0,0,0,0];if(p.rounds)delete p.rounds.spell;if(p.roundSel)delete p.roundSel.spell;save();setTimeout(()=>toast('📜 New spelling words! Starting again at Bronze 🥉'),300);}}

function fmtTime(s){const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m';}
function daysChart(p){
 const out=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const v=p.daily[dayKey(d)]||{r:0,w:0};out.push({l:d.toLocaleDateString(undefined,{weekday:'short'}),r:v.r,w:v.w});}

/* ================= pet buddies: earned at levels, limited hints ================= */
const PET_LEVELS=[2,4,6,8,10];
const HINT_CHARGE=8;                       // right answers to earn back one hint
const PET_STAGES=[{n:'Baby',xp:0,max:1},{n:'Big',xp:15,max:2},{n:'Grown-up',xp:45,max:3},{n:'Legendary',xp:120,max:3}];
function petData(p,id){p.petData=p.petData||{};if(!p.petData[id])p.petData[id]={xp:0,hints:1,charge:0};return p.petData[id];}
function petStage(pd){let s=PET_STAGES[0];PET_STAGES.forEach(x=>{if(pd.xp>=x.xp)s=x;});return s;}
function petMeter(pd){const st=petStage(pd);let m='';for(let i=0;i<st.max;i++)m+=i<pd.hints?'💡':'<span class="dimbulb">💡</span>';return m;}
function petMilestones(p){p.petMs=p.petMs||[];const due=PET_LEVELS.filter(l=>p.level>=l&&!p.petMs.includes(l));p.pendingPets=due.length;return due;}
function petCharge(p){
 const pet=petOf(p);if(!pet)return;const pd=petData(p,pet.id);const st=petStage(pd);
 pd.xp+=.25;
 if(pd.hints<st.max){pd.charge++;if(pd.charge>=HINT_CHARGE){pd.charge=0;pd.hints++;setTimeout(()=>toast(`${pet.e} ${pet.name} has a new hint for you! 💡`),600);}}
 const st2=petStage(pd);if(st2.max>st.max){pd.hints=Math.min(st2.max,pd.hints+1);setTimeout(()=>{banner(`${pet.e} ${pet.name} grew up!`);toast(`${pet.name} is now ${st2.n} and can hold ${st2.max} hints!`);},900);}
 updateHintBtn();
}
function updateHintBtn(){
 const b=$('#hintBtn');if(!b||!B)return;const p=P();const pet=petOf(p);
 if(!pet){b.innerHTML='🐾 Hint';b.classList.add('off');return;}
 const pd=petData(p,pet.id);
 b.classList.toggle('off',pd.hints<=0);
 b.innerHTML=`${pet.e} Hint ${pd.hints>0?petMeter(pd):`<small>${pd.charge}/${HINT_CHARGE}</small>`}`;
}
function useHint(){
 if(!B||B.busy||B.over||fbOpen||!B.q)return;
 if(spellRound()>=5){toast('👑 No pet hints in the Legend round. You can do it!');return;}
 const p=P();const pet=petOf(p);
 if(!pet){toast('Earn a pet buddy at hero level 2 and it will give you hints! 🐾');return;}
 const pd=petData(p,pet.id);
 if(B.q.hinted){toast(`${pet.name} already helped with this one!`);return;}
 if(pd.hints<=0){toast(`${pet.e} ${pet.name} is resting. ${HINT_CHARGE-pd.charge} more right answers for a new hint!`);return;}
 pd.hints--;pd.xp+=1;B.q.hinted=true;save();SFX.coin();
 let body=hintFor(B.q);
 modal(`<div class="mcard hintcard"><div class="pethead"><span class="bigpet">${pet.e}</span><div><b>${esc(pet.name)} says:</b><div class="muted">${pd.hints} hint${pd.hints===1?'':'s'} left</div></div></div><div class="hint">${body}</div><button class="btn green big" onclick="closeModal()">Thanks, ${esc(pet.name)}!</button></div>`);
 updateHintBtn();
}
function hintFor(q){
 if(q.type==='word'){
  const first=q.word[0].toLowerCase();if(!B.input.startsWith(first))B.input=first;showQ();setTimeout(()=>say(q.word,.45),300);
  return `<p>It starts with <b style="font-size:28px">${esc(first)}</b> and has <b>${q.word.length}</b> letters.</p><p>Listen to it slowly… 🐢</p>`;
 }
 if(q.type==='choice'){
  const wrong=[0,1,2,3].filter(i=>i!==q.answer&&i<q.choices.length).sort(()=>Math.random()-.5).slice(0,2);q.hidden=wrong;
  $('.bctrl .qpad').innerHTML=questPadHTML();
  return `<p>I crossed out <b>two wrong answers</b> for you! ✂️</p>`;
 }
 if(q.type==='hw'){
  if(q.hint)return `<p>${esc(q.hint)}</p>`;
  const n=parseFloat(normAns(q.answer));
  if(!isNaN(n)&&/^[\d.]+$/.test(normAns(q.answer))){const lo=Math.floor(n*.8),hi=Math.ceil(n*1.2);return `<p>The answer is somewhere between <b>${lo}</b> and <b>${hi}</b>.</p><p>Read it again slowly and find the numbers you need.</p>`;}
  return `<p>Read the problem again slowly and underline the numbers. What is it asking you to find?</p>`;
 }
 return mathNudge(q);
}
function mathNudge(q){
 if(q.nudge)return q.nudge;
 const {op,a,b,c}=q;const d=(n,i)=>Math.floor(n/Math.pow(10,i))%10;
 if(op==='add'){
  if(c===undefined&&a+b<=20)return `<p>Count all the dots:</p><div class="dotbox"><span class="grp">${dotsHTML(a)}</span><span class="plus">+</span><span class="grp">${dotsHTML(b,'o')}</span></div>`;
  const s=d(a,0)+d(b,0)+(c!==undefined?d(c,0):0);
  return `<p>Start with the <b>ones</b>: ${d(a,0)} + ${d(b,0)}${c!==undefined?' + '+d(c,0):''} = <b>${s}</b>.</p><p>${s>=10?`Write the ${s%10} and carry the 1 to the tens!`:`Write the ${s}, then add the tens.`}</p>`;
 }
 if(op==='sub'){
  if(a<=20)return `<p>Start at <b>${a}</b> and count back <b>${b}</b>.</p><p>Or think: ${b} + ? = ${a}</p>`;
  if(q.answer<10)return `<p>These numbers are close together!</p><p>Start at <b>${b}</b> and count up to <b>${a}</b>. How many steps?</p>`;
  const ao=d(a,0),bo=d(b,0);
  return ao>=bo?`<p>Start with the <b>ones</b>: ${ao} − ${bo} = <b>${ao-bo}</b>. Now do the tens!</p>`:`<p>Ones: ${ao} is smaller than ${bo}, so <b>borrow a ten</b>: ${ao+10} − ${bo} = <b>${ao+10-bo}</b>.</p><p>Remember the tens went down by 1!</p>`;
 }
 if(op==='mul'){
  if(a<=12&&b<=12){
   if(a===0||b===0)return `<p>Zero groups of anything is… nothing at all!</p>`;
   if(a===1||b===1)return `<p>One group of a number is just that number!</p>`;
   if(a===10||b===10)return `<p>Times 10? Put a zero on the end of ${a===10?b:a}!</p>`;
   const big=Math.max(a,b),small=Math.min(a,b);
   const shown=Math.max(1,Math.min(3,small-1));
   return `<p>Count by <b>${big}s</b>, ${small} times in all:</p><p><b>${Array.from({length:shown},(_,i)=>big*(i+1)).join(', ')}, …</b> keep going!</p>`;
  }
  const split=b>12?'b':'a';const big=split==='a'?a:b,oth=split==='a'?b:a;const parts=placeParts(big);
  if(parts.length===1){const z=String(big).match(/0+$/)[0];return `<p>${big} × ${oth} is like <b>${big/Math.pow(10,z.length)} × ${oth}</b>…</p><p>…then put <b>${z.length===1?'a zero':z.length+' zeros'}</b> on the end!</p>`;}
  return `<p>Split <b>${big}</b> into ${parts.join(' + ')}.</p><p>First: ${parts[0]} × ${oth} = <b>${parts[0]*oth}</b>. Now do the other part${parts.length>2?'s':''} and add!</p>`;
 }
 const qn=q.answer;
 const shown=Math.max(1,Math.min(2,qn-1));
 return `<p>Think: <b>${b} × ? = ${a}</b></p><p>Count by ${b}s: <b>${Array.from({length:shown},(_,i)=>b*(i+1)).join(', ')}, …</b> How many jumps to get to ${a}?</p>`;
}
function offerPet(){
 const p=P();const due=petMilestones(p);if(!due.length)return;
 const pool=PETS.filter(x=>!p.pets.includes(x.id)&&(x.tier==='common'||(x.tier==='rare'&&due[0]>=6)));
 if(!pool.length){p.petMs.push(due[0]);p.eggs++;save();toast(`Level ${due[0]} reward: a mystery egg! 🥚 Hatch it in your backpack.`);return;}
 const w=[];pool.forEach(x=>{for(let i=0;i<(x.tier==='rare'?1:3);i++)w.push(x);});
 const opts=[];const src=w.length?w:pool;while(opts.length<Math.min(3,pool.length)){const x=pick(src);if(!opts.includes(x))opts.push(x);}
 SFX.level();
 modal(`<div class="mcard"><div class="big-emoji">🎁</div><h2>Level ${due[0]} reward!</h2><p>A new pet buddy wants to join you. Pets give you <b>hints</b> 💡 when a problem is tricky!</p>
 <div class="petpick">${opts.map(x=>`<button class="item" onclick="takePet('${x.id}',${due[0]})"><div class="ie">${x.e}</div><div>${esc(x.name)}</div><small>${PERKS[x.perk]}</small>${x.tier!=='common'?tierTag(x):''}</button>`).join('')}</div>
 <p class="muted">Tap the one you want!</p></div>`);
}

const cloudPayload=()=>({v:1,gifts:state.gifts||{},players:state.players,pin:state.pin||null,pinUpd:state.pinUpd||0,deleted:state.deleted||{},upd:Date.now()});

/* each player remembers when it last changed, so the newest copy of each kid wins */
const HASH=new Map();
function stampChanges(init){state.players.forEach(p=>{const h=JSON.stringify(p,(k,v)=>k==='upd'?undefined:v);if(!init&&HASH.has(p.id)&&HASH.get(p.id)!==h)p.upd=Date.now();if(!init&&!HASH.has(p.id)&&!p.upd)p.upd=Date.now();HASH.set(p.id,h);});}
function mergeStates(remote,joining,keepId){
 const del=Object.assign({},remote.deleted||{},state.deleted||{});
 const map=new Map(),order=[];
 (remote.players||[]).forEach(p=>{map.set(p.id,p);order.push(p.id);});
 state.players.forEach(p=>{const r=map.get(p.id);if(!r){map.set(p.id,p);order.push(p.id);}else if(p.id===keepId||(p.upd||0)>(r.upd||0))map.set(p.id,p);});
 let list=order.map(id=>map.get(id)).filter(p=>!(del[p.id]&&del[p.id]>=(p.upd||0)));
 if(joining){const score=p=>(p.setup?1e9:0)+(p.level||1)*1e5+(p.battles||0)*10+((p.upd||0)/1e13);const best={};
  list.forEach(p=>{const k=(p.name||'').trim().toLowerCase();if(!best[k]||score(p)>score(best[k]))best[k]=p;});list=list.filter(p=>best[(p.name||'').trim().toLowerCase()]===p);}
 const before=JSON.stringify(state.players)+JSON.stringify(state.gifts||{});
 state.players=list;state.deleted=del;mergeGifts(remote);
 if(remote.pin&&(!state.pin||(remote.pinUpd||0)>(state.pinUpd||0))){state.pin=remote.pin;state.pinUpd=remote.pinUpd||0;}
 if(state.cur&&!state.players.find(p=>p.id===state.cur))state.cur=null;
 migrate();stampChanges(true);saveLocal();keepPin();
 return before!==JSON.stringify(state.players)+JSON.stringify(state.gifts||{});
}

async function syncNow(){
 if(!cloud.code)return;if(cloud.busy){cloud.again=true;return;}
 cloud.busy=true;let changed=false;
 try{const remote=await cloudGet(cloud.code);
  if(remote)changed=mergeStates(remote,false,curScreen==='battle'||curScreen==='create'?state.cur:null);
  await cloudPut(cloud.code,cloudPayload());cloud.status='ok';cloud.last=Date.now();}
 catch(e){cloud.status='offline';}
 cloud.busy=false;updateCloudBadge();
 if(changed&&['profiles','map','parent','backpack','quests','zone'].includes(curScreen)&&!$('#modal.show'))go(curScreen,curArg);
 if(changed&&state.cur&&['world','map','backpack','pethome'].includes(curScreen))setTimeout(showGift,400);
 if(cloud.again){cloud.again=false;scheduleSync();}
}
