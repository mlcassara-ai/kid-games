<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Math Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math Quest">
<meta name="theme-color" content="#1d3a8a">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon-192.png?v=1">
<style>
:root{--ink:#241a3d;--accent:#7c5cff;--gold:#ffc83d;--good:#2ecc71;--bad:#ff5a5f;--muted:#7a6fa0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka',system-ui,-apple-system,sans-serif;color:var(--ink);background:#1b1446 radial-gradient(ellipse at top,#4b3aa8,#1b1446 70%) fixed;min-height:100dvh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation;color:inherit}
input,select{font-family:inherit}
.starfield{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.starfield i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.1}}
.page{max-width:1000px;margin:0 auto;padding:16px}
.title{color:#fff;text-align:center;margin:8px 0 16px;font-size:clamp(24px,4vw,32px)}
.center{text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.muted{color:var(--muted)}
.btn{background:var(--accent);color:#fff;font-size:18px;font-weight:600;padding:12px 20px;border-radius:14px;box-shadow:0 4px 0 #4a31c9;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4a31c9}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 4px 0 #c98f00}
.btn.green{background:var(--good);box-shadow:0 4px 0 #1e9a53}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 #b3262b}
.btn.ghost{background:rgba(255,255,255,.15);box-shadow:none}
.btn.ghost.dark{background:#eee9ff;color:var(--ink)}
.btn.small{font-size:15px;padding:8px 14px}
.btn.big{font-size:22px;padding:14px 26px}
/* top bar */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 14px;color:#fff;position:sticky;top:0;z-index:5;background:rgba(20,12,50,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tb-hero{width:46px;height:54px;background:rgba(255,255,255,.12);border-radius:12px;padding:0;overflow:hidden;flex:none}
.tb-hero svg{width:60px;height:78px;margin:-4px 0 0 -7px}
.tb-me{position:relative;flex:none;background:none;border:0;padding:0;cursor:pointer}.tb-me .tb-hero{display:block;border:2px solid #ffd43b;box-shadow:0 3px 0 rgba(0,0,0,.4)}.tb-me:active{transform:translateY(2px)}
.tb-me .tb-qdot{position:absolute;top:-6px;right:-10px;z-index:1}.tb-me .eq-badge{background:#7c5cff;border:2px solid #fff;font-size:11px;padding:1px 5px;border-radius:9px;min-width:0;width:auto;height:auto;line-height:1.2}.tb-me .tbl{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;line-height:1;color:#ffe08a;pointer-events:none}
.tb-info{cursor:pointer}.tb-chips{display:flex;gap:5px;margin-top:4px}.tb-chips .coins{padding:1px 8px;font-size:13px;border:1.5px solid rgba(255,212,59,.5)}
.tb-drop{position:fixed;z-index:60;background:#fff;border-radius:16px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);min-width:230px;display:flex;flex-direction:column}
.tb-drop button{background:none;border:0;text-align:left;font:600 17px Fredoka,sans-serif;color:#2b2250;padding:12px 12px;border-radius:11px;cursor:pointer}.tb-drop button+button{border-top:1px solid #ece8ff}.tb-drop button:hover{background:#f3f0ff}
.tb-info{flex:1;min-width:0}
.tb-name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{background:var(--accent);border-radius:8px;padding:0 6px;font-size:14px;margin-left:4px}
.xpbar{height:8px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden;max-width:200px;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#6ef0ff,#7c5cff)}
.coins{background:rgba(0,0,0,.35);padding:6px 12px;border-radius:20px;font-weight:700;color:var(--gold);white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.15);color:#fff;font-size:20px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;position:relative;flex:none}
.snaps{list-style:none;padding:0;margin:8px 0 0}.snaps li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(0,0,0,.08)}.snaps li:first-child{border-top:0}.sn-t{flex:1;min-width:0;text-align:left}.sn-t b{display:block}.sn-t small{display:block;color:#6a5fa0;font-size:13px;overflow-wrap:anywhere}.sn-k{display:inline-block;width:auto;margin:2px 0;font-size:12px;font-weight:700;padding:1px 7px;border-radius:9px;background:#e7f5ff;color:#1864ab;white-space:nowrap}.sn-k.sn-pre{background:#fff3bf;color:#8a5a00}.snaps .btn{min-height:44px;flex:none}
.bprog{display:flex;align-items:center;gap:8px;padding:3px 14px 4px;background:rgba(0,0,0,.28);font-size:13px;font-weight:700;color:#fff;position:relative;z-index:2;line-height:1}
.bp-bar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}.bp-bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffe066,#8dffb0);transition:width .4s}
.bp-t{white-space:nowrap;min-width:7.5em;text-align:right;text-shadow:0 1px 2px rgba(0,0,0,.5)}.bp-e{font-size:14px}
.bhud .iconbtn{width:44px;height:44px;min-width:44px;font-size:20px}
@media(max-width:520px){.battle .bhud{padding-top:6px;padding-bottom:6px}.bprog{padding:2px 12px 3px;font-size:12px}}
/* one back button everywhere: top-left "← Place", at least 44px tall so small fingers hit it (add-on screens using .zhead get it too) */
.zhead>.btn:first-child,.backbtn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;flex:none;white-space:nowrap}
.iconbtn .pcb{position:absolute;top:-9px;left:50%;margin-left:-11px;font-size:15px;line-height:1;background:#fff;border-radius:50%;padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.35);animation:pcbBob 1.6s ease-in-out infinite;pointer-events:none;z-index:1}
@keyframes pcbBob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-3px) rotate(8deg)}}
.iconbtn .dot{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
@media(max-width:520px){.iconbtn{width:38px;height:38px;font-size:17px}.coins{padding:5px 8px;font-size:14px}.tb-name{font-size:15px}.topbar{gap:5px;padding:8px}}
/* logo + profiles */
.logo{text-align:center;margin:22px 0 4px;color:#fff;line-height:.9}
.logo-top{font-size:26px;letter-spacing:14px;color:#6ef0ff;font-weight:700;padding-left:14px}
.logo-main{font-size:clamp(64px,15vw,120px);font-weight:700;background:linear-gradient(180deg,#ffe066,#ff8c1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #5a2a00)}
.logo-sub{font-size:20px;letter-spacing:3px;opacity:.85;margin-top:8px}
.floaty{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;max-width:720px;margin:0 auto 20px}
.pcard{background:#fff;border-radius:22px;padding:12px 10px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .15s}
.pcard:hover{transform:translateY(-4px) rotate(-1deg)}
.pcard svg{width:100px;height:130px}
.pname{font-size:22px;font-weight:700}
.plive{display:inline-block;background:#138a45;color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px;animation:livep 2s ease-in-out infinite}@keyframes livep{50%{opacity:.7}}
.plwait{display:block;font-size:13px;line-height:1.3;margin-top:3px;color:inherit;opacity:.95}.plwait b{color:#d9480f}.plv{font-size:15px;color:var(--muted)}
.lockgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:12px auto}
.lockgrid button{font-size:44px;background:#f1edff;border-radius:18px;padding:8px 0;box-shadow:0 4px 0 #cfc6f2}
.chip.pic{font-size:22px;padding:3px 10px}
.contcard{width:100%;min-height:110px;margin-bottom:16px}
.contcard .zart{font-size:70px}
.pnote{text-align:left;background:rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;max-width:760px;margin:10px auto}.pnote ul{margin:6px 0;padding-left:4px;list-style:none;line-height:1.6}.pnote summary{cursor:pointer;font-weight:600;color:#ffe066}
.cst{display:flex;flex-direction:column;align-items:center;gap:3px}.cst small{font-size:11px;font-weight:700;color:#7a3e0e;opacity:.85}
.bptabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;position:sticky;top:70px;z-index:4}.bptab{position:relative;flex:1;min-width:64px;background:rgba(255,255,255,.18);color:#fff;border-radius:14px;padding:8px 6px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}.bptab span{font-size:24px}.bptab.on{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25)}.bptab .dot{position:absolute;top:4px;right:6px;width:12px;height:12px;border-radius:50%;background:#ff3b3b;border:2px solid #fff}
.bptabs-wrap .bpsec{display:none}.bptabs-wrap.tab-egg .bpsec[data-t=egg],.bptabs-wrap.tab-spell .bpsec[data-t=spell],.bptabs-wrap.tab-hat .bpsec[data-t=hat],.bptabs-wrap.tab-robe .bpsec[data-t=robe],.bptabs-wrap.tab-more .bpsec[data-t=more]{display:block}
.bpsec[data-t=more] .panel~.bpempty,.bpsec[data-t=more] div~.bpempty{display:none}.moretile{border:2px dashed #b197fc!important;background:#f8f6ff!important}
@media(max-width:520px){.bptabs{top:62px}.bptab{min-width:0;font-size:12px;padding:6px 2px}.bptab span{font-size:20px}}
.bigcont{display:flex;align-items:center;gap:14px;width:100%;margin:6px 0 14px;padding:14px 18px;border-radius:22px;background:linear-gradient(135deg,#2fd27a,#16a34a);color:#fff;text-align:left;box-shadow:0 6px 0 #11803a,0 0 22px rgba(47,210,122,.45);animation:glowbtn 1.6s ease-in-out infinite}
.bigcont .bc-art{font-size:58px;flex:none;line-height:1}.bigcont .bc-txt{flex:1;min-width:0}.bigcont b{display:block;font-size:24px;line-height:1.2}.bigcont small{display:block;font-size:16px;opacity:.95;margin-top:3px}
.bigcont .bc-go{flex:none;background:#fff;color:#16a34a;font-weight:800;font-size:22px;border-radius:999px;padding:10px 18px}
@media(max-width:520px){.bigcont{padding:12px}.bigcont .bc-art{font-size:44px}.bigcont b{font-size:19px}.bigcont small{font-size:14px}.bigcont .bc-go{font-size:17px;padding:8px 12px}}
.qboard .zhead .title{margin-right:0}@media(max-width:520px){.qboard .zhead .title{font-size:24px;white-space:nowrap}.createbar{flex-wrap:nowrap!important;gap:8px}.createbar .btn{padding:12px 12px}.createbar .btn.big{font-size:18px;flex:1}}.qb-lead{white-space:nowrap}@media(max-width:520px){.qb-lead span{display:none}}
.qpanel.compact{padding:10px 12px}.qpanel.compact h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px}.qstreak{margin-left:auto;font-size:14px;color:#d9480f}
.qline{display:flex;align-items:center;gap:10px;padding:6px 4px;border-top:1px solid #eee7ff}.qline:first-of-type{border-top:0}.qline .qnpc{font-size:26px}.qline .qbody{flex:1;min-width:0;font-size:14px}.qline .qbody b{font-size:15px;display:block}.qline .qbody small{display:block;color:#6a5fa0}.qline .qbar{display:block}.qline .qcount{font-weight:700;color:#5f3dc4;white-space:nowrap}.qline.done{background:#fff9db;border-radius:10px}
.lockmore{margin:14px auto 6px;text-align:center;color:#d0c8ff;font-size:17px;font-weight:600}
.mf.done{background:#e8f9ee}.mf.done em{color:#1e9a53}
.mf.lvlog{background:#f1edff}
.questbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;background:rgba(255,255,255,.12);color:#fff;border-radius:16px;padding:10px 16px;margin-bottom:14px;font-size:17px}
.pbest{margin-top:10px;font-weight:700;color:#1e9a53;font-size:18px}.pbest.dim{color:var(--muted);font-weight:600}
.downnote{margin-top:12px;background:#fff6e0;border-radius:14px;padding:10px;font-size:16px;color:#6b4a00}
.lockdots{font-size:28px;letter-spacing:6px;color:var(--accent)}
.chip.big{font-size:18px;padding:10px 18px}
.chip.pic sup{font-size:12px;color:var(--accent);font-weight:700}
.zmap.champ{box-shadow:0 0 0 5px var(--gold),0 6px 0 rgba(0,0,0,.3)}
tr.flash td,.pp.flash{animation:flashbg .9s}
@keyframes flashbg{0%,40%{background:#fff3b0}100%{background:transparent}}
.pp.flash{animation:flashcard .9s}@keyframes flashcard{0%,40%{box-shadow:0 0 0 4px #ffc83d}100%{box-shadow:none}}
.z-spell{background:linear-gradient(160deg,#f7b733,#fc4a1a)}
.z-quiz{background:linear-gradient(160deg,#7f7fd5,#86a8e7 50%,#91eae4)}
.z-hw{background:linear-gradient(160deg,#56ab2f,#a8e063)}
.questmode #heroF .hp,.questmode #hhpn{visibility:hidden}
.spellq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.lboxes{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.lbox{width:clamp(24px,5.5vw,38px);height:clamp(34px,6.5vh,48px);border-bottom:4px solid #cfc6f2;font-size:clamp(22px,4.5vh,34px);font-weight:700;color:var(--accent);display:grid;place-items:center;text-transform:lowercase}
.lbox.on{border-color:var(--accent)}
.kbd{width:min(620px,98vw);margin:8px auto calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.krow{display:flex;gap:5px;justify-content:center}
.krow button{flex:1;max-width:56px;font-size:clamp(18px,3.2vh,26px);font-weight:700;padding:clamp(8px,1.6vh,14px) 0;border-radius:10px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #b9b0d9}
.krow button.wide{max-width:none;flex:1.5}.krow .go{background:var(--good);color:#fff;box-shadow:0 3px 0 #1e9a53}.krow .del{background:#ffe1e2}
.quizq{font-size:clamp(18px,3.2vh,24px);font-weight:600;letter-spacing:0;line-height:1.3;text-align:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(620px,96vw);margin:10px auto calc(12px + env(safe-area-inset-bottom))}
@media(max-width:560px){.choices{grid-template-columns:1fr}}
.choices button{background:#fff;color:var(--ink);border-radius:14px;padding:12px;font-size:18px;font-weight:600;text-align:left;box-shadow:0 4px 0 #b9b0d9;min-height:56px}
.choices b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;margin-right:6px;font-size:15px}
.hwq{font-size:clamp(26px,5vh,44px)}.hwq.long{font-size:clamp(17px,2.8vh,22px);font-weight:600;letter-spacing:0;text-align:left}
.pad .xk{grid-column:span 3;background:#eef6ff;font-size:20px}
.spellans{font-size:44px;font-weight:700;letter-spacing:4px;margin:8px 0;color:#1e9a53}.spellans .bad{color:var(--bad);text-decoration:underline}
.mf.new{background:#f1edff}
.wordbox summary{cursor:pointer;font-weight:600;color:var(--accent);margin:8px 0}
.ta{font-size:16px;resize:vertical;min-height:120px}
.qlist{margin:4px 0 8px;padding-left:20px}
.qcard{position:relative}
.hintbtn{position:absolute;top:-24px;right:-8px;background:#fff6d6;border:3px solid var(--gold);border-radius:999px;padding:4px 10px;font-size:15px;font-weight:700;color:#6b4a00;box-shadow:0 3px 0 rgba(0,0,0,.2);z-index:2;white-space:nowrap}
.hintbtn.off{background:#eee;border-color:#ccc;color:#888}
.hintbtn small{font-weight:600}
.dimbulb{filter:grayscale(1);opacity:.35}
.hintcard .pethead{display:flex;align-items:center;gap:12px;text-align:left}
.bigpet{font-size:54px;animation:bob 1.6s ease-in-out infinite}
.choices .gone{opacity:.3;text-decoration:line-through}
.petpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.petpick .item{cursor:pointer}
.famcode{font-size:24px;font-weight:700;letter-spacing:2px;background:#f1edff;border-radius:12px;padding:10px;margin:8px 0;word-break:break-word;color:var(--accent)}
.famcode.small{font-size:17px;padding:3px 8px}
.famlink{font-size:13px;word-break:break-all;background:#f6f3ff;border-radius:10px;padding:8px;color:#4c3f78}
.battle.z-forest{background:linear-gradient(180deg,#3f8f2c,#1f4a18)}
.battle.z-caves{background:linear-gradient(180deg,#22203a,#110e22)}
.battle.z-volcano{background:linear-gradient(180deg,#1a0f0d,#3a120c)}
.battle.z-castle{background:linear-gradient(180deg,#3c3458,#1c1630)}
.battle.z-tower{background:linear-gradient(180deg,#3b2a8a,#0b0826)}
.battle.z-spell{background:linear-gradient(180deg,#8a6a2a,#4a3614)}
.battle.z-quiz{background:linear-gradient(180deg,#f1f6ff,#9bb3e8)}
.battle.z-hw{background:linear-gradient(180deg,#4c9a3a,#23501b)}
.battle .bhud{background:rgba(0,0,0,.35);position:relative;z-index:2}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-500px)}}
.scene-svg .drift{animation:drift 70s linear infinite}.scene-svg .drift.slow{animation-duration:120s}
@keyframes twk{50%{opacity:.25}}.scene-svg .twk{animation:twk 2.8s ease-in-out infinite}.scene-svg .twk.slow{animation-duration:5s}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(40px,-20px)}50%{transform:translate(90px,5px)}75%{transform:translate(40px,25px)}100%{transform:translate(0,0)}}
.scene-svg .flutter{animation:flutter 12s ease-in-out infinite}
@keyframes drip{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(220px);opacity:0}}.scene-svg .drip{animation:drip 4s ease-in infinite}
@keyframes glowp{50%{opacity:.7}}.scene-svg .glow{animation:glowp 3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.12,.9)}}.scene-svg .flick{animation:flick .35s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes ember{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translate(20px,-260px);opacity:0}}.scene-svg .ember{animation:ember 6s linear infinite}
@keyframes lava{50%{opacity:.75}}.scene-svg .lavaglow,.scene-svg .lavaflow{animation:lava 2.2s ease-in-out infinite}
@keyframes smoke{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-40px);opacity:.2}}.scene-svg .smoke{animation:smoke 4s ease-out infinite}
@keyframes bat{0%{transform:translate(0,0)}50%{transform:translate(-120px,20px)}100%{transform:translate(0,0)}}.scene-svg .bat{animation:bat 9s ease-in-out infinite}
@keyframes fog{from{transform:translateX(0)}to{transform:translateX(200px)}}.scene-svg .fog{animation:fog 20s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}.scene-svg .spin{animation:spin 30s linear infinite}
@keyframes floaty{50%{transform:translateY(-12px)}}.scene-svg .float{animation:floaty 5s ease-in-out infinite}
@keyframes leaf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-80px,420px) rotate(540deg)}}.scene-svg .leaf{animation:leaf 9s linear infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.scene-svg *{animation:none!important}}
.pcard.add{background:rgba(255,255,255,.1);color:#fff;border:3px dashed rgba(255,255,255,.4);box-shadow:none}
.pcard.add .plv{color:#cfc6ff}
.plus{font-size:64px;height:130px;display:grid;place-items:center}
/* creator */
.creator{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;background:#fff;border-radius:24px;padding:20px;max-width:780px;margin:0 auto 16px}
.preview{width:210px;flex:none;display:grid;place-items:center;background:radial-gradient(circle,#efeaff,#fff 70%);border-radius:20px}

/* ================= play-time bank: 60 minutes to play, every 2 minutes away earns 1 back =================
   Short sessions never lock anyone out. When the bank runs out, the break lasts until it is full again
   (a full hour of play = a 2-hour break). A battle in progress is always allowed to finish. */
const TB_FREE=['profiles','create','parent','rest'];let tbLastInput=Date.now();
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{tbLastInput=Date.now();},{passive:true}));
const tbOn=p=>!!p&&p.tbOn!==false;const tbCap=p=>p.tbMin||60;
function tbState(p){p.tb=p.tb||{bank:tbCap(p),t:Date.now(),locked:false};const cap=tbCap(p)+(p.tb.bonus||0);if(p.tb.bank>cap)p.tb.bank=cap;if(p.tb.bonus&&p.tb.bank<=tbCap(p))p.tb.bonus=0;return p.tb;} /* bonus = extra minutes a parent added on top of a full bank */
function tbTick(p,active){const T=tbState(p);const now=Date.now();const dt=Math.max(0,Math.min(600,(now-T.t)/60000));T.t=now;
 if(active)T.bank-=dt;else T.bank=Math.min(Math.max(tbCap(p),T.bank),T.bank+dt*.5);
 if(T.locked&&T.bank>=tbCap(p)-.01){T.locked=false;T.bank=tbCap(p);}
 if(T.bank<=0&&!T.locked)T.locked=true;
 if(T.locked&&T.bank<0)T.bank=0; /* finishing a battle never makes the break longer: the break is always twice the play time */
 return T;}
function tbLeft(p){return Math.max(0,Math.ceil(tbState(p).bank));}
function tbBackAt(p){const T=tbState(p);const mins=(tbCap(p)-T.bank)*2;return new Date(Date.now()+mins*60000);}
const tbBlocked=p=>tbOn(p)&&tbState(p).locked;
/* how long until a kid on a break can play again: '3:45 PM' and '1h 20m' */
function tbWait(p){tbTick(p,false);const at=tbBackAt(p);const mins=Math.max(1,Math.ceil((at-Date.now())/60000));
 return {hm:at.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),dur:mins>=60?`${Math.floor(mins/60)} hr${mins>=120?'s':''}${mins%60?' '+mins%60+' min':''}`:`${mins} minute${mins>1?'s':''}`,mins};}

 else if(curScreen==='rest')go('rest');}catch(e){}},30000); // keep the "come back at" times fresh, and let kids back in when the break ends

 state.players.forEach(o=>{if(o!==p&&o.tb)tbTick(o,false);});
 if(active){if(before>10&&T.bank<=10)toast(`⏳ 10 minutes of play left, ${p.name}!`);else if(before>2&&T.bank<=2)toast('⏳ 2 minutes left! Finish up your battle.');}

/* ---- popup budget: at most ONE automatic popup when a kid logs in (the most time-limited / story-critical one).
   Everything else waits: it glows on the Quest Board / in the World, or pops on a later visit — one at a time, a few minutes apart.
   Walk-up visitors (Dr. Quartz, Ozzy) already wait for window.visitorQuiet, so we just keep that quiet after a popup. */
/* ---- 🚪 visitor queue: only ONE visitor event at a time (Principal Wise, Dr. Quartz, Ozzy, the Eagle, the Troll, Prisma…).
   MQ_VISIT.claim(name[,ms]) → true when it's your turn: you now hold the slot, call MQ_VISIT.release(name) when your visit ends.
   MQ_VISIT.busy([name])     → true when someone ELSE holds the slot, or another walk-up visitor is already standing on the map.
   MQ_VISIT.wait(name,fn)    → call fn once the slot is free again (one waiter per name; fn must re-check its own rules, then claim()).
   MQ_VISIT.who() / release(name). A claim runs out by itself after ms (default 20 min), so a stuck add-on never blocks everyone.
   MQ_VISIT.hold(name,on[,ms]) → claim + watch(name,on): the slot is given back by itself once on() (e.g. "my card is still open") stays false ~2 s.
   MQ_VISIT.swap(from,to) hands a held slot to another name; reset() clears everything (player switch).
   Waiting is fair: when the slot frees, the head of the wait() line gets first dibs, so anyone refused should wait() to get in line.
   Add-ons that haven't adopted it yet are still respected: W.mobs quartz / ozzy / byeOzzy / principal and window.trollBusy count as busy. */
window.MQ_VISIT=(function(){let cur=null,until=0,tm=null,due=0,resv=null,ru=0;const q=[];
 /* fair turns: when the slot frees up and someone is waiting in line, the head of the line gets first dibs (resv) for a little while,
    so a walk-up visitor that polls every half second can't jump the queue. Anyone refused should call wait() to get in line. */
 const held=()=>{if(cur&&Date.now()>until){cur=null;if(q.length)kick(1500);}return cur;};
 const legacy=me=>{try{if(window.trollBusy&&me!=='troll'&&me!=='eagle')return 'troll';if(typeof W!=='undefined'&&W&&Array.isArray(W.mobs)){for(const o of W.mobs){if(o.quartz&&me!=='quartz')return 'quartz';if((o.ozzy||o.byeOzzy)&&me!=='ozzy')return 'ozzy';if(o.principal&&me!=='principal')return 'principal';}}}catch(e){}return null;};
 const reserved=me=>{if(!resv)return false;if(Date.now()>ru){resv=null;return false;}return resv!==me;};
 const head=ms=>{if(q.length){resv=q[0].n;ru=Date.now()+(ms||20e3);}else resv=null;};
 const api={
  who(){return held()||legacy(null);},
  busy(me){const h=held();return !!((h&&h!==me)||legacy(me)||(me&&!h&&reserved(me)));},
  claim(name,ms){if(!name)return false;const h=held();
   if(h===name){until=Math.max(until,Date.now()+(ms||20*60e3));return true;}
   if(h||legacy(name)||reserved(name))return false;
   cur=name;until=Date.now()+(ms||20*60e3);if(resv===name)resv=null;const i=q.findIndex(x=>x.n===name);if(i>=0)q.splice(i,1);return true;},
  release(name){if(!name||held()===name){cur=null;until=0;if(q.length){head();kick(1500);}}},
  wait(name,fn){if(typeof fn!=='function')return;const i=q.findIndex(x=>x.n===name);if(i>=0)q[i].f=fn;else q.push({n:name,f:fn});if(!held()&&!resv)head();kick(4000);},
  /* auto-release: keep the slot while on() is true (e.g. "my card is still open"); give it back once on() has been false for ~2 s */
  watch(name,on,grace){let miss=0;const t0=Date.now()+(grace==null?2500:grace);const iv=setInterval(()=>{if(held()!==name){clearInterval(iv);return;}let up=false;try{up=!!on();}catch(e){}
   if(up||Date.now()<t0){miss=0;return;}if(++miss>=3){clearInterval(iv);api.release(name);}},700);},
  hold(name,on,ms,grace){if(!api.claim(name,ms))return false;api.watch(name,on,grace);return true;},
  swap(from,to){if(held()===from){cur=to;return true;}return false;},
  reset(){cur=null;until=0;q.length=0;resv=null;clearTimeout(tm);tm=null;},
  _q:q};
 function kick(ms){const d=Date.now()+ms;if(tm&&due<=d)return;clearTimeout(tm);due=d;tm=setTimeout(run,ms);}
 function run(){tm=null;if(!q.length){resv=null;return;}
  if(held()||legacy(null)){head(25e3);kick(15e3);return;}
  if(document.querySelector('#modal.show')||(typeof curScreen!=='undefined'&&curScreen==='battle')){head(15e3);kick(5000);return;}
  const x=q.shift();resv=x.n;ru=Date.now()+10e3;try{x.f();}catch(e){console.warn('MQ_VISIT',x.n,e);}
  if(resv===x.n)resv=null; /* its turn came but it didn't claim (its own rules said not now) */
  if(q.length){if(!held())head();kick(held()?15e3:3000);}}
 return api;})();

/* ---------- skill check: quick placement for + − × ÷ ---------- */
let SKC=null;const SC_OPS=['add','sub','mul','div'];const scOps=()=>(SKC&&SKC.ops)||SC_OPS; // grades 1–2 are only checked on + and −
function scStart(p){const L0=clamp(gradeExp(p)-2,1,(p.adult||(p.grade||3)>=10)?19:15);SKC={ops:(p.grade!=null&&p.grade<=2)?['add','sub']:SC_OPS,i:0,L:L0,start:L0,ok:0,asked:0,passed:{},failedAt:{},q:null,input:'',n:0,msg:'',done:false};scNextQ();}
function scNextQ(){const op=scOps()[SKC.i];SKC.q=genQ(op,SKC.L);for(let i=0;SKC.q&&SKC.q.pick&&i<30;i++)SKC.q=genQ(op,SKC.L); /* typed answers only here */SKC.input='';SKC.n++;}
function scFinishOp(){const op=scOps()[SKC.i];SKC.i++;SKC.ok=0;SKC.asked=0;if(SKC.i>=scOps().length){scApply();return;}SKC.L=SKC.start;scNextQ();}
function scAnswer(){const p=P();const q=SKC.q;if(!SKC.input||SKC.input==='-')return;const v=parseInt(SKC.input,10);const ok=v===q.answer||!!(q.alt&&q.alt.includes(v));const op=scOps()[SKC.i];
 SKC.asked++;if(ok){SFX.correct();SKC.ok++;}else SFX.wrong();
 SKC.msg=ok?'✅ '+pick(['Nice!','Yes!','Correct!','Great!']):(q.tpl?`Last question: the answer was <b>${xAnsStr(q,true)}</b>.`:(()=>{const a=q.answer<0?'−'+(-q.answer):q.answer;const t=String(q.text);return `Last question: <b>${esc(t)}${/\?|_/.test(t)?' → '+a:' = '+a}</b>`;})())+` No worries — here's a new one!`;SKC.msgOk=ok;
 const tries=Object.keys(SKC.passed).length;
 if(!ok){SKC.failedAt[op]=Math.min(SKC.failedAt[op]||99,SKC.L);if(SKC.passed[op]){scFinishOp();}else if(SKC.L<=1){SKC.passed[op]=1;scFinishOp();}else{SKC.L=Math.max(1,SKC.L-2);SKC.ok=0;SKC.asked=0;scNextQ();}}
 else if(SKC.ok>=2){SKC.passed[op]=SKC.L;const nx=Math.min(maxLv(op),SKC.L+2,(p.adult||(p.grade||3)>=10)?25:(p.grade||3)>=7?20:15); /* algebra levels (16+) only for grade 7 and up; Algebra 2 levels (21+) for grade 10+ and adults */if(nx===SKC.L||nx>=(SKC.failedAt[op]||99)){scFinishOp();}else{SKC.L=nx;SKC.ok=0;SKC.asked=0;scNextQ();}}
 else scNextQ();
 if(SKC.n>50&&!SKC.done)scApply();
 go('skillcheck');}
function scApply(){const p=P();SKC.done=true;SKC.res={};
 scOps().forEach(op=>{const to=SKC.passed[op]||1;SKC.res[op]=to;if(to>lvl(p,op)){applyLevel(p,op,to);p.recent[op]=[];}});
 const avg=scOps().reduce((a,o)=>a+(SKC.passed[o]||1),0)/scOps().length;
 if(avg>=6)XOPS.forEach(op=>{const to=Math.min(maxLv(op)-2,Math.floor(avg-2),gradeExp(p));if(to>lvl(p,op)){applyLevel(p,op,to);p.recent[op]=[];}});

function scKey(k){if(!SKC||SKC.done)return;if(k==='del')SKC.input=SKC.input.slice(0,-1);else if(k==='neg')SKC.input=SKC.input.startsWith('-')?SKC.input.slice(1):'-'+SKC.input;else if(SKC.input.length<7)SKC.input+=k;SFX.tap();go('skillcheck');}
/* leaving the skill check early (or skipping it) still gives a sensible start: tested skills keep what they showed, untested ones start near the kid's grade */
function scLeave(){const p=P();if(!p)return;if(SKC&&!SKC.done){xPlace(p);const L0=SKC.start;scOps().forEach((op,i)=>{const to=SKC.passed[op]||(i<SKC.i?1:i===SKC.i?Math.max(1,Math.min(L0,SKC.L)-2):Math.max(1,L0-2));if(to>lvl(p,op)){applyLevel(p,op,to);p.recent[op]=[];}});save();}SKC=null;}

function qPrime(){try{if(!B||B.mode!=='math'||B.wild)return;const qc=$('#qcard'),qt=$('#qtext'),ql=$('#qlabel');if(!qc||!qt)return;
 const p=P(),keep=qt.innerHTML,kl=ql?ql.textContent:'',q0=B.q,i0=B.input;let h=0;QPRIMING=true;

 if(B.foes&&B.foes[B.ti])B.foes[B.ti].hp=B.mhp;

 {const se=$('#streak');const txt=B.mode==='math'&&!B.wild?`🔥 ${B.streak} in a row`:(B.streak>=2?`🔥 ${B.streak} streak`:'');if(se.textContent!==txt){se.textContent=txt;se.classList.remove('bump');void se.offsetWidth;if(B.streak>0)se.classList.add('bump');}}

/* slim "how close am I to winning" bar under the battle top bar. HP battles estimate the right answers still needed

function updateProg(){try{const bi=$('#bprogI'),bt=$('#bprogT');if(!bi||!B)return;let f=0,txt='';
 if(B.mode!=='math'&&B.total){f=(B.done||0)/B.total;const n=B.total-(B.done||0);txt=n>0?`${n} to go`:'🎉';}
 else{const fs=B.foes&&B.foes.length?B.foes:[{hp:B.mhp,max:B.mmax}];const tot=fs.reduce((a,x)=>a+(x.max||0),0)||1,left=Math.max(0,fs.reduce((a,x)=>a+Math.max(0,x.hp||0),0));f=1-left/tot;
  const p=P(),sp=SPELLS.find(s=>s.id===p.spell)||SPELLS[0];const hit=20*(B.spellFrozen>0?1:sp.mult)*(petPerk(p)==='power'?1.15:1)*(1+Math.min(B.streak||0,5)*.1);
  const n=Math.ceil(left/Math.max(1,hit));txt=left<=0?'🎉 Won!':n===1?'1 more right answer!':`about ${n} more right`;}
 bi.style.width=Math.round(Math.min(1,Math.max(0,f))*100)+'%';if(bt.textContent!==txt)bt.textContent=txt;}catch(e){}}

/* ================= the wishing fountain: a secret dad-joke machine ================= */
function fnt(p){p.fountain=p.fountain||{t:0,need:rnd(1,15),seen:[]};if(p.fountain.need>15)p.fountain.need=rnd(1,15);return p.fountain;}
const FOUNT_HINTS=['The water sparkles…','You hear a tiny giggle from the water…','The fountain gurgles happily.','Bubbles rise to the top…','Did the fountain just… snicker?','Plip! The coin sinks and glows.','Something is chuckling down there…','The water ripples in a funny way.'];
function fountainOpen(){const p=P();const f=fnt(p);
 modal(`<div class="mcard fountain"><div class="fnt-pool${window.MQ_FOUNTAIN_ART?' art':''}" id="fntPool"><span class="fnt-e">${window.MQ_FOUNTAIN_ART?MQ_FOUNTAIN_ART.svg.replace('<svg ','<svg width="150" height="150" style="display:block;margin:0 auto" '):'⛲'}</span></div><h2>The Wishing Fountain</h2><p id="fntMsg" class="fnt-msg">Toss in a coin and make a wish…</p>
 <div class="row"><button class="btn gold big" id="fntBtn" onclick="fountainToss()">Toss 🪙 ${f.t+1}</button></div><p class="muted" style="margin:0">Each toss costs 1 more coin than the last. A joke resets the price to 1.</p>
 <p class="muted" id="fntCoins">You have 🪙 ${p.coins}${f.seen.length?` · 🤣 ${f.seen.length} of ${DAD_JOKES.length} jokes found`:''}</p><button class="btn ghost dark small" onclick="closeModal()">Walk away</button></div>`);}
let fntBusy=false;
function fountainToss(){const p=P();const f=fnt(p);if(fntBusy||!$('#fntMsg'))return;const n=f.t+1;
 if(p.coins<n){$('#fntMsg').textContent=p.coins?`You only have ${p.coins} coin${p.coins>1?'s':''}!`:'The fountain gurgles. You need a coin!';return;}
 p.coins-=n;f.t++;save();const fb=$('#fntBtn');if(fb)fb.textContent=`Toss 🪙 ${f.t+1}`;
 for(let i=0;i<Math.min(n,5);i++){tone(900+Math.random()*300,.12,'sine',.06,i*.09);const pool=$('#fntPool');if(pool){const c=document.createElement('span');c.className='fnt-coin';c.textContent='🪙';c.style.left=(30+Math.random()*40)+'%';c.style.animationDelay=(i*.09)+'s';pool.appendChild(c);setTimeout(()=>c.remove(),1200);const r=document.createElement('i');r.className='fnt-ripple';r.style.left=(25+Math.random()*50)+'%';r.style.animationDelay=(.4+i*.09)+'s';pool.appendChild(r);setTimeout(()=>r.remove(),1800);}}
 const ce=$('#fntCoins');if(ce)ce.textContent=`You have 🪙 ${p.coins}${f.seen.length?` · 🤣 ${f.seen.length} of ${DAD_JOKES.length} jokes found`:''}`;
 if(f.t>=f.need){fntBusy=true;$('#fntMsg').textContent='💦 The fountain is bubbling like crazy…';setTimeout(()=>{fntBusy=false;fountainJoke();},900);return;}
 $('#fntMsg').textContent=pick(FOUNT_HINTS);}
function fountainJoke(){const p=P();const f=fnt(p);
 let pool=DAD_JOKES.map((_,i)=>i).filter(i=>!f.seen.includes(i));if(!pool.length){f.seen=[];pool=DAD_JOKES.map((_,i)=>i);}
 const i=pick(pool);f.seen.push(i);f.t=0;f.need=rnd(1,15);save();const [q,a]=DAD_JOKES[i];
 [523,659,784].forEach((x,k)=>tone(x,.18,'triangle',.07,k*.1));
 modal(`<div class="mcard fountain"><div class="fnt-pool splash"><span class="fnt-e big">⛲</span><span class="fnt-face">😜</span></div><h2>💦 SPLOOSH! The fountain has a joke for you!</h2>
 <div class="fnt-joke">${esc(q)}</div><div class="fnt-punch" id="fntPunch">${esc(a)}</div>
 <div class="row">${voiceOn()?`<button class="btn ghost dark" id="fntHear" data-j="${i}" onclick="speakToggle(()=>say(DAD_JOKES[${i}][0],.9))">🔊 Hear it</button>`:''}<button class="btn green big" id="fntTell" onclick="fountainPunch()">Tell me! 🤔</button></div>
 <p class="muted">🤣 Joke ${f.seen.length} of ${DAD_JOKES.length} found</p></div>`);
 sayV(q,.9);}
function fountainPunch(){const el=$('#fntPunch');if(!el)return;el.classList.add('show');
 {const h=$('#fntHear');if(h){const j=+h.dataset.j;h.onclick=()=>speakToggle(()=>say(DAD_JOKES[j][0]+' … '+DAD_JOKES[j][1],.9));}} /* after the punchline, Hear it reads the whole joke */const b=$('#fntTell');if(b){b.textContent='😂 Ha! Again!';b.onclick=()=>fountainOpen();}
 sayV(el.textContent,.9);setTimeout(()=>{tone(180,.08,'square',.06);tone(140,.08,'square',.06,.12);tone(1200,.35,'triangle',.04,.26);},1100);}

function cafeMoneyQ(p){const g=p.grade||3;
 /* real school-cafe prices in cents; two mains first, then two sides */

const STORIES=[
{id:'a1',lv:'A',e:'🐢',t:'The Brave Little Turtle',p:['Tia the turtle lived at the edge of a big pond. All her friends swam across the pond to play on the warm rocks. But Tia stayed on the shore. The water looked deep, and she was scared.','One day, the frogs said, "Come on, Tia! You can do it!" Tia took a deep breath. She paddled slowly, one little kick at a time. Her heart was pounding.','At last, Tia climbed onto the warm rocks. Everyone cheered! Tia smiled a big turtle smile. She was still a little scared, but she was very proud.'],
 q:[['What is the main idea of the story?',['Turtles should always stay on the shore where it is safe','Being brave means trying even when you are scared','Frogs are the best swimmers in the whole big pond','Rocks get warm in the sun'],1,'Tia was scared but tried anyway. That is what being brave means.'],
  ['Who cheered for Tia before she swam?',['The fish','Her mom','The frogs','The ducks'],2,'The story says, "One day, the frogs said, Come on, Tia!"'],

{id:'a2',lv:'A',e:'🌱',t:'Sam\'s Garden',p:['Sam planted tiny tomato seeds in his backyard. Every morning he gave them water. Every evening he checked for sprouts. For days, nothing happened.','"Maybe they will never grow," Sam sighed. But he kept watering. After two weeks, tiny green leaves poked out of the dirt!','By summer, Sam had more tomatoes than his family could eat. He put them in a basket and shared them with all his neighbors.'],

  ['How long did it take for the seeds to sprout?',['Two days','Two weeks','Two months','One year'],1,'"After two weeks, tiny green leaves poked out."'],
  ['Why did Sam share his tomatoes?',['He did not like the taste of tomatoes at all','He had more than his family could eat','His mom told him that he had to share','They were rotten'],1,'"Sam had more tomatoes than his family could eat."']]},
{id:'a3',lv:'A',e:'🍂',t:'Why Do Leaves Change Color?',p:['In spring and summer, most leaves are green. They are green because of something inside them called chlorophyll. Chlorophyll helps the tree make food from sunlight.','In the fall, the days get shorter and cooler. Trees stop making as much food, and the green chlorophyll fades away.','When the green is gone, we can see the yellow and orange colors that were hiding in the leaves all along!'],
 q:[['What is this passage mostly about?',['How to rake up all the leaves in your yard','Why leaves change color in the fall','Which trees grow the tallest in the forest','How to grow a big tree from a seed'],1,'The whole passage explains why leaves change color.'],
  ['What makes leaves green?',['Rain from the clouds','Chlorophyll','Dirt in the ground','Wind'],1,'"They are green because of something inside them called chlorophyll."'],
  ['The yellow and orange colors were…',['painted on by people in the fall','hiding in the leaves all along','made by the cold wind at night','only in winter'],1,'"The yellow and orange colors that were hiding in the leaves all along!"']]},
{id:'a4',lv:'A',e:'🧤',t:'The Lost Mitten',p:['Maya came home from the park with only one red mitten. "Oh no!" she said. "Grandma knitted these for me."','Maya and her dad walked back to the park. They looked by the swings. They looked by the slide. Then Maya heard a tiny whimper under the bench.','A little puppy was curled up on her red mitten, keeping warm! A lady ran up. "That\'s my puppy, Biscuit!" she said. "Thank you for finding him." Maya smiled. Her mitten had helped a puppy stay warm.'],
 q:[['What was Maya\'s problem at the start?',['She was very hungry after the park','She lost one of her mittens','Her dad was lost at the park','It was raining too hard to play'],1,'She came home "with only one red mitten."'],
  ['Where did Maya find the mitten?',['By the swings','On the slide','Under the bench','In her pocket'],2,'She heard a whimper "under the bench."'],
  ['Why did Maya smile at the end?',['Her mitten had helped a puppy stay warm','She got to take the puppy home to keep','She won a prize','Her grandma came to the park to help look'],0,'"Her mitten had helped a puppy stay warm."']]},
{id:'a5',lv:'A',e:'🐝',t:'Honeybees at Work',p:['Honeybees are very busy insects. They fly from flower to flower to collect a sweet juice called nectar.','Back at the hive, the bees turn the nectar into honey. They store the honey in little wax rooms called cells.','When a bee finds a great patch of flowers, it does a special wiggle dance! The dance tells the other bees which way to fly to find the flowers.'],
 q:[['What is this passage mostly about?',['How honeybees work and make honey','Why flowers are so pretty in the spring','How to catch a bee in a jar','Bears that like to eat honey'],0,'The passage tells what honeybees do all day.'],
  ['What is nectar?',['A kind of wax that bees make','A sweet juice from flowers','A bee\'s home inside the hive','A special dance that bees do'],1,'"A sweet juice called nectar."'],
  ['Why do bees do a wiggle dance?',['To stay warm inside the hive on a cold day','To show off','To tell other bees where the flowers are','To scare away the birds that try to eat bees'],2,'"The dance tells the other bees which way to fly."']]},
{id:'a6',lv:'A',e:'🦊',t:'The Fox and the Grapes',p:['One hot day, a hungry fox saw juicy purple grapes hanging from a vine. "Those look delicious," he said.','The fox jumped as high as he could, but the grapes were too high. He jumped again and again. He could not reach them.','Finally the fox walked away with his nose in the air. "I did not want those grapes anyway," he said. "I am sure they are sour."'],
 q:[['Why did the fox say the grapes were sour?',['He tasted one grape and it was too sour','He was pretending he did not want what he could not get','The farmer told him the grapes were not ripe yet and very sour','They were green'],1,'He could not reach them, so he pretended he did not want them.'],
  ['What was the fox\'s problem?',['The grapes were too high to reach','He was too full to eat any more food','It was raining too hard to hunt','A bird ate all of the grapes before he came'],0,'"The grapes were too high."'],
  ['This story is a fable. What is a fable?',['A true news story about real animals','A short story with a lesson, often with talking animals','A poem about food','A science book that tells true facts about foxes and grapes'],1,'Fables are short stories with a lesson, like this one.']]},
{id:'a7',lv:'A',e:'🍋',t:'The Lemonade Stand',p:['Leo and his sister Ana set up a lemonade stand. They wanted to raise money for the animal shelter. On the first day, only two people stopped.','"Nobody can see us," said Ana. So they made a big, bright sign. Leo baked cookies to sell too.','The next day, a long line of people came! Leo and Ana sold every cup. They gave all the money to the animal shelter, and the shelter workers gave them a big thank-you card.'],
 q:[['Why did Leo and Ana have a lemonade stand?',['To buy toys for themselves','To raise money for the animal shelter','Because they were thirsty and wanted a cold drink','For a school test'],1,'"They wanted to raise money for the animal shelter."'],
  ['What did they change to get more customers?',['They lowered the price','They made a big sign and added cookies','They moved the stand to the beach by the water','They sang songs and danced for people walking by'],1,'"They made a big, bright sign. Leo baked cookies to sell too."'],
  ['What is the main idea?',['Lemonade is too sour to sell, so you should give up','Working together and trying new ideas can help others','Signs are hard to make, so you should not try new ideas','Cookies are better than lemonade, so always sell cookies'],1,'They worked as a team and changed their plan to help the shelter.']]},
{id:'a8',lv:'A',e:'🐙',t:'Octopus Tricks',p:['An octopus has eight long arms covered in suckers. The suckers help it grab food and hold on to rocks.','An octopus is a master of hiding. It can change the color of its skin in a flash to match the rocks and sand around it.','If a hungry shark comes too close, the octopus has one more trick. It squirts a cloud of dark ink and zooms away while the shark cannot see!'],
 q:[['What is this passage mostly about?',['How sharks hunt','The amazing tricks an octopus uses','Where to find the best rocks and sand in the sea','How to swim fast like a fish'],1,'It describes the octopus and its tricks.'],
  ['How many arms does an octopus have?',['Six','Eight','Ten','Four'],1,'"An octopus has eight long arms."'],
  ['Why does an octopus squirt ink?',['To make art','To escape from danger','To eat','To clean the water'],1,'It squirts ink "and zooms away while the shark cannot see."']]},
{id:'a9',lv:'A',e:'🪁',t:'Grandpa\'s Kite',p:['Nora and Grandpa built a kite out of paper and sticks. They painted it with bright stars. Then they ran to the hill to fly it.','The kite went up… and crashed down. It crashed again and again. Nora wanted to quit. "Let\'s think," said Grandpa. "Maybe it needs a longer tail to keep it steady."','They tied on a longer tail made of ribbons. This time the kite climbed high into the sky and danced with the wind. "We did it!" Nora shouted.'],
 q:[['What is the lesson of the story?',['Kites are easy to make and always fly on the very first try','Don\'t give up; think of a new way to solve a problem','Grandpas are tall','Stars are the best thing to paint on a kite'],1,'They kept trying and fixed the problem with a longer tail.'],
  ['What did they add to fix the kite?',['More paint','A longer tail','Heavier sticks','A motor'],1,'"They tied on a longer tail made of ribbons."'],
  ['How did Nora feel when the kite kept crashing?',['Excited','Like she wanted to quit','Hungry and ready for lunch','Sleepy'],1,'"Nora wanted to quit."']]},
{id:'a10',lv:'A',e:'🦉',t:'Animals of the Night',p:['While you sleep, some animals are just waking up! Animals that are awake at night are called nocturnal animals.','Owls are nocturnal. They have huge eyes that help them see in the dark. Bats are nocturnal too. They make tiny squeaks and listen for the echoes to find bugs to eat.','Raccoons come out at night to look for food. Their little paws can open lids and even door handles!'],
 q:[['What does nocturnal mean?',['Awake during the day','Awake at night','Lives in water','Very tiny'],1,'"Animals that are awake at night are called nocturnal animals."'],
  ['How do bats find bugs in the dark?',['With the big eyes that help them see in the dark','By listening for echoes of their squeaks','By smelling flowers','With little flashlights on their heads'],1,'"They make tiny squeaks and listen for the echoes."'],
  ['What is this passage mostly about?',['Animals that are active at night','How to open doors and trash cans with paws','Why people need to sleep at night','Birds that fly only in the daytime'],0,'It describes several nocturnal animals.']]},
{id:'b1',lv:'B',e:'⛸️',t:'The Science of Ice Skating',p:['Have you ever wondered why ice skaters can glide so smoothly? The secret is a tiny, slippery layer on top. The surface of ice is naturally a little slippery, and when a blade slides, friction warms the ice and helps make a very thin layer of water.','Skate blades are also special. They are narrow and have a slight curve, called a rocker, so only a small part of the blade touches the ice at once. The blade also has two sharp edges that grip the ice, which lets skaters turn, stop, and push off.','Great skaters combine this science with balance and practice. Spins, jumps, and quick stops take thousands of hours of training. Every fall teaches the body something new about balance.'],
 q:[['What is the main idea of the passage?',['Ice is cold','Science and practice both help skaters glide, turn and balance','Skates are expensive, so only a few people can ever learn to skate','Skating was invented in winter by people who wanted to travel'],1,'The passage explains the science of skating and how practice builds skill.'],
  ['What is the "rocker" on a skate blade?',['A sharp edge that grips the ice','A slight curve in the blade','The boot','A kind of spinning jump'],1,'"They are narrow and have a slight curve, called a rocker."'],
  ['What can you infer the author thinks about falling?',['Falling means you should quit','Falls are part of learning','Only beginners fall','Falls make ice melt'],1,'"Every fall teaches the body something new about balance."']]},
{id:'b2',lv:'B',e:'🤖',t:'Maria\'s Robot',p:['For the science fair, Maria built a robot that was supposed to sort red and blue blocks. At home it worked perfectly. But on the morning of the fair, the robot dropped every block on the floor.','Maria wanted to hide under the table. Instead, she took a deep breath and started testing one part at a time. She discovered that the bright gym lights were confusing the robot\'s color sensor. She built a small cardboard shade over the sensor, and the robot began sorting again.','Maria did not win first place. But the judges gave her a special award for problem-solving. "You showed us what real engineers do," one judge said. "They find the problem and fix it."'],
 q:[['What is the theme of the story?',['Robots are dangerous','Mistakes can be solved by staying calm and testing ideas','Science fairs are unfair because only the biggest robots can win','If something goes wrong, it is best to hide and give up'],1,'Maria stayed calm, found the problem and fixed it.'],
  ['What was causing the robot to fail?',['A dead battery','The bright gym lights confused the color sensor','The blocks were too heavy for the robot\'s small arm to lift','A broken wheel'],1,'"The bright gym lights were confusing the robot\'s color sensor."'],
  ['Why did the judge say Maria acted like a real engineer?',['She won first place','She found the problem and fixed it','She built the biggest robot','She used cardboard'],1,'"They find the problem and fix it."']]},
{id:'b3',lv:'B',e:'🦋',t:'The Great Monarch Journey',p:['Every fall, millions of monarch butterflies from eastern Canada and the eastern United States fly all the way to the mountains of central Mexico. Some travel nearly 3,000 miles, one of the longest trips of any insect. All winter they cling together in huge clusters on tall oyamel fir trees.','Amazingly, the butterflies that make the trip south have never been there before. In spring, those same butterflies start back north. They lay eggs on milkweed along the way, and their children and grandchildren finish the trip. Scientists believe monarchs use the sun, and maybe Earth\'s magnetic field, to find their way.','Monarchs need a plant called milkweed. It is the only plant their caterpillars eat. As milkweed disappears from fields and roadsides, people are planting it in gardens and schoolyards to help the monarchs survive.'],
 q:[['What is this passage mostly about?',['How to raise caterpillars in a jar at home and keep them fed all summer','The monarch butterfly\'s long migration and how people help','Mountains in Mexico and the animals that live high up in them','Why butterflies are orange and how they use their color to hide'],1,'It describes the journey and why milkweed matters.'],
  ['Why is milkweed important to monarchs?',['It is the only plant their caterpillars eat','It shows them the way south to Mexico each fall','It keeps them warm','It is their home in the mountains of Mexico'],0,'"It is the only plant their caterpillars eat."'],
  ['What is surprising about the butterflies that fly south?',['They are the biggest butterflies in the whole world','They have never been to Mexico before','They fly only at night','They travel in cars'],1,'"The butterflies that make the trip south have never been there before."']]},
{id:'b4',lv:'B',e:'🐺',t:'The Boy Who Cried Wolf',p:['A shepherd boy was bored watching the village sheep. To have some fun, he shouted, "Wolf! Wolf!" The villagers dropped their work and ran up the hill to help. There was no wolf, and the boy laughed at them.','A few days later, he did it again. Again the villagers came running, and again there was no wolf. They walked back down the hill, grumbling and annoyed.','Then one evening, a real wolf crept out of the forest. "Wolf! Wolf!" the boy cried, terrified. But this time, no one came. They thought he was tricking them again.'],
 q:[['What is the moral of this fable?',['Wolves are dangerous, so shepherds should never watch the sheep alone at night','If you lie, people may not believe you even when you tell the truth','Sheep need strong fences','Villagers are lazy and will not help'],1,'After his lies, no one believed him when the wolf was real.'],
  ['Why did the boy first shout "Wolf!"?',['He saw a wolf creeping out of the forest','He was bored and wanted to have fun','A sheep was lost','He was hungry'],1,'"To have some fun, he shouted, Wolf! Wolf!"'],
  ['Which word best describes the villagers after the second trick?',['Grateful','Annoyed','Sleepy','Excited'],1,'They walked back "grumbling and annoyed."']]},
{id:'b5',lv:'B',e:'🌋',t:'How Volcanoes Form',p:['Deep beneath Earth\'s surface, it is so hot that some rock melts into a thick liquid called magma. Magma is lighter than the solid rock around it, so it slowly rises upward.','When magma finds a crack in Earth\'s crust, it can push its way out. Once it reaches the surface, it is called lava. Over many eruptions, lava and ash pile up and harden, building a mountain called a volcano.','Some volcanoes erupt gently, with rivers of glowing lava. Others explode violently, blasting ash high into the sky. Scientists called volcanologists study volcanoes to help warn people before an eruption.'],
 q:[['What is the difference between magma and lava?',['Magma is cold and hard, but it turns into hot lava only after it flows down the mountain','Magma is underground; it is called lava once it reaches the surface','They are different colors','Lava is rock, magma is ash'],1,'"Once it reaches the surface, it is called lava."'],
  ['Why does magma rise?',['It is lighter than the rock around it','Wind pulls it up through the cracks','Scientists pump it up to the surface with machines','It is frozen'],0,'"Magma is lighter than the solid rock around it, so it slowly rises."'],
  ['Why do volcanologists study volcanoes?',['To collect lava to make art','To help warn people before an eruption','To build new mountains for people to climb','To make them erupt on purpose'],1,'"To help warn people before an eruption."']]},
{id:'b6',lv:'B',e:'⚽',t:'The New Kid',p:['On his first day at a new school, Jonah ate lunch alone. At recess he stood by the wall, watching a soccer game and wishing he knew someone.','Then a girl named Ava jogged over. "We need one more player," she said. "Want to join?" Jonah scored a goal that day, but what he remembered most was that someone had noticed him.','A month later, a new student sat alone in the cafeteria, staring at her tray. Jonah remembered how that felt. He picked up his lunch, walked over, and said, "Want to sit with us?"'],
 q:[['What is the theme of the story?',['Soccer is the best sport because it helps you score goals','One act of kindness can spread to others','New schools are scary forever','Lunch is the most important part of a school day'],1,'Ava was kind to Jonah, and later Jonah was kind to someone else.'],
  ['What did Jonah remember most about his first day?',['Scoring a goal in the soccer game','That someone noticed him','The food in the cafeteria','The name of his new teacher'],1,'"What he remembered most was that someone had noticed him."'],
  ['Why did Jonah invite the new student to sit with him?',['His teacher made him go and sit with her','He remembered how it felt to be alone','She had extra food','She was on his soccer team at recess'],1,'"Jonah remembered how that felt."']]},
{id:'b7',lv:'B',e:'🪸',t:'Coral Reefs in Trouble',p:['Coral reefs look like colorful underwater gardens, but corals are actually tiny animals. Millions of them live together and build hard skeletons that form a reef. Reefs are home to about one quarter of all ocean species, even though they cover less than one percent of the ocean floor.','Corals get their bright colors and much of their food from tiny algae that live inside them. When ocean water becomes too warm, corals push the algae out. The corals turn white, which is called bleaching. If the water stays warm too long, the corals can die.','Scientists and volunteers are working to protect reefs. Some grow baby corals in underwater nurseries and replant them. Others study which corals can survive warmer water.'],
 q:[['What is the main idea of the passage?',['Coral reefs are important, are in danger, and people are working to help them','Corals are colorful plants that grow in underwater gardens and need lots of sunlight','Oceans are cold','Fish like bright colors, so they swim to reefs to look at them'],0,'The passage explains what reefs are, the danger, and how people help.'],
  ['What causes coral bleaching?',['Too many fish eating the coral','Water that is too warm','Rain falling on the ocean','Strong waves that break the reefs apart'],1,'"When ocean water becomes too warm, corals push the algae out."'],
  ['Based on the passage, corals are…',['rocks','tiny animals','seaweed','shells left by crabs'],1,'"Corals are actually tiny animals."']]},
{id:'b8',lv:'B',e:'⛰️',t:'The Stonecutter',p:['A stonecutter worked hard every day chipping rocks from a mountain. One day he saw a rich man in a fine carriage. "I wish I were rich," he said, and magically, he became rich.','Soon he noticed the sun was even more powerful, so he wished to be the sun. But a cloud covered the sun, so he wished to be a cloud. Then the wind pushed the cloud away, and nothing could move the mountain, so he wished to be the mountain.','As the mountain, he felt something chipping at his side. It was a stonecutter. "Then the stonecutter is the most powerful of all," he said. He wished to be himself again, and he was finally happy.'],
 q:[['What is the lesson of this folk tale?',['Be happy with who you are','Mountains are strong','Always wish for money','Clouds are stronger than the sun'],0,'After trying to be everything else, he was happiest as himself.'],
  ['Why did he want to become a cloud?',['A cloud covered the sun','He liked rain','The wind told him to','He was tired'],0,'"A cloud covered the sun, so he wished to be a cloud."'],
  ['What made him realize a stonecutter was powerful?',['A stonecutter was chipping at the mountain','The king came and told him so','He read about it in a big old book','The wind blew hard against the mountain but could not move it'],0,'"He felt something chipping at his side. It was a stonecutter."']]},
{id:'b9',lv:'B',e:'🍭',t:'An Accidental Invention',p:['In 1905, an eleven-year-old boy named Frank Epperson mixed powdered soda with water on his porch. He stirred it with a wooden stick and then forgot about it overnight.','That night, the temperature dropped below freezing. In the morning, Frank found the drink frozen solid with the stick standing straight up. He pulled it out and licked it. It was delicious!','Years later, Frank began selling his frozen treats on sticks. At first he called them "Epsicles," but his children called them "Pop\'s sicles." The name stuck, and today we call them Popsicles.'],
 q:[['What is this passage mostly about?',['How a boy accidentally invented the Popsicle','How to make soda at home with powder and water','Why winter nights are so cold','Frank\'s children and the games they liked to play'],0,'It tells how the Popsicle was invented by accident.'],
  ['What caused the drink to freeze?',['He put it in the kitchen freezer before he went to bed','The temperature dropped below freezing overnight','He added ice','It was summer, so the porch was cool'],1,'"That night, the temperature dropped below freezing."'],
  ['Where did the name "Popsicle" come from?',['A contest held by a big candy company in town','His children called them "Pop\'s sicles"','A store owner','The word "soda"'],1,'"His children called them Pop\'s sicles. The name stuck."']]},
{id:'b10',lv:'B',e:'🏃',t:'Training for the Big Race',p:['Kai wanted to run the town\'s 5K race, but on his first practice he could only jog for five minutes before he was out of breath. Instead of giving up, he made a plan: run a little farther each week.','Week by week, Kai added a few more minutes. Some days were hard, and one week his knee hurt, so he rested and walked instead. His coach reminded him that rest is part of training too.','On race day, Kai did not finish first. But he ran the whole 5K without stopping, something he could not have imagined two months earlier. He crossed the finish line with the biggest smile in town.'],
 q:[['What is the theme of the story?',['Winning first place is the only thing that really matters','Steady practice and patience help you reach big goals','Running hurts','Coaches are strict'],1,'Kai improved a little at a time and reached his goal.'],
  ['What did Kai do when his knee hurt?',['He quit','He rested and walked instead','He ran even faster to catch up','He bought new running shoes'],1,'"He rested and walked instead."'],

function weekStart(d){d=d?new Date(d):new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-d.getDay());return d;}

function weekDays(wk){const d=new Date(wk+'T12:00:00');return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return dayKey(x);});}

 if(!pl.length)return null;
 const max={};STAR_CATS.forEach(c=>max[c.id]=Math.max(0,...pl.map(x=>c.v(x.s))));
 const won={};pl.forEach(x=>won[x.p.id]=[]);const left=STAR_CATS.filter(c=>max[c.id]>0);
 const give=(x,c)=>{won[x.p.id].push({c:c.id,d:c.d(x.s)});left.splice(left.indexOf(c),1);};

  let best=null;need.forEach(x=>left.forEach(c=>{const v=c.v(x.s);if(v<=0)return;const sc=v/max[c.id];if(!best||sc>best.sc+1e-9)best={x,c,sc};}));

/* ================= gifts between family players ================= */
const GIFTS_PER_DAY=2,GIFT_COINS=[10,25,50];
function niceDate(d){try{const x=new Date(d+'T12:00:00');if(isNaN(x))return d;return x.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}catch(e){return d;}}
function giftsLeft(p){return p.giftsSent&&p.giftsSent.d===dayKey()?Math.max(0,GIFTS_PER_DAY-p.giftsSent.n):GIFTS_PER_DAY;}

function giftSend(toId,kind,item,qty){
 const p=P();const to=state.players.find(x=>x.id===toId);if(!to||!giftsLeft(p))return closeModal();
 if(kind==='coins'){if(p.coins<qty)return giftPick(toId);p.coins-=qty;}
 else if(kind==='food'){if(!(p.pantry[item]>0))return giftPick(toId);p.pantry[item]--;}
 else if(kind==='egg'){if(p.eggs<1)return giftPick(toId); /* keep p.eggB (shop eggs, which always hatch a pet) in step: give a found mystery egg first; if only shop eggs are left, a shop egg travels as one */

 const n=base.type==='skillup'?1:Math.round(base.n*(1+.25*tier));return Object.assign({},base,{t:`${base.t} ${tier+1}`,n,d:base.d.replace('{N}',n),r:{...base.r,coins:Math.round(base.r.coins*(1+.2*tier))}});}

 if(!ops.length)return 'mul';return ops.map(o=>({o,a:p.stats[o].r/(p.stats[o].r+p.stats[o].w)})).sort((a,b)=>a.a-b.a)[0].o;}

function qRetire(p,Q){Q.v2=1;let c=0,e=0,l=0;(Q.active||[]).forEach(a=>{if(!a.done)return;try{const r=qDef(a.c,a.i).r||{};c+=r.coins||0;e+=r.eggs||0;l+=r.legend||0;if(r.food){p.pantry=p.pantry||{};p.pantry[r.food]=(p.pantry[r.food]||0)+1;}}catch(x){}});
 Q.active=[];if(c||e||l){p.coins+=c;p.eggs=(p.eggs||0)+e;p.legendEggs=(p.legendEggs||0)+l;setTimeout(()=>{try{toast(`📜 Your finished quests paid out: ${[c?'🪙 '+c:'',e?'🥚 '+e:'',l?'🌟 '+l:''].filter(Boolean).join(' · ')}`);}catch(x){}},1500);}}
function qState(p){p.qs=p.qs||{idx:{},active:[],rot:0,v2:1};const Q=p.qs;if(!Q.v2)qRetire(p,Q);
 while(!Q.v2&&Q.active.length<3){let tries=0;while(tries++<5){const c=QROT[Q.rot%QROT.length];Q.rot++;if(!Q.active.some(a=>a.c===c)){const idx=Q.idx[c]||0;const d=qDef(c,idx);Q.active.push({c,i:idx,prog:0,done:false,op:d.type==='weak'?weakOp(p):null});break;}}if(tries>5)break;}

function bankKey(p){const WB=CONTENT.wordBank||{},g=p.grade||3;const old=g<=3?'3':g>=7?(WB['7']?'7':'5'):'5';const neu=g<=2&&!p.adult&&WB['1']?'1':(g>=9||p.adult)&&WB['10']?'10':old;

/* One safe way to talk for the whole game. iPad/iPhone Safari drops speech when: it hasn't been "unlocked" by a tap yet,
   cancel() and speak() happen in the same instant, the speech engine got paused in the background, or the utterance is
   garbage-collected mid-sentence. ttsSpeak() works around all four. */
let TTS_KEEP=null,TTS_UNLOCKED=false;
/* Natural pacing: every spoken text is split into sentences and spoken one at a time with a short breath between them
   (the speech engines run sentences together otherwise). Any cancel — ttsStop(), a new ttsSpeak(), or a direct
   speechSynthesis.cancel() anywhere in the game — drops the rest of the queue. */
const TTS_PAUSE=450;let TTS_SEQ=0,TTS_QON=false,TTS_GAP=null;
function ttsSentences(t){t=String(t||'').replace(/\s+/g,' ').trim();if(!t)return [];
 const keep=t.replace(/\b(Dr|Mr|Mrs|Ms|St|Mt|vs|etc|e\.g|i\.e)\.\s/gi,(m,a)=>a+'\u0001 ');
 const parts=keep.replace(/([.!?…])\s+(?=["'“(]?[A-Z0-9¿¡])/g,'$1\u0002').split('\u0002').map(x=>x.replace(/\u0001/g,'.').trim()).filter(x=>x&&/[A-Za-z0-9]/.test(x));
 return parts.length?parts:[t];}
(function(){try{const ss=window.speechSynthesis;if(!ss||ss.__mqWrap)return;const c=ss.cancel.bind(ss);ss.cancel=function(){TTS_SEQ++;TTS_QON=false;clearTimeout(TTS_GAP);return c();};ss.__mqWrap=1;}catch(e){}})();
function ttsSpeak(u){try{const ss=window.speechSynthesis;if(!ss)return;
 const parts=ttsSentences(u.text);
 const mk=t=>{const x=new SpeechSynthesisUtterance(t);x.lang=u.lang;x.rate=u.rate;x.pitch=u.pitch;x.volume=u.volume;if(u.voice)x.voice=u.voice;return x;};
 const start=()=>{const seq=++TTS_SEQ;TTS_QON=true;let i=0;
  const next=()=>{if(seq!==TTS_SEQ)return;if(i>=parts.length){TTS_QON=false;TTS_KEEP=null;return;}
   const x=parts.length===1?u:mk(parts[i]);i++;TTS_KEEP=x;let fin=false;

/* ================= pet buddies: earned at levels, limited hints ================= */
const PET_LEVELS=[2,4,6,8,10];
const HINT_CHARGE=8;                       // right answers to earn back one hint
const PET_STAGES=[{n:'Baby',xp:0,max:1},{n:'Big',xp:15,max:2},{n:'Grown-up',xp:45,max:3},{n:'Mighty',xp:120,max:3}]; /* last growth stage was called 'Legendary' — renamed so it isn't confused with the Legendary pet tier */
const PET_PTS={c:1,hp:1,xp:1,dmg:.5,egg:25,hint:5};
function petCredit(p,k,n){const pet=petOf(p);if(!pet||!n)return;questEvent(p,'petpts',n*PET_PTS[k]);const pd=petData(p,pet.id);pd.st=pd.st||{};pd.st[k]=(pd.st[k]||0)+n;pd.wk=pd.wk||{};const wk=weekKey();pd.wk[wk]=Math.round(((pd.wk[wk]||0)+n*PET_PTS[k])*10)/10;const ks=Object.keys(pd.wk).sort();if(ks.length>8)delete pd.wk[ks[0]];}
function petPower(pd){const s=(pd&&pd.st)||{};return Math.round(Object.keys(PET_PTS).reduce((a,k)=>a+(s[k]||0)*PET_PTS[k],0));}
function petData(p,id){p.petData=p.petData||{};if(!p.petData[id])p.petData[id]={xp:0,hints:1,charge:0};return p.petData[id];}
/* endless pet levels after Mighty: each level needs a little more XP */
function petLvInfo(pd){const top=PET_STAGES[PET_STAGES.length-1].xp;if(!pd||pd.xp<top)return {lv:0,into:0,need:50};let x=pd.xp-top,l=1,need=50;while(x>=need){x-=need;l++;need+=10;}return {lv:l,into:x,need};}
const petLv=pd=>petLvInfo(pd).lv;
function petLvCheck(p,pet,before){const pd=petData(p,pet.id);const now=petLv(pd);if(now>0)questEvent(p,'petlv',now);if(now>before){setTimeout(()=>{if(curScreen==='battle'&&B&&!B.over)banner(`${pet.e} ${pet.name} is now Lv ${now}!`);toast(`🌟 ${pet.e} ${pet.name} reached Mighty Lv ${now}! Pet moves hit a little harder.`);SFX.level();},900);}}
function petStage(pd){let s=PET_STAGES[0];PET_STAGES.forEach(x=>{if(pd.xp>=x.xp)s=x;});return s;}
function petMeter(pd){const st=petStage(pd);let m='';for(let i=0;i<st.max;i++)m+=i<pd.hints?'💡':'<span class="dimbulb">💡</span>';return m;}
function petMilestones(p){p.petMs=p.petMs||[];const due=PET_LEVELS.filter(l=>p.level>=l&&!p.petMs.includes(l));p.pendingPets=due.length;return due;}
function petCharge(p){
 const pet=petOf(p);if(!pet)return;const pd=petData(p,pet.id);const st=petStage(pd);const lv0=petLv(pd);
 pd.xp+=.25*(1+.1*vLv(p,'pethome'));petLvCheck(p,pet,lv0);
 if(pd.hints<st.max){pd.charge++;if(pd.charge>=HINT_CHARGE){pd.charge=0;pd.hints++;setTimeout(()=>toast(`${pet.e} ${pet.name} has a new hint for you! 💡`),600);}}
 const st2=petStage(pd);if(st2.max>st.max){pd.hints=Math.min(st2.max,pd.hints+1);setTimeout(()=>{banner(`${pet.e} ${pet.name} grew up!`);toast(`${pet.name} is now ${st2.n} and can hold ${st2.max} hints!`);},900);}
 updateHintBtn();
}
function updateHintBtn(){
 const b=$('#hintBtn');if(!b||!B)return;const p=P();const pet=petOf(p);
 if(!pet){b.innerHTML='🐾 Hint';b.classList.add('off');return;}
 const pd=petData(p,pet.id);

function useHint(){
 if(!B||B.busy||B.over||fbOpen||!B.q)return;
 if(spellRound()>=5){toast('👑 No pet hints in the Legend round. You can do it!');return;}

function hintFor(q){
 if(q.type==='word'){
  const first=q.word[0].toLowerCase();if(!B.input.startsWith(first))B.input=first;showQ();setTimeout(()=>say(q.word,.45),300);
  return `<p>It starts with <b style="font-size:28px">${esc(first)}</b> and has <b>${q.word.length}</b> letters.</p><p>Listen to it slowly… 🐢</p>`;
 }
 if(q.type==='choice'){
  const wrong=[0,1,2,3].filter(i=>i!==q.answer&&i<q.choices.length).sort(()=>Math.random()-.5).slice(0,2);q.hidden=wrong;
  $('.bctrl .qpad').innerHTML=questPadHTML();
  return `<p>I crossed out <b>two wrong answers</b> for you! ✂️</p>`;
 }
 if(q.type==='hw'){
  if(q.hint)return `<p>${esc(q.hint)}</p>`;
  const n=parseFloat(normAns(q.answer));
  if(!isNaN(n)&&/^[\d.]+$/.test(normAns(q.answer))){const lo=Math.floor(n*.8),hi=Math.ceil(n*1.2);return `<p>The answer is somewhere between <b>${lo}</b> and <b>${hi}</b>.</p><p>Read it again slowly and find the numbers you need.</p>`;}
  return `<p>Read the problem again slowly and underline the numbers. What is it asking you to find?</p>`;
 }
 return mathNudge(q);
}
function mathNudge(q){
 if(q.nudge)return q.nudge;
 const {op,a,b,c}=q;const d=(n,i)=>Math.floor(n/Math.pow(10,i))%10;
 if(op==='add'){
  if(c===undefined&&a+b<=20)return `<p>Count all the dots:</p><div class="dotbox"><span class="grp">${dotsHTML(a)}</span><span class="plus">+</span><span class="grp">${dotsHTML(b,'o')}</span></div>`;
  const s=d(a,0)+d(b,0)+(c!==undefined?d(c,0):0);
  return `<p>Start with the <b>ones</b>: ${d(a,0)} + ${d(b,0)}${c!==undefined?' + '+d(c,0):''} = <b>${s}</b>.</p><p>${s>=10?`Write the ${s%10} and carry the 1 to the tens!`:`Write the ${s}, then add the tens.`}</p>`;
 }
 if(op==='sub'){
  if(a<=20)return `<p>Start at <b>${a}</b> and count back <b>${b}</b>.</p><p>Or think: ${b} + ? = ${a}</p>`;
  if(q.answer<10)return `<p>These numbers are close together!</p><p>Start at <b>${b}</b> and count up to <b>${a}</b>. How many steps?</p>`;
  const ao=d(a,0),bo=d(b,0);
  return ao>=bo?`<p>Start with the <b>ones</b>: ${ao} − ${bo} = <b>${ao-bo}</b>. Now do the tens!</p>`:`<p>Ones: ${ao} is smaller than ${bo}, so <b>borrow a ten</b>: ${ao+10} − ${bo} = <b>${ao+10-bo}</b>.</p><p>Remember the tens went down by 1!</p>`;
 }
 if(op==='mul'){
  if(a<=12&&b<=12){
   if(a===0||b===0)return `<p>Zero groups of anything is… nothing at all!</p>`;
   if(a===1||b===1)return `<p>One group of a number is just that number!</p>`;
   if(a===10||b===10)return `<p>Times 10? Put a zero on the end of ${a===10?b:a}!</p>`;
   const big=Math.max(a,b),small=Math.min(a,b);
   const shown=Math.max(1,Math.min(3,small-1));
   return `<p>Count by <b>${big}s</b>, ${small} times in all:</p><p><b>${Array.from({length:shown},(_,i)=>big*(i+1)).join(', ')}, …</b> keep going!</p>`;
  }
  const split=b>12?'b':'a';const big=split==='a'?a:b,oth=split==='a'?b:a;const parts=placeParts(big);
  if(parts.length===1){const z=String(big).match(/0+$/)[0];return `<p>${big} × ${oth} is like <b>${big/Math.pow(10,z.length)} × ${oth}</b>…</p><p>…then put <b>${z.length===1?'a zero':z.length+' zeros'}</b> on the end!</p>`;}
  return `<p>Split <b>${big}</b> into ${parts.join(' + ')}.</p><p>First: ${parts[0]} × ${oth} = <b>${parts[0]*oth}</b>. Now do the other part${parts.length>2?'s':''} and add!</p>`;
 }
 const qn=q.answer;
 const shown=Math.max(1,Math.min(2,qn-1));
 return `<p>Think: <b>${b} × ? = ${a}</b></p><p>Count by ${b}s: <b>${Array.from({length:shown},(_,i)=>b*(i+1)).join(', ')}, …</b> How many jumps to get to ${a}?</p>`;
}
function offerPet(){

 const pool=PETS.filter(x=>!p.pets.includes(x.id)&&(x.tier==='common'||(x.tier==='rare'&&due[0]>=6)));
 if(!pool.length){p.petMs.push(due[0]);p.eggs++;save();toast(`Level ${due[0]} reward: a mystery egg! 🥚 Hatch it in the Pet Home.`);return;}

 <p class="muted">Tap the one you want!</p></div>`);
}

}


/* ================= auto-update (version check + "been away" fresh start) ================= */
/* APP_VER is defined in the first <script> in <body> (it also versions the add-on file URLs) */
const Upd=(function(){
 const AWAY_RESET=6*3600e3,AWAY_QUIET=15*60e3,EVERY=30*60e3,SAFE=['profiles','map','world','rest'];
 let pending=null,bannerShown=false,lastScr=null,arrived=0,busy=false,resetDue=0,waitSince=0;
 const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
 function safeNow(){return typeof curScreen!=='undefined'&&SAFE.includes(curScreen)&&!document.querySelector('#modal.show,#kindOv,.tr-root,.eg-root,.eg-flyover,#isRoot,#cvRoot')&&!window.trollBusy&&!document.hidden;}
 async function latest(){if(location.protocol==='file:')return null;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;const j=await r.json();return j&&j.v?String(j.v):null;}catch(e){return null;}}
 function triedRecently(v){try{const t=JSON.parse(ls.get('mqUpdTry')||'null');return t&&t.v===v&&Date.now()-t.t<20*60e3;}catch(e){return false;}}
 async function check(){const v=await latest();if(v&&v!==APP_VER&&!triedRecently(v)){pending=v;return true;}return false;}
 function splash(msg){const d=document.createElement('div');d.id='updSplash';d.innerHTML=`<div><div class="logo-main" style="font-size:54px">QUEST</div><div style="font-size:22px;font-weight:800;margin-top:10px">${msg}</div><div class="upd-dots"><span></span><span></span><span></span></div></div>`;document.body.appendChild(d);}
 async function reload(resume,msg){if(busy)return;busy=true;
  try{if(typeof save==='function'&&state)save();}catch(e){}
  splash(msg||'✨ Updating Math Quest…');
  try{if(cloud&&cloud.code){clearTimeout(cloud.timer);await Promise.race([syncNow(),new Promise(r=>setTimeout(r,4000))]);}}catch(e){}
  try{if(pending)ls.set('mqUpdTry',JSON.stringify({v:pending,t:Date.now()}));}catch(e){}
  try{if(resume&&state&&state.cur)sessionStorage.setItem('mqResume',state.cur);else sessionStorage.removeItem('mqResume');}catch(e){}
  const q=new URLSearchParams(location.search);q.set('r',Date.now());location.replace(location.pathname+'?'+q.toString()+location.hash);}
 function banner(){if(bannerShown||document.getElementById('updBar'))return;bannerShown=true;const b=document.createElement('button');b.id='updBar';b.type='button';
  b.innerHTML='✨ New stuff in Math Quest! <u>Tap to update</u>';b.onclick=()=>{if(safeNow())reload(true);else{toast("Got it! It'll update when you're back on the map. 👍");b.remove();}};document.body.appendChild(b);}
 async function onReturn(){const hid=+ls.get('mqHiddenAt')||0;ls.del('mqHiddenAt');if(!hid)return;const away=Date.now()-hid;
  if(away>=AWAY_RESET){await check();if(safeNow())reload(false,'👋 Welcome back!');else{resetDue=Date.now();waitSince=Date.now();}return;}
  if(await check()){if(away>=AWAY_QUIET&&safeNow())reload(true);else banner();}}
 function markWait(){if(!waitSince)waitSince=Date.now();}
 document.addEventListener('visibilitychange',()=>{if(document.hidden){ls.set('mqHiddenAt',String(Date.now()));try{save();}catch(e){}}else onReturn();});
 window.addEventListener('pagehide',()=>ls.set('mqHiddenAt',String(Date.now())));
 setInterval(async()=>{if(!document.hidden&&!pending&&await check())banner();},EVERY);
 setTimeout(async()=>{if(await check())banner();},20000);
 // a waiting update is applied the next time they arrive back on a safe screen (map, home, sign-in)
 setInterval(()=>{if(typeof curScreen==='undefined')return;if(curScreen!==lastScr){lastScr=curScreen;arrived=Date.now();}
  // wait for them to arrive back on a safe screen after the update/reset became due, then settle 1.5 s
  if(!busy&&(resetDue||(pending&&bannerShown))&&safeNow()&&arrived>waitSince&&Date.now()-arrived>1500){if(resetDue)reload(false,'👋 Welcome back!');else reload(true);}},700);
 const _b=banner;banner=function(){if(!bannerShown)waitSince=Date.now();_b();};
 function afterBoot(){try{const q=new URLSearchParams(location.search);if(q.has('r')){q.delete('r');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);}}catch(e){}
  let id=null;try{id=sessionStorage.getItem('mqResume');sessionStorage.removeItem('mqResume');}catch(e){}
  const p=id&&state.players.find(x=>x.id===id);if(p&&p.setup){state.cur=p.id;applyHeroSound(p);save();go('world');toast('✨ Math Quest is up to date!');}}
 async function checkNow(show){const v=await latest();if(!v){if(show)toast("Couldn't check right now. Try again later.");return;}
  if(v===APP_VER){if(show)toast('✅ This is the newest version ('+APP_VER+').');return;}pending=v;ls.del('mqUpdTry');reload(false);}
 return {check,checkNow,afterBoot,_s:()=>({pending,bannerShown,busy})};})();
window.Upd=Upd;
