<!doctype html>
<meta charset="utf-8">
<title>Math Quest smoke test</title>
<!-- Run with: /usr/bin/python3 math-quest/tools/smoke.py   (starts a local server and a throwaway headless Chrome)
     The page loads the real game in a frame and drives it. It only runs on localhost with ?run=1, so opening it on the
     live site (where a family's real save lives) does nothing. -->
<style>body{font:15px system-ui;margin:20px}iframe{width:900px;height:650px;border:1px solid #999}.ok{color:#18794e}.bad{color:#c22}</style>
<h1 id="h">Math Quest smoke test</h1>
<pre id="log"></pre>
<pre id="result" hidden></pre>
<iframe id="game"></iframe>
<script>
(async function(){
const local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
if(!local||!/[?&]run=1/.test(location.search)){document.getElementById('log').textContent='Not running: this page only runs on localhost with ?run=1.';return;}
const log=document.getElementById('log'),results=[];
const frame=document.getElementById('game');
const boot=()=>new Promise(res=>{frame.onload=()=>res();frame.src='../index.html?smoke='+Date.now();});
await boot();
const W=frame.contentWindow;
/* the game finishes booting a moment after the page loads (it opens its local database first) */
for(let i=0;i<200;i++){let up=false;try{up=W.eval("typeof state!=='undefined'&&!!state&&Array.isArray(state.players)&&document.body.innerText.length>20");}catch(e){}if(up)break;await new Promise(r=>setTimeout(r,50));}
const errs=[];W.addEventListener('error',e=>errs.push(String(e.message||e)));W.addEventListener('unhandledrejection',e=>errs.push('rejection: '+String(e.reason&&e.reason.message||e.reason)));

/* helpers that live inside the game's own page, so tests can use its top-level let/const globals */
W.eval(`window.T={
 wait:ms=>new Promise(r=>setTimeout(r,ms)),
 until:async(f,ms,what)=>{const t=Date.now();while(!f()){if(Date.now()-t>(ms||8000))throw new Error('timed out waiting for '+(what||f));await new Promise(r=>setTimeout(r,40));}},
 ok:(c,m)=>{if(!c)throw new Error(m||'check failed');},
 clone:x=>JSON.parse(JSON.stringify(x)),
 hero:(name,grade,o)=>{const p=newPlayer(name||'Smoke',grade||3);p.id='p'+(name||'Smoke')+Math.random().toString(36).slice(2,6);p.setup=true;p.welcomed=true;p.skillChecked=true;p.tbOn=false;p.xplace=1;p.xp2=1;p.battles=20;p.level=8;p.coins=500;p.pets=PETS.slice(0,6).map(x=>x.id);p.pet=p.pets[0];Object.assign(p,o||{});state.players.push(p);migrate();const q=state.players.find(x=>x.id===p.id);q.care=q.care||{};q.care.intro=1;return q;},
 reset:()=>{try{closeModal();}catch(e){}const ov=document.getElementById('dqOv');if(ov)ov.remove();state.players=[];state.cur=null;state.deleted={};state.ownGroups={};state.gifts={};BASE={};try{MQ_VISIT.reset();}catch(e){}try{Discovery._leave();}catch(e){}curScreen='profiles';},
 answerAsk:(right)=>{const q=Daily._dbg.cur();if(!q)throw new Error('no question card open');String(right===false?q.answer+1:q.answer).split('').forEach(c=>Daily._k(c));Daily._k('go');Daily._next();}
};`);

const tests=[
['boot: version and add-ons',async function(){
  const v=await fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
  T.ok(v.v===APP_VER,'version.json '+v.v+' does not match APP_VER '+APP_VER);
  ['Adv','Cleanup','Lunch','Fade','PetCare','Mastery','Insights','Cave','Quartz','Lab','Inner','Music','Groups','Daily','Surprise','MQ_CONTENT','MORE_STORIES','ADV_TALES','CAVE_DATA','IS_DATA'].forEach(n=>T.ok(window[n],'add-on missing: '+n));
  T.ok(curScreen==='profiles','did not boot to the profiles screen');
  T.ok(document.body.innerText.length>20,'profiles screen is empty');}],

['questions: every skill at every level',async function(){
  const bad=[];OPS.forEach(op=>{for(let L=1;L<=maxLv(op);L++)for(let k=0;k<25;k++){let q;try{q=genQ(op,L);}catch(e){bad.push(op+' L'+L+' threw '+e.message);break;}
   if(!q||!(q.text||q.tpl)||!Number.isFinite(q.answer)){bad.push(op+' L'+L+' bad question '+JSON.stringify(q).slice(0,120));break;}}});
  T.ok(!bad.length,bad.slice(0,5).join(' | '));}],

['minerals: every one has a hammer-tap result, and the tests can tell them all apart',async function(){
  T.ok(CAVE_DATA.FOSSILS.every(f=>f.x&&['what','size','ate','where'].every(k=>typeof f.x[k]==='string'&&f.x[k].length>3)),'a fossil has no Museum exhibit card facts');
  const D=CAVE_DATA,ids=Object.keys(D.MIN),br=D.BREAKS.map(b=>b.id),band=h=>{const i=D.TOOLS.findIndex(t=>h<=t.h);return i<0?4:i;};
  T.ok(ids.every(k=>br.includes(D.MIN[k].br)),'a mineral has no hammer-tap result: '+ids.filter(k=>!br.includes(D.MIN[k].br)));
  const sig=(k,uv)=>{const m=D.MIN[k];return [band(m.h),m.s,!!m.f,!!m.m,!!m.w,m.br,uv?m.u||'':''].join('|');};
  T.ok(new Set(ids.map(k=>sig(k,true))).size===ids.length,'two minerals give the same result on every test, even with the UV lamp');
  T.ok(sig('mica')!==sig('gypsum')&&sig('feldspar')!==sig('olivine'),'mica/gypsum or feldspar/olivine still cannot be told apart');}],

['screens: every screen draws for a hero',async function(){
  T.reset();const p=T.hero('Screens',3);state.cur=p.id;p.sci=p.sci||{};p.sci.key=1;const bad=[];
  const skip=['rest','skillcheck','inner','cave','office','fade','truck','market','district']; /* these need their own setup; truck and district have their own tests */
  for(const s of Object.keys(SCREENS)){if(skip.includes(s))continue;try{go(s,s==='zone'?'forest':undefined);T.ok(curScreen===s,'ended on '+curScreen);T.ok(document.body.innerText.length>10,'empty');}catch(e){bad.push(s+': '+e.message);}try{closeModal();}catch(e){}}
  T.ok(!bad.length,bad.join(' | '));}],

['migrate: bare and old saves survive',async function(){
  T.reset();state.players.push({id:'pBare'},{id:'pOld',name:'Old',skill:{add:7},battles:12},null);migrate();
  const b=state.players.find(x=>x.id==='pBare'),o=state.players.find(x=>x.id==='pOld');
  T.ok(b&&b.look&&b.skill&&b.stats,'bare player was not filled in');T.ok(o.skill.add===7,'old save with progress was reset to '+o.skill.add);
  T.ok(state.players.every(x=>x&&x.id),'null player survived');}],

['battle: right answer, wrong answer, win',async function(){
  T.reset();const p=T.hero('Battle',3);state.cur=p.id;go('world');const b0=p.battles;
  /* "Flip it" questions (20% of the time) take two numbers, so answer through helpers that know both kinds */
  const right=()=>{const q=B.q;if(q.rev){B.input=String(q.ex[0][0]);B.input2=String(q.ex[0][1]);}else B.input=String(q.answer);answer();};
  const wrong=()=>{const q=B.q;if(q.rev){B.input='99999';B.input2='99999';}else B.input=String(q.answer+1);answer();};
  const ready=()=>B&&B.q&&!B.busy&&!fbOpen&&!document.querySelector('#modal.show');
  startBattle('forest',0);await T.until(ready,10000,'first question');B.mhp=B.mmax=5000;B.foes.forEach(f=>{f.hp=f.max=5000;}); /* a sturdy monster, so the test's right answers cannot end the battle early */
  const r0=p.stats.add.r,q1=B.q;right();
  await T.until(()=>ready()&&B.q!==q1,12000,'second question');T.ok(p.stats.add.r===r0+1,'right answer not counted');
  /* a helped answer: the hit lands, but no streak, coins or stats, and the problem is queued to come back */
  for(let k=0;k<6&&B.q.rev;k++){const q0=B.q;right();await T.until(()=>ready()&&B.q!==q0,12000,'a plain question');}
  {const qh=B.q,s0=B.streak,c0=p.coins,r1=p.stats.add.r,hp0=B.mhp,rv0=B.review.length;fleeBattle();T.ok(/Show me how/.test(document.querySelector('#modal').innerText),'help button missing');Daily.help();closeModal();
   T.ok(qh.hinted,'help did not mark the question');right();await T.until(()=>ready()&&B.q!==qh,12000,'question after a helped answer');
   T.ok(B.streak===s0,'helped answer raised the streak');T.ok(p.coins===c0,'helped answer paid coins');T.ok(p.stats.add.r===r1,'helped answer counted as right');
   T.ok(B.mhp<hp0,'helped answer did no damage');T.ok(B.review.length===rv0+1||B.q.again,'helped problem was not queued to come back');T.ok(p.missed[qh.text],'helped problem not recorded');}
  const w0=p.stats.add.w,n0=Object.keys(p.missed).length;wrong();await T.until(()=>fbOpen,8000,'wrong-answer card');
  T.ok(p.stats.add.w===w0+1&&Object.keys(p.missed).length===n0+1,'missed problem not stored');
  /* 🧠 Teach me on the wrong-answer card: a wrong step asks again, right steps walk to the answer, then a practice problem; no stats change */
  {const qm=B.q;if(window.Teach&&Teach.can(qm)){T.ok(/Teach me/.test(document.querySelector('#modal').innerText),'the Teach me button is missing');
    const D=Teach._dbg,typ=v=>{String(v).split('').forEach(k=>Teach._key(k));Teach._key('✓');},st0=JSON.stringify(p.stats),f0=(p.teach&&p.teach.f)||0;Teach._open();
    T.ok(D.TM()&&D.TM().p.steps.length>=1,'Teach me did not open');typ(D.ans(D.TM().p.steps[0])+1);T.ok(D.TM().i===0&&/Try again/.test(document.querySelector('#modal').innerText),'a wrong step did not ask to try again');
    for(let i=0;i<20&&D.TM().mode==='steps';i++)typ(D.ans(D.TM().p.steps[D.TM().i]));
    T.ok(D.TM().mode==='done'&&document.querySelector('#modal').innerText.includes(qm.text+' = '+qm.answer),'Teach me did not finish with the answer');
    Teach._prac();const pq=D.TM().prac;T.ok(pq&&pq.text!==qm.text&&pq.op===qm.op,'Try one like it gave no similar problem');typ(pq.answer);T.ok(D.TM().right,'the practice answer was not accepted');
    T.ok(p.teach&&p.teach.f===f0+1&&p.teach.pr[0]>=1&&JSON.stringify(p.stats)===st0,'Teach me did not log, or it changed the battle stats');Teach._close();T.ok(!fbOpen,'Back to the battle did not close the card');}
   else closeFeedback();}
  await T.until(ready,12000,'question after a miss');
  B.mhp=1;B.foes.forEach(f=>{f.hp=1;});right();
  await T.until(()=>p.battles>b0,20000,'battle win to be counted');T.ok(p.battles===b0+1,'battle win not counted');}],

['teach me: every plain fact up to the thousands gets a strategy whose steps are right and end on the answer',async function(){
  let n=0,bad=[];for(const op of ['add','sub','mul','div'])for(let L=1;L<=10;L++)for(let i=0;i<60;i++){const q=genQ(op,L),pl=Teach.plan(q);if(!pl){if(op==='mul'||op==='div'||L<=7)bad.push('no plan '+q.text);continue;}n++;
   const c=(a,o,b)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?a/b:a/2;pl.steps.forEach(s=>{if(c(s.a,s.op,s.b)!==s.r||s.r<0||!Number.isInteger(s.r))bad.push(q.text+' step '+s.a+s.op+s.b);});
   if(Teach._dbg.ans(pl.steps[pl.steps.length-1])!==q.answer)bad.push(q.text+' ends on the wrong number');}
  T.ok(n>1500&&!bad.length,'Teach me plans are wrong: '+bad.slice(0,4).join('; '));
  const tx=t=>{const [a,o,b]=t.split(' '),op={'+':'add','−':'sub','×':'mul','÷':'div'}[o],A=+a,Bn=+b;return Teach.plan({op,a:A,b:Bn,L:5,text:t,answer:o==='+'?A+Bn:o==='−'?A-Bn:o==='×'?A*Bn:A/Bn}).name;};
  T.ok(tx('8 + 5')==='Make a ten'&&tx('6 + 7')==='Near doubles'&&tx('13 − 5')==='Back through ten'&&tx('6 × 9')==='10s minus one group'&&tx('45 ÷ 5')==='Chunk it'&&tx('29 + 14')==='Round and adjust','a fact got the wrong strategy');
 }],
['town train: track, tunnels and a station on the plaza; the train comes, stops, cannot be ridden yet, leaves; free bell and paid call; visitors',async function(){
  T.reset();const p=T.hero('Rider',3);p.coins=50;state.cur=p.id;p.wpos={x:22,y:19};go('world');await T.wait(300);
  const D=Train._dbg,R=D.ROW,mt=()=>document.querySelector('#modal').innerText;
  T.ok(W.T[R][D.X0].tunnel&&W.T[R][D.X1].tunnel&&W.T[R][20].rail&&!W.T[R][20].block&&W.T[D.BOARD[1]][D.BOARD[0]].npc==='station','the track, tunnels or station are missing');
  W.hx=22;W.hy=19;const cut=Object.entries(W.gates).filter(([z,c])=>!wPathTo(c[0],c[1]).length).map(e=>e[0]);T.ok(!cut.length,'the track cut off a world: '+cut.join(', '));
  D.TR.ph='away';D.TR.wait=.01;D.TR.walkers.length=0;D.tick(.05);T.ok(D.TR.ph==='in','the train did not come when its time was up');
  for(let i=0;i<300&&D.TR.ph==='in';i++)D.tick(.05);T.ok(D.TR.ph==='stop'&&W.T[R][22].npc==='tride','the train did not stop at the station');
  wNpc('tride');T.ok(/Discovery Zone will open October 15th/.test(mt()),'getting on did not say the destination is coming soon');closeModal();
  for(let i=0;i<500&&D.TR.ph==='stop';i++)D.tick(.05);T.ok(D.TR.ph==='out'&&!W.T[R][22].npc&&!W.T[R][22].block,'the train did not leave, or left its doors on the track');
  for(let i=0;i<500&&D.TR.ph==='out';i++)D.tick(.05);T.ok(D.TR.ph==='away'&&Math.abs(D.TR.wait-900)<1,'the next train is not 15 minutes away');
  wNpc('station');T.ok(/Number Town Station/.test(mt())&&/Coming soon/i.test(mt()),'the station card did not open');Train._bell();T.ok(D.TR.wait===D.BELL_WAIT&&p.coins===50,'the free bell did not bring the train within a minute');closeModal();
  Train._call();T.ok(p.coins===50-D.CALL_COST&&D.TR.wait<=5,'a paid call did not bring the train right away');
  p.coins=3;D.TR.wait=200;Train._call();T.ok(p.coins===3&&D.TR.wait===200,'a call went through without enough coins');
  D.TR.walkers.length=0;for(let i=0;i<40&&!D.TR.walkers.length;i++)D.spawnRider();T.ok(D.TR.walkers.length===1,'no visitor got off the train');
  for(let i=0;i<400&&D.TR.walkers.length;i++)D.tick(.05);T.ok(!D.TR.walkers.length,'the visitor never walked into town');
 }],
['map ground: the finer floor and trails draw the whole map without errors and leave the walking grid alone',async function(){
  {T.reset();const q=T.hero('NoMobs',3);state.cur=q.id;go('world');await T.wait(150);T.ok(!W.mobs.some(m=>!m.principal&&!m.quartz&&!m.mod),'wild monsters still wander the map');const n0=(qState(q).active||[]).length;}
  T.reset();const p=T.hero('Walker',3);state.cur=p.id;go('world');await T.wait(200);T.ok(!!window.MQ_GROUND,'ground.js is not loaded');
  const blocks=JSON.stringify(W.T.map(r=>r.map(t=>t.block?1:0)));const c=document.createElement('canvas');c.width=400;c.height=300;let err='';
  try{MQ_GROUND.draw(c.getContext('2d'),W,0,WCOLS-1,0,WROWS-1,0,0,20,performance.now());}catch(e){err=String(e);}
  T.ok(!err,'drawing the ground failed: '+err);T.ok(JSON.stringify(W.T.map(r=>r.map(t=>t.block?1:0)))===blocks,'drawing the ground changed where you can walk');
  {const WL=MQ_GROUND.walls(W);T.ok(Object.keys(WL.wall).length>20&&Object.keys(WL.gate).length>5,'no stone walls or gates between areas');
   /* a wall blocks a step; a gate lets you through */
   const k=+Object.keys(WL.wall).find(k=>{const x=k%1000,y=Math.floor(k/1000),m=WL.wall[k],t=W.T[y][x],u=m&1?W.T[y][x+1]:W.T[y+1][x];return t&&u&&!t.block&&!u.block;});
   const x=k%1000,y=Math.floor(k/1000),d=WL.wall[k]&1?[1,0]:[0,1];T.ok(MQ_GROUND.blocked(W,x,y,x+d[0],y+d[1]),'a wall does not block');
   W.hx=x;W.hy=y;W.moving=false;W.path=[];wStep(d[0],d[1]);T.ok(W.hx===x&&W.hy===y,'the hero walked through a stone wall');
   const gk=+Object.keys(WL.gate)[0],gx=gk%1000,gy=Math.floor(gk/1000),gd=WL.gate[gk]&1?[1,0]:[0,1];T.ok(!MQ_GROUND.blocked(W,gx,gy,gx+gd[0],gy+gd[1]),'a gate blocks');
   /* nothing reachable before the walls is cut off, and every world entrance can be walked to from the town square */
   let st=null;for(let yy=0;yy<WROWS&&!st;yy++)for(let xx=0;xx<WCOLS;xx++){const t=W.T[yy][xx];if(t.plaza&&!t.block){st=[xx,yy];break;}}
   const reach=wl=>{const seen=new Set([st+'']),q=[st];while(q.length){const [a,b]=q.pop();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=a+dx,ny=b+dy,t=W.T[ny]&&W.T[ny][nx];if(!t||seen.has(nx+','+ny))continue;
     if(t.block&&!(t.gate||t.npc||t.chest))continue;if(wl&&MQ_GROUND.blocked(W,a,b,nx,ny))continue;seen.add(nx+','+ny);if(!t.block)q.push([nx,ny]);}}return seen;};
   const r0=reach(false),r1=reach(true);T.ok(r0.size===r1.size,'the walls cut off '+(r0.size-r1.size)+' places the hero could reach before');
   for(const [zid,c] of Object.entries(W.gates)){W.hx=st[0];W.hy=st[1];T.ok(wPathTo(c[0],c[1]).length>0,'cannot walk to the '+zid+' entrance past the walls');}}
 }],
['event worlds: Haunted Hollow and Harvest Hollow open on their own dates; Harvest Hollow gives Gobble the Turkey, then the Pilgrim Hat',async function(){
  T.reset();const p=T.hero('Feast',3);state.cur=p.id;const dk=window.dayKey,hv=ZONES.find(z=>z.id==='harvest'),hh=ZONES.find(z=>z.id==='haunt');T.ok(hv&&hv.event,'Harvest Hollow is missing');
  try{
   window.dayKey=()=>'2026-11-20';T.ok(eventOpen('harvest')&&!eventOpen('haunt')&&!eventOpen()&&!zoneLocked(hv,p)&&zoneLocked(hh,p),'Harvest Hollow is not open on Nov 20 (or Haunted Hollow is)');
   T.ok(/Harvest Hollow is open/.test(eventBanner(p))&&/Gobble the Turkey/.test(eventBanner(p)),'no Harvest Hollow banner on Nov 20');
   window.dayKey=()=>'2026-10-20';T.ok(eventOpen('haunt')&&eventOpen()&&!eventOpen('harvest')&&eventSoon('harvest')&&/Opens Nov 15/.test(hv.lockMsg),'Halloween dates broke, or Harvest Hollow is not coming soon');
   T.ok(/Haunted Hollow is open/.test(eventBanner(p)),'the Haunted Hollow banner is missing on Oct 20');
   window.dayKey=()=>'2026-12-02';T.ok(!eventOpen('harvest')&&!eventSoon('harvest')&&/Closed until next Thanksgiving/.test(hv.lockMsg),'Harvest Hollow is not closed in December');
  }finally{window.dayKey=dk;}
  T.ok(/Gobble/.test(eventPrize(p,1,hv))&&p.pets.includes('gobble'),'the first Harvest Hollow boss win does not give Gobble the Turkey');
  T.ok(/Pilgrim Hat/.test(eventPrize(p,2,hv))&&p.owned.hats.includes('pilgrim'),'the second boss win does not give the Pilgrim Hat');
  T.ok(/Boo/.test(eventPrize(p,1,hh))&&p.pets.includes('boo'),'Haunted Hollow no longer gives Boo');
  for(const [op,a,b] of [['add',7,5],['sub',9,4],['mul',6,3],['div',12,4]]){const st=feastStory({op,a,b,answer:1});T.ok(st&&st.includes('<b>'+a+'</b>')&&st.includes('<b>'+b+'</b>'),'no feast word problem for '+op);}
  T.ok(MON_ART['🌾']&&attackOf('🌾').n==='Straw storm','the Scarecrow King has no art or attack');
  go('world');await T.wait(150);T.ok(W.gates.harvest&&W.gates.harvest[0]===17&&W.T[15][17].gate==='harvest'&&window.MQ_GATE_ART&&MQ_GATE_ART.harvest,'the Harvest Hollow entrance is not left of Number Town');
  p.look.hat='pilgrim';T.ok(/fcc419/.test(heroSVG(p.look)),'the Pilgrim Hat does not draw');
 }],
['map life: tiny themed critters (butterflies, bubbles, embers, snow…) appear near the hero and never block',async function(){
  T.reset();const p=T.hero('Looker',3);state.cur=p.id;go('world');await T.wait(200);W.hx=BIOMES.forest.c[0]+1;W.hy=BIOMES.forest.c[1]+1;await T.wait(2500);
  T.ok(window.MQ_AMBIENT&&MQ_AMBIENT.count()>0&&MQ_AMBIENT.count()<=18,'no ambient life near the hero, or too much ('+(window.MQ_AMBIENT?MQ_AMBIENT.count():'none')+')');
 }],
['map scenery: every drawn forest tree, bush and plant loads, at least 3 of each kind, on the same tiles as before',async function(){
  const D=window.MQ_DECOR;T.ok(!!D,'decor.js is not loaded');if(!D)return;const S=D.SET.forest;
  T.ok(new Set(S.block.filter(k=>/pine|oak|birch/.test(k))).size>=3&&new Set(S.block.filter(k=>/bush|berry/.test(k))).size>=3&&new Set(S.deco).size>=3,'the forest has fewer than 3 kinds of trees, bushes or plants');
  for(const [z,S] of Object.entries(D.SET))T.ok(new Set(S.block).size>=3&&new Set(S.deco).size>=3&&S.block.concat(S.deco,S.extra).every(k=>D.ART[k]&&D.SZ[k]),'the '+z+' scenery set is short or names a missing drawing');
  {const C=D.SET.castle;T.ok(C&&new Set(C.block).size>=3&&new Set(C.deco).size>=3&&!C.block.concat(C.deco).some(k=>/grave|tomb|brick/.test(k)),'the Division Castle does not have 3+ kinds of castle scenery');}
  for(const k of Object.keys(D.ART)){const i=new Image();i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(D.ART[k]);await T.until(()=>i.complete,3000,k);T.ok(i.naturalWidth>0,'the '+k+' drawing does not load');}
  T.reset();const p=T.hero('Woods',3);state.cur=p.id;go('world');await T.wait(300);let n=0,blockOk=true;for(let y=0;y<WROWS;y++)for(let x=0;x<WCOLS;x++){const t=W.T[y][x];if(t.b==='forest'&&t.o){n++;if(!!t.block===!!t.deco)blockOk=false;}}
  T.ok(n>10&&blockOk,'forest scenery tiles changed (trees must still block, plants must not)');
