<!doctype html>
<meta charset="utf-8">
<title>Math Quest smoke test</title>
<!-- Run with: /usr/bin/python3 math-quest/tools/smoke.py   (starts a local server and a throwaway headless Chrome)
     The page loads the real game in a frame and drives it. It only runs on localhost with ?run=1, so opening it on the
     live site (where a family's real save lives) does nothing. -->
<style>body{font:15px system-ui;margin:20px}iframe{width:900px;height:650px;border:1px solid #999}.ok{color:#18794e}.bad{color:#c22}</style>
<h1 id="h">Math Quest smoke test</h1>
<pre id="log"></pre>
<pre id="result" hidden></pre>
<iframe id="game"></iframe>
<script>
(async function(){
const local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
if(!local||!/[?&]run=1/.test(location.search)){document.getElementById('log').textContent='Not running: this page only runs on localhost with ?run=1.';return;}
const log=document.getElementById('log'),results=[];
const frame=document.getElementById('game');
const boot=()=>new Promise(res=>{frame.onload=()=>res();frame.src='../index.html?smoke='+Date.now();});
await boot();
const W=frame.contentWindow;
/* the game finishes booting a moment after the page loads (it opens its local database first) */
for(let i=0;i<200;i++){let up=false;try{up=W.eval("typeof state!=='undefined'&&!!state&&Array.isArray(state.players)&&document.querySelector('#app').innerText.length>20");}catch(e){}if(up)break;await new Promise(r=>setTimeout(r,50));}
const errs=[];W.addEventListener('error',e=>errs.push(String(e.message||e)));W.addEventListener('unhandledrejection',e=>errs.push('rejection: '+String(e.reason&&e.reason.message||e.reason)));

/* helpers that live inside the game's own page, so tests can use its top-level let/const globals */
W.eval(`window.T={
 wait:ms=>new Promise(r=>setTimeout(r,ms)),
 until:async(f,ms,what)=>{const t=Date.now();while(!f()){if(Date.now()-t>(ms||8000))throw new Error('timed out waiting for '+(what||f));await new Promise(r=>setTimeout(r,40));}},
 ok:(c,m)=>{if(!c)throw new Error(m||'check failed');},
 clone:x=>JSON.parse(JSON.stringify(x)),
 hero:(name,grade,o)=>{const p=newPlayer(name||'Smoke',grade||3);p.id='p'+(name||'Smoke')+Math.random().toString(36).slice(2,6);p.setup=true;p.welcomed=true;p.skillChecked=true;p.tbOn=false;p.xplace=1;p.xp2=1;p.battles=20;p.level=8;p.coins=500;p.pets=PETS.slice(0,6).map(x=>x.id);p.pet=p.pets[0];Object.assign(p,o||{});state.players.push(p);migrate();const q=state.players.find(x=>x.id===p.id);q.care=q.care||{};q.care.intro=1;return q;},
 reset:()=>{try{closeModal();}catch(e){}const ov=document.getElementById('dqOv');if(ov)ov.remove();state.players=[];state.cur=null;state.deleted={};state.ownGroups={};state.gifts={};BASE={};try{MQ_VISIT.reset();}catch(e){}try{Discovery._leave();}catch(e){}curScreen='profiles';},
 answerAsk:(right)=>{const q=Daily._dbg.cur();if(!q)throw new Error('no question card open');String(right===false?q.answer+1:q.answer).split('').forEach(c=>Daily._k(c));Daily._k('go');Daily._next();}
};`);

const tests=[
['boot: version and add-ons',async function(){
  const v=await fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
  T.ok(v.v===APP_VER,'version.json '+v.v+' does not match APP_VER '+APP_VER);
  ['Adv','Cleanup','Lunch','Fade','PetCare','Mastery','Insights','Cave','Quartz','Lab','Inner','Music','Groups','Daily','Surprise','MQ_CONTENT','MORE_STORIES','ADV_TALES','CAVE_DATA','IS_DATA'].forEach(n=>T.ok(window[n],'add-on missing: '+n));
  T.ok(curScreen==='profiles','did not boot to the profiles screen');
  T.ok(document.querySelector('#app').innerText.length>20,'profiles screen is empty');}],

['questions: every skill at every level',async function(){
  const bad=[];OPS.forEach(op=>{for(let L=1;L<=maxLv(op);L++)for(let k=0;k<25;k++){let q;try{q=genQ(op,L);}catch(e){bad.push(op+' L'+L+' threw '+e.message);break;}
   if(!q||!(q.text||q.tpl)||!Number.isFinite(q.answer)){bad.push(op+' L'+L+' bad question '+JSON.stringify(q).slice(0,120));break;}}});
  T.ok(!bad.length,bad.slice(0,5).join(' | '));}],

['minerals: every one has a hammer-tap result, and the tests can tell them all apart',async function(){
  T.ok(CAVE_DATA.FOSSILS.every(f=>f.x&&['what','size','ate','where'].every(k=>typeof f.x[k]==='string'&&f.x[k].length>3)),'a fossil has no Museum exhibit card facts');
  const D=CAVE_DATA,ids=Object.keys(D.MIN),br=D.BREAKS.map(b=>b.id),band=h=>{const i=D.TOOLS.findIndex(t=>h<=t.h);return i<0?4:i;};
  T.ok(ids.every(k=>br.includes(D.MIN[k].br)),'a mineral has no hammer-tap result: '+ids.filter(k=>!br.includes(D.MIN[k].br)));
  const sig=(k,uv)=>{const m=D.MIN[k];return [band(m.h),m.s,!!m.f,!!m.m,!!m.w,m.br,uv?m.u||'':''].join('|');};
  T.ok(new Set(ids.map(k=>sig(k,true))).size===ids.length,'two minerals give the same result on every test, even with the UV lamp');
  T.ok(sig('mica')!==sig('gypsum')&&sig('feldspar')!==sig('olivine'),'mica/gypsum or feldspar/olivine still cannot be told apart');}],

['screens: every screen draws for a hero',async function(){
  T.reset();const p=T.hero('Screens',3);state.cur=p.id;p.sci=p.sci||{};p.sci.key=1;const bad=[];
  const skip=['rest','skillcheck','inner','cave','office','fade','truck','market','district']; /* these need their own setup; truck and district have their own tests */
  for(const s of Object.keys(SCREENS)){if(skip.includes(s))continue;try{go(s,s==='zone'?'forest':undefined);T.ok(curScreen===s,'ended on '+curScreen);T.ok(document.querySelector('#app').innerText.length>10,'empty');}catch(e){bad.push(s+': '+e.message);}try{closeModal();}catch(e){}}
  T.ok(!bad.length,bad.join(' | '));}],

['migrate: bare and old saves survive',async function(){
  T.reset();state.players.push({id:'pBare'},{id:'pOld',name:'Old',skill:{add:7},battles:12},null);migrate();
  const b=state.players.find(x=>x.id==='pBare'),o=state.players.find(x=>x.id==='pOld');
  T.ok(b&&b.look&&b.skill&&b.stats,'bare player was not filled in');T.ok(o.skill.add===7,'old save with progress was reset to '+o.skill.add);
  T.ok(state.players.every(x=>x&&x.id),'null player survived');}],

['battle: right answer, wrong answer, win',async function(){
  T.reset();const p=T.hero('Battle',3);state.cur=p.id;go('world');const b0=p.battles;
  /* "Flip it" questions (20% of the time) take two numbers, so answer through helpers that know both kinds */
  const right=()=>{const q=B.q;if(q.rev){B.input=String(q.ex[0][0]);B.input2=String(q.ex[0][1]);}else B.input=String(q.answer);answer();};
  const wrong=()=>{const q=B.q;if(q.rev){B.input='99999';B.input2='99999';}else B.input=String(q.answer+1);answer();};
  const ready=()=>B&&B.q&&!B.busy&&!fbOpen&&!document.querySelector('#modal.show');
  startBattle('forest',0);await T.until(ready,10000,'first question');B.mhp=B.mmax=5000;B.foes.forEach(f=>{f.hp=f.max=5000;}); /* a sturdy monster, so the test's right answers cannot end the battle early */
  const r0=p.stats.add.r,q1=B.q;right();
  await T.until(()=>ready()&&B.q!==q1,12000,'second question');T.ok(p.stats.add.r===r0+1,'right answer not counted');
  /* a helped answer: the hit lands, but no streak, coins or stats, and the problem is queued to come back */
  for(let k=0;k<6&&B.q.rev;k++){const q0=B.q;right();await T.until(()=>ready()&&B.q!==q0,12000,'a plain question');}
  {const qh=B.q,s0=B.streak,c0=p.coins,r1=p.stats.add.r,hp0=B.mhp,rv0=B.review.length;fleeBattle();T.ok(/Show me how/.test(document.querySelector('#modal').innerText),'help button missing');Daily.help();closeModal();
   T.ok(qh.hinted,'help did not mark the question');right();await T.until(()=>ready()&&B.q!==qh,12000,'question after a helped answer');
   T.ok(B.streak===s0,'helped answer raised the streak');T.ok(p.coins===c0,'helped answer paid coins');T.ok(p.stats.add.r===r1,'helped answer counted as right');
   T.ok(B.mhp<hp0,'helped answer did no damage');T.ok(B.review.length===rv0+1||B.q.again,'helped problem was not queued to come back');T.ok(p.missed[qh.text],'helped problem not recorded');}
  const w0=p.stats.add.w,n0=Object.keys(p.missed).length;wrong();await T.until(()=>fbOpen,8000,'wrong-answer card');
  T.ok(p.stats.add.w===w0+1&&Object.keys(p.missed).length===n0+1,'missed problem not stored');closeFeedback();
  await T.until(ready,12000,'question after a miss');
  B.mhp=1;B.foes.forEach(f=>{f.hp=1;});right();
  await T.until(()=>p.battles>b0,20000,'battle win to be counted');T.ok(p.battles===b0+1,'battle win not counted');}],

['sync: field merge, duplicate heroes, removed groups',async function(){
  T.reset();const p=T.hero('Sync',3);const base=T.clone(p);BASE[p.id]=T.clone(base);
  p.coins=base.coins+40;p.upd=Date.now();const r=T.clone(base);r.grade=4;r.upd=Date.now()-5000;
  mergeStates({v:1,players:[r],deleted:{},gifts:{},ownGroups:{},live:{}},false,null);
  const m=state.players.find(x=>x.id===p.id);T.ok(m.coins===base.coins+40,'local coins lost in merge');T.ok(m.grade===4,'remote grade change lost in merge');
  /* a merge must keep the very same hero object (and its inner objects), so work in progress is not written to a discarded copy */
  {T.reset();const h=T.hero('Keep',3);h.sci={rocks:1,trips:5};const sci0=h.sci,b0=T.clone(h);BASE[h.id]=T.clone(b0);h.coins+=7;h.sci.trips=6;h.upd=Date.now();
   const rem=T.clone(b0);rem.grade=5;rem.sci.rocks=2;rem.upd=Date.now()-4000;mergeStates({v:1,players:[rem],deleted:{},gifts:{},ownGroups:{},live:{}},false,null);
   T.ok(state.players.find(x=>x.id===h.id)===h,'the merge replaced the hero object');T.ok(h.sci===sci0,'the merge replaced an inner object');
   T.ok(h.grade===5&&h.sci.rocks===2&&h.sci.trips===6&&h.coins===b0.coins+7,'merged values are wrong: '+JSON.stringify([h.grade,h.sci,h.coins]));
   h.sci.key=1;T.ok(P()===null||true);T.ok(state.players.find(x=>x.id===h.id).sci.key===1,'a write after the merge was lost');}
  /* a stale device (no agreed copy, or an old one) must never take a Troll or Eagle visit away */
  {T.reset();const h=T.hero('Vis',3);h.troll={visits:2,hoard:[]};h.upd=Date.now()-9000;const rem=T.clone(h);rem.troll.visits=0;rem.eagle={visits:1,hoard:[]};rem.upd=Date.now();
   mergeStates({v:1,players:[rem],deleted:{},gifts:{},ownGroups:{},live:{}},false,null);T.ok(h.troll.visits===2&&h.eagle.visits===1,'a visit count went down with no agreed copy: '+JSON.stringify([h.troll,h.eagle]));
   BASE[h.id]=T.clone(h);const r2=T.clone(h);r2.troll.visits=1;r2.upd=Date.now()+50;mergeStates({v:1,players:[r2],deleted:{},gifts:{},ownGroups:{},live:{}},false,null);T.ok(h.troll.visits===2,'a visit count went down in a field merge');}
  T.reset();const weak=T.hero('Mika',3,{level:2,battles:3});const strong=T.clone(weak);strong.id='pCloudStrong';strong.level=9;strong.battles=80;
  const cloud={v:1,players:[strong],deleted:{},gifts:{},ownGroups:{'AAA-BBB-CCC-11':'s1','DDD-EEE-FFF-22':''},live:{}};
  state.ownGroups={'DDD-EEE-FFF-22':'s2'};mergeStates(T.clone(cloud),true,null);
  T.ok(state.players.length===1&&state.players[0].id==='pCloudStrong','join did not keep only the stronger hero');
  const c2=T.clone(cloud);c2.players.push(T.clone(weak));mergeStates(c2,false,null);
  T.ok(state.players.length===1,'weaker duplicate came back on the next sync');
  T.ok(state.ownGroups['DDD-EEE-FFF-22']==='','removed class group came back');T.ok(state.ownGroups['AAA-BBB-CCC-11']==='s1','other class group was lost');}],

['sync: an answer given while the save is uploading is not lost',async function(){
  T.reset();const h=T.hero('Race',3,{coins:100});const real={get:cloudGet,put:cloudPut,code:cloud.code};let store=null,gate=null;
  cloudGet=async()=>store?T.clone(store):null;
  cloudPut=(code,obj)=>{const data=JSON.stringify(obj);return (async()=>{if(gate)await gate.p;store=JSON.parse(data);return data;})();};
  try{cloud.code='SMOKE-TEST-ONLY';cloud.busy=false;BASE={};baseReady=Promise.resolve();
   await syncNow();T.ok(store&&store.players.find(x=>x.id===h.id).coins===100,'first upload failed');
   P;const me=()=>state.players.find(x=>x.id===h.id);me().coins=110;stampChanges(false);
   let open;gate={p:new Promise(r=>{open=r;})};const s2=syncNow();await T.wait(60);me().coins=120;stampChanges(false);open();gate=null;await s2;
   T.ok(store.players.find(x=>x.id===h.id).coins===110,'the upload did not carry the first change');
   await syncNow();T.ok(me().coins===120,'an answer given during the upload was thrown away: coins went back to '+me().coins);
   T.ok(store.players.find(x=>x.id===h.id).coins===120,'the later change never reached the cloud');
  }finally{cloudGet=real.get;cloudPut=real.put;cloud.code=real.code;clearTimeout(cloud.timer);cloud.busy=false;cloud.again=false;BASE={};}}],

['adventure: fix-it, focus battle, leave, reward',async function(){
  T.reset();let p=T.hero('Adv',3);state.cur=p.id;p.stats.div={r:10,w:10};p.stats.add={r:30,w:2};
  p.missed={'8 + 7':{n:2,a:15,op:'add',last:'2026-09-28',fixed:0,q:{op:'add',L:4,a:8,b:7,answer:15,text:'8 + 7'}}};
  go('map');T.ok(document.querySelector('.tad-card'),'Adventure card missing from the Quest Board');
  p.missed['□ − □ = 15']={n:5,a:15,op:'sub',last:'2026-10-01',fixed:0,q:{op:'sub',L:4,answer:15,text:'□ − □ = 15'}};
  T.ok(!Daily._dbg.fixList(p).some(q=>/□/.test(q.text)),'a Flip-it problem (which needs two numbers) was offered in Fix-it');
  /* an online sync in the middle of the questions swaps the player for a fresh copy; progress must land on the new one */
  Daily.fix();T.answerAsk();{const i=state.players.indexOf(p);state.players[i]=T.clone(p);}T.answerAsk();T.answerAsk();
  p=P();T.ok(p.tad&&p.tad.s===1,'fix-it progress was lost when the hero was refreshed by a sync');T.ok(p.missed['8 + 7'].fixed===1,'missed problem not marked');closeModal();
  T.ok(p.tad.cur&&p.tad.cur.zid==='castle','focus battle is not the weakest skill: '+JSON.stringify(p.tad.cur));
  Daily.battle();await T.until(()=>curScreen==='battle'&&B&&B.q&&!B.busy,10000,'focus battle');T.ok(B.foes.length===1&&B.mmax<110,'focus battle is not shortened');
  fleeBattle();T.ok(/Show me how/.test(document.querySelector('#modal').innerText),'help button missing');doFlee();T.ok(p.tad.owe&&p.tad.owe.zid==='castle','left monster not remembered');
  p.tad.s=2;const c0=p.coins;Daily.take('coins');T.ok(p.tad.s===3&&p.tad.stars===1&&p.coins===c0+30,'reward not given');closeModal();}],

['pets and camp: trick, no math to send or unpack, trail pack, loot',async function(){
  T.reset();const p=T.hero('Camp',3);state.cur=p.id;go('pethome');try{closeModal();}catch(e){}
  T.ok(document.getElementById('tadTrick'),'trick panel missing');const pd=petData(p,p.pet),x0=pd.xp;Daily.trick();const card=document.getElementById('dqCard');Daily._k('7');T.ok(document.getElementById('dqCard')===card&&document.querySelector('#dqOv .dq-in').textContent==='7','a number press redrew the whole question card');Daily._k('del');
  T.answerAsk();T.ok(pd.xp>x0&&p.tad.tr===1,'trick gave no pet growth');
  p.adv.crew=[p.pets[1],p.pets[2]];p.adv.len='short';p.adv.trip=null;p.adv.packB=1;go('camp');Adv.send();
  await T.until(()=>p.adv.trip,5000,'trip to start');T.ok(!document.getElementById('dqOv'),'sending pets to camp asked a math question');T.ok(p.adv.trip.pack===1&&!p.adv.packB,'the Trail pack did not add its extra find: '+p.adv.trip.pack);
  p.adv.trip.end=Date.now()-1000;const res=Adv._fin();T.ok(res&&res.sacks.length===2,'no sacks came home');
  T.ok(res.sacks.every(s=>Array.isArray(s.items)),'sack without items');
  try{Adv.openAll();}catch(e){}await T.wait(50);T.ok(!document.getElementById('dqOv'),'opening the sacks asked a math question');try{closeModal();}catch(e){}}],

['village plaza: every building is on the plaza, reachable and not crowded',async function(){
  T.reset();const p=T.hero('Plaza',3);state.cur=p.id;window.MQ_TRUCK_BETA=true;window.MQ_DISTRICT_BETA=true;window.MQ_BP_BETA=true;p.sci=p.sci||{};p.sci.key=1;W=null;go('world');await T.wait(150);
  const bad=[];NPCS.forEach(n=>{const t=W.T[n.y][n.x];if(!t.plaza)bad.push(n.id+' is off the plaza');if(t.npc!==n.id)bad.push(n.id+' is not on its tile');
   if(![[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>wWalk(n.x+dx,n.y+dy)))bad.push(n.id+' cannot be reached');
   NPCS.forEach(m=>{if(m!==n&&Math.abs(m.x-n.x)<=1&&Math.abs(m.y-n.y)<=1)bad.push(n.id+' touches '+m.id);});});
  PLAZA_DECOR.flat().forEach(([e,x,y])=>{if(!W.T[y][x].plaza||W.T[y][x].npc)bad.push('plaza decoration at '+x+','+y+' is misplaced');});
  T.ok(!NPCS.some(n=>n.id==='school'||n.id==='board'),'a menu-only building is back on the plaza');go('map');T.ok(document.querySelector('.qb-lead'),'Leaderboard button missing from the Quest Board');go('world');await T.wait(100);T.ok(/Quest Board/.test(document.querySelector('.wtop').innerText),'Quest Board button missing from the World screen');p.vil=p.vil||{};p.vil.portal=2;go('world');await T.wait(50);T.ok(/Quest Board ★2/.test(document.querySelector('.wtop').innerText),'Quest Portal stars missing from the Quest Board button');
  {p.sci.rocks=0;p.sci.lab={ok:{}};go('lab');let t=document.querySelector('#app').innerText;T.ok(/one free ride today/.test(t),'the Lab does not offer the key\'s free ride');
   p.sci.lab.freeDay=dayKey();go('lab');t=document.querySelector('#app').innerText;T.ok(/used today's free ride/.test(t)&&/you have none/.test(t)&&/Step 1/.test(t)&&/Buy a rock/.test(t),'the Lab does not say a rock is needed after the free ride');
   p.sci.rocks=1;go('lab');t=document.querySelector('#app').innerText;T.ok(!/you have none/.test(t)&&/This ride uses a rock/.test(t),'the Lab is wrong when the hero has a rock and no free ride');
   p.sci.lab.freeDay='';p.sci.trips=5;p.cave={trips:5,stats:{dug:12}};const r0=p.sci.rocks;go('lab');Lab.down();T.ok(curScreen==='cave'&&p.sci.rocks===r0&&p.sci.lab.freeDay===dayKey()&&p.sci.trips===6,'the free ride did not start a trip, or it spent a rock');
   await T.wait(300);T.ok(/ride straight down/.test(document.querySelector('#app').innerText+document.body.innerText),'no welcome for a trip without a rock');go('world');try{closeModal();}catch(e){}}
  go('world');await T.wait(50);wNpc('gym');T.ok(curScreen==='mastery'&&/Fact Gym/.test(document.querySelector('#app').innerText),'the Fact Gym building did not open the fact grid');go('map');T.ok(!document.querySelector('.mq-hc'),'Mastery card is still on the Quest Board');go('world');await T.wait(50);
  T.ok(!document.querySelector('.topbar button.tb-hero')&&document.querySelectorAll('.topbar [onclick*="backpack"]').length===1,'the top bar has more than one way into the Bag');
  {const z=ZONES.find(x=>x.id==='garden');T.ok(zoneTag(p,z)==='','an untouched world shows progress');p.progress.garden=[3,2,1,0,0,0];T.ok(zoneTag(p,z)===' 3/6','world progress tag is wrong: '+zoneTag(p,z));p.progress.garden=[3,3,3,3,3,3];T.ok(/🥉 0\/6/.test(zoneTag(p,z)),'medal tag is wrong: '+zoneTag(p,z));}
  T.ok(wWalk(W.hx,W.hy),'hero starts on a blocked tile');T.ok(!bad.length,bad.slice(0,4).join(' | '));window.MQ_TRUCK_BETA=false;delete window.MQ_DISTRICT_BETA;W=null;}],

['food truck: hidden unless the preview switch is on; then card, screens and map spot',async function(){
  T.reset();const p=T.hero('Truck',3,{battles:40});state.cur=p.id;
  window.MQ_TRUCK_BETA=false;try{localStorage.removeItem('mqTruckPreview');localStorage.setItem('mqTruckBeta','1');}catch(e){}
  T.ok(!Truck.flag(),'truck shows without the preview switch (an old preview must not count)');go('map');T.ok(!document.querySelector('.tk-hc'),'truck card shown while hidden');go('world');await T.wait(100);T.ok(W.T[17][25].npc!=='truck','truck on the map while hidden');
  window.MQ_TRUCK_BETA=true;go('map');T.ok(document.querySelector('.tk-hc'),'truck card missing from the Quest Board');
  Truck.open();T.ok(curScreen==='truck'&&document.querySelector('#app').innerText.length>40,'truck screen is empty');try{closeModal();}catch(e){}
  go('market');T.ok(curScreen==='market'&&document.querySelector('#app').innerText.length>20,'market screen is empty');
  go('world');await T.wait(100);const t=W.T[17][25];T.ok(t.npc==='truck','truck is not on the map');
  T.ok([[21,20],[23,20],[22,19],[22,21]].some(([x,y])=>W.T[y]&&W.T[y][x]&&!W.T[y][x].block&&!W.T[y][x].water),'truck cannot be reached on the map');
  wNpc('truck');T.ok(curScreen==='truck','tapping the truck on the map did not open it');window.MQ_TRUCK_BETA=false;}],

['discovery district: hidden unless the preview switch is on, then walkable',async function(){
