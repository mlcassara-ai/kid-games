const clockH = () => S.clock == null ? 7 : S.clock;

function dayPart(){ const h = clockH(); return h >= 20 || h < 5 ? "night" : h < 7 ? "dawn" : h < 17 ? "day" : "dusk"; }
function timeIcon(){ return { night:"🌙", dawn:"🌅", day:"☀️", dusk:"🌇" }[dayPart()]; }

const dayKey = (d = new Date()) => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
function seeded(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function fishOfDay(){
  const pool = [...new Set(LAKES.filter(l => S.lakes.includes(l.id) && (!l.ocean || S.saltRod)).flatMap(l => l.fish))].filter(id => !SPECIES[id].legend);
  const r = seeded("fotd" + dayKey()); return pool[Math.floor(r() * pool.length)] || "bluegill";
}

// Pearl runs the bait shop. Every day she has 3 little jobs; finish all 3 for a mystery gift.
const JOB_KINDS = ["count", "species", "lake", "bait", "night", "size", "release", "troll"];
function makeJobs(){
  const r = seeded("jobs" + dayKey() + ((LL.player() || {}).id || "")), pick = a => a[Math.floor(r() * a.length)];
  const lakes = LAKES.filter(l => S.lakes.includes(l.id) && (!l.ocean || S.saltRod)), sp = [...new Set(lakes.flatMap(l => l.fish))].filter(id => !SPECIES[id].legend && SPECIES[id].rar >= 4);
  const baits = S.baits.filter(k => BAITS[k] && k !== "bare"), kinds = JOB_KINDS.filter(k => k !== "troll" || S.boatOwn || S.coins > 30), list = [];
  while (list.length < 3){
    const k = pick(kinds); if (list.some(j => j.k === k)) continue;
    let j;
    if (k === "count"){ const n = 5 + Math.floor(r() * 4); j = { k, need:n, text:"Catch " + n + " fish", pay:20 }; }
    if (k === "species"){ const id = pick(sp); j = { k, id, need:1, text:"Catch a " + SPECIES[id].name, pay:25 }; }
    if (k === "lake"){ const L = pick(lakes); j = { k, id:L.id, need:3, text:"Catch 3 fish at " + L.name, pay:20 }; }

const TUNES = { day: { bpm: 76, chords: [[48,52,55],[45,48,52],[41,45,48],[43,47,50]], scale: [60,62,64,67,69,72,74,76,79] },

function pluck(t, n, vol, dur){ const ac = AC, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = "triangle"; o.frequency.value = midiHz(n); f.type = "lowpass"; f.frequency.value = 2400;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(BUS.music); o.start(t); o.stop(t + dur + .05); }

  o.type = "sine"; o.frequency.value = midiHz(n); o.detune.value = det; g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.022, t + .9); g.gain.linearRampToValueAtTime(.0001, t + dur);

function musicTick(){
  if (!AC || !BUS || AV.music <= 0 || !S.sound || AC.state !== "running"){ mus.next = 0; return; }
  const tune = state === "fishing" && trip && isNight() ? TUNES.night : TUNES.day, eighth = 60 / tune.bpm / 2;
  if (mus.next < AC.currentTime) mus.next = AC.currentTime + .1;
  while (mus.next < AC.currentTime + .7){
    const t = mus.next, st = mus.step % 16, ch = tune.chords[Math.floor(mus.step / 16) % 4];
    if (st === 0){ pad(t, ch.map(n => n + 12), eighth * 16); pluck(t, ch[0] - 12, .12, 1.4); }
    if (st === 8) pluck(t, ch[2] - 12, .09, 1.1);
    if (st % 2 === 0 && (st === 0 || Math.random() < (tune === TUNES.night ? .32 : .5))){
      mus.mel = clamp(mus.mel + Math.round(rand(-2.4, 2.4)), 0, tune.scale.length - 1); pluck(t, tune.scale[mus.mel], .07, .9); }
    mus.step++; mus.next += eighth;
  }
}

const FISH_LOOK = {                          // snout height, forehead fullness, where the body is deepest, tail-stem height, belly depth
  sun:      { sy:.06, a1:.62, pk:-.02, ped:.2,  bd:1 },
  bass:     { sy:.1,  a1:.22, pk:.04,  ped:.19, bd:.95 },
  trout:    { sy:.06, a1:.2,  pk:.0,   ped:.2,  bd:.92 },

  carp:     { sy:.2,  a1:.4,  pk:.06,  ped:.23, bd:.95 },

function depthOf(sp){ return sp.depth || (sp.shape === "ray" ? .95 : sp.shape === "flat" ? .42 : sp.shape === "shark" ? .17 : sp.shape === "guitar" ? .14 : sp.shape === "sun" ? (sp.tall ? .44 : .5) : sp.shape === "bass" ? .3 : sp.shape === "trout" ? .25 : sp.shape === "cat" ? .23 : sp.shape === "carp" ? .34 : .15); }

  c.beginPath();

    c.moveTo(bl*1.34, h*.25);
    c.bezierCurveTo(bl*1.15, -h*.2, bl*.8, -h*.95, bl*.35, -h*.98);
    c.bezierCurveTo(-bl*.2, -h*1.02, -bl*.7, -h*.55, -bl*.97, -h*.2);

    c.bezierCurveTo(bl*.95, snY - h*(.3 + k.a1*.5), pk + bl*(.3 + k.a1*.35), -h, pk, -h);          // forehead up to the back

  c.fillStyle = g;

  else if (sp.mark === "stripe"){ const sg = c.createLinearGradient(0, -h*.22, 0, h*.12); sg.addColorStop(0, "rgba(235,245,250,0)"); sg.addColorStop(.5, sp.markC); sg.addColorStop(1, "rgba(235,245,250,0)"); c.fillStyle = sg; c.fillRect(-bl*1.1, -h*.22, bl*2.1, h*.34); }
  else if (sp.mark === "ystripe"){ const sg = c.createLinearGradient(0, -h*.25, 0, h*.15); sg.addColorStop(0, "rgba(240,200,50,0)"); sg.addColorStop(.5, sp.markC); sg.addColorStop(1, "rgba(240,200,50,0)"); c.fillStyle = sg; c.fillRect(-bl*1.1, -h*.25, bl*2.3, h*.4); }
  else if (sp.mark === "streaks"){ c.lineWidth = Math.max(.6, L*.008); for (let i = 0; i < 16; i++){ const x0 = -bl*.95 + i*bl*.12; c.beginPath(); c.moveTo(x0, -h); c.lineTo(x0 + bl*.22, h*.35); c.stroke(); } }
  else if (sp.mark === "stripes"){ c.lineWidth = Math.max(1, L*.02); for (let i = 0; i < 8; i++){ const x0 = -bl*.6 + i*bl*.2; c.beginPath(); c.moveTo(x0, -h); c.lineTo(x0 - bl*.45, -h*.15); c.stroke(); } }
  else if (sp.mark === "spots2"){ for (const [sx, sy] of [[-bl*.02, -h*.7], [-bl*.34, -h*.6]]){ c.beginPath(); c.ellipse(sx, sy, L*.04, L*.03, 0, 0, 7); c.fill(); } }
  else if (sp.mark === "calico"){ for (let i = 0; i < 22; i++){ c.beginPath(); c.ellipse(-bl*.85 + prand(i, seed)*bl*1.6, -h*.9 + prand(i+30, seed)*h*1.3, L*.035*(.5+prand(i+7, seed)), L*.025*(.5+prand(i+9, seed)), prand(i+3, seed)*3, 0, 7); c.fill(); } }
  else if (sp.mark === "trout"){
    const pk = c.createLinearGradient(0, -h*.35, 0, h*.35);
    pk.addColorStop(0, "rgba(226,112,135,0)"); pk.addColorStop(.5, "rgba(226,112,135,.8)"); pk.addColorStop(1, "rgba(226,112,135,0)");
    c.fillStyle = pk; c.fillRect(-bl*1.1, -h*.35, bl*2.3, h*.7);
    c.fillStyle = "rgba(25,35,25,.75)"; for (let i = 0; i < 60; i++){ c.beginPath(); c.arc(-bl*1.05 + prand(i, seed)*bl*2, -h + prand(i+70, seed)*dn(1.3), Math.max(.7, L*.011), 0, 7); c.fill(); }
  }
  else if (sp.mark === "scutes"){
    c.fillStyle = "rgba(235,230,215,.85)";
    for (const row of [-.52, .05, .55]) for (let i = 0; i < 11; i++){ const sx = -bl*.9 + i*bl*.2; c.beginPath(); c.moveTo(sx - 3, h*row + 2); c.lineTo(sx, h*row - 3); c.lineTo(sx + 3, h*row + 2); c.closePath(); c.fill(); }
  }
  // scales (not on catfish or sturgeon skin)
  if (sp.shape !== "cat" && sp.shape !== "sturgeon" && L > 26){
    const s = sp.mark === "scales" ? Math.max(4, L*.07) : Math.max(2.4, L*.034);
    c.lineWidth = sp.mark === "scales" ? 1 : .6;
    for (let yy = -h, row = 0; yy < h; yy += s*.62, row++){
      for (let xx = -bl*1.02 + (row % 2) * s/2; xx < bl*.55; xx += s){
        c.strokeStyle = sp.mark === "scales" ? "rgba(90,55,15,.4)" : "rgba(0,0,0,.13)";
        c.beginPath(); c.arc(xx, yy, s/2, .15*Math.PI, .85*Math.PI); c.stroke();
        c.strokeStyle = "rgba(255,255,255,.08)";
        c.beginPath(); c.arc(xx, yy - .6, s/2, .25*Math.PI, .75*Math.PI); c.stroke();
      }
    }
  }
  // lateral line
  c.strokeStyle = "rgba(255,255,255,.22)"; c.lineWidth = Math.max(.6, L*.008);
  c.beginPath(); c.moveTo(bl*.42, -h*.42); c.bezierCurveTo(bl*.1, -h*.55, -bl*.4, -h*.35, -bl*.95, -h*.02); c.stroke();
  // light from above: glossy sheen on the back, soft shadow under the belly
  const hl = c.createRadialGradient(bl*.25, -h*.5, 1, bl*.2, -h*.4, dn(1.4));
  hl.addColorStop(0, "rgba(255,255,255,.32)"); hl.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = hl; c.fillRect(-bl*1.1, up(1.1), bl*2.6, dn(2.2));
  const sh = c.createLinearGradient(0, h*.4, 0, h);
  sh.addColorStop(0, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,.18)");
  c.fillStyle = sh; c.fillRect(-bl*1.1, h*.4, bl*2.6, h*.7);
  // head & gill cover: a shade darker/greener with a soft edge
  const hx0 = sp.shape === "sturgeon" ? bl*.5 : bl*.42;
  const hg = c.createLinearGradient(hx0 - h*.4, 0, hx0 + h*.1, 0);
  hg.addColorStop(0, "rgba(0,0,0,.14)"); hg.addColorStop(1, "rgba(0,0,0,0)");
  c.fillStyle = hg; c.beginPath(); c.ellipse(hx0 - h*.15, 0, h*.12, h*.9, 0, 0, 7); c.fill();
  if (sp.cheek){ const ch = c.createRadialGradient(bl*.72, h*.25, 1, bl*.72, h*.25, h*.55); ch.addColorStop(0, rgbaOf(sp.cheek, .55)); ch.addColorStop(1, rgbaOf(sp.cheek, 0)); c.fillStyle = ch; c.fillRect(bl*.2, -h*.3, bl, dn(1.2)); }
  c.restore();

  // body outline (soft)
  bodyPath(c, sp, bl, h); c.strokeStyle = "rgba(0,0,0,.28)"; c.lineWidth = Math.max(.7, L*.01); c.stroke();
  // gill cover edge
  c.strokeStyle = "rgba(0,0,0,.32)"; c.lineWidth = Math.max(.8, L*.012);
  c.beginPath(); c.moveTo(hx0 + h*.05, -h*.78); c.quadraticCurveTo(hx0 - h*.28, -h*.1, hx0 + h*.02, h*.75); c.stroke();
  // ear flap (sunfish)
  if (sp.ear){
    c.fillStyle = sp.ear; c.beginPath(); c.ellipse(hx0 - h*.02, -h*.12, L*.05, L*.035, -.2, 0, 7); c.fill();
    if (sp.earEdge){ c.strokeStyle = sp.earEdge; c.lineWidth = Math.max(1, L*.012); c.beginPath(); c.ellipse(hx0 - h*.02, -h*.12, L*.05, L*.035, -.2, -1.2, 1.6); c.stroke(); }
  }
  // pectoral fin (near side, over the body)
  fin(c, [hx0 - h*.08, h*.05], [hx0 - h*.02, h*.35], [[hx0 - bl*.28, h*.2 + w*h*.1], [hx0 - bl*.36, h*.42], [hx0 - bl*.2, h*.55]], fc, 6, .7);
  // eye
  const er = Math.max(1.6, L*.028), ex = sp.shape === "sturgeon" ? bl*.62 : sp.shape === "cat" ? bl*.72 : bl*.66, ey = -h*.3;
  const ir = c.createRadialGradient(ex, ey, er*.2, ex, ey, er);
  ir.addColorStop(0, sp.eye || "#b98a2e"); ir.addColorStop(1, shade(sp.eye || "#b98a2e", -.45));
  c.fillStyle = ir; c.beginPath(); c.arc(ex, ey, er, 0, 7); c.fill();
  c.fillStyle = "#050505"; c.beginPath(); c.arc(ex + er*.12, ey, er*.58, 0, 7); c.fill();
  c.fillStyle = "rgba(255,255,255,.85)"; c.beginPath(); c.arc(ex + er*.35, ey - er*.3, Math.max(.6, er*.22), 0, 7); c.fill();
  // mouth
  c.strokeStyle = "rgba(35,20,15,.75)"; c.lineWidth = Math.max(.8, L*.012); c.beginPath();
  if (sp.shape === "bass"){ c.moveTo(bl*1.0, h*.02); c.quadraticCurveTo(bl*.85, h*.2, bl*.6, h*.2); }
  else if (sp.shape === "cat"){ c.moveTo(bl*1.0, h*.18); c.lineTo(bl*.82, h*.22); }
  else if (sp.shape === "sturgeon"){ c.moveTo(bl*1.0, h*.62); c.lineTo(bl*.88, h*.62); }
  else { c.moveTo(bl*.99, h*.12); c.lineTo(bl*.86, h*.2); }
  c.stroke();
  // barbels / whiskers
  if (sp.shape === "cat" || sp.shape === "carp" || sp.shape === "sturgeon"){
    c.strokeStyle = sp.shape === "cat" ? "rgba(35,35,35,.9)" : "rgba(90,70,45,.85)"; c.lineWidth = Math.max(.8, L*.01); c.lineCap = "round";
    if (sp.shape === "cat"){
      const len = L*.26;
      for (let i = 0; i < 3; i++){ c.beginPath(); c.moveTo(bl*.95, h*.2); c.quadraticCurveTo(bl*.95 + len*.5, h*.3 + i*h*.35, bl*.95 + len*.25 - i*len*.15, h*.7 + i*h*.45); c.stroke(); }
      c.beginPath(); c.moveTo(bl*.92, -h*.15); c.quadraticCurveTo(bl*1.2, -h*.7, bl*1.15, up(1.05)); c.stroke();
    } else if (sp.shape === "carp"){
      c.beginPath(); c.moveTo(bl*.97, h*.15); c.quadraticCurveTo(bl*1.05, h*.3, bl*.98, h*.42); c.stroke();
    } else {
      for (let i = 0; i < 4; i++){ c.beginPath(); c.moveTo(bl*1.08 - i*bl*.03, h*.45); c.lineTo(bl*1.08 - i*bl*.03, h*.75); c.stroke(); }
    }
  }
  if (sp.legend){ // crown
    c.fillStyle = "#ffd23f"; c.strokeStyle = "#b8860b"; c.lineWidth = 1.5; const cx = bl*.25, cy = up(1.05), cw = L*.2;
    c.beginPath(); c.moveTo(cx-cw/2, cy); c.lineTo(cx-cw/2, cy-cw*.5); c.lineTo(cx-cw/4, cy-cw*.25); c.lineTo(cx, cy-cw*.6); c.lineTo(cx+cw/4, cy-cw*.25); c.lineTo(cx+cw/2, cy-cw*.5); c.lineTo(cx+cw/2, cy); c.closePath(); c.fill(); c.stroke();
  }
}

// Painted fish are cached as small images (5 tail positions each) so the game stays smooth on phones.
const spriteCache = new Map();
const WIGS = [-1, -.5, 0, .5, 1];
function fishSprite(sp, L, frame){
  const Lq = L < 80 ? Math.round(L/2)*2 : Math.round(L/4)*4;
  const key = (sp.boss ? "B:" : "") + sp.name + "|" + Lq + "|" + frame;
  let s = spriteCache.get(key);
  if (s) return s;
  const h = Lq * shapeHr(sp) / 2 * 1.6;
  const w = Lq * 1.5 + 10, hh = Math.max(h * (sp.shape === "sturgeon" ? 5 : 3.6), Lq * .45) + 10;
  const k = 2;                                           // draw at 2x for crisp retina
  const cv2 = document.createElement("canvas"); cv2.width = Math.ceil(w*k); cv2.height = Math.ceil(hh*k);
  const c = cv2.getContext("2d"); c.scale(k, k); c.translate(w*.52, hh/2);
  paintFish(c, sp, Lq, WIGS[frame] * .9, false);
  s = { cv: cv2, w, hh, ox: w*.52, oy: hh/2 };
  if (spriteCache.size > 700) spriteCache.clear();
  spriteCache.set(key, s);
  return s;
}
function drawFish(ctx, sp, x, y, L, dir, t, opt={}){
  ctx.save(); ctx.translate(x, y); ctx.scale(opt.face != null ? (Math.abs(opt.face) < .14 ? .14 * Math.sign(opt.face || 1) : opt.face) : dir, 1);   // a turning fish looks thin mid-turn
  if (opt.rot) ctx.rotate(opt.rot);
  if ((sp.legend || sp.boss || sp.glow) && !opt.silhouette){               // glowing aura
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, L*.8);
    const ac = sp.glow || (sp.boss ? "255,95,70" : "255,225,110");
    g.addColorStop(0, "rgba(" + ac + ",.45)"); g.addColorStop(1, "rgba(" + ac + ",0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, L*.8, 0, Math.PI*2); ctx.fill();
  }
  if (opt.silhouette){ paintFish(ctx, sp, L, 0, true); ctx.restore(); return; }
  const beat = opt.beat || 1, ang = t*9*beat + (opt.phase || 0), ph = Math.sin(ang);
  const frame = Math.max(0, Math.min(4, Math.round((ph + 1) * 2)));
  const s = fishSprite(sp, L, frame);
  const k = L / (L < 80 ? Math.round(L/2)*2 : Math.round(L/4)*4);
  ctx.scale(k * (1 + ph*.015), k);                              // tiny body flex as it swims
  const amp = (opt.bend == null ? 1 : opt.bend) * s.hh * .045;
  if (amp > .25 && L > 26 && !opt.rot && sp.shape !== "ray"){
    // swim wave: the body is drawn in thin slices, each nudged up or down, more toward the tail
    const N = L > 90 ? 12 : 8, sw = s.w / N, pxw = s.cv.width / N;
    for (let i = 0; i < N; i++){
      const n = 1 - (i + .5) / N, off = amp * n * n * Math.sin(ang - n * 3.2);
      ctx.drawImage(s.cv, i * pxw, 0, pxw + 1, s.cv.height, -s.ox + i * sw, -s.oy + off, sw + .6, s.hh);
    }
  } else ctx.drawImage(s.cv, -s.ox, -s.oy, s.w, s.hh);
  ctx.restore();
}

function fishIcon(id, w=150, h=80, silhouette=false){
  const scale = 2;
  const c = document.createElement("canvas"); c.width = w*scale; c.height = h*scale;
  const cx = c.getContext("2d"), sp = typeof id === "string" ? SPECIES[id] : id;
  cx.scale(scale, scale);
  const ext = .42 * depthOf(sp) + (sp.shape === "sturgeon" ? .22 : .16) + (sp.legend ? .06 : 0);   // half-height of fish + fins, per unit length
  const L = Math.min(w*.62, h*.47/ext);
  cx.translate(w*.52, h*.52);
  paintFish(cx, sp, L, 0, silhouette);
  return c;
}

// =====================================================================
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const wrap = document.getElementById("wrap");
function layout(){
  const iw = window.innerWidth, ih = window.innerHeight, a = iw / ih;
  if (a >= SW / 720){ H = ih < 520 ? 600 : 720; W = Math.round(clamp(H * a, SW, 1280)); }   // wide screens: a wider lake
  else { W = SW; H = Math.round(Math.min(1040, SW / a)); }                                // tall phones: more water
  const s = Math.min(iw/W, ih/H);
  const w = W*s, h = H*s;
  wrap.style.width = w+"px"; wrap.style.height = h+"px"; wrap.style.fontSize = (16*s)+"px";
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = Math.round(W*s*dpr); cv.height = Math.round(H*s*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
window.addEventListener("resize", layout); layout();

const keys = {};
let pointerX = null, pointerDown = false;
const typing = e => { const t = e.target; return !!t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable); };   // typing in a box: the keys are for the box, not the reel
window.addEventListener("keydown", e => {
  if (typing(e)) return;
  keys[e.code] = true;
  if (["Space","ArrowDown","ArrowUp","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if (!e.repeat && (e.code==="Space" || e.code==="ArrowUp")) reelPress();
});
window.addEventListener("keyup", e => { if (typing(e)) return; keys[e.code] = false; if (e.code==="Space" || e.code==="ArrowUp") reelRelease(); });
function toGameX(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
cv.addEventListener("pointermove", e => { pointerX = toGameX(e); });
cv.addEventListener("pointerdown", e => { pointerDown = true; pointerX = toGameX(e); try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
window.addEventListener("pointerup", e => { pointerDown = false; if (e.pointerType !== "mouse") pointerX = null; });
window.addEventListener("pointercancel", () => { pointerDown = false; pointerX = null; });
cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") pointerX = null; });
let btnHeld = false;
const holding = () => btnHeld;
const reelBtn = document.getElementById("reelBtn");
reelBtn.addEventListener("pointerdown", e => { e.preventDefault(); try{ reelBtn.setPointerCapture(e.pointerId); }catch(_){} reelPress(); });
["pointerup","pointercancel","lostpointercapture"].forEach(ev => reelBtn.addEventListener(ev, reelRelease));
reelBtn.addEventListener("contextmenu", e => e.preventDefault());
function reelPress(){
  if (state !== "fishing" || !trip) return;
  btnHeld = true; reelBtn.classList.add("down");
  const T = trip;
  if (T.wild && T.wild.mode === "raid" && T.wild.stage === "warn") T.wild.taps++;
  if (T.nibble){ setHook(); return; }
  if (T.phase === "troll"){ if (T.strike) trollHook(); return; }
  if (T.phase === "ready") doCast();
  else if (T.phase === "drop") startReel("Reeling up!");
  else if (T.phase === "reel" && !T.autoUp) crank();
}
function reelRelease(){ btnHeld = false; reelBtn.classList.remove("down"); }
// how much line one crank brings in: less for heavier fish, a bit more on deeper lakes
function fishLb(f){ return weightLb(f.sp, f.inches); }
function crank(){
  const T = trip;
  let ft = 3 + T.lake.depth/40;                                               // empty hook
  if (T.caught.length) ft = clamp(3.6 / (1 + Math.sqrt(fishLb(T.caught[0]))*.3), 1.5, 3.2) * (.7 + T.lake.depth/150);
  T.pending += ft * upVal("reel") * PPF;
}

// A "visit" = you stay at one lake, casting again and again, until you leave.

  infoModal(`<div style="font-size:3.5em">🌊🎣</div><h3>You need a Saltwater Rod & Reel</h3>
    <p>Ocean fish are big and strong, and salt water rusts a lake reel. Buy a <b>Saltwater Rod & Reel</b> at the Tackle Shop for <b>🪙${SALT_ROD_COST}</b>.</p>

function startVisit(L, mode){
  if (L.ocean && !S.saltRod){ needSaltRod(); return; }
  if (mode === "boat"){ const c = rentCost(L); if (S.coins < c) return; if (c){ S.coins -= c; save(); SFX.coin(); toast(L.ocean ? "🛥️ Charter boat booked for your visit!" : "🚣 Boat rented for your whole visit!"); } else toast("🚤 " + BOATS[S.boatOwn].name + ", ready to go!"); }
  visit = { lake: L, mode }; S.lastLake = L.id;
  arriveExtras(L, mode); save();
  startTrip(L, 0, mode);
  if (stockDay(L)) setTimeout(() => toast("🚚 Trout stocking day! The truck just let fresh trout go here. Some are BIG.", 3600), 400);
  const tg = tagInfo(); if (tg && !tg.caught && tg.lake === L) setTimeout(() => toast("🏷️ Pearl's tagged " + SPECIES[tg.id].name + " is somewhere in this lake! Look for the yellow tag.", 3600), stockDay(L) ? 4200 : 400);
}
function continueVisit(){
  if (visit && visit.sd && visit.sd.left <= 0){ sdFinish(); return; }
  if (visit) startTrip(visit.lake, 0, visit.mode, true);
  else showScreen("map");
}
function leaveLake(){
  if (!trip) return;
  if (trip.boss){ trip = null; toast("You left the boss fight. The entry fee is gone.", 2600); continueVisit(); return; }
  if (visit) returnBait(visit.hookBait);
  if (visit && visit.sd) toast("🏆 You left the Showdown. The entry fee is gone.", 2600);
  save(); trip = null; visit = null; showScreen("map");
}
function toggleBoat(){
  if (!trip || trip.phase !== "ready" || !visit || trip.boss) return;
  if (visit.sd){ toast("🏆 Showdowns are fished from the dock."); return; }
  if (stormOn() && visit.mode === "dock"){ toast("⚡ Not in a storm! Wait for it to pass."); return; }
  const L = visit.lake;

const TIERS = [null, { icon:"🥉", name:"Bronze" }, { icon:"🥈", name:"Silver", at:.45, bonus:5 }, { icon:"🥇", name:"Gold", at:.75, bonus:15 }];
function tierOf(id, inches){
  const sp = SPECIES[id]; if (!inches) return 0; if (sp.legend) return 3;
  const fr = (inches - sp.min) / (sp.max - sp.min);
  return fr >= TIERS[3].at ? 3 : fr >= TIERS[2].at ? 2 : 1;
}
function tierIcon(id){ const d = S.dex[id]; return d ? TIERS[tierOf(id, d.best)].icon : ""; }
function tierInches(id, t){ const sp = SPECIES[id]; return Math.ceil(sp.min + TIERS[t].at * (sp.max - sp.min)); }
function goldCount(){ return DEX_ORDER.filter(id => S.dex[id] && tierOf(id, S.dex[id].best) === 3).length; }

const MAP_POS = { ocean:[33.20, -117.26], dixon:[33.17, -117.05], poway:[33.00, -117.01], jennings:[32.86, -116.89], cuyamaca:[32.98, -116.58], elcap:[32.89, -116.80], otay:[32.61, -116.93] };
const mapXY = (lat, lon) => [(lon + 117.35) / .9 * 480, (33.31 - lat) / .78 * 300];

function drawLakeMap(){
  if (mapArt) return mapArt;
  const c = document.createElement("canvas"); c.width = 960; c.height = 600; const x = c.getContext("2d"); x.scale(2, 2);
  const land = x.createLinearGradient(0, 0, 480, 0); land.addColorStop(0, "#e9dcb4"); land.addColorStop(.6, "#dccb98"); land.addColorStop(1, "#c9b07a");
  x.fillStyle = land; x.fillRect(0, 0, 480, 300);

  // the ocean and the coast
  x.fillStyle = "#6fb3d2"; x.beginPath(); x.moveTo(0, 0); x.lineTo(30, 0);
  for (let y = 0; y <= 300; y += 10) x.lineTo(30 + y * .14 + Math.sin(y * .09) * 6 + (y > 200 && y < 250 ? 18 : 0), y);
  x.lineTo(0, 300); x.fill();
  x.strokeStyle = "rgba(255,255,255,.5)"; x.lineWidth = 1; for (let k = 0; k < 4; k++){ x.beginPath(); for (let y = 0; y <= 300; y += 10) x.lineTo(20 - k * 7 + y * .14 + Math.sin(y * .09 + k) * 6, y); x.stroke(); }
  x.fillStyle = "rgba(255,255,255,.75)"; x.font = "italic bold 11px Trebuchet MS"; x.save(); x.translate(18, 170); x.rotate(-Math.PI / 2); x.fillText("PACIFIC OCEAN", 0, 0); x.restore();
  // mountains in the east
  for (let i = 0; i < 26; i++){ const mx = 320 + prand(i, 11) * 170, my = 40 + prand(i, 12) * 230, h = 12 + prand(i, 13) * 16;
    x.fillStyle = "#a88a5a"; x.beginPath(); x.moveTo(mx - h, my); x.lineTo(mx, my - h); x.lineTo(mx + h, my); x.fill();
    x.fillStyle = "#c9ad7a"; x.beginPath(); x.moveTo(mx, my - h); x.lineTo(mx + h, my); x.lineTo(mx + h * .3, my); x.fill(); }
  for (let i = 0; i < 18; i++){ const px = 380 + prand(i, 21) * 60, py = 85 + prand(i, 22) * 70; x.fillStyle = "#3f6b45"; x.beginPath(); x.moveTo(px, py - 8); x.lineTo(px - 4, py); x.lineTo(px + 4, py); x.fill(); }   // pines by Cuyamaca
  // highways
  x.strokeStyle = "rgba(200,70,50,.55)"; x.lineWidth = 2; x.setLineDash([6, 4]);
  x.beginPath(); x.moveTo(150, 0); x.quadraticCurveTo(170, 150, 150, 300); x.stroke();                     // I-15
  x.beginPath(); x.moveTo(70, 190); x.quadraticCurveTo(250, 175, 480, 160); x.stroke();                    // I-8
  x.setLineDash([]);
  // San Diego and the border
  x.fillStyle = "#5a3a1c"; x.beginPath(); x.arc(95, 222, 4, 0, 7); x.fill(); x.font = "bold 10px Trebuchet MS"; x.fillText("San Diego", 102, 226);
  x.strokeStyle = "rgba(90,58,28,.6)"; x.setLineDash([2, 3]); x.beginPath(); x.moveTo(70, 297); x.lineTo(480, 293); x.stroke(); x.setLineDash([]);
  x.fillStyle = "rgba(90,58,28,.7)"; x.fillText("MEXICO", 300, 290);
  // the lakes
  for (const L of LAKES){ const [lx, ly] = mapXY(...MAP_POS[L.id]);
    x.fillStyle = "#3f8fc0"; x.beginPath(); for (let a = 0; a <= 6.3; a += .5){ const r = 9 + Math.sin(a * 3 + L.depth) * 3; x.lineTo(lx + Math.cos(a) * r * 1.4, ly + 6 + Math.sin(a) * r * .7); } x.fill();
    x.fillStyle = "rgba(255,255,255,.5)"; x.fillRect(lx - 6, ly + 4, 6, 1.2); }
  x.strokeStyle = "#8a5a2c"; x.lineWidth = 3; x.strokeRect(1.5, 1.5, 477, 297);
  x.fillStyle = "#5a3a1c"; x.font = "bold 9px Trebuchet MS"; x.fillText("N ▲", 450, 18);

}

let trip = null;

let spawnBoat = false;                       // true on a boat trip: the ocean's offshore fish only come to the charter
const smallFor = (lake, dock) => dock && (lake.ocean ? .8 : true);   // dock fish run small; pier fish a little less so
let spawnLakeNow = null;
function spawnFishFor(lake, y, exclude, small){
  spawnLakeNow = lake;
  const frac = y / (lake.depth*PPF);
  const lure = S.up.lure;
  const n = nightAmt(), cat = id => SPECIES[id].shape === "cat";
  let cands = lake.fish.concat(spawnBoat && lake.boatFish || []).filter(id => !SPECIES[id].legend && id !== exclude && frac >= SPECIES[id].d[0] * (cat(id) ? 1 - .6*n : 1) && frac <= SPECIES[id].d[1])   // catfish rise at night
    .map(id => ({ v:id, w: SPECIES[id].rar * (SPECIES[id].rar <= 3 ? 1 + lure*.5 : 1) * lerp(1, NIGHT_FISH[id] || 1, n) * (id === "trout" && stockDay(lake) ? 4 : 1) }));
  if (!cands.length){
    let best = null, bd = 9;
    lake.fish.forEach(id => { const s = SPECIES[id]; if (s.legend) return; const dd = frac < s.d[0] ? s.d[0]-frac : frac - s.d[1]; if (dd < bd){ bd = dd; best = id; } });
    cands = [{ v:best, w:1 }];
  }
  const tg = tagInfo();
  if (tg && !tg.caught && tg.lake === lake && Math.random() < .04 && !(visit && visit.sd)){ const f = makeFish(tg.id, y, small); f.tagged = true; return f; }
  if (lake.rare && Math.random() < RARE_CHANCE * (cabinAt(lake) && S.cabin.up.feeder ? 2 : 1)){                // every so often, a fish that's hard to find in this lake
    const r = makeFish(lake.rare[Math.floor(Math.random() * lake.rare.length)], y, small); r.rare = true; return r;
  }
  return makeFish(pickWeighted(cands), y, small);
}
const RARE_CHANCE = .05;
function makeFish(id, y, small){
  const sp = SPECIES[id];
  const f = Math.pow(Math.random(), 1.5 - S.up.lure*.17) * (small === true ? .55 : small || 1);   // dock fish run small
  const brood = id === "trout" && stockDay(spawnLakeNow) && Math.random() < .15;   // the stocking truck brings a few big brood trout
  const inches = sp.legend ? rand(sp.min, sp.max) : lerp(sp.min, sp.max, brood ? Math.max(f, rand(.7, 1)) : f);
  const dir = Math.random() < .5 ? -1 : 1;
  const L = fishPx(sp, inches);
  const v = VARIANTS[id] && Math.random() < variantChance();
  return { id, sp: v ? variantSp(id) : sp, variant: v ? VARIANTS[id].key : null, inches, frac:f, L, x: rand(-20, W+20), y, baseY: y, dir,
    speed: rand(18, 45) * (sp.shape==="sun" ? 1.2 : sp.shape==="sturgeon" ? .6 : 1), phase: rand(0,6), trophy: !sp.legend && f > .78 };
}

function startTrip(lake, bossFeePaid, mode, quiet){
  if (!quiet) SFX.splash();
  mode = bossFeePaid ? "boat" : (mode || "dock");
  if (!S.day || S.day.lake !== lake.id) S.day = { lake: lake.id, kept: [] };   // new lake = new fishing day                 // boss fights always include a boat
  const dock = mode === "dock";
  spawnBoat = !dock;
  const home = cabinAt(lake), longDock = dock && home && S.cabin.up.longdock;
  const bottom = (dock ? (lake.pierDepth || (longDock ? Math.min(40, Math.round(lake.depth * .5)) : Math.min(24, Math.round(lake.depth * .3)))) : lake.depth) * PPF;
  const fish = [];
  const n = Math.round((dock ? Math.max(10, bottom / 36) : bottom / 55) * Math.sqrt(W / SW) * (W > SW ? 1.15 : 1));
  for (let i=0;i<n + (home && S.cabin.up.feeder ? 5 : 0);i++) fish.push(spawnFishFor(lake, rand(dock ? 70 : 160, bottom - 15), null, smallFor(lake, dock && !longDock)));
  let boss = null;
  if (bossFeePaid){
    const d = BOSSES[lake.id], sp = bossSp(lake.id);
    const maxY = Math.min(bottom - 8, upVal("line") * PPF);
    const y = Math.max(200, Math.min(maxY - 45, bottom * .8));
    const L = clamp(40 + d.inches*2.4, 100, 240);
    fish.push({ id: d.dex || d.base, sp, inches:d.inches, frac:1, L, x:W/2, y, baseY:y, dir:1, speed:22, phase:0, trophy:false, boss:true, sniffT:0 });
    boss = { def:d, fee:bossFeePaid, left: BOSS_CASTS };
  }
  if (!bossFeePaid && isNight() && LEGENDS[lake.id] && Math.random() < LEGEND_CHANCE * (fullMoon() ? 2.5 : 1)){   // a Night Legend is down there tonight
    const d = LEGENDS[lake.id], sp = legendSp(lake.id), maxY = Math.min(bottom - 10, upVal("line") * PPF);
    const y = rand(Math.min(maxY * .5, 200), maxY - 20);
    fish.push({ id: "legend_" + lake.id, sp, inches: d.inches, frac: 1, L: clamp(40 + d.inches * 2.2, 90, 200), x: rand(40, W - 40), y, baseY: y, dir: Math.random() < .5 ? -1 : 1, speed: 18, phase: 0, trophy: false, nightLegend: true });
  }
  const snags = [];
  // on the bottom: mostly sunken wood, plus cans, an old boot, the odd tire
  const nBottom = Math.round((dock ? 2 : Math.max(3, bottom / 150)) * W / SW);
  const bottomJunk = lake.ocean ? [{v:"can",w:2},{v:"boot",w:1},{v:"tire",w:1}] : [{v:"log",w:5},{v:"branch",w:3},{v:"can",w:2},{v:"boot",w:1.5},{v:"tire",w:.6},{v:"cart",w:.2}];
  for (let i=0;i<nBottom;i++){
    const t = pickWeighted(bottomJunk), sg = makeSnag(t, rand(30, W-30), 0);
    sg.y = bottom - sg.h/2 + 4;                       // resting on the lake bottom
    snags.push(sg);
  }
  // in the water column: plants growing up from the bottom and floating weed clumps
  const nPlants = dock ? 1 : Math.max(2, Math.round(bottom / 260));
  if (lake.ocean) for (let i = 0; i < (dock ? 2 : 3); i++){       // kelp grows almost to the top
    const sg = makeSnag("weed", dock ? rand(270, W - 40) : rand(40, W - 40), bottom); sg.kelp = true;   // not right under the pier where your bait drops
    sg.w = 44; sg.h = rand(.55, .85) * bottom; sg.y = bottom - sg.h/2; snags.push(sg);
  }
  else for (let i=0;i<nPlants;i++){
    if (Math.random() < .6){ const sg = makeSnag("weed", rand(30, W-30), bottom); sg.h = rand(.25, dock ? .45 : .5) * bottom; sg.y = bottom - sg.h/2; snags.push(sg); }
    else snags.push(makeSnag("clump", rand(40, W-40), rand(bottom*.3, bottom*.75)));
  }
  if (!bossFeePaid && mode === "boat" && S.tmap && S.tmap.pieces >= 4 && !S.tmap.done && S.tmap.lake === lake.id){   // X marks the spot
    const sg = makeSnag("chest", rand(W * .3, W * .8), 0); sg.gold = true; sg.w = 46; sg.h = 32; sg.y = bottom - sg.h/2 + 3; snags.push(sg);
  }
  else if (!bossFeePaid && Math.random() < .12){            // now and then, a treasure chest on the bottom
    const sg = makeSnag("chest", rand(40, W - 40), 0); sg.y = bottom - sg.h/2 + 3; snags.push(sg);
  }
  if (bossFeePaid) snags.length = 0;                  // boss fights: the boss is the only trouble down there
  trip = { lake, bottom, maxY: Math.min(bottom - 8, upVal("line") * PPF), fish, snags, caught:[], lost:0,
    mode, tipX: rodTipFor(anglerBase({ mode, lake }), ROD_IDLE).x, tipY: rodTipFor(anglerBase({ mode, lake }), ROD_IDLE).y,
    bobber: !!S.bobber && !bossFeePaid, bobX: null,
    hook:{ x: dock ? 193 : W/2+50, y: -30 }, phase:"ready", camY:camTop(), shields: upVal("guard"),
    bubbles:[], pops:[], fight:null, t:0, doneT:0, chain:null,
    pending:0, autoUp:false, upSpeed:0, castT:0, castX:0, reelAng:0, spoolAng:0,
    boss, bait: "bare", baitLost:false, baitRolled:false };
  // what's on the hook? It stays from the last cast unless a fish ate it.
  if (visit && visit.hookBait !== undefined) trip.bait = visit.hookBait;
  else { trip.bait = S.bait && baitUnlocked(S.bait) && baitHere(S.bait, lake) && takeBait(S.bait) ? S.bait : "spinner"; if (visit) visit.hookBait = trip.bait; }
  if (scentOn() && !bossFeePaid) addScentFish(trip, 5);
  if (frenzyOn() && !bossFeePaid) for (let i = 0; i < 6; i++) trip.fish.push(spawnFishFor(lake, rand(40, Math.min(bottom - 15, 12 * PPF)), null, smallFor(lake, dock)));
  if (visit && visit.lostMsg){ toast("🪝 " + visit.lostMsg + " Tap Bait.", 2600); visit.lostMsg = null; }
  btnHeld = false; uiSheet = bossFeePaid ? "bait" : null;          // boss fight: pick your bait first
  setBobDepth();
  renderBaitBar();
  S.trips++; save();
  showScreen("fishing");
  updateHud();
  if (!bossFeePaid && dock && S.trips > 3 && Math.random() < .07) foundLoot();
}

function makeSnag(type, x, y){
  const s = { type, x, y, hitT:0 };
  if (type==="log"){ s.w=rand(90,140); s.h=20; s.rot=rand(-.25,.25); }
  if (type==="tire"){ s.w=46; s.h=46; }
  if (type==="boot"){ s.w=34; s.h=34; }
  if (type==="can"){ s.w=18; s.h=26; }
  if (type==="cart"){ s.w=64; s.h=46; }
  if (type==="weed"){ s.w=36; s.h=rand(70,140); s.y = y - s.h/2; }
  if (type==="branch"){ s.w=rand(70,110); s.h=14; s.rot=rand(-.2,.2); }
  if (type==="clump"){ s.w=54; s.h=34; }
  if (type==="chest"){ s.w=34; s.h=24; }
  return s;
}

function renderBaitBar(){
  const bar = $("baitBar"), bd = trip && trip.boss ? trip.boss.def : null;
  bar.innerHTML = '<div class="lbl">🪙 ' + S.coins + '</div>';
  if (bd) bar.insertAdjacentHTML("beforeend", '<div class="lbl" style="color:#ffe38a">🎯 ' + bd.name + ' likes ' + bd.likes + '. ⭐ = good pick</div>');
  BAIT_ORDER.forEach(k => {
    const bt = BAITS[k];
    if (k === "bare" || !baitUnlocked(k) || (trip && !baitHere(k, trip.lake))) return;   // boss prizes show up once you win them; ocean bait only at the ocean
    const onHook = trip && trip.bait === k;
    const left = baitLeft(k), needBuy = left <= 0 && !onHook;
    const c = document.createElement("button");
    c.className = "chip" + (onHook ? " on" : "") + (needBuy ? " buy" : "");
    let label = (bd && (bd.bite[k] || 0) >= .4 ? "⭐ " : "") + bt.icon + " " + bt.name;
    if (bt.soft && !needBuy) label += " ×" + left;
    if (needBuy) label += ' <span class="price">' + (bt.soft ? "+" + bt.pack + " " : "") + "🪙" + bt.cost + '</span>';
    c.innerHTML = label;
    if (needBuy && S.coins < bt.cost) c.disabled = true;
    c.onclick = () => {
      if (!trip || trip.phase !== "ready" || trip.bait === k) return;
      if (baitLeft(k) <= 0 && !buyBait(k)) return;
      returnBait(trip.bait);                                       // put the old bait back in the tackle box
      if (!takeBait(k)) return;
      trip.bait = k; if (visit) visit.hookBait = k; S.bait = k; save(); SFX.click();
      pop(trip.tipX, -60, bt.icon + " " + bt.name + " on the hook!", "#fff", 16);
      uiSheet = null; renderBaitBar(); updateHud();
    };
    bar.appendChild(c);
  });
  if (bd) return;                                                  // no bobber for boss fights
  // bobber rig
  const row = document.createElement("div"); row.className = "lbl"; row.style.cssText = "display:flex;justify-content:center;gap:.35em;align-items:center;margin-top:.4em";
  const mk = (txt, fn, on) => { const b = document.createElement("button"); b.className = "chip" + (on ? " on" : ""); b.textContent = txt; b.onclick = () => { fn(); S.bobber = !!S.bobber; save(); if (trip){ trip.bobber = !!S.bobber && !trip.boss; setBobDepth(); } SFX.click(); renderBaitBar(); updateHud(); }; return b; };
  row.appendChild(mk(S.bobber ? "🔴 Bobber: ON" : "⚪ Bobber: OFF", () => { S.bobber = !S.bobber; }, S.bobber));
  if (S.bobber){
    row.appendChild(mk("−", () => { S.bobDepth = Math.max(2, (S.bobDepth || 6) - 1); }));
    const d = document.createElement("span"); d.style.cssText = "color:#fff;font-weight:bold;min-width:3.4em;text-align:center"; d.textContent = (S.bobDepth || 6) + " ft"; row.appendChild(d);
    row.appendChild(mk("+", () => { S.bobDepth = Math.min(20, (S.bobDepth || 6) + 1); }));
  }
  bar.appendChild(row);
}

// coin counter in the top bar, with a little "+5" pop whenever coins go up
let shownCoins = null;

function updateHud(){

  parts.push(trip.boss ? "⚔️ " + trip.boss.def.name + " · 🎣 " + (BOSS_CASTS - trip.boss.left + 1) + "/" + BOSS_CASTS : "🧺 " + dayCount(trip.lake.id) + "/" + DAY_LIMIT[trip.lake.id]);
  if (trip.phase === "troll") parts.push("🚤");
  if (trip.bobber) parts.push("🔴 " + Math.round(trip.bobDepthPx / PPF) + " ft");

// ---- Nibbles: a fish mouths the bait a few times. If it really bites, tap fast to set the hook!

// ---- Weather: sunny, cloudy, or rain (rain = can barely see) ----
function weatherLevel(){ return visit && visit.weather ? visit.weather.level : 0; }   // 0 sunny · .5 cloudy · 1 rain
function rainAmt(){ return clamp((weatherLevel() - .5) * 2, 0, 1); }

function weatherIcon(){ const l = weatherLevel(); return l < .25 ? "☀️" : l < .75 ? "☁️" : "🌧️"; }
function updateWeather(dt){
  if (!visit) return;
  const w = visit.weather || (visit.weather = { target:0, level:0, next: Date.now() + rand(40, 80)*1000 });
  if (Date.now() > w.next){
    const old = w.target, r = Math.random();
    w.target = r < .55 ? 0 : r < .83 ? .5 : 1;
    w.next = Date.now() + (w.target === 1 ? rand(45, 80) : rand(60, 120)) * 1000;
    if (w.target === 1 && old !== 1 && !w.storm && !(visit && visit.sd) && !(trip && trip.boss) && Math.random() < .4){
      w.storm = { left: 60, flash: 0 }; w.next = Date.now() + 75000;

    }

    else if (old === 1 && w.target !== 1) toast("☀️ The rain stopped.");
  }
  w.level += (w.target - w.level) * Math.min(1, dt * .6);

    if (Math.random() < dt * .25){ st.flash = 1; st.bx = rand(W * .2, W * .9); setTimeout(() => SFX.thunder(), rand(200, 900)); }
    if (st.left <= 0){

      if (visit && visit.mode === "boat" && !(trip && trip.boss)){ visit.mode = "dock"; SFX.thunder();
        toast("⚡ CRACK! Lightning! The ranger called every boat back to the dock.", 3600);
        if (trip && trip.phase === "ready") startTrip(visit.lake, 0, "dock", true); }
      else toast("⛅ The storm moved on.", 2400);
    } }
  // raindrop patter

}
// Deep water gets dark. Rain makes everything murky. You can always see a little around your bait.
const fogCv = document.createElement("canvas"); fogCv.width = W; fogCv.height = H;

function drawFog(T, sy, hx, hy){
  if (fogCv.width !== W || fogCv.height !== H){ fogCv.width = W; fogCv.height = H; }
  const f = fogCtx, rn = rainAmt(), cl = cloudAmt(), surf = sy(0);
  f.clearRect(0, 0, W, H);

  const nt = nightAmt(), top = Math.min(.92, .05*cl + .72*rn + .5*nt);   // murkiness right at the surface (and darkness at night)
  const g = f.createLinearGradient(0, surf, 0, sy(160 * PPF));
  for (const ft of [0, 10, 25, 45, 70, 100, 160]){
    const deep = Math.min(.93, Math.pow(ft / 70, .8) * .9);

  }
  f.fillStyle = g; f.fillRect(0, Math.max(0, surf), W, H);

    rg.addColorStop(0, "rgba(0,0,0,.92)"); rg.addColorStop(1, "rgba(0,0,0,0)");
    f.fillStyle = rg; f.fillRect(hx - R, hy - R, R*2, R*2);

const rainDrops = [];

// =====================================================================
//  EVENTS: feeding frenzies, the trout truck, the tagged fish of the week, full moons and storms
// =====================================================================
const FRENZY_SECS = 90, TAG_PRIZE = 150;
const frenzyOn = () => !!(visit && visit.ev && visit.ev.on);
const stormOn = () => !!(visit && visit.weather && visit.weather.storm);
// the stocking truck comes to Dixon and Poway on different days
function stockDay(L){ const d = sdDayNum(); return !!L && ((L.id === "dixon" && d % 4 === 0) || (L.id === "poway" && d % 4 === 2)); }
// one tagged fish a week, in one of your lakes
function tagInfo(){
  const w = Math.floor(sdDayNum() / 7), lakes = LAKES.filter(l => S.lakes.includes(l.id) && (!l.ocean || S.saltRod));
  if (!lakes.length) return null;
  const lake = lakes[(w * 5 + 3) % lakes.length], pool = lake.fish.filter(id => !SPECIES[id].legend && SPECIES[id].rar >= 2);
  return { w, lake, id: pool[(w * 7 + 1) % pool.length], caught: !!(S.tag && S.tag.w === w) };
}
// the real moon: full when it's within about 2 days of full
function moonPhase(){ const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14); return (((Date.now() - ref) / 864e5 / syn) % 1 + 1) % 1; }
const fullMoon = () => Math.abs(moonPhase() - .5) < .07;
function evUpdate(T, dt){
  const E = visit.ev || (visit.ev = { clock: 0, next: rand(5, 9) * 60, on: false, warn: 0, left: 0 });
  if (visit.mode === "dock" || visit.mode === "boat") visit.truckT = (visit.truckT || 0) + dt;
  E.clock += dt;
  if (!E.on && !E.warn && E.clock > E.next){ E.warn = 4; toast("🌊 The water is starting to bubble...", 2600); }
  else if (E.warn){ E.warn -= dt; if (E.warn <= 0){ E.warn = 0; E.on = true; E.left = FRENZY_SECS; SFX.bigSplash(); toast("🔥 FEEDING FRENZY! Everything is biting!", 2600);
      for (let i = 0; i < 6; i++){ const f = spawnFishFor(T.lake, rand(40, Math.min(T.bottom - 15, 12 * PPF)), null, smallFor(T.lake, T.mode === "dock")); f.x = rand(40, W - 40); T.fish.push(f); } } }
  else if (E.on){ E.left -= dt; if (Math.random() < dt * 6) ripple(T, rand(20, W - 20), Math.random() < .3);
    if (Math.random() < dt * 1.2){ E.jump = { x: rand(60, W - 60), t: 0, sp: SPECIES[T.lake.fish[Math.floor(Math.random() * T.lake.fish.length)]] }; }
    if (E.jump){ E.jump.t += dt; if (E.jump.t > .9) E.jump = null; }
    if (E.left <= 0){ E.on = false; E.next = E.clock + rand(6, 10) * 60; toast("The frenzy is over. Phew!", 2000); } }
}
function drawEvents(T, sy){
  const E = visit && visit.ev, st = visit && visit.weather && visit.weather.storm, lines = [];
  if (E && E.on){ lines.push(["🔥 FEEDING FRENZY " + Math.ceil(E.left) + "s", "#ffb26b"]);
    if (E.jump && E.jump.sp){ const k = E.jump.t / .9, jx = E.jump.x + k * 40, jy = sy(-Math.sin(Math.PI * k) * 40);   // little fish leaping out of the boil
      drawFish(ctx, E.jump.sp, jx, jy, 26, 1, T.t, { rot: (k - .5) * 1.8 }); } }
  if (st){ lines.push(["⚡ STORM: lightning in " + Math.ceil(st.left) + "s", "#ffe38a"]);
    if (st.flash > .5 && st.bx){ ctx.strokeStyle = "rgba(255,255,230," + st.flash.toFixed(2) + ")"; ctx.lineWidth = 3; ctx.beginPath(); let x = st.bx, y = 0; ctx.moveTo(x, y);
      while (y < sy(0)){ y += rand(18, 34); x += rand(-14, 14); ctx.lineTo(x, Math.min(y, sy(0))); } ctx.stroke(); } }
  if (visit && stockDay(visit.lake) && (visit.truckT || 0) < 45 && sy(0) > 60) drawTruck(T, sy(0));
  if (st && st.flash > 0){ ctx.fillStyle = "rgba(255,255,255," + (st.flash * .45).toFixed(2) + ")"; ctx.fillRect(0, 0, W, H); }
  lines.forEach(([txt, col], i) => { ctx.font = "bold 14px Trebuchet MS, sans-serif"; const tw = ctx.measureText(txt).width + 22, y = 104 + i * 26;
    ctx.fillStyle = "rgba(10,25,40,.8)"; roundRect(W / 2 - tw / 2, y, tw, 22, 11); ctx.fill(); ctx.fillStyle = col; ctx.textAlign = "center"; ctx.fillText(txt, W / 2, y + 16); });
}
function drawTruck(T, surf){                              // the stocking truck on the shore, pouring trout into the lake
  const x = W - 150, y = surf - 22, t = T.t;
  ctx.fillStyle = "#f4f6f8"; ctx.fillRect(x, y - 26, 62, 24); ctx.fillStyle = "#2f6fb8"; ctx.fillRect(x, y - 14, 62, 5);
  ctx.fillStyle = "#2f6fb8"; ctx.font = "bold 9px Trebuchet MS, sans-serif"; ctx.textAlign = "center"; ctx.fillText("TROUT", x + 31, y - 17);
  ctx.fillStyle = "#e8eef2"; ctx.fillRect(x + 62, y - 20, 22, 18); ctx.fillStyle = "#8ac4e0"; ctx.fillRect(x + 70, y - 17, 11, 7);
  ctx.fillStyle = "#222"; for (const wx of [x + 12, x + 46, x + 74]){ ctx.beginPath(); ctx.arc(wx, y - 1, 5, 0, 7); ctx.fill(); }
  ctx.strokeStyle = "#8a959c"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, y - 18); ctx.lineTo(x - 26, y + 6); ctx.stroke();   // the pipe
  ctx.strokeStyle = "rgba(200,230,255,.8)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x - 26, y + 6); ctx.quadraticCurveTo(x - 34, y + 14, x - 36, surf + 2); ctx.stroke();
  for (let i = 0; i < 2; i++){ const k = ((t * .9 + i * .5) % 1), fx = x - 26 - k * 22, fy = y + 6 + k * k * (surf - y);   // trout tumbling out
    drawFish(ctx, SPECIES.trout, fx, fy, 22, -1, t, { rot: 1 + k }); }
}
function eventsCard(){
  const out = [], today = LAKES.filter(l => S.lakes.includes(l.id) && stockDay(l)), tg = tagInfo();

}

// =====================================================================
//  THE DOCK SHOWDOWN: a timed tournament on a long dock against two rivals
// =====================================================================
const SD_SECS = 240;
const SD_TIERS = [
  { id:"local",  name:"Local Derby",        lakes:["dixon","poway"],                fee:25,  need:null,     rate:.5,  size:.8,  cup:"🏅" },
  { id:"county", name:"County Cup",         lakes:["jennings","cuyamaca","elcap"],  fee:75,  need:"local",  rate:.62, size:.9,  cup:"🎖️" },
  { id:"state",  name:"State Championship", lakes:["otay"],                         fee:200, need:"county", rate:.85, size:1.05, cup:"🏆" }
];
const SD_TYPES = { bag:"Heaviest 3-fish bag", kinds:"Most kinds of fish", big:"Biggest single fish", count:"Most fish" };
const SD_TYPE_ORDER = ["bag", "kinds", "big", "count"];
const RIVALS = [
  { name:"Lucky Lou", shirt:"#d9822b", hat:"bucket", rod:"red", rate:1.3, size:.75,
    hi:"Y'all ready to lose? Heh, just kidding. Mostly.", brag:["Another one!", "Lucky me!", "Ha! Too easy!"], win:"Lucky again! Good fishing, kid.", lose:"Shucks! You out-fished ol' Lou!" },
  { name:"Grandma June", shirt:"#9a5fb8", hat:"straw", rod:"gold", rate:.6, size:1.15,
    hi:"Patience, dear. The big ones come to those who wait.", brag:["Oh my, a nice one!", "Patience pays!", "Look at this beauty!"], win:"Thank you for a lovely contest, sweetie.", lose:"My goodness, you're a natural!" },
  { name:"Tex", shirt:"#b8402c", hat:"cowboy", rod:"black", rate:1, size:1.05,
    hi:"Back home we call these bait, partner.", brag:["Yee-haw!", "Bigger in Texas!", "Watch and learn!"], win:"That's how it's done, partner!", lose:"Well, I'll be. Tip of the hat to ya." }
];
const sdDayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5);
function sdTier(L){ return SD_TIERS.find(t => t.lakes.includes(L.id)); }
function sdOpen(t){ return !t.need || (S.sd.wins[t.need] || 0) > 0; }
function sdType(L){ return SD_TYPE_ORDER[(sdDayNum() + LAKES.indexOf(L)) % SD_TYPE_ORDER.length]; }
function sdScore(type, fish){
  if (type === "bag") return fish.map(f => f.lb).sort((a, b) => b - a).slice(0, 3).reduce((s, x) => s + x, 0);
  if (type === "kinds") return new Set(fish.map(f => f.id)).size + Math.min(.99, fish.reduce((s, f) => s + f.lb, 0) / 100);   // ties go to total weight
  if (type === "big") return fish.reduce((m, f) => Math.max(m, f.lb), 0);
  return fish.length;
}
function sdFmt(type, v){ return type === "kinds" ? Math.floor(v) + (Math.floor(v) === 1 ? " kind" : " kinds") : type === "count" ? v + (v === 1 ? " fish" : " fish") : v.toFixed(1) + " lb"; }
// a brother or sister in the family can be your rival: they fish with their real best catches
function siblingRival(L){
  const me = LL.player(); if (!me || !LL.players) return null;
  const pool = LL.players().filter(p => p.id !== me.id && p.game && p.game.dex).map(p => ({ p, fish: Object.entries(p.game.dex).filter(([id]) => L.fish.includes(id) && SPECIES[id] && !SPECIES[id].legend).map(([id, d]) => ({ id, best: d.best })) })).filter(x => x.fish.length >= 2);
  if (!pool.length) return null;
  const x = pool[Math.floor(Math.random() * pool.length)], g = x.p.game, lk = Object.assign({ hat:"cap", rod:"black" }, g.look);
  return { name: x.p.name, shirt: x.p.color || "#3f88bd", hat: lk.hat, rod: lk.rod, rate: 1, size: 1, ghost: x.fish, sib: true,
    hi: "I'm fishing with " + x.p.name + "'s real best catches. Can you beat them?", brag: ["Got one!", "Beat that!", "Ha!"], win: x.p.name + " wins this time!", lose: "You beat " + x.p.name + "'s best!" };
}
function showdownOffer(L){
  const t = sdTier(L);
  if (!sdOpen(t)){ const nt = SD_TIERS.find(x => x.id === t.need);
    infoModal(`<div style="font-size:3em">🔒🏆</div><h3>${t.name}</h3><p>Win a <b>${nt.name}</b> first (at ${nt.lakes.map(id => lakeById(id).name).join(" or ")}) to get into the ${t.name}.</p>`, "OK"); return; }
  const type = sdType(L), wins = S.sd.wins[t.id] || 0;
  const html = `<div style="font-size:3em">🏆🎣</div><span class="tag trophy">${t.cup} ${t.name.toUpperCase()}</span><h3>${L.name} Showdown</h3>
    <p>Today's contest: <b>${SD_TYPES[type]}</b><br>⏱️ 4 minutes of fishing on the long dock against 2 rivals. Every fish you land counts (catch and release).</p>
    <p>🎟️ Entry <b>${t.fee} 🪙</b> · 🥇 Win <b>${t.fee * 3} 🪙</b> + a ${t.cup} cup · 🥈 your entry back</p>
    <div class="muted">${wins ? "You've won " + wins + (wins > 1 ? " times" : " time") + " at this level." : "The contest changes every day."}</div>`;
  if (S.coins < t.fee) infoModal(html.replace("🎟️ Entry <b>", "🎟️ You need <b>"), "OK");
  else infoModal(html, "Not now", null, { text: "Enter! (" + t.fee + " 🪙)", fn: () => startShowdown(L) });

function startShowdown(L){
  const t = sdTier(L); if (S.coins < t.fee || (L.ocean && !S.saltRod)) return;
  S.coins -= t.fee; S.sd.played++; SFX.coin();
  const pool = RIVALS.slice().sort(() => Math.random() - .5), sib = Math.random() < .6 ? siblingRival(L) : null;
  const picks = sib ? [pool[0], sib] : pool.slice(0, 2);
  const type = sdType(L);
  const rivals = picks.map((r, i) => ({ def: r, fish: [], score: 0, next: rand(15, 40) / (t.rate * r.rate), st: "wait", stT: 0, said: 0,
    T: { mode: "dock", lake: L, ax: i ? W * .74 : W * .52, who: { shirt: r.shirt, hat: r.hat, rod: r.rod }, t: rand(0, 5), phase: "drop", caught: [], hook: { x: 0, y: 0 }, upSpeed: 0 } }));
  visit = { lake: L, mode: "dock", sd: { tier: t, type, left: SD_SECS, el: 0, rivals, mine: [], boss: false } }; S.lastLake = L.id; save();
  startTrip(L, 0, "dock");
  rivals.forEach((r, i) => setTimeout(() => { if (trip && visit && visit.sd) pop(r.T.ax, -95 - i * 22, r.def.name + ": “" + r.def.hi + "”", "#fff7d6", 14); }, 600 + i * 2200));
  toast("🏆 " + SD_TYPES[type] + " · 4 minutes. GO!", 2600);
}
function sdDockLen(){ return Math.min(W - 20, W * .74 + 70); }
function rivalCatch(r, sd, T){
  const t = sd.tier; let id, inches;
  if (r.def.ghost && Math.random() < .85){ const g = r.def.ghost[Math.floor(Math.random() * r.def.ghost.length)]; id = g.id; inches = g.best * rand(.55, .95); }
  else { const f = spawnFishFor(T.lake, rand(70, T.bottom - 15), null, true); id = f.id; inches = clamp(f.inches * t.size * r.def.size, SPECIES[id].min, SPECIES[id].max); }
  const sp = SPECIES[id], lb = weightLb(sp, inches);
  r.fish.push({ id, lb }); r.score = sdScore(sd.type, r.fish);
  r.st = "reel"; r.stT = 0; r.catchSp = sp; r.catchIn = inches; r.lb = lb;
}
function sdUpdate(T, dt){
  const sd = visit.sd;
  if (!sd.done){ sd.left -= dt; sd.el += dt; }
  for (const r of sd.rivals){
    const R = r.T; R.t += dt; R.lastDt = dt; r.stT += dt;
    const hx = R.ax + 58, depth = 9 * PPF;
    if (r.st === "wait"){ R.phase = "drop"; R.caught = []; R.upSpeed = 0; R.hook = { x: hx, y: depth };
      if (!sd.done && sd.el >= r.next){ rivalCatch(r, sd, T); r.next = sd.el + rand(.6, 1.5) * 60 / (sd.tier.rate * r.def.rate); } }
    else if (r.st === "reel"){ R.phase = "reel"; R.caught = [1]; R.upSpeed = 60; R.hook = { x: hx, y: depth * Math.max(0, 1 - r.stT / 1.4) };
      if (r.stT > 1.4){ r.st = "show"; r.stT = 0; splashAt(T, hx, 0, 10);

// ---------- scenery (textures made once, reused every frame) ----------
const causticTile = (() => {                      // shimmering light network on the water, tiles seamlessly
  const n = 128, c = document.createElement("canvas"); c.width = c.height = n;
  const x = c.getContext("2d"), img = x.createImageData(n, n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++){
    const u = i / n * Math.PI * 2, v = j / n * Math.PI * 2;
    const a = Math.sin(u*2 + Math.sin(v*3)*1.2) + Math.sin(v*2 + Math.sin(u*3)*1.4) + Math.sin(u*3 + v*3 + Math.sin(u - v));
    const val = Math.pow(1 - Math.min(1, Math.abs(a) / 1.1), 7), k = (j*n + i) * 4;
    img.data[k] = 255; img.data[k+1] = 255; img.data[k+2] = 235; img.data[k+3] = Math.round(val * 210);
  }
  x.putImageData(img, 0, 0); return c;
})();
let causticPat = null;

function hillLine(x, seed, amp, base){ return base - (Math.sin(x*.009 + seed)*amp + Math.sin(x*.023 + seed*2)*amp*.45 + Math.sin(x*.061 + seed*3)*amp*.18); }

// the ocean view from the pier: open sea to the horizon, an island far out, bluffs, palms and a lifeguard tower
function oceanShore(c, B){
  const sea = c.createLinearGradient(0, B - 44, 0, B); sea.addColorStop(0, "#8cc4dc"); sea.addColorStop(1, "#4d9fc4");
  c.fillStyle = sea; c.fillRect(0, B - 44, W, 44);
  c.fillStyle = "rgba(255,255,255,.5)"; c.fillRect(0, B - 45, W, 1.5);                               // the horizon
  c.fillStyle = "rgba(140,150,170,.55)"; c.beginPath(); c.moveTo(W * .58, B - 44); c.quadraticCurveTo(W * .7, B - 54, W * .86, B - 47); c.lineTo(W * .9, B - 44); c.fill();   // an island far out
  c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 1;
  for (let i = 0; i < 26; i++){ const x = prand(i, 51) * W, y = B - 40 + prand(i, 52) * 36; c.beginPath(); c.moveTo(x, y); c.lineTo(x + 6 + prand(i, 53) * 10, y); c.stroke(); }
  const bw = Math.min(200, W * .36);                                                                    // bluffs on the left
  c.fillStyle = "#c9a878"; c.beginPath(); c.moveTo(0, B - 100); c.quadraticCurveTo(bw * .5, B - 104, bw * .8, B - 80); c.quadraticCurveTo(bw * .95, B - 50, bw, B - 10); c.lineTo(0, B - 10); c.fill();
  c.strokeStyle = "rgba(140,105,70,.45)"; c.lineWidth = 1.2; for (let k = 0; k < 7; k++){ c.beginPath(); c.moveTo(0, B - 88 + k * 11); c.quadraticCurveTo(bw * .5, B - 90 + k * 12, bw * (.82 + k * .025), B - 70 + k * 9); c.stroke(); }
  c.fillStyle = "#6f8a4a"; c.beginPath(); c.moveTo(0, B - 104); c.quadraticCurveTo(bw * .5, B - 110, bw * .82, B - 82); c.lineTo(bw * .78, B - 78); c.quadraticCurveTo(bw * .5, B - 100, 0, B - 96); c.fill();
  [[bw * .2, "#f2efe6", "#c9563c"], [bw * .42, "#eef0f0", "#7a8a96"], [bw * .6, "#f6e6c8", "#c9563c"]].forEach(([x, wall, roof]) => {   // beach houses on the bluff
    c.fillStyle = wall; c.fillRect(x - 9, B - 116, 18, 12); c.fillStyle = roof; c.beginPath(); c.moveTo(x - 11, B - 116); c.lineTo(x, B - 124); c.lineTo(x + 11, B - 116); c.fill();
    c.fillStyle = "#6fa3c4"; c.fillRect(x - 5, B - 113, 4, 4); c.fillRect(x + 2, B - 113, 4, 4); });
  const palm = (x, y, h) => { c.strokeStyle = "#7a6248"; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 4, y - h * .5, x + 2, y - h); c.stroke();
    c.strokeStyle = "#3f6b3a"; c.lineWidth = 1.6; for (let k = 0; k < 7; k++){ const a = -Math.PI + k * Math.PI / 6; c.beginPath(); c.moveTo(x + 2, y - h); c.quadraticCurveTo(x + 2 + Math.cos(a) * 8, y - h - 5, x + 2 + Math.cos(a) * 13, y - h + 4 + Math.abs(Math.sin(a)) * 3); c.stroke(); } };
  palm(bw * .1, B - 103, 34); palm(bw * .32, B - 106, 40); palm(bw * .52, B - 104, 30); palm(bw * .74, B - 88, 36);
  c.fillStyle = "#ecdcae"; c.beginPath(); c.moveTo(0, B - 12); c.lineTo(bw * 1.5, B - 4); c.lineTo(bw * 1.5, B); c.lineTo(0, B); c.fill();   // the beach
  const tx = bw * 1.15;                                                                                // lifeguard tower
  c.strokeStyle = "#8a7a62"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(tx - 7, B - 4); c.lineTo(tx - 5, B - 20); c.moveTo(tx + 7, B - 4); c.lineTo(tx + 5, B - 20); c.stroke();
  c.fillStyle = "#4aa8d8"; c.fillRect(tx - 9, B - 32, 18, 12); c.fillStyle = "#f2c53a"; c.beginPath(); c.moveTo(tx - 11, B - 32); c.lineTo(tx, B - 38); c.lineTo(tx + 11, B - 32); c.fill();
  c.fillStyle = "#fff"; c.fillRect(tx - 6, B - 29, 12, 5); c.fillStyle = "#d33a3a"; c.fillRect(tx + 9, B - 44, 6, 4); c.fillRect(tx + 9, B - 44, 1, 14);
  c.strokeStyle = "rgba(255,255,255,.8)"; c.lineWidth = 1.4; for (let k = 0; k < 3; k++){ c.beginPath(); c.moveTo(0, B - 8 + k * 2); c.quadraticCurveTo(bw * .8, B - 6 + k * 2, bw * 1.6, B - 2 + k); c.stroke(); }   // surf on the sand
  const sx = W * .72;                                                                                  // a sailboat
  c.fillStyle = "#f6f6f2"; c.beginPath(); c.moveTo(sx, B - 30); c.lineTo(sx, B - 58); c.lineTo(sx + 14, B - 30); c.fill(); c.beginPath(); c.moveTo(sx - 2, B - 32); c.lineTo(sx - 2, B - 52); c.lineTo(sx - 11, B - 32); c.fill();
  c.fillStyle = "#c9563c"; c.beginPath(); c.moveTo(sx - 14, B - 29); c.lineTo(sx + 17, B - 29); c.lineTo(sx + 12, B - 25); c.lineTo(sx - 10, B - 25); c.fill();
}
function shoreArt(L){
  const key = L.id + "|" + W; if (shoreCache[key]) return shoreCache[key];
  const sc = SCENES[L.id] || SCENES.dixon, S2 = 2, c0 = document.createElement("canvas");
  c0.width = W * S2; c0.height = SHORE_H * S2;
  const c = c0.getContext("2d"); c.scale(S2, S2);
  const B = SHORE_H, seed = sc.seed;
  const ridge = (x, sd, amp, base) => hillLine(x, sd, amp, base);
  if (L.ocean){ oceanShore(c, B); c0.wid = W; shoreCache[key] = c0; return c0; }
  const fillRidge = (fill, sd, amp, base, step = 8) => { c.fillStyle = fill; c.beginPath(); c.moveTo(0, B); for (let x = 0; x <= W; x += step) c.lineTo(x, ridge(x, sd, amp, base)); c.lineTo(W, B); c.fill(); };
  const haze = (col, a) => { const [r,g,b] = hexRgb(col); return `rgba(${r},${g},${b},${a})`; };

  // --- far layer: each lake's own mountain skyline
  if (L.id === "poway"){                                   // Mt. Woodson, with Potato Chip Rock near the top
    fillRidge(haze(sc.far, .75), seed, 14, B - 70);
    c.fillStyle = haze("#8a8e98", .92); c.beginPath(); c.moveTo(20, B - 40);
    c.bezierCurveTo(110, B - 110, 150, B - 150, 220, B - 175, 270, B - 168); c.bezierCurveTo(320, B - 160, 400, B - 100, 520, B - 40); c.lineTo(520, B); c.lineTo(20, B); c.fill();
    for (let i = 0; i < 40; i++){ const x = 150 + prand(i, 5)*250, y = B - 150 + prand(i, 6)*80 + Math.abs(x - 270)*.35, r = 1.6 + prand(i, 7)*2.6;   // boulder-covered slopes
      c.fillStyle = "rgba(70,70,75,.25)"; c.beginPath(); c.ellipse(x + .8, y + .8, r, r*.7, 0, 0, 7); c.fill();
      c.fillStyle = "rgba(205,200,190,.6)"; c.beginPath(); c.ellipse(x, y, r, r*.7, 0, 0, 7); c.fill(); }
    c.fillStyle = "#8d8a86"; c.beginPath(); c.moveTo(262, B - 170); c.lineTo(290, B - 176); c.lineTo(291, B - 173); c.lineTo(263, B - 166); c.fill();   // the "chip"
  } else if (L.id === "elcap"){                             // El Capitan's big granite dome
    fillRidge(haze(sc.far, .7), seed, 18, B - 80);
    const dg = c.createLinearGradient(0, B - 185, 0, B - 40); dg.addColorStop(0, "#c9c2b4"); dg.addColorStop(1, "#8f8474");
    c.fillStyle = dg; c.beginPath(); c.moveTo(40, B - 40);
    c.bezierCurveTo(70, B - 150, 150, B - 190, 220, B - 186); c.bezierCurveTo(290, B - 182, 340, B - 120, 370, B - 40); c.fill();
    c.strokeStyle = "rgba(90,80,70,.35)"; c.lineWidth = 1.4;
    for (let i = 0; i < 9; i++){ const x = 90 + i*28; c.beginPath(); c.moveTo(x, B - 160 + Math.abs(x - 215)*.4); c.quadraticCurveTo(x + 6, B - 100, x - 4, B - 45); c.stroke(); }
    c.fillStyle = "rgba(255,255,255,.18)"; c.beginPath(); c.ellipse(190, B - 165, 40, 12, -.2, 0, 7); c.fill();
  } else if (L.id === "cuyamaca"){                          // Cuyamaca Peak and pointy Stonewall Peak
    fillRidge(haze(sc.far, .85), seed, 30, B - 95);
    c.fillStyle = haze("#7c8a96", .95); c.beginPath(); c.moveTo(250, B - 70); c.lineTo(318, B - 168); c.lineTo(332, B - 172); c.lineTo(400, B - 70); c.fill();
    c.fillStyle = "rgba(60,70,80,.25)"; c.beginPath(); c.moveTo(250, B - 70); c.lineTo(318, B - 168); c.lineTo(322, B - 70); c.fill();
    c.fillStyle = "rgba(230,230,225,.5)"; c.beginPath(); c.moveTo(310, B - 158); c.lineTo(318, B - 168); c.lineTo(332, B - 172); c.lineTo(340, B - 160); c.lineTo(326, B - 150); c.fill();
  } else if (L.id === "otay"){                              // rugged Otay Mountain ridge
    fillRidge(haze(sc.far, .6), seed + 2, 22, B - 105);
    c.fillStyle = haze("#7f7a92", .88); c.beginPath(); c.moveTo(0, B - 60);
    for (let x = 0; x <= W; x += 6) c.lineTo(x, B - 95 - Math.sin(x*.012 + 1)*38 - Math.abs(Math.sin(x*.07))*10 - prand(x, 3)*4);
    c.lineTo(W, B); c.lineTo(0, B); c.fill();
  } else {
    fillRidge(haze(sc.far, .85), seed, 26, B - 78);
  }

  // --- near hills with their own color and texture
  const hg = c.createLinearGradient(0, B - 75, 0, B); hg.addColorStop(0, shade(sc.hills, .06)); hg.addColorStop(1, shade(sc.hills, -.25));
  c.fillStyle = hg; c.beginPath(); c.moveTo(0, B);
  for (let x = 0; x <= W; x += 8) c.lineTo(x, ridge(x, seed + 4, 18, B - 38));
  c.lineTo(W, B); c.fill();
  const onHill = (i, k) => { const x = prand(i, k) * W, top = ridge(x, seed + 4, 18, B - 38); return [x, top + 3 + prand(i, k + 1) * (B - top - 7)]; };
  for (let i = 0; i < 110; i++){                          // grass / shrub texture
    const [x, y] = onHill(i, 21);
    c.fillStyle = prand(i, 23) < .5 ? "rgba(52,70,38,.45)" : shade(sc.hills, -.18);
    c.beginPath(); c.ellipse(x, y, 1.6 + prand(i, 24)*3, 1.2 + prand(i, 25)*1.6, 0, 0, 7); c.fill();
  }
  // wildflower patches
  for (let i = 0; i < 140; i++){
    const [x, y] = onHill(i, 61); if (prand(i, 63) < .35) continue;
    c.fillStyle = sc.flowers[i % sc.flowers.length]; c.globalAlpha = .75 + prand(i, 64)*.25;
    c.beginPath(); c.arc(x, y, .9 + prand(i, 65)*1.1, 0, 7); c.fill();
  }
  c.globalAlpha = 1;

  // --- landmarks (drawn before shoreline trees so trees sit in front)
  const cabin = (x, y, w, h, wall, roof) => {
    c.fillStyle = wall; c.fillRect(x - w/2, y - h, w, h);
    c.fillStyle = roof; c.beginPath(); c.moveTo(x - w/2 - 3, y - h); c.lineTo(x, y - h - h*.7); c.lineTo(x + w/2 + 3, y - h); c.fill();
    c.fillStyle = "rgba(40,30,20,.6)"; c.fillRect(x - 2, y - h*.6, 4, h*.6); c.fillStyle = "#cfe6f2"; c.fillRect(x + w*.18, y - h*.75, 4, 3);
  };
  if (L.id === "dixon"){
    cabin(300, B - 8, 26, 12, "#c9b48a", "#9c3b2e");                      // bait shop
    c.strokeStyle = "#ddd"; c.lineWidth = 1; c.beginPath(); c.moveTo(322, B - 8); c.lineTo(322, B - 34); c.stroke();
    c.fillStyle = "#3b6fb5"; c.fillRect(322, B - 34, 8, 5);                // flag
    for (let i = 0; i < 18; i++){ const x = 40 + prand(i, 71)*400, y = ridge(x, seed + 4, 18, B - 38) + 6 + prand(i, 72)*14;   // big granite boulders
      c.fillStyle = "#b5ada0"; c.beginPath(); c.ellipse(x, y, 3 + prand(i, 73)*5, 2.2 + prand(i, 74)*3, 0, 0, 7); c.fill();
      c.fillStyle = "rgba(255,255,255,.25)"; c.beginPath(); c.ellipse(x - 1, y - 1, 2, 1.2, 0, 0, 7); c.fill(); }
    for (let r = 0; r < 4; r++) for (let k = 0; k < 8; k++){ const x = 365 + k*11 + r*5 + prand(r*9 + k, 75)*3, y = ridge(x, seed + 4, 18, B - 38) + 5 + r*5;   // avocado grove in rows
      c.fillStyle = "rgba(0,0,0,.15)"; c.beginPath(); c.ellipse(x + 1, y + 2.2, 3.4, 1, 0, 0, 7); c.fill();
      c.fillStyle = "#2d4f2c"; c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); c.fillStyle = "#4b7040"; c.beginPath(); c.arc(x - .8, y - 1, 1.5, 0, 7); c.fill(); }
  }
  if (L.id === "poway"){
    c.fillStyle = "#f2efe6"; c.fillRect(330, B - 20, 22, 2); for (let k = 0; k < 4; k++) c.fillRect(331 + k*6.5, B - 20, 1.5, 12);   // gazebo
    c.fillStyle = "#6b4a33"; c.beginPath(); c.moveTo(327, B - 20); c.lineTo(341, B - 29); c.lineTo(355, B - 20); c.fill();
  }
  if (L.id === "jennings"){
    c.fillStyle = "#a33a2c"; c.fillRect(350, B - 30, 30, 16); c.fillStyle = "#7c2a20"; c.beginPath(); c.moveTo(346, B - 30); c.lineTo(365, B - 42); c.lineTo(384, B - 30); c.fill();   // red barn
    c.strokeStyle = "#f2e6d0"; c.lineWidth = 1; c.strokeRect(360, B - 24, 10, 10); c.beginPath(); c.moveTo(360, B - 24); c.lineTo(370, B - 14); c.moveTo(370, B - 24); c.lineTo(360, B - 14); c.stroke();
    c.strokeStyle = "#8b8f95"; c.lineWidth = 1.2; c.beginPath(); c.moveTo(402, B - 14); c.lineTo(410, B - 62); c.lineTo(418, B - 14); c.moveTo(404, B - 30); c.lineTo(416, B - 30); c.moveTo(406, B - 46); c.lineTo(414, B - 46); c.stroke();   // windmill tower (blades spin live)
    [[440, "#e8e3d4"], [458, "#e2743a"]].forEach(([x, col]) => { c.fillStyle = col; c.beginPath(); c.moveTo(x, B - 8); c.lineTo(x + 8, B - 20); c.lineTo(x + 16, B - 8); c.fill(); });   // campground tents
  }
  if (L.id === "cuyamaca"){
    cabin(385, B - 8, 28, 13, "#7a4f2e", "#4b3a2e");                      // log cabin store
    c.strokeStyle = "rgba(60,35,20,.5)"; c.lineWidth = .8; for (let k = 0; k < 4; k++){ c.beginPath(); c.moveTo(371, B - 10 - k*3); c.lineTo(399, B - 10 - k*3); c.stroke(); }
  }
  if (L.id === "elcap"){
    c.fillStyle = "#cfcac0"; c.beginPath(); c.moveTo(380, B - 4); c.lineTo(392, B - 36); c.lineTo(SW, B - 36); c.lineTo(SW, B - 4); c.fill();   // the dam
    c.fillStyle = "rgba(0,0,0,.12)"; for (let k = 0; k < 5; k++) c.fillRect(398 + k*16, B - 36, 2, 32);
  }
  if (L.id === "otay"){
    [[330, 34], [368, 24], [396, 40]].forEach(([x, w]) => { c.fillStyle = "#eef0f0"; c.fillRect(x, B - 15, w, 10); c.fillStyle = "#9fb3c2"; c.fillRect(x, B - 17, w, 2); c.fillStyle = "#6b8aa6"; for (let k = 3; k < w - 3; k += 6) c.fillRect(x + k, B - 12, 3, 3); });   // training center
    ["#d33a3a", "#f2f2f2", "#2f5fb3"].forEach((col, k) => { c.strokeStyle = "#ccc"; c.lineWidth = .8; c.beginPath(); c.moveTo(444 + k*8, B - 6); c.lineTo(444 + k*8, B - 30); c.stroke(); c.fillStyle = col; c.fillRect(444 + k*8, B - 30, 6, 4); });
  }

  // --- trees along the shore, in each lake's own style
  const oak = (x, y, r, col) => { c.fillStyle = col; for (let k = 0; k < 4; k++){ c.beginPath(); c.arc(x + (k - 1.5) * r*.55, y - r*.4 - (k % 2) * r*.35, r*.7, 0, 7); c.fill(); }

  const palm = (x, y, h) => { c.strokeStyle = "#7a6248"; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 4, y - h*.5, x + 2, y - h); c.stroke();
    c.strokeStyle = "#3f6b3a"; c.lineWidth = 1.6; for (let k = 0; k < 7; k++){ const a = -Math.PI + k*Math.PI/6; c.beginPath(); c.moveTo(x + 2, y - h); c.quadraticCurveTo(x + 2 + Math.cos(a)*8, y - h - 5, x + 2 + Math.cos(a)*13, y - h + 4 + Math.abs(Math.sin(a))*2); c.stroke(); } };
  const scrub = (x, y, r) => { c.fillStyle = "#6a6a3e"; c.beginPath(); c.ellipse(x, y - r*.4, r, r*.55, 0, 0, 7); c.fill(); c.fillStyle = "rgba(160,150,90,.35)"; c.beginPath(); c.ellipse(x - r*.3, y - r*.6, r*.5, r*.25, 0, 0, 7); c.fill(); };
  if (L.id === "cuyamaca"){ for (let i = 0; i < 26; i++){ const x = prand(i, 81)*W; if (x > 366 && x < 404) continue; pine(x, B - 4 - prand(i, 82)*14, 18 + prand(i, 83)*20); } }
  else if (L.id === "otay"){ for (let i = 0; i < 4; i++) palm(40 + i*52 + prand(i, 91)*20, B - 5, 26 + prand(i, 92)*10); for (let i = 0; i < 10; i++) scrub(prand(i, 93)*W, B - 5, 3 + prand(i, 94)*3); }
  else if (L.id === "elcap"){ for (let i = 0; i < 16; i++){ const x = prand(i, 95)*370; scrub(x, B - 5 - prand(i, 96)*8, 3 + prand(i, 97)*4); } oak(60, B - 6, 9, "#3a4f2c"); }
  else {

// far underwater: dim rock ridges and schools of little fish, moving slower than the foreground (depth)
function drawDeepBackdrop(T, sy, so, night){
  const L = T.lake, deepC = mixHex(L.water[0], L.water[1], .85), base = sy(T.bottom) + T.camY * .25, a = .55 * (1 - .4 * night), hs = clamp(T.bottom / (50 * PPF), .35, 1);
  if (base > -40){
    ctx.globalAlpha = a * .55; ctx.fillStyle = deepC; ctx.beginPath(); ctx.moveTo(0, H + 50);
    for (let x = 0; x <= W; x += 16) ctx.lineTo(x, base - (90 + Math.sin((x + so * .2) * .011) * 60 + Math.abs(Math.sin((x + so * .2) * .031)) * 40) * hs);
    ctx.lineTo(W, H + 50); ctx.fill();
    ctx.globalAlpha = a * .8; ctx.fillStyle = mixHex(L.water[1], "#000000", .2); ctx.beginPath(); ctx.moveTo(0, H + 50);
    for (let x = 0; x <= W; x += 14) ctx.lineTo(x, base - (30 + Math.sin((x + so * .4) * .017 + 2) * 34 + Math.abs(Math.sin((x + so * .4) * .05)) * 22) * hs);
    ctx.lineTo(W, H + 50); ctx.fill();
  }
  // two far-off schools drifting by
  ctx.fillStyle = mixHex(L.water[1], "#000000", .1);
  for (let s = 0; s < 2; s++){
    const sx = ((T.t * (9 + s * 5) + s * 420 + so * .3) % (W + 300)) - 150, syy = sy(T.bottom * (.35 + s * .25)) + T.camY * .35;
    if (syy < -60 || syy > H + 60) continue;
    for (let i = 0; i < 9; i++){ const fx = sx + prand(i, 71 + s) * 90, fy = syy + prand(i, 81 + s) * 40 + Math.sin(T.t * 1.5 + i) * 3;
      ctx.globalAlpha = a * .45; ctx.beginPath(); ctx.ellipse(fx, fy, 6, 2.2, 0, 0, 7); ctx.moveTo(fx - 5, fy); ctx.lineTo(fx - 9, fy - 2.5); ctx.lineTo(fx - 9, fy + 2.5); ctx.fill(); }

// the lake floor: boulders with moss, swaying grass, and sunlight dancing on the sand in shallow water
function drawBottomLife(T, by2, so, bottomY){
  const shallow = clamp(1 - bottomY / PPF / 45, 0, 1) * (1 - .8 * cloudAmt()) * (1 - (T === trip ? nightAmt() : 0));

    ctx.save(); ctx.globalAlpha = .22 * shallow; ctx.beginPath(); ctx.rect(0, by2 - 4, W, 60); ctx.clip();

    const x = ((prand(i, 95) * (W + 40) + so) % (W + 40)) - 20, y = by2 + 4 + prand(i, 96) * 6, h = 10 + prand(i, 97) * 16;

// the shore, upside down and wobbly, on the water

// big reel button: icon + label follow the situation
let lastMode = "";
function syncReelBtn(){
  const T = trip, show = state === "fishing" && T && T.phase !== "done";
  reelBtn.classList.toggle("show", !!show);
  const ready = !!(show && T.phase === "ready");
  $("baitBar").classList.toggle("show", ready && uiSheet === "bait");
  $("optSheet").classList.toggle("show", ready && uiSheet === "opt");
  $("baitBtn").classList.toggle("show", ready);
  $("optBtn").classList.toggle("show", ready);
  const canTroll = !!(show && T.mode === "boat" && !T.boss && (T.phase === "ready" || (T.phase === "troll" && !T.strike)));
  $("trollBtn").classList.toggle("show", canTroll);
  $("bellBtn").classList.toggle("show", !!(show && visit && visit.holder && visit.holder.bite > 0));
  if (canTroll){ const on = T.phase === "troll"; $("trollIcon").textContent = on ? "🛑" : "🚤"; $("trollLbl").textContent = on ? "Stop" : "Troll"; }
  $("reelGfx").classList.toggle("show", !!show);
  $("btnMute").style.display = state === "fishing" ? "none" : "";
  $("btnBug").style.display = state === "fishing" || state === "results" ? "none" : "";
  if (!show) return;
  let mode, label;
  if (T.phase === "ready" || T.phase === "cast"){ mode = "cast"; label = T.phase === "cast" ? "" : "TAP TO CAST"; }
  else if (T.nibble){ const b = T.nibble.stage === "bite"; mode = b ? "tap danger" : "out"; label = b ? "SET THE HOOK!" : "WAIT..."; }
  else if (T.phase === "drop"){ mode = "out"; label = "TAP TO STOP"; }
  else if (T.phase === "troll"){ mode = T.strike ? "tap danger" : "hold"; label = T.strike ? "STRIKE! TAP!" : btnHeld ? "LURE UP..." : "HOLD = LURE UP"; }
  else if (T.phase === "fight"){ mode = "fight" + (T.fight && T.fight.tension > 80 ? " danger" : ""); label = T.fight && T.fight.tension > 80 ? "LET GO!" : "HOLD!"; }
  else if (T.autoUp){ mode = "auto"; label = "REELING IN!"; }
  else if (T.caught.length){ mode = "tap"; label = "TAP TAP TAP!"; }
  else { mode = "hold"; label = T.fouled ? "REEL IT ALL IN" : T.bobber && !btnHeld ? "WAIT... or HOLD" : "HOLD TO REEL"; }
  const key = mode + "|" + label;
  if (key !== lastMode){
    lastMode = key;
    reelBtn.className = "show " + mode + (btnHeld ? " down" : "");
    $("reelGfx").className = "show" + (mode.includes("danger") ? " danger" : "");
    $("reelLabel").textContent = label;
    const cast = mode === "cast";
    $("rCast").style.display = cast ? "" : "none"; $("rSpool").style.display = cast ? "none" : ""; $("rHandle").style.display = cast ? "none" : "";
  }
  $("rHandle").setAttribute("transform", "rotate(" + (T.reelAng % 360).toFixed(1) + " 50 50)");
  $("rSpool").setAttribute("transform", "rotate(" + (T.spoolAng % 360).toFixed(1) + " 50 50)");
}

const idle = makeIdle();

  idle.t += dt;
  for (const f of idle.fish){ f.x += f.dir*f.speed*dt; f.y = f.baseY + Math.sin(idle.t*1.3+f.phase)*6; if (f.x > W+90) f.x = -90; if (f.x < -90) f.x = W+90; }

//  MAIN LOOP
// =====================================================================
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  ctx.clearRect(0,0,W,H);
  syncReelBtn();
  if (state === "fishing" && trip){
    const J = trip.jump, slow = J && J.t / J.dur > .3 && J.t / J.dur < .7 ? .4 : 1;
    updateFishing(dt * slow);
    if (trip){
      const k = trip.kick || 0;
      ctx.save(); if (k > .05) ctx.translate((Math.random() - .5) * k * 9, (Math.random() - .5) * k * 9);
      renderScene(trip, false); ctx.restore();
      if (k > .5){ ctx.fillStyle = "rgba(255,255,255," + ((k - .5) * .35).toFixed(2) + ")"; ctx.fillRect(0, 0, W, H); }
    } else renderScene(idle, true);
  }
  else { updateIdle(dt); renderScene(idle, true); }
  requestAnimationFrame(loop);
}

const WILD_ORDER = ["osprey", "merganser", "heron", "turtle", "crawdad", "bullfrog", "pelican", "sealion", "dolphin", "gull"];
// a big moment (osprey or duck) comes every 14-26 minutes of fishing, about 1-2 times in 30-45 minutes;
// a quiet sighting every 4-8 minutes
function wildClock(){ return S.wild = S.wild || { t: 0, nextBig: rand(14, 26) * 60, nextSee: rand(4, 8) * 60, seen: {} }; }
function wildSeen(kind){
  const w = wildClock(), first = !w.seen[kind]; w.seen[kind] = (w.seen[kind] || 0) + 1;
  if (first){ S.coins += 10; toast("📸 New in your Wildlife album: " + WILD[kind].icon + " " + WILD[kind].name + "! +10 🪙", 3200); SFX.land(); }
}
function updateWild(T, dt){
  if (T.boss) return;
  const w = wildClock(); w.t += dt;
  const A = T.wild;
  if (!A){
    const hooked = T.caught.length && T.caught[0], dep = T.hook.y / PPF, inView = T.phase === "ready" || (T.phase !== "fight" && dep < 10);
    if (w.t > w.nextBig && inView && !T.jump){                         // waits until the surface is on screen
      w.nextBig = w.t + rand(14, 26) * 60;
      if (T.lake.ocean) w.nextBig = w.t + rand(8, 16) * 60;          // sea lions and pelicans are bolder than lake birds
      const kind = T.lake.ocean ? (Math.random() < .5 ? "pelican" : "sealion") : Math.random() < .55 ? "osprey" : "merganser";
      if (hooked && T.phase === "reel" && (kind === "osprey" || kind === "sealion" || fishLb(hooked) < 1.5)) startRaid(T, kind, hooked);
      else startShow(T, kind);
    } else if (w.t > w.nextSee && T.phase !== "fight"){
      w.nextSee = w.t + rand(4, 8) * 60;
      const opts = T.lake.ocean ? ["dolphin", "gull"] : ["heron", "turtle", "crawdad"].concat(isNight() ? ["bullfrog", "bullfrog"] : []);
      const kind = opts[Math.floor(Math.random() * opts.length)];
      T.wild = { kind, mode:"see", t:0, dur: kind === "crawdad" ? 16 : kind === "turtle" || kind === "dolphin" ? 14 : 12, dir: Math.random() < .5 ? 1 : -1 };
      if (kind === "bullfrog") SFX.croak();
      wildSeen(kind);
    }
    return;
  }
  A.t += dt;
  if (A.mode === "snatch"){                                           // a bird swoops down and grabs your fish right at the surface
    if (A.stage === "in" && A.t > .8){
      const i = T.caught.indexOf(A.f); if (i >= 0){ T.caught.splice(i, 1); T.lost++; T.chain = null; T.tired = false; }
      A.stage = "out"; A.t = 0; A.carry = A.f; SFX.splash(); splashAt(T, A.x, 0, 14); S.coins += 5; showCoins();
      pop(W / 2, -70, (A.kind === "pelican" ? "🐦 A pelican" : "🦅 An osprey") + " stole your " + A.f.sp.name + "!!! (+5 🪙 for the photo)", "#ffd0c8", 18);
    } else if (A.stage === "out" && A.t > 1.8){ T.wild = null; T.phase = "done"; T.doneT = 0; }
    return;
  }
  if (A.mode === "raid"){                                             // after your hooked fish: tap fast to scare it off!
    const f = T.caught[0];
    if (A.stage === "warn"){ if (!f || T.caught[0] !== A.f){ T.wild = null; return; }
      if (A.taps >= A.need){ A.stage = "flee"; A.t = 0; SFX.shield(); pop(T.hook.x, -60, "You scared it off! +5 🪙", "#bff5c8", 20); S.coins += 5; showCoins(); return; }
      if (A.t > A.win){ A.stage = "grab"; A.t = 0; } }
    else if (A.stage === "grab"){ if (A.t > .45){
        const i = T.caught.indexOf(A.f); if (i >= 0){ T.caught.splice(i, 1); T.lost++; T.chain = null; T.tired = false; }
        A.stage = "flee"; A.t = 0; A.carry = A.f; SFX.splash(); splashAt(T, T.hook.x, 0, 16); S.coins += 5; showCoins();
        pop(T.hook.x, -60, ({ osprey:"🦅 The osprey", pelican:"🐦 The pelican", sealion:"🦭 The sea lion" }[A.kind] || "🦆 The duck") + " stole your fish! (+5 🪙 for the photo)", "#ffd0c8", 17); } }
    else if (A.stage === "flee" && A.t > 2.2) T.wild = null;
  } else if (A.mode === "show"){                                      // a dive on a fish swimming near the top
    if (A.stage === "in" && A.t > A.din){ A.stage = "hit"; A.t = 0; SFX.splash(); splashAt(T, A.x, 0, 18);
      const i = T.fish.indexOf(A.f); if (i >= 0) T.fish.splice(i, 1); A.carry = A.f; }
    else if (A.stage === "hit" && A.t > (A.kind === "merganser" || A.kind === "sealion" ? 1.4 : .5)){ A.stage = "out"; A.t = 0; }
    else if (A.stage === "out" && A.t > 2.6) T.wild = null;
  } else if (A.t > A.dur) T.wild = null;
}
// Now and then, just as a fish comes out of the water, a bird swoops in and steals it. Never a boss, a legend, a rare look,
// a trophy or a kind you haven't caught before, never a big fish, and at most once every 10 minutes of fishing.
const SNATCH = { chance: .08 };
function trySnatch(T){
  const f = T.caught[0], w = wildClock();
  if (!f || T.boss || T.wild || f.boss || f.nightLegend || f.sp.legend || f.variant || f.trophy || !S.dex[f.id] || fishLb(f) > 4) return false;
  if (w.t < (w.nextSnatch || 0) || Math.random() > SNATCH.chance) return false;
  w.nextSnatch = w.t + 10 * 60;
  const kind = T.lake.ocean ? "pelican" : "osprey";
  T.phase = "snatch"; T.wild = { kind, mode:"snatch", stage:"in", t:0, f, x: T.hook.x, dir: T.hook.x < W/2 ? 1 : -1 };
  wildSeen(kind); SFX.screech(kind);
  return true;
}
function startRaid(T, kind, f){
  T.wild = { kind, mode:"raid", stage:"warn", t:0, f, taps:0, need: kind === "sealion" ? 11 : kind === "osprey" || kind === "pelican" ? 8 : 6, win: 2.4, dir: T.hook.x < W/2 ? 1 : -1 };
  wildSeen(kind); SFX.screech(kind);
  pop(W / 2, -150, ({ osprey:"🦅 An osprey", pelican:"🐦 A pelican", sealion:"🦭 A sea lion" }[kind] || "🦆 A duck") + " wants your fish!", "#ffe38a", 19);
}
function startShow(T, kind){
  let f = T.fish.filter(x => !x.boss && !x.nightLegend && !x.nibbling && x.y < 7 * PPF && x.L < 70).sort((a, b) => a.y - b.y)[0];
  if (!f){ f = spawnFishFor(T.lake, 2.5 * PPF, null, true); f.x = rand(80, W - 80); T.fish.push(f); }   // a little fish right under the surface
  T.wild = { kind, mode:"show", stage:"in", t:0, f, x: f.x, din: kind === "osprey" || kind === "pelican" ? 2.2 : 3.2, dir: f.x < W/2 ? 1 : -1 };
  wildSeen(kind); SFX.screech(kind);
}

  g.fillStyle = "#333"; g.beginPath(); g.moveTo(16, -1); g.lineTo(18.5, .2); g.lineTo(16, 1); g.fill();
