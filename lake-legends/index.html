<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lake Legends: Deep Drop</title>
<meta name="description" content="A San Diego lake fishing game for kids. Drop your hook, catch real local fish, and fill your Fishdex!">
<style>
  :root { --ink:#0f2a3d; --paper:#fffaf0; --gold:#f5b82e; --green:#3fa34d; --red:#e0483a; --blue:#2f7fb5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  button { touch-action:manipulation; }
  html,body { margin:0; height:100%; background:#0b2233; overflow:hidden; font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif; color:var(--ink); user-select:none; -webkit-user-select:none; }
  #wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); aspect-ratio:480/720; overflow:hidden; border-radius:.6em; box-shadow:0 0 40px rgba(0,0,0,.5); }
  #c { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  canvas { display:block; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; padding:1.2em 1em; overflow-y:auto; }
  .screen.show { display:flex; }
  .dim { background:rgba(8,30,48,.55); }
  h1 { font-size:2.6em; margin:.3em 0 0; color:#fff; text-align:center; line-height:1; text-shadow:0 .08em 0 #0b3a57, 0 .15em .3em rgba(0,0,0,.4); }
  h1 small { display:block; font-size:.45em; color:var(--gold); letter-spacing:.15em; margin-top:.3em; }
  h2 { color:#fff; margin:.2em 0 .5em; font-size:1.6em; text-shadow:0 .08em 0 #0b3a57; text-align:center; }
  .btn { font:inherit; font-size:1.15em; font-weight:bold; border:none; border-radius:.7em; padding:.6em 1.2em; margin:.3em; cursor:pointer; color:#fff; background:var(--green); box-shadow:0 .22em 0 #22702f; transition:transform .05s; }
  .btn:active { transform:translateY(.15em); box-shadow:0 .07em 0 #22702f; }
  .btn.blue { background:var(--blue); box-shadow:0 .22em 0 #1d5680; }
  .btn.gold { background:var(--gold); color:#3a2600; box-shadow:0 .22em 0 #b27f10; }
  .btn.red { background:var(--red); box-shadow:0 .22em 0 #9b2a20; }
  .btn.small { font-size:.9em; padding:.45em .8em; }
  .btn:disabled { background:#8a98a3; box-shadow:0 .22em 0 #5e6a73; cursor:default; }
  .card { background:var(--paper); border-radius:.9em; padding:.8em 1em; margin:.35em 0; width:100%; box-shadow:0 .2em 0 rgba(0,0,0,.2); }
  .row { display:flex; align-items:center; gap:.7em; }
  .grow { flex:1; min-width:0; }
  .coins { color:#fff; font-weight:bold; font-size:1.1em; background:rgba(0,0,0,.3); border-radius:2em; padding:.25em .8em; }
  .topbar { width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:.3em; }
  .muted { color:#5b6b76; font-size:.85em; }
  .howto { background:rgba(255,250,240,.93); border-radius:.9em; padding:.7em 1em; margin:1em 0 .6em; font-size:.92em; line-height:1.35; max-width:22em; }
  .howto b { color:var(--blue); }
  .lake h3 { margin:0; font-size:1.15em; }
  .lake.locked { opacity:.85; background:#e7e2d6; }
  .tag { display:inline-block; font-size:.75em; font-weight:bold; border-radius:1em; padding:.1em .6em; background:#dfeef7; color:#1d5680; margin-right:.3em; }
  .tag.new { background:var(--gold); color:#3a2600; }
  .tag.trophy { background:#7a4cc2; color:#fff; }
  .dexgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.5em; width:100%; }
  .dexcell { background:var(--paper); border-radius:.8em; padding:.4em; text-align:center; cursor:pointer; font-size:.8em; font-weight:bold; box-shadow:0 .2em 0 rgba(0,0,0,.2); }
  .dexcell.unk { background:#c9d6de; color:#51626e; }
  .dexcell.legend { background:linear-gradient(#fff4c9,#f5d56b); }
  .dexcell canvas, .card canvas, #modalBox canvas { width:100%; height:auto; display:block; }
  #modal { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,20,32,.7); padding:1em; z-index:40; }
  #modal.show { display:flex; }
  #modalBox { background:var(--paper); border-radius:1em; padding:1em; width:100%; max-height:95%; overflow-y:auto; text-align:center; }
  #modalBox h3 { margin:.2em 0; font-size:1.5em; }
  #modalBox ul { text-align:left; padding-left:1.2em; margin:.5em 0; line-height:1.35; }
  #modalBox .facts li { margin-bottom:.35em; }
  #hud { position:absolute; left:0; right:0; top:0; display:none; justify-content:space-between; align-items:flex-start; padding:.6em; pointer-events:none; z-index:5; }
  #hud.show { display:flex; }
  #hud .pill { background:rgba(0,0,0,.45); color:#fff; font-weight:bold; border-radius:2em; padding:.3em .8em; margin-bottom:.3em; font-size:1em; }
  #hud .btn { pointer-events:auto; }
  #hud > div:first-child { position:relative; }
  #hudCoins { display:inline-block; color:#ffe38a; }
  #coinPop { position:absolute; left:5.4em; top:2.2em; white-space:nowrap; color:#ffe38a; font-weight:bold; font-size:1.2em; text-shadow:0 1px 3px #000; opacity:0; pointer-events:none; }
  #coinPop.go { animation:coinUp 1.4s ease-out forwards; }
  @keyframes coinUp { 0%{ opacity:1; transform:translateY(0) scale(1.2); } 70%{ opacity:1; } 100%{ opacity:0; transform:translateY(-1.2em) scale(1); } }
  #toast { position:absolute; left:50%; bottom:7.2em; max-width:92%; transform:translateX(-50%); background:rgba(0,0,0,.7); color:#fff; padding:.5em 1em; border-radius:1em; font-weight:bold; display:none; z-index:30; text-align:center; }
  .shopitem .lvl { display:flex; gap:.2em; margin-top:.2em; }
  .shopitem .lvl i { width:1.1em; height:.5em; border-radius:.3em; background:#cfd8de; display:block; }
  .shopitem .lvl i.on { background:var(--green); }
  .mute { position:absolute; right:.6em; bottom:.6em; z-index:25; }
  /* the whole bottom strip is the reel control: tap / hold anywhere in it */
  #reelBtn { position:absolute; left:50%; bottom:1.3em; transform:translateX(-50%); width:13em; height:4.8em; border-radius:1.4em; padding:0; display:none; z-index:6; cursor:pointer; touch-action:none;
    border:.18em solid rgba(255,255,255,.7); box-shadow:0 .3em 0 rgba(0,0,0,.35), 0 .4em 1em rgba(0,0,0,.3);
    background:linear-gradient(#2f6a8f, #123247); font:inherit; }
  #reelBtn.show { display:block; }
  #baitBar { position:absolute; left:0; right:0; bottom:7.4em; display:none; flex-wrap:wrap; justify-content:center; gap:.35em; padding:0 1em; z-index:6; }
  #baitBar.show, #optSheet.show { display:flex; }
  #optSheet { position:absolute; left:0; right:0; bottom:7.4em; display:none; flex-direction:column; align-items:center; gap:.4em; z-index:7; }
  #optSheet .chip { font-size:1em; min-width:12em; }
  .sidebtn { position:absolute; bottom:1.7em; width:4em; height:4em; border-radius:50%; border:none; padding:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,250,240,.95); color:var(--ink); z-index:6; cursor:pointer; box-shadow:0 .2em 0 rgba(0,0,0,.25); touch-action:manipulation; }
  .sidebtn.show { display:flex; }
  .sidebtn span { font-size:1.6em; line-height:1.1; }
  .sidebtn small { font-size:.68em; font-weight:bold; }
  #baitBtn { left:.8em; } #optBtn { right:.8em; } #trollBtn { right:.8em; bottom:6.4em; }
  .tagline { color:#fff; font-weight:bold; font-size:1.2em; text-shadow:0 1px 3px #0b3a57; margin:.8em 0 1.4em; }
  #baitBar .lbl { width:100%; text-align:center; color:#fff; font-weight:bold; text-shadow:0 1px 3px #000; font-size:.95em; }
  .chip { font:inherit; font-size:.85em; font-weight:bold; border:none; border-radius:2em; padding:.4em .75em; background:rgba(255,250,240,.92); color:var(--ink); cursor:pointer; touch-action:manipulation; }
  .chip.on { background:var(--gold); color:#3a2600; box-shadow:0 0 0 .18em #fff; }
  .chip.buy { background:rgba(214,234,246,.95); }
  .chip:disabled { opacity:.5; cursor:default; }
  .chip .price { font-size:.85em; background:rgba(0,0,0,.08); border-radius:1em; padding:.05em .4em; margin-left:.2em; }
  .kr { display:flex; gap:.4em; margin-top:.4em; }
  .kr .btn { flex:1; margin:0; font-size:.95em; padding:.5em; }
  .kr .btn.off { background:#c9d2d8; color:#51626e; box-shadow:0 .22em 0 #9aa6ae; }
  .rule { font-size:.85em; margin-top:.3em; padding:.3em .5em; border-radius:.5em; background:#eef4f7; }
  .rule.no { background:#fbe3df; } .rule.yes { background:#e2f3e4; }
  .lakebtns { display:flex; flex-direction:column; gap:.3em; flex:none; }
  .lakebtns .btn { margin:0; font-size:.95em; padding:.5em .8em; }
  .boss { margin-top:.5em; padding-top:.5em; border-top:1px dashed #d6ccb8; }
  .bossbar { height:.5em; border-radius:.3em; background:#e3dccd; overflow:hidden; margin-top:.25em; }
  .bossbar i { display:block; height:100%; background:var(--red); }
  .sech { color:#fff; margin:.8em 0 .2em; width:100%; font-size:1.15em; text-shadow:0 1px 2px #0b3a57; }
  #reelBtn.down { filter:brightness(1.25); transform:translateX(-50%) translateY(.15em); box-shadow:0 .1em 0 rgba(0,0,0,.35); }
  #reelBtn.cast { background:linear-gradient(#4cc062, #1f6e2e); animation:glow 1.2s ease-in-out infinite; }
  #reelBtn.tap  { background:linear-gradient(#f7c64a, #a8740a); }
  #reelBtn.fight { background:linear-gradient(#e0584a, #7d1c14); }
  #reelBtn.danger { animation:flash .25s linear infinite; }
  #reelLabel { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; white-space:nowrap; color:#fff; font-weight:bold; font-size:1.3em; letter-spacing:.06em; text-shadow:0 1px 3px #000, 0 0 8px rgba(0,0,0,.6); pointer-events:none; }
  #reelLabel small { display:block; font-size:.5em; letter-spacing:.1em; opacity:.8; }
  #reelGfx { position:absolute; top:.6em; right:.6em; width:4.8em; height:4.8em; border-radius:50%; display:none; z-index:6; pointer-events:none;
    background:radial-gradient(circle at 50% 40%, #2f6a8f, #0f2b40); box-shadow:0 0 0 .22em rgba(255,255,255,.35), 0 .3em .8em rgba(0,0,0,.4); }
  #reelGfx.show { display:block; }
  #reelGfx.danger { animation:shake .12s linear infinite; }
  #reelGfx svg { width:84%; height:84%; display:block; margin:8% auto 0; }
  @keyframes glow { 50% { filter:brightness(1.3); } }
  @keyframes flash { 50% { filter:brightness(1.6); } }
  @keyframes shake { 0%{ margin-right:-2px } 50%{ margin-right:2px } 100%{ margin-right:-2px } }
  @media (prefers-reduced-motion: reduce) { #reelBtn.cast, #reelBtn.danger, #reelGfx.danger { animation:none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="720"></canvas>

  <!-- HUD during fishing: one small info pill + a reel-in button while the line is out -->
  <div id="hud">
    <div><div class="pill" id="hudInfo">⬇ 0 ft</div><div class="pill" id="hudCoins">🪙 0</div><span id="coinPop"></span></div>
  </div>

  <div id="baitBar"></div>
  <div id="optSheet"></div>
  <button class="sidebtn" id="baitBtn" aria-label="Bait"><span id="baitIcon">🥄</span><small id="baitLbl">Bait</small></button>
  <button class="sidebtn" id="optBtn" aria-label="More options"><span>☰</span><small>More</small></button>
  <button class="sidebtn" id="trollBtn" aria-label="Troll"><span id="trollIcon">🚤</span><small id="trollLbl">Troll</small></button>
  <!-- Reel control: the whole bottom strip -->
  <button id="reelBtn" aria-label="Reel"><span id="reelLabel">TAP TO CAST</span></button>
  <!-- Reel animation: always in the same spot, top right -->
  <div id="reelGfx" aria-hidden="true">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="42" fill="#17344a" stroke="#a9c3d3" stroke-width="5"/>
      <g id="rSpool"><circle cx="50" cy="50" r="27" fill="#e2c979"/>
        <path d="M50 23 A27 27 0 0 1 77 50" stroke="#8a6f2a" stroke-width="4" fill="none"/>
        <path d="M50 77 A27 27 0 0 1 23 50" stroke="#8a6f2a" stroke-width="4" fill="none"/></g>
      <g id="rHandle"><rect x="46.5" y="16" width="7" height="36" rx="3.5" fill="#eef3f6"/>
        <circle cx="50" cy="18" r="9.5" fill="#f5b82e" stroke="#9c6d0c" stroke-width="3"/>
        <circle cx="50" cy="50" r="7" fill="#eef3f6"/></g>
      <g id="rCast"><path d="M24 74 Q28 26 74 24" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M64 12 L80 24 L63 35" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    </svg>
  </div>

  <!-- Title -->
  <div class="screen show" id="scrTitle">
    <h1>Lake Legends<small>DEEP DROP</small></h1>
    <p class="tagline">Fish real San Diego lakes!</p>
    <button class="btn" id="btnPlay" style="font-size:1.5em">🎣 Let's Fish!</button>
    <div style="margin-top:.6em"><button class="btn blue small" id="btnHow">How to play</button><button class="btn blue small" id="btnLakes">🗺️ Lakes</button></div>
  </div>

  <!-- Lake map -->
  <div class="screen dim" id="scrMap">
    <div class="topbar"><span class="coins" id="mapCoins">🪙 0</span><span><button class="btn blue small" id="btnDex">📖 Fishdex</button><button class="btn gold small" id="btnShop">🛒 Tackle Shop</button></span></div>
    <h2>Pick a Lake</h2>
    <div id="champ" class="coins" style="display:none;margin-bottom:.4em">🏆 You're a Lake Legend! 🏆</div>
    <div id="lakeList" style="width:100%"></div>
  </div>

  <!-- Shop -->
  <div class="screen dim" id="scrShop">
    <div class="topbar"><span class="coins" id="shopCoins">🪙 0</span><button class="btn blue small" data-go="map">⬅ Lakes</button></div>
    <h2>Tackle Shop</h2>
    <div id="shopList" style="width:100%"></div>
  </div>

  <!-- Fishdex -->
  <div class="screen dim" id="scrDex">
    <div class="topbar"><span class="coins" id="dexCount">0/15</span><button class="btn blue small" data-go="map">⬅ Lakes</button></div>
    <h2>Fishdex</h2>
    <div class="dexgrid" id="dexGrid"></div>
    <div class="sech">🏆 Boss Trophies</div>
    <div class="dexgrid" id="bossGrid"></div>
    <button class="btn red small" id="btnReset" style="margin-top:1.5em;opacity:.7">Start over</button>
  </div>

  <!-- Results -->
  <div class="screen dim" id="scrResults">
    <h2 id="resTitle">Trip Results</h2>
    <div id="resList" style="width:100%"></div>
    <div class="coins" id="resTotal" style="margin:.5em 0">+0 🪙</div>
    <div class="kr" style="width:100%;max-width:22em"><button class="btn blue" id="btnRelease">💧 Release</button><button class="btn" id="btnCollect">Cast again!</button></div>
  </div>

  <div id="modal"><div id="modalBox"></div></div>
  <div id="toast"></div>
  <button class="btn blue small mute" id="btnMute">🔊</button>
</div>

<script>
"use strict";
// =====================================================================
//  DATA — San Diego County lake fish
// =====================================================================
const W = 480, H = 720, PPF = 16; // pixels per foot

const SPECIES = {
  bluegill:  { name:"Bluegill", shape:"sun", cheek:"#3d6fb5", body:"#5e7d52", belly:"#e3a64a", fin:"#4f6b46", mark:"bars", markC:"rgba(30,50,40,.35)", ear:"#15213d",
    min:4, max:11, k:1250, rar:10, d:[.02,.42], val:3, str:.8,
    facts:["It's named for the blue-black flap on the edge of its gill cover.","Dad bluegills build nests by fanning the lake bottom with their tails, then guard the eggs.","Found in all nine City of San Diego reservoirs, so it's many kids' first fish!"] },
  greensun:  { name:"Green Sunfish", shape:"sun", body:"#4b7a62", belly:"#eccb5c", fin:"#3f6653", mark:"speckle", markC:"rgba(120,215,210,.8)", ear:"#111", earEdge:"#f1d36b",
    min:3, max:9, k:1300, rar:7, d:[.02,.35], val:3, str:.8,
    facts:["Look for turquoise squiggles on its cheeks.","It has a bigger mouth than most sunfish, so it can gulp small fish.","It's super tough and can live in warm, muddy water where other fish can't."] },
  redear:    { name:"Redear Sunfish", shape:"sun", body:"#7c8a55", belly:"#f0c060", fin:"#6b7848", mark:"speckle", markC:"rgba(60,70,40,.35)", ear:"#222", earEdge:"#e0402a",
    min:5, max:13, k:1250, rar:6, d:[.1,.5], val:5, str:.9,
    facts:["Its nickname is \"shellcracker.\"","It has special teeth in its throat for crunching snails and clams.","Look for the bright red or orange edge on its ear flap."] },
  bcrappie:  { name:"Black Crappie", shape:"sun", tall:.5, body:"#b3b596", belly:"#eeeedc", fin:"#8f9277", mark:"speckle", markC:"rgba(35,40,30,.75)", dense:true,
    min:6, max:15, k:1500, rar:5, d:[.2,.62], val:6, str:1,
    facts:["Say it \"CROP-ee\"!","Black crappie are covered in dark speckles instead of stripes.","Big eyes help them hunt in dim light, so they bite best at sunrise and sunset."] },
  wcrappie:  { name:"White Crappie", shape:"sun", tall:.46, body:"#c7cbb6", belly:"#f5f5ec", fin:"#a3a894", mark:"bars", markC:"rgba(70,80,65,.5)",
    min:6, max:15, k:1550, rar:5, d:[.2,.62], val:6, str:1,
    facts:["White crappie have 5 to 10 faint up-and-down bars. That's how you tell them from black crappie.","They like to hang out in schools around sunken brush and trees.","They're a little more comfortable in muddy water than black crappie."] },
  trout:     { name:"Rainbow Trout", shape:"trout", body:"#6c8a6a", belly:"#f2eee2", fin:"#7e9a7a", mark:"trout",
    min:9, max:22, k:2300, rar:7, d:[.08,.5], val:8, str:1.1,
    facts:["Trout need cool water, so most San Diego lakes stock them only in fall, winter and spring.","Lake Cuyamaca sits high in the mountains (about 4,600 ft), so it's the only San Diego lake that can stock trout all year.","Look for the pink \"rainbow\" stripe along its side."] },
  largemouth:{ name:"Largemouth Bass", shape:"bass", body:"#5d7b3e", belly:"#eef0d0", fin:"#55713a", mark:"band", markC:"rgba(35,50,22,.75)",
    min:9, max:26, k:1500, rar:6, d:[.08,.56], val:10, str:1.2,
    facts:["San Diego lakes are world-famous for giant Florida-strain largemouth bass.","Its upper jaw reaches past the back of its eye. That's why it's called LARGEmouth!","Lake Miramar has produced some of the biggest bass ever caught anywhere."] },
  smallmouth:{ name:"Smallmouth Bass", shape:"bass", body:"#8a6a3a", belly:"#e8d6a8", fin:"#7a5c30", mark:"bars", markC:"rgba(60,40,15,.5)", eye:"#c0392b",
    min:8, max:20, k:1450, rar:4, d:[.25,.7], val:12, str:1.3,
    facts:["Smallmouth are bronze-brown with dark bars and often red eyes.","They're famous for leaping out of the water when hooked.","In this game you'll only find them at Lake Cuyamaca, which stocks them."] },
  channel:   { name:"Channel Catfish", shape:"cat", body:"#88909a", belly:"#e9ecef", fin:"#7b838c", mark:"dots", markC:"rgba(20,25,30,.6)", tail:"fork",
    min:12, max:32, k:2400, rar:5, d:[.55,1], val:10, str:1.3,
    facts:["A catfish's whiskers are called barbels, and they're covered in taste buds.","Catfish have taste buds all over their skin. They can taste with their whole body!","Santee Lakes has a channel catfish record close to 40 pounds."] },
  bluecat:   { name:"Blue Catfish", shape:"cat", body:"#5d7fa2", belly:"#e6eef6", fin:"#50708f", tail:"fork",
    min:16, max:50, k:2000, rar:2, d:[.68,1], val:18, str:1.8,
    facts:["The blue catfish is the biggest catfish in North America. Some weigh over 100 pounds!","Lower Otay Lake is known for giant blue cats.","They cruise the deepest parts of the lake looking for food."] },
  whitecat:  { name:"White Catfish", shape:"cat", body:"#a7abae", belly:"#fafafa", fin:"#95999c", tail:"fork",
    min:9, max:20, k:2300, rar:4, d:[.55,.97], val:9, str:1.1,
    facts:["It's a smaller cousin of the channel catfish, with a bright white belly.","Its tail is forked, but only a little.","In this game you'll find it at Lower Otay Lake."] },
  bullhead:  { name:"Bullhead", shape:"cat", body:"#5b4a30", belly:"#d8c89a", fin:"#4d3f28", tail:"square",
    min:7, max:15, k:2100, rar:5, d:[.62,1], val:7, str:1,
    facts:["It's named for its big, wide, flat head.","Unlike channel cats, its tail is square, not forked.","Bullheads can survive in water with very little oxygen."] },
  carp:      { name:"Common Carp", shape:"carp", body:"#b8923f", belly:"#efdca0", fin:"#b8643a", mark:"scales", markC:"rgba(90,60,20,.35)",
    min:14, max:34, k:1700, rar:4, d:[.45,.95], val:9, str:1.5,
    facts:["Carp can live for more than 40 years!","They have two pairs of little whiskers and big, shiny scales.","Santee Lakes has a carp record near 40 pounds."] },
  sturgeon:  { name:"Sturgeon", shape:"sturgeon", body:"#6c685e", belly:"#d8d4c8", fin:"#5d5a52", mark:"scutes",
    min:30, max:72, k:4200, rar:1.2, d:[.8,1], val:30, str:2,

// =====================================================================
let AC = null, NOISE = null;
function audioCtx(){
  if (!S.sound) return null;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    if (!NOISE){ NOISE = AC.createBuffer(1, Math.floor(AC.sampleRate*.08), AC.sampleRate); const d = NOISE.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
    return AC;
  } catch(e){ return null; }
}
window.addEventListener("pointerdown", () => audioCtx(), { once:true });
// one "tick" of a reel's ratchet: a tiny filtered noise burst
function tick(freq, vol, when=0, dur=.014){
  const ac = audioCtx(); if (!ac) return;
  try {
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime + when;
    src.buffer = NOISE; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 5;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t, Math.random()*.05); src.stop(t+dur+.01);
  } catch(e){}
}
// continuous reel sound: `rate` ticks per second
const reelSnd = { acc:0 };
function reelSound(rate, freq, vol, dt){
  if (rate <= 0 || !S.sound){ reelSnd.acc = 0; return; }
  reelSnd.acc += rate*dt; let i = 0;
  while (reelSnd.acc >= 1 && i < 6){ reelSnd.acc -= 1; tick(freq*(.92+Math.random()*.16), vol, i/rate); i++; }
}
function tone(freq, dur, type="sine", vol=.15, slide=0){
  const ac = audioCtx(); if (!ac) return;
  try {
    const AC = ac;
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq+slide), t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
  } catch(e) {}
}

function hexRgb(hex){ const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(hex, amt){                     // amt < 0 darkens, > 0 lightens
  const [r, g, b] = hexRgb(hex), f = amt < 0 ? 0 : 255, a = Math.abs(amt);
  return "rgb(" + Math.round(r + (f - r) * a) + "," + Math.round(g + (f - g) * a) + "," + Math.round(b + (f - b) * a) + ")";
}

function mixHex(a, b, t){ const A = hexRgb(a), B = hexRgb(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; }

// a see-through fin with rays: base from b0 to b1, outer edge through pts
function fin(c, b0, b1, pts, col, rays, alpha = .82){
  c.save();

  const g = c.createLinearGradient((b0[0] + b1[0]) / 2, (b0[1] + b1[1]) / 2, mid[0], mid[1]);
  g.addColorStop(0, rgbaOf(col, alpha)); g.addColorStop(1, rgbaOf(col, alpha * .45));
  c.fillStyle = g;
  c.beginPath(); c.moveTo(b0[0], b0[1]);

    if (q) c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); else c.lineTo(p[0], p[1]);

}

    const t = i / (n - 1), bx = x0 + (x1 - x0) * t, by = y0 + (y1 - y0) * t;
    pts.push([bx - (x0 - x1) * .04, by - heights[i]]);

// Painted fish are cached as small images (5 tail positions each) so the game stays smooth on phones.
const spriteCache = new Map();
const WIGS = [-1, -.5, 0, .5, 1];
function fishSprite(sp, L, frame){
  const Lq = L < 80 ? Math.round(L/2)*2 : Math.round(L/4)*4;
  const key = (sp.boss ? "B:" : "") + sp.name + "|" + Lq + "|" + frame;
  let s = spriteCache.get(key);
  if (s) return s;
  const h = Lq * shapeHr(sp) / 2 * 1.6;
  const w = Lq * 1.5 + 10, hh = Math.max(h * (sp.shape === "sturgeon" ? 5 : 3.6), Lq * .45) + 10;
  const k = 2;                                           // draw at 2x for crisp retina
  const cv2 = document.createElement("canvas"); cv2.width = Math.ceil(w*k); cv2.height = Math.ceil(hh*k);
  const c = cv2.getContext("2d"); c.scale(k, k); c.translate(w*.52, hh/2);
  paintFish(c, sp, Lq, WIGS[frame] * .9, false);
  s = { cv: cv2, w, hh, ox: w*.52, oy: hh/2 };
  if (spriteCache.size > 700) spriteCache.clear();
  spriteCache.set(key, s);
  return s;
}
function drawFish(ctx, sp, x, y, L, dir, t, opt={}){
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  if (opt.rot) ctx.rotate(opt.rot);
  if ((sp.legend || sp.boss) && !opt.silhouette){               // glowing aura
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, L*.8);
    const ac = sp.boss ? "255,95,70" : "255,225,110";
    g.addColorStop(0, "rgba(" + ac + ",.45)"); g.addColorStop(1, "rgba(" + ac + ",0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, L*.8, 0, Math.PI*2); ctx.fill();
  }
  if (opt.silhouette){ paintFish(ctx, sp, L, 0, true); ctx.restore(); return; }
  const ph = Math.sin(t*9 + (opt.phase || 0));
  const frame = Math.max(0, Math.min(4, Math.round((ph + 1) * 2)));
  const s = fishSprite(sp, L, frame);
  const k = L / (L < 80 ? Math.round(L/2)*2 : Math.round(L/4)*4);
  ctx.scale(k * (1 + ph*.015), k);                              // tiny body flex as it swims
  ctx.drawImage(s.cv, -s.ox, -s.oy, s.w, s.hh);
  ctx.restore();
}

function fishIcon(id, w=150, h=80, silhouette=false){
  const scale = 2;
  const c = document.createElement("canvas"); c.width = w*scale; c.height = h*scale;
  const cx = c.getContext("2d"), sp = typeof id === "string" ? SPECIES[id] : id;
  cx.scale(scale, scale);
  const ext = .42 * depthOf(sp) + (sp.shape === "sturgeon" ? .22 : .16) + (sp.legend ? .06 : 0);   // half-height of fish + fins, per unit length
  const L = Math.min(w*.62, h*.47/ext);
  cx.translate(w*.52, h*.52);
  paintFish(cx, sp, L, 0, silhouette);
  return c;
}

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const wrap = document.getElementById("wrap");
function layout(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  const w = W*s, h = H*s;
  wrap.style.width = w+"px"; wrap.style.height = h+"px"; wrap.style.fontSize = (16*s)+"px";
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = Math.round(W*s*dpr); cv.height = Math.round(H*s*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}

let btnHeld = false;

const reelBtn = document.getElementById("reelBtn");
reelBtn.addEventListener("pointerdown", e => { e.preventDefault(); try{ reelBtn.setPointerCapture(e.pointerId); }catch(_){} reelPress(); });
["pointerup","pointercancel","lostpointercapture"].forEach(ev => reelBtn.addEventListener(ev, reelRelease));

function reelPress(){
  if (state !== "fishing" || !trip) return;
  btnHeld = true; reelBtn.classList.add("down");
  const T = trip;
  if (T.nibble){ setHook(); return; }
  if (T.phase === "troll"){ if (T.strike) trollHook(); return; }
  if (T.phase === "ready") doCast();
  else if (T.phase === "drop") startReel("Reeling up!");
  else if (T.phase === "reel" && !T.autoUp) crank();
}
function reelRelease(){ btnHeld = false; reelBtn.classList.remove("down"); }
// how much line one crank brings in: less for heavier fish, a bit more on deeper lakes
function fishLb(f){ return weightLb(f.sp, f.inches); }
function crank(){
  const T = trip;
  let ft = 3 + T.lake.depth/40;                                               // empty hook
  if (T.caught.length) ft = clamp(3.6 / (1 + Math.sqrt(fishLb(T.caught[0]))*.3), 1.5, 3.2) * (.7 + T.lake.depth/150);
  T.pending += ft * upVal("reel") * PPF;
}

// A "visit" = you stay at one lake, casting again and again, until you leave.
let visit = null;
function startVisit(L, mode){
  if (mode === "boat"){ if (S.coins < L.boat) return; S.coins -= L.boat; save(); SFX.coin(); toast("🚣 Boat rented for your whole visit!"); }
  visit = { lake: L, mode }; S.lastLake = L.id; save();
  startTrip(L, 0, mode);
}
function continueVisit(){
  if (visit) startTrip(visit.lake, 0, visit.mode, true);
  else showScreen("map");
}
function leaveLake(){
  if (!trip) return;
  if (trip.boss){ trip = null; toast("You left the boss fight. The entry fee is gone.", 2600); continueVisit(); return; }
  if (visit) returnBait(visit.hookBait);
  save(); trip = null; visit = null; showScreen("map");
}
function toggleBoat(){
  if (!trip || trip.phase !== "ready" || !visit || trip.boss) return;
  const L = visit.lake;
  if (visit.mode === "dock"){
    if (S.coins < L.boat){ toast("A boat costs 🪙" + L.boat + "."); return; }
    S.coins -= L.boat; save(); SFX.coin(); visit.mode = "boat"; toast("🚣 Boat rented!");
  } else { visit.mode = "dock"; toast("🪵 Back to the dock"); }
  startTrip(L, 0, visit.mode, true);
}

// size badges: bronze for any catch, silver and gold for bigger ones of that species
const TIERS = [null, { icon:"🥉", name:"Bronze" }, { icon:"🥈", name:"Silver", at:.45, bonus:5 }, { icon:"🥇", name:"Gold", at:.75, bonus:15 }];
function tierOf(id, inches){
  const sp = SPECIES[id]; if (!inches) return 0; if (sp.legend) return 3;
  const fr = (inches - sp.min) / (sp.max - sp.min);
  return fr >= TIERS[3].at ? 3 : fr >= TIERS[2].at ? 2 : 1;
}
function tierIcon(id){ const d = S.dex[id]; return d ? TIERS[tierOf(id, d.best)].icon : ""; }
function tierInches(id, t){ const sp = SPECIES[id]; return Math.ceil(sp.min + TIERS[t].at * (sp.max - sp.min)); }
function goldCount(){ return DEX_ORDER.filter(id => S.dex[id] && tierOf(id, S.dex[id].best) === 3).length; }
function dexCaughtCount(){ return DEX_ORDER.filter(id => S.dex[id]).length; }

let trip = null;

function spawnFishFor(lake, y, exclude, small){
  const frac = y / (lake.depth*PPF);
  const lure = S.up.lure;
  let cands = lake.fish.filter(id => !SPECIES[id].legend && id !== exclude && frac >= SPECIES[id].d[0] && frac <= SPECIES[id].d[1])
    .map(id => ({ v:id, w: SPECIES[id].rar * (SPECIES[id].rar <= 3 ? 1 + lure*.5 : 1) }));
  if (!cands.length){
    let best = null, bd = 9;
    lake.fish.forEach(id => { const s = SPECIES[id]; if (s.legend) return; const dd = frac < s.d[0] ? s.d[0]-frac : frac - s.d[1]; if (dd < bd){ bd = dd; best = id; } });
    cands = [{ v:best, w:1 }];
  }
  if (lake.rare && Math.random() < RARE_CHANCE){                // every so often, a fish that's hard to find in this lake
    const r = makeFish(lake.rare[Math.floor(Math.random() * lake.rare.length)], y, small); r.rare = true; return r;
  }
  return makeFish(pickWeighted(cands), y, small);
}
const RARE_CHANCE = .05;
function makeFish(id, y, small){
  const sp = SPECIES[id];
  const f = Math.pow(Math.random(), 1.5 - S.up.lure*.17) * (small ? .55 : 1);   // dock fish run small
  const inches = sp.legend ? rand(sp.min, sp.max) : lerp(sp.min, sp.max, f);
  const dir = Math.random() < .5 ? -1 : 1;
  const L = fishPx(sp, inches);
  return { id, sp, inches, frac:f, L, x: rand(-20, W+20), y, baseY: y, dir,
    speed: rand(18, 45) * (sp.shape==="sun" ? 1.2 : sp.shape==="sturgeon" ? .6 : 1), phase: rand(0,6), trophy: !sp.legend && f > .78 };
}

function startTrip(lake, bossFeePaid, mode, quiet){
  if (!quiet) SFX.splash();
  mode = bossFeePaid ? "boat" : (mode || "dock");
  if (!S.day || S.day.lake !== lake.id) S.day = { lake: lake.id, kept: [] };   // new lake = new fishing day                 // boss fights always include a boat
  const dock = mode === "dock";
  const bottom = (dock ? Math.min(24, Math.round(lake.depth * .3)) : lake.depth) * PPF;
  const fish = [];
  const n = dock ? Math.max(10, Math.round(bottom / 36)) : Math.round(bottom / 55);
  for (let i=0;i<n;i++) fish.push(spawnFishFor(lake, rand(dock ? 70 : 160, bottom - 15), null, dock));
  let boss = null;
  if (bossFeePaid){
    const d = BOSSES[lake.id], sp = bossSp(lake.id);
    const maxY = Math.min(bottom - 8, upVal("line") * PPF);
    const y = Math.max(200, Math.min(maxY - 45, bottom * .8));
    const L = clamp(40 + d.inches*2.4, 100, 240);
    fish.push({ id: d.dex || d.base, sp, inches:d.inches, frac:1, L, x:W/2, y, baseY:y, dir:1, speed:22, phase:0, trophy:false, boss:true, sniffT:0 });
    boss = { def:d, fee:bossFeePaid, left: BOSS_CASTS };
  }
  const snags = [];
  // on the bottom: mostly sunken wood, plus cans, an old boot, the odd tire
  const nBottom = dock ? 3 : Math.max(3, Math.round(bottom / 150));
  const bottomJunk = [{v:"log",w:5},{v:"branch",w:3},{v:"can",w:2},{v:"boot",w:1.5},{v:"tire",w:.6},{v:"cart",w:.2}];
  for (let i=0;i<nBottom;i++){
    const t = pickWeighted(bottomJunk), sg = makeSnag(t, rand(30, W-30), 0);
    sg.y = bottom - sg.h/2 + 4;                       // resting on the lake bottom
    snags.push(sg);
  }
  // in the water column: plants growing up from the bottom and floating weed clumps
  const nPlants = dock ? 2 : Math.max(2, Math.round(bottom / 260));

function hitFish(f, hx, hy){ const h = f.L * .2; return Math.abs(f.x - hx) < f.L*.42 && Math.abs(f.y - hy) < h + 5; }

const PREDATORS = ["trout","largemouth","smallmouth","bcrappie","wcrappie","channel","bluecat","whitecat","dottie"];

// ---- Nibbles: a fish mouths the bait a few times. If it really bites, tap fast to set the hook!
function interest(T, f){
  if (T.fouled) return 0;                                 // junk on the hook: no fish will touch it
  const cb = curBait(T); let c = f.boss ? (T.boss.def.bite[cb] || .12) : biteChance(f, cb);
  if (c > 0 && scentOn()) c = Math.min(1, c + .15);       // scent makes fish that already like your bait hungrier
  if (c > 0) c = Math.min(1, c + .1 * rainAmt());          // fish often bite better in the rain
  return c;
}

// ---- Weather: sunny, cloudy, or rain (rain = can barely see) ----
function weatherLevel(){ return visit && visit.weather ? visit.weather.level : 0; }   // 0 sunny · .5 cloudy · 1 rain
function rainAmt(){ return clamp((weatherLevel() - .5) * 2, 0, 1); }
function cloudAmt(){ return clamp(weatherLevel() * 2, 0, 1); }
function weatherIcon(){ const l = weatherLevel(); return l < .25 ? "☀️" : l < .75 ? "☁️" : "🌧️"; }
function updateWeather(dt){
  if (!visit) return;
  const w = visit.weather || (visit.weather = { target:0, level:0, next: Date.now() + rand(40, 80)*1000 });
  if (Date.now() > w.next){
    const old = w.target, r = Math.random();
    w.target = r < .55 ? 0 : r < .83 ? .5 : 1;
    w.next = Date.now() + (w.target === 1 ? rand(45, 80) : rand(60, 120)) * 1000;
    if (w.target === 1 && old !== 1) toast("🌧️ Rain! It's hard to see... but fish love it.", 2600);
    else if (old === 1 && w.target !== 1) toast("☀️ The rain stopped.");
  }
  w.level += (w.target - w.level) * Math.min(1, dt * .6);
  // raindrop patter
  const rn = rainAmt();
  if (rn > .05 && S.sound){ w.acc = (w.acc || 0) + dt * 30 * rn; while (w.acc >= 1){ w.acc--; tick(rand(4000, 6500), .015 + .02*rn, Math.random()*.03, .008); } }
}
// Deep water gets dark. Rain makes everything murky. You can always see a little around your bait.
const fogCv = document.createElement("canvas"); fogCv.width = W; fogCv.height = H;
const fogCtx = fogCv.getContext("2d");
function drawFog(T, sy, hx, hy){
  const f = fogCtx, rn = rainAmt(), cl = cloudAmt(), surf = sy(0);
  f.clearRect(0, 0, W, H);
  if (surf >= H) return;
  const top = .05*cl + .72*rn;                          // murkiness right at the surface
  const g = f.createLinearGradient(0, surf, 0, sy(160 * PPF));
  for (const ft of [0, 10, 25, 45, 70, 100, 160]){
    const deep = Math.min(.93, Math.pow(ft / 70, .8) * .9);
    const a = 1 - (1 - top) * (1 - deep);
    g.addColorStop(ft / 160, "rgba(4,16,28," + a.toFixed(3) + ")");
  }
  f.fillStyle = g; f.fillRect(0, Math.max(0, surf), W, H);
  if (hy > surf - 5){
    const R = 150 - 80*rn;
    f.globalCompositeOperation = "destination-out";
    const rg = f.createRadialGradient(hx, hy, R*.25, hx, hy, R);
    rg.addColorStop(0, "rgba(0,0,0,.92)"); rg.addColorStop(1, "rgba(0,0,0,0)");
    f.fillStyle = rg; f.fillRect(hx - R, hy - R, R*2, R*2);
    f.globalCompositeOperation = "source-over";
  }
  ctx.drawImage(fogCv, 0, 0, W, H);
}
const rainDrops = [];
function drawRain(dt){
  const rn = rainAmt();
  if (rn > .02) for (let i = 0; i < 60*rn*dt*10; i++) rainDrops.push({ x: rand(-20, W + 20), y: rand(-40, 0), v: rand(700, 900) });
  ctx.strokeStyle = "rgba(210,225,240," + (.35 + .2*rn).toFixed(2) + ")"; ctx.lineWidth = 1.2; ctx.beginPath();
  for (const d of rainDrops){ d.y += d.v * dt; d.x -= d.v * .12 * dt; ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + 3, d.y - 16); }
  ctx.stroke();
  for (let i = rainDrops.length - 1; i >= 0; i--) if (rainDrops[i].y > H + 20) rainDrops.splice(i, 1);
}
const SCENT_COST = 5, SCENT_SECS = 60;
function scentOn(){ return !!(visit && visit.scentUntil && Date.now() < visit.scentUntil); }
function scentLeft(){ return scentOn() ? Math.ceil((visit.scentUntil - Date.now()) / 1000) : 0; }
function useScent(){
  if (!trip || !visit || trip.boss || trip.phase !== "ready") return;
  if (S.coins < SCENT_COST){ toast("Fish scent costs 🪙" + SCENT_COST + "."); return; }
  S.coins -= SCENT_COST; save(); SFX.coin();
  visit.scentUntil = Math.max(Date.now(), visit.scentUntil || 0) + SCENT_SECS*1000;
  addScentFish(trip, 6);

}
// scent draws extra fish into the area

function startNibble(f, c){
  const T = trip, side = f.x < T.hook.x ? 1 : -1;
  T.nibble = { f, c, side, count:0, n: 2 + Math.floor(Math.random()*3), next: rand(.4,.7), stage:"nibble", t:0,
               willBite: Math.random() < c, win: 1.0 };

}
function updateNibble(dt){
  const T = trip, N = T.nibble, f = N.f, hk = T.hook;
  f.dir = N.side;
  f.x = lerp(f.x, hk.x - N.side*f.L*.42, Math.min(1, dt*8));
  f.baseY = lerp(f.baseY, hk.y + 4, Math.min(1, dt*8)); f.y = f.baseY;
  N.t += dt;
  if (N.stage === "nibble"){
    N.next -= dt;
    if (N.next <= 0){
      N.count++; T.jig = 1; tick(2600, .14); tick(2100, .1, .05);
      pop(hk.x + 26, hk.y - 12, "nibble", "rgba(255,255,255,.85)", 13);
      if (N.count >= N.n){
        if (N.willBite){ N.stage = "bite"; N.t = 0; T.jig = 2.4; SFX.bite(); pop(hk.x, hk.y - 44, "BITE! TAP NOW!", "#ffe38a", 22); }
        else endNibble("bored");

function endNibble(why){

// ---- Bobber: the bait hangs a set depth under a float. Nibbles bob it; a BITE pulls it under. ----
function setBobDepth(){ const T = trip; if (!T) return; T.bobDepthPx = Math.max(2*PPF, Math.min((S.bobDepth || 6) * PPF, T.bottom - 14, T.maxY)); }
// the line pulls the hook toward the fisherman (the water surface under the rod tip), not straight up
function lineDir(T){
  const dx = T.tipX - T.hook.x, dy = 0 - T.hook.y, d = Math.hypot(dx, dy) || 1;
  return { ux: dx / d, uy: dy / d, d };
}

  if (kdir){ hk.x += kdir * 280 * k * dt; pointerX = null; }
  else if (pointerX !== null){ hk.x += (pointerX - hk.x) * Math.min(1, dt*7*k); }

function checkSnags(T, hk){

    s.hitT = 1.2;
    if (T.shields > 0){ T.shields--; SFX.shield(); pop(hk.x, hk.y-20, "🛡️ Shield!", "#9fe6ff"); hk.x += (hk.x < s.x ? -30 : 30); }
    else if (!T.fouled){

      T.fouled = s.type; T.phase = "reel"; T.pending = 0;

      pop(hk.x, hk.y-24, JUNK[s.type].icon + " Snagged!" + (cost ? " \u2212" + cost + " 🪙" : "") + " Reel all the way in.", "#ffb3a8", 17);
    }

// ---- Trolling: the boat idles along, the lure trails behind, fish strike as you pass ----
const TROLL_LURES = ["spinner", "crank", "swim"];

function trollInterest(T, f){
  let c = interest(T, f) * (TROLL_SHAPE[f.sp.shape] ?? .6);
  if (f.trophy) c *= .35;                              // the big ones are wary: trophies mostly come from a good cast
  return Math.min(1, c);
}
function startTroll(){
  const T = trip; if (!T || T.phase !== "ready" || T.mode !== "boat" || T.boss) return;
  if (!TROLL_LURES.includes(curBait(T))){ toast("Trolling needs a lure: 🥄 spinner, 🐠 crankbait or 🐟 swimbait. Tap Bait!", 2800); uiSheet = "bait"; renderBaitBar(); return; }
  uiSheet = null; T.phase = "troll"; T.trollSpd = 52; T.strike = null;
  T.hook.x = T.tipX + 40; T.hook.y = 0; SFX.splash();
  pop(T.tipX + 40, -20, "🚤 Trolling! Hold to raise your lure, let go to let it sink.", "#fff", 15);
}
function stopTroll(){
  const T = trip; if (!T || T.phase !== "troll") return;
  T.strike = null; T.phase = "reel"; T.pending = 0; pop(T.hook.x, T.hook.y - 20, "Reeling in", "#fff", 15);
}
function trollHook(){
  const T = trip, st = T.strike; if (!st) return;
  T.strike = null; st.f.nibbling = false;

}
function updateTroll(dt){
  const T = trip, hk = T.hook, spd = T.trollSpd;
  if (visit) visit.scroll = (visit.scroll || 0) + spd * dt;
  // lure depth: hold to raise it, let go and it sinks; the deeper it runs, the farther back it trails
  const floor = Math.min(T.maxY, T.bottom - 6);
  if (btnHeld) hk.y = Math.max(PPF * 1.5, hk.y - 95 * dt); else hk.y = Math.min(floor, hk.y + 42 * dt);
  hk.x = lerp(hk.x, Math.min(W - 110, T.tipX + 45 + hk.y * .12), Math.min(1, dt * 2));

function updateFight(dt){

  // pops
  ctx.textAlign = "center";
  for (const p of T.pops){ ctx.globalAlpha = 1 - Math.max(0, p.t-1)/.6; ctx.font = `bold ${p.size}px Trebuchet MS, sans-serif`; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.55)"; const px = clamp(p.x, 110, W-110); ctx.strokeText(p.text, px, sy(p.y)); ctx.fillStyle = p.color; ctx.fillText(p.text, px, sy(p.y)); }
  ctx.globalAlpha = 1;
  drawRain(T.lastDt || 1/60);
  if (F) drawFightUI(F);
}

function drawBait(k, x, y, t){
  const w = Math.sin(t*8);
  ctx.save(); ctx.translate(x, y);
  if (k === "worm" || k === "crawler"){
    ctx.strokeStyle = k === "worm" ? "#e07a8a" : "#b8606f"; ctx.lineWidth = k === "worm" ? 4 : 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0,-4); ctx.quadraticCurveTo(-8 + w*3, 4, -2, 10); ctx.quadraticCurveTo(6 - w*3, 16, -1, 22 + (k==="crawler"?6:0)); ctx.stroke();
    if (k === "crawler"){ ctx.fillStyle = "#555"; ctx.beginPath(); ctx.arc(2, 34, 5, 0, 7); ctx.fill(); }
  } else if (k === "dough" || k === "corn" || k === "stink"){
    ctx.fillStyle = k === "dough" ? "#ff8c1a" : k === "corn" ? "#f2d34b" : "#7a5a2a";
    ctx.beginPath(); ctx.arc(0, 2, 6, 0, 7); ctx.fill();
    if (k === "stink"){ ctx.strokeStyle = "rgba(160,200,90,.8)"; ctx.lineWidth = 1.5; for (let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-6+i*6, -6); ctx.quadraticCurveTo(-3+i*6+w*2, -12, -6+i*6, -18); ctx.stroke(); } }
  } else if (k === "crank"){
    ctx.rotate(Math.PI/2 + w*.25); ctx.fillStyle = "#f15a24"; ctx.beginPath(); ctx.ellipse(0, 0, 11, 5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffd23f"; ctx.fillRect(-2, -5, 5, 10); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-7, -1, 2, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(-17,-4); ctx.lineTo(-17,4); ctx.fill();
  } else if (k === "spinner"){
    ctx.fillStyle = "#c33"; ctx.fillRect(-2, 0, 5, 12);
    ctx.save(); ctx.translate(1, 4); ctx.scale(Math.cos(t*14), 1); ctx.fillStyle = "#e6ecf0"; ctx.beginPath(); ctx.ellipse(0, 0, 7, 4, 0, 0, 7); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.arc(1, 14, 2.5, 0, 7); ctx.fill();
  } else if (k === "bread"){
    ctx.fillStyle = "#f3e2b8"; ctx.beginPath(); ctx.arc(0, 2, 6, 0, 7); ctx.fill();
    ctx.fillStyle = "#8e3b5b"; ctx.beginPath(); ctx.arc(2, 0, 2, 0, 7); ctx.fill();
  } else if (k === "swim"){
    ctx.rotate(Math.PI/2 + w*.3); drawFish(ctx, SPECIES.trout, 0, 0, 30, -1, t);
  }
  ctx.restore();
}
// junk stuck on your hook after a snag
const JUNK = {
  log:{ name:"a waterlogged stick", icon:"🪵", wood:true }, branch:{ name:"a sunken branch", icon:"🪵", wood:true },
  can:{ name:"an old tin can", icon:"🥫", trash:true }, boot:{ name:"an old boot", icon:"🥾", trash:true },
  tire:{ name:"a chunk of tire", icon:"🛞", trash:true }, cart:{ name:"a shopping cart wheel", icon:"🛒", trash:true },
  weed:{ name:"a wad of weeds", icon:"🌿" }, clump:{ name:"a wad of weeds", icon:"🌿" }
};
function drawJunk(type, x, y, t){
  ctx.save(); ctx.translate(x, y + 10); ctx.rotate(Math.sin(t*3)*.2);
  if (type === "log" || type === "branch"){ ctx.strokeStyle = "#5e3f22"; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(14, 3); ctx.moveTo(4, 1); ctx.lineTo(10, -8); ctx.stroke(); }
  else if (type === "can"){ ctx.fillStyle = "#c33"; ctx.fillRect(-6, -2, 12, 18); ctx.fillStyle = "#ccc"; ctx.fillRect(-6, -2, 12, 3); }
  else if (type === "boot"){ ctx.fillStyle = "#5b3b22"; ctx.fillRect(-7, -2, 10, 18); ctx.fillRect(-7, 11, 20, 7); }
  else if (type === "tire"){ ctx.strokeStyle = "#222"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 8, 9, 0, 7); ctx.stroke(); }
  else if (type === "cart"){ ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(0, 8, 7, 0, 7); ctx.fill(); ctx.strokeStyle = "#9aa4ab"; ctx.lineWidth = 2; ctx.strokeRect(-3, -4, 6, 6); }
  else { ctx.strokeStyle = "#2f7a3a"; ctx.lineWidth = 3; for (let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(0, -2); ctx.quadraticCurveTo(i*6 + Math.sin(t*4+i)*3, 8, i*5, 20); ctx.stroke(); } }
  ctx.restore();
}
function drawSnag(s, y, t){
  ctx.save(); ctx.translate(s.x, y);
  if (s.hitT > 0) ctx.globalAlpha = .6 + Math.sin(t*30)*.3;
  if (s.type==="log"){ ctx.rotate(s.rot); const lg = ctx.createLinearGradient(0, -s.h/2, 0, s.h/2); lg.addColorStop(0, "#7c5a3a"); lg.addColorStop(.5, "#5e4128"); lg.addColorStop(1, "#3a2817"); ctx.fillStyle = lg; ctx.fillRect(-s.w/2, -s.h/2, s.w, s.h);
    ctx.fillStyle = "rgba(60,90,40,.35)"; ctx.fillRect(-s.w/2, -s.h/2, s.w, 3); ctx.fillStyle = "#8a6440"; ctx.beginPath(); ctx.ellipse(s.w/2, 0, 6, s.h/2, 0, 0, 7); ctx.fill(); ctx.strokeStyle = "#4e331c"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-s.w/2+10, -3); ctx.lineTo(s.w/2-20, -3); ctx.moveTo(-s.w/2+25, 5); ctx.lineTo(s.w/2-10, 5); ctx.stroke(); ctx.fillStyle = "#6e4a2a"; ctx.fillRect(-10, -s.h/2-14, 5, 16); }
  if (s.type==="tire"){ ctx.strokeStyle = "#222"; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(0,0,17,0,7); ctx.stroke(); ctx.strokeStyle = "#444"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0,0,22,0,7); ctx.stroke(); }
  if (s.type==="boot"){ ctx.fillStyle = "#5b3b22"; ctx.fillRect(-10,-17,14,26); ctx.fillRect(-10,4,28,10); ctx.fillStyle = "#3d2715"; ctx.fillRect(-10,12,28,4); }
  if (s.type==="can"){ ctx.fillStyle = "#c33"; ctx.fillRect(-8,-13,16,26); ctx.fillStyle = "#ccc"; ctx.fillRect(-8,-13,16,3); ctx.fillStyle = "#fff"; ctx.fillRect(-8,-3,16,5); }
  if (s.type==="cart"){ ctx.strokeStyle = "#9aa4ab"; ctx.lineWidth = 3; ctx.strokeRect(-30,-20,54,30); for (let i=-24;i<24;i+=9){ ctx.beginPath(); ctx.moveTo(i,-20); ctx.lineTo(i,10); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(24,-20); ctx.lineTo(34,-26); ctx.stroke(); ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(-22,18,5,0,7); ctx.arc(16,18,5,0,7); ctx.fill(); }
  if (s.type==="branch"){ ctx.rotate(s.rot); ctx.strokeStyle = "#5e3f22"; ctx.lineCap = "round"; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-s.w/2, 2); ctx.lineTo(s.w/2, -2); ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-s.w*.1, 0); ctx.lineTo(-s.w*.1 + 12, -14); ctx.moveTo(s.w*.2, -1); ctx.lineTo(s.w*.2 + 10, 10); ctx.moveTo(s.w*.3, -1); ctx.lineTo(s.w*.3 + 8, -12); ctx.stroke(); }
  if (s.type==="clump"){ ctx.fillStyle = "rgba(47,122,58,.85)"; for (let i=0;i<6;i++){ ctx.beginPath(); ctx.ellipse(-18 + i*7, Math.sin(i*2.1)*6 + Math.sin(t*1.5+i)*2, 11, 7, i, 0, 7); ctx.fill(); }
    ctx.strokeStyle = "#3f8f4a"; ctx.lineWidth = 2; for (let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(-12+i*9, 6); ctx.quadraticCurveTo(-10+i*9 + Math.sin(t*2+i)*4, 16, -12+i*9, 24); ctx.stroke(); } }
  if (s.type==="weed"){
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const base = s.h/2, sx = (yy, i) => { const r = (base - yy) / s.h; return i*5*(1 + r*1.4) + Math.sin(t*1.3 + yy*.025 + i*.35 + s.x*.01) * r * r * 16; };
    for (let i=-2;i<=2;i++){
      const top = -s.h/2 + Math.abs(i)*s.h*.14;
      const wg = ctx.createLinearGradient(0, base, 0, top); wg.addColorStop(0, "#1c4221"); wg.addColorStop(1, i%2 ? "#5e9a44" : "#74ae4f");
      ctx.strokeStyle = wg; ctx.lineWidth = 2.6 - Math.abs(i)*.4; ctx.beginPath(); ctx.moveTo(sx(base, i), base);
      for (let yy = base; yy > top; yy -= 6) ctx.lineTo(sx(yy, i), yy);
      ctx.stroke();
      ctx.fillStyle = i%2 ? "rgba(84,140,62,.7)" : "rgba(104,160,72,.7)";
      let side = 1;
      for (let yy = base - 10; yy > top + 4; yy -= 11){ const xx = sx(yy, i); side = -side; ctx.beginPath(); ctx.ellipse(xx + side*4.5, yy - 2, 5.5, 1.7, side*-.55, 0, 7); ctx.fill(); }
    }
  }
  if (false){ ctx.strokeStyle = "#2f7a3a"; ctx.lineWidth = 5; ctx.lineCap = "round"; for (let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*10, s.h/2); for (let yy=s.h/2; yy>-s.h/2; yy-=10) ctx.lineTo(i*10 + Math.sin(yy*.08 + t*2 + i)*7, yy); ctx.stroke(); } }
  ctx.restore();
}

function drawFightUI(F){
  const x = 40, y = 175, w = W-80;
  ctx.fillStyle = "rgba(10,25,40,.8)"; roundRect(x-12, y-40, w+24, 150, 14); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 20px Trebuchet MS, sans-serif";
  ctx.fillText(F.f.boss || F.f.sp.legend ? "⚔️ " + F.f.sp.name.toUpperCase() + " ⚔️" : "Big fish! It's fighting!", W/2, y-14);
  ctx.font = "bold 13px Trebuchet MS, sans-serif"; ctx.textAlign = "left"; ctx.fillText("LINE TENSION", x, y+10);
  // tension bar
  const tg = ctx.createLinearGradient(x,0,x+w,0);
  tg.addColorStop(0,"#3fa34d"); tg.addColorStop(.6,"#f5d03a"); tg.addColorStop(.85,"#e0483a"); tg.addColorStop(1,"#b31d12");
  ctx.fillStyle = "rgba(255,255,255,.15)"; roundRect(x, y+16, w, 22, 11); ctx.fill();
  ctx.fillStyle = tg; roundRect(x, y+16, Math.max(22, w*F.tension/100), 22, 11); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.fillText("REEL IT IN", x, y+58);
  if (F.stages > 1){ ctx.textAlign = "right"; ctx.fillText("ROUND " + F.stage + " OF " + F.stages, x+w, y+58); ctx.textAlign = "left"; }
  ctx.fillStyle = "rgba(255,255,255,.15)"; roundRect(x, y+64, w, 18, 9); ctx.fill();
  ctx.fillStyle = "#5bc0ff"; roundRect(x, y+64, Math.max(18, w*F.prog/100), 18, 9); ctx.fill();
  ctx.textAlign = "center"; ctx.font = "bold 14px Trebuchet MS, sans-serif";
  ctx.fillStyle = F.tension > 80 || F.run ? "#ff8a7a" : "#fff";
  ctx.fillText(F.run ? "It's running for the logs! Steer " + (F.run.dir < 0 ? "➡ RIGHT ➡" : "⬅ LEFT ⬅") : F.tension > 80 ? "LET GO! The drag is screaming!" : "HOLD the reel button to reel", W/2, y+102);
  if (F.run){ // danger zone on the side it's running toward
    const zx = F.run.dir < 0 ? 0 : W-42;
    ctx.fillStyle = "rgba(224,72,58," + (.25 + Math.sin(performance.now()/90)*.1) + ")"; ctx.fillRect(zx, 0, 42, H);
    ctx.fillStyle = "#6e4a2a"; for (let i=0;i<6;i++){ ctx.fillRect(zx+4, 260 + i*70, 34, 12); }
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// big reel button: icon + label follow the situation
let lastMode = "";
function syncReelBtn(){
  const T = trip, show = state === "fishing" && T && T.phase !== "done";
  reelBtn.classList.toggle("show", !!show);
  const ready = !!(show && T.phase === "ready");
  $("baitBar").classList.toggle("show", ready && uiSheet === "bait");
  $("optSheet").classList.toggle("show", ready && uiSheet === "opt");
  $("baitBtn").classList.toggle("show", ready);
  $("optBtn").classList.toggle("show", ready);
  const canTroll = !!(show && T.mode === "boat" && !T.boss && (T.phase === "ready" || (T.phase === "troll" && !T.strike)));
  $("trollBtn").classList.toggle("show", canTroll);
  if (canTroll){ const on = T.phase === "troll"; $("trollIcon").textContent = on ? "🛑" : "🚤"; $("trollLbl").textContent = on ? "Stop" : "Troll"; }
  $("reelGfx").classList.toggle("show", !!show);
  $("btnMute").style.display = state === "fishing" ? "none" : "";
  if (!show) return;
  let mode, label;
  if (T.phase === "ready" || T.phase === "cast"){ mode = "cast"; label = T.phase === "cast" ? "" : "TAP TO CAST"; }
  else if (T.nibble){ const b = T.nibble.stage === "bite"; mode = b ? "tap danger" : "out"; label = b ? "SET THE HOOK!" : "WAIT..."; }
  else if (T.phase === "drop"){ mode = "out"; label = "TAP TO STOP"; }
  else if (T.phase === "troll"){ mode = T.strike ? "tap danger" : "hold"; label = T.strike ? "STRIKE! TAP!" : btnHeld ? "LURE UP..." : "HOLD = LURE UP"; }
  else if (T.phase === "fight"){ mode = "fight" + (T.fight && T.fight.tension > 80 ? " danger" : ""); label = T.fight && T.fight.tension > 80 ? "LET GO!" : "HOLD!"; }
  else if (T.autoUp){ mode = "auto"; label = "REELING IN!"; }
  else if (T.caught.length){ mode = "tap"; label = "TAP TAP TAP!"; }
  else { mode = "hold"; label = T.fouled ? "REEL IT ALL IN" : T.bobber && !btnHeld ? "WAIT... or HOLD" : "HOLD TO REEL"; }
  const key = mode + "|" + label;
  if (key !== lastMode){
    lastMode = key;
    reelBtn.className = "show " + mode + (btnHeld ? " down" : "");
    $("reelGfx").className = "show" + (mode.includes("danger") ? " danger" : "");
    $("reelLabel").textContent = label;
    const cast = mode === "cast";
    $("rCast").style.display = cast ? "" : "none"; $("rSpool").style.display = cast ? "none" : ""; $("rHandle").style.display = cast ? "none" : "";
  }
  $("rHandle").setAttribute("transform", "rotate(" + (T.reelAng % 360).toFixed(1) + " 50 50)");
  $("rSpool").setAttribute("transform", "rotate(" + (T.spoolAng % 360).toFixed(1) + " 50 50)");
}

// idle backdrop for menus
function makeIdle(){
  const lake = LAKES[0], bottom = lake.depth*PPF, fish = [];
  const ids = ["bluegill","largemouth","trout","redear","bcrappie","channel","carp"];
  for (let i=0;i<9;i++){ const f = makeFish(ids[i % ids.length], rand(90, 900)); fish.push(f); }
  return { lake, bottom, fish, snags:[makeSnag("weed", 60, bottom), makeSnag("weed", 400, bottom), makeSnag("log", 300, 560)], bubbles:[], pops:[], camY:-220, t:0 };
}
const idle = makeIdle();
function updateIdle(dt){
  idle.t += dt;
  for (const f of idle.fish){ f.x += f.dir*f.speed*dt; f.y = f.baseY + Math.sin(idle.t*1.3+f.phase)*6; if (f.x > W+90) f.x = -90; if (f.x < -90) f.x = W+90; }
  if (Math.random() < dt*4) idle.bubbles.push({ x: rand(0,W), y: idle.camY + H + 10, r: rand(1.5,4), v: rand(20,50) });
  idle.bubbles.forEach(b => b.y -= b.v*dt); idle.bubbles = idle.bubbles.filter(b => b.y > 0);
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  ctx.clearRect(0,0,W,H);
  syncReelBtn();
  if (state === "fishing" && trip){ updateFishing(dt); if (trip) renderScene(trip, false); else renderScene(idle, true); }
  else { updateIdle(dt); renderScene(idle, true); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
