function drawWild(T, sy){
  const A = T.wild; if (!A) return;
  const t = A.t, flap = .5 + .5 * Math.sin(performance.now() / 70);
  if (A.mode === "see"){
    const k = Math.min(1, t / 2, (A.dur - t) / 2);                  // fade in and out
    ctx.save(); ctx.globalAlpha = clamp(k, 0, 1);
    if (A.kind === "heron") drawHeron(A.dir > 0 ? W * .82 : W * .62, sy(0) - 2, 1.3, t);
    if (A.kind === "turtle"){ const x = A.dir > 0 ? -30 + t * 40 : W + 30 - t * 40; drawTurtle(x, sy(3 * PPF + Math.sin(t) * 6), 1.3, A.dir, t); }
    if (A.kind === "crawdad"){ const x = A.dir > 0 ? 30 + t * 22 : W - 30 - t * 22; drawCrawdad(x, sy(T.bottom) + 2, 1.2, A.dir, t); }
    if (A.kind === "bullfrog") drawFrog(W * .7, sy(0) + 1, 1.3);
    if (A.kind === "dolphin"){ for (let k = 0; k < 3; k++){ const x = (A.dir > 0 ? -60 + t * 70 : W + 60 - t * 70) - A.dir * k * 46, ph = (t * 1.6 + k * .7) % 2;   // a pod leaping past
      if (ph < 1) drawDolphin(x, sy(0) - Math.sin(ph * Math.PI) * 26 + 6, 1.4, A.dir, (ph - .5) * 1.4); } }
    if (A.kind === "gull") drawGull(A.dir > 0 ? -30 + t * 55 : W + 30 - t * 55, sy(0) - 70 - Math.sin(t * 1.3) * 14, 1.6, A.dir);
    ctx.restore(); return;
  }
  const hx = T.hook.x;
  if (A.kind === "osprey" || A.kind === "pelican"){
    let x, y, dive = false;
    if (A.mode === "snatch"){
      if (A.stage === "in"){ const k = Math.min(1, t / .8); x = A.x - A.dir * 240 * (1 - k); y = sy(-170 * (1 - k) * (1 - k) - 12); dive = k > .5; }
      else { x = A.x + A.dir * t * 170; y = sy(-12 - t * 120); }
    } else if (A.mode === "raid"){
      if (A.stage === "warn"){ const k = Math.min(1, t / 1); x = hx - A.dir * (260 - 200 * k) + Math.sin(t * 3) * 10; y = sy(-150 + 40 * k); }
      else if (A.stage === "grab"){ const k = Math.min(1, t / .45); x = hx - A.dir * 60 * (1 - k); y = sy(-110 + 110 * k); dive = true; }
      else { x = hx + A.dir * t * 160; y = sy(-t * 120); }
    } else {
      if (A.stage === "in"){ const k = t / A.din; x = A.x - A.dir * (300 * (1 - k)); y = k < .6 ? sy(-180 + 40 * k) : sy(-156 + 156 * (k - .6) / .4); dive = k > .6; }
      else if (A.stage === "hit"){ x = A.x; y = sy(-t * 20); }
      else { x = A.x + A.dir * t * 150; y = sy(-t * 110); }
    }
    if (A.carry && A.stage !== "warn") drawFish(ctx, A.carry.sp, x, y + 10, Math.min(46, A.carry.L * .6), A.dir, T.t * 2, { rot: .2 });
    if (A.kind === "pelican") drawPelican(x, y, 2.2, dive ? .2 : flap, A.dir, dive); else drawOsprey(x, y, 2.2, dive ? .2 : flap, A.dir, dive);
    if (A.mode === "raid" && A.stage === "warn"){                    // the tap meter
      const w = 160, bx = W / 2 - w / 2, by = 128;
      ctx.fillStyle = "rgba(10,25,40,.8)"; roundRect(bx - 8, by - 22, w + 16, 40, 10); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 13px Trebuchet MS, sans-serif"; ctx.textAlign = "center"; ctx.fillText("TAP FAST TO SCARE IT!", W / 2, by - 7);
      ctx.fillStyle = "rgba(255,255,255,.2)"; roundRect(bx, by, w, 10, 5); ctx.fill(); ctx.fillStyle = "#7dffb8"; roundRect(bx, by, Math.max(10, w * Math.min(1, A.taps / A.need)), 10, 5); ctx.fill();
    }
  } else {                                                            // the merganser
    let x, y, under = false;
    if (A.mode === "raid"){
      if (A.stage === "warn"){ x = hx - A.dir * (140 - 90 * Math.min(1, t / 1.2)); y = sy(0); }
      else if (A.stage === "grab"){ x = hx - A.dir * 50 * (1 - t / .45); y = sy(T.hook.y * Math.min(1, t / .45)); under = true; }
      else { x = hx + A.dir * t * 90; y = sy(Math.max(0, T.hook.y - t * 120)); under = y > sy(0) + 3; }
    } else {
      const F = A.f;
      if (A.stage === "in"){ const k = t / A.din; x = A.x - A.dir * 200 * (1 - k); if (k < .45) y = sy(0); else { under = true; y = sy(F.y * (k - .45) / .55); } }
      else if (A.stage === "hit"){ x = A.x; y = sy(F.y * (1 - t / 1.4)); under = true; }
      else { x = A.x + A.dir * t * 70; y = sy(0); }
    }
    if (A.carry && (A.stage === "hit" || A.stage === "flee" || A.stage === "out")) drawFish(ctx, A.carry.sp, x + A.dir * 16, y + 2, Math.min(34, A.carry.L * .5), A.dir, T.t * 2, { rot: .3 });
    if (A.kind === "sealion") drawSeaLion(x, y, 1.9, A.dir, under); else drawDuck(x, y, 1.9, A.dir, under);
    if (under && Math.random() < .3) T.bubbles.push({ x, y: y + T.camY, r: rand(1, 2.5), v: rand(20, 40) });
    if (A.mode === "raid" && A.stage === "warn"){
      const w = 160, bx = W / 2 - w / 2, by = 128;
      ctx.fillStyle = "rgba(10,25,40,.8)"; roundRect(bx - 8, by - 22, w + 16, 40, 10); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 13px Trebuchet MS, sans-serif"; ctx.textAlign = "center"; ctx.fillText("TAP FAST TO SCARE IT!", W / 2, by - 7);
      ctx.fillStyle = "rgba(255,255,255,.2)"; roundRect(bx, by, w, 10, 5); ctx.fill(); ctx.fillStyle = "#7dffb8"; roundRect(bx, by, Math.max(10, w * Math.min(1, A.taps / A.need)), 10, 5); ctx.fill();
    }
  }
}

function prizeItem(id){ for (const [kind, T] of [["hat", HATS], ["rod", RODS], ["paint", PAINTS]]) for (const k in T) if (T[k].prize === id) return { kind, key:k, name: T[k].name }; return null; }
let prizeQueue = [];
function checkPrizes(){
  if (!S || !S.dex) return;
  S.prizes = S.prizes || {};
  for (const m of MILESTONES){
    if (S.prizes[m.id] || m.prog(S) < m.need) continue;
    S.prizes[m.id] = Date.now(); S.coins += m.coins; const it = prizeItem(m.id);
    prizeQueue.push(`<div style="font-size:3.5em">🏅</div><span class="tag new">PRIZE UNLOCKED!</span><h3>${m.name}</h3><p><b>+${m.coins} 🪙</b>${it ? ` and the <b>${it.name}</b>! Wear it from the Tackle Shop's Style section.` : ""}</p>`);
  }
  const p = window.LL && LL.player();
  if (p && p.game === S) for (const pp of p.pprizes || []){                        // prizes from home
    const m = MILESTONES.find(x => x.id === pp.goal); if (!m || pp.earned || m.prog(S) < m.need) continue;
    pp.earned = Date.now();
    prizeQueue.push(`<div style="font-size:3.5em">🎁</div><span class="tag new">A PRIZE FROM HOME!</span><h3>${LL.esc(pp.text)}</h3><p>You did it: <b>${m.name}</b>! Go tell a grown-up. 🎉</p>`);
  }
}

  return `<div class="card jobs"><b>🏅 Prize ladder</b> <span class="muted">${Object.keys(S.prizes || {}).length}/${MILESTONES.length} won</span>${rows}</div>`
    + (pp.length ? `<div class="card jobs"><b>🎁 Prizes from home</b> <span class="muted">set by a grown-up in the Parent Corner</span>${pp.map(x => { const m = MILESTONES.find(y => y.id === x.goal) || { name:"?", need:1, prog:() => 0 };
      return `<div class="job${x.earned ? " done" : ""}"><span>${x.earned ? (x.given ? "🎉" : "🎁") : "⏳"} <b>${LL.esc(x.text)}</b> for: ${m.name}</span><span>${x.earned ? (x.given ? "given ✓" : "earned!") : Math.min(m.need, m.prog(S)) + "/" + m.need}</span></div>`; }).join("")}</div>` : "");
}
// goals and progress for the Parent Corner (any player's game)
window.LL_GOALS = g => MILESTONES.map(m => ({ id: m.id, name: m.name, cur: Math.min(m.need, m.prog(g || {})), need: m.need }));

// A printable "Certificate of Catch"
function printCertificate(c){
  const p = LL.player(), sp = c.sp, icon = fishIcon(sp, 420, 200).toDataURL();
  let el = $("cert"); if (!el){ el = document.createElement("div"); el.id = "cert"; document.body.appendChild(el); }
  const date = new Date(c.t || Date.now()).toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
  el.innerHTML = `<div class="certpage"><div class="certin">
    <div class="certtop">🎣 LAKE LEGENDS 🎣</div><h1>Certificate of Catch</h1>
    <p class="certsub">This certifies that</p><div class="certname">${LL.esc(p ? p.name : "An angler")}</div>
    <p class="certsub">caught a</p><div class="certfish">${sp.name}</div><img src="${icon}" alt="">
    <div class="certstats">${(+c.inches).toFixed(1)} inches · ${fmtLb(c.lb)} · ${LL.esc(c.lake)}</div>
    <div class="certfoot"><div><div class="certline"></div>Lake Legends Fishing Club</div><div class="certseal">🏆<small>OFFICIAL</small></div><div><div class="certline">${date}</div>Date</div></div>
  </div></div><div class="certbtns"><button class="btn" id="certPrint">🖨️ Print</button><button class="btn blue" id="certClose">Close</button></div>`;
  el.style.display = "flex";
  $("certPrint").onclick = () => window.print();
  $("certClose").onclick = () => { el.style.display = "none"; };
}

// =====================================================================
//  TROPHY LODGE · RECORDS · FAMILY BOARD · FAMILY DERBY
// =====================================================================
const MAX_MOUNTS = 8;
const mountSp = m => m.leg ? legendSp(m.leg) : m.v && VARIANTS[m.id] ? variantSp(m.id) : SPECIES[m.id];
function mountFish(f, L){
  const m = { id: f.nightLegend ? f.sp.base : f.id, v: f.variant || null, leg: f.nightLegend ? L.id : null, inches: +f.inches.toFixed(1), lb: +fishLb(f).toFixed(2), lake: L.id, t: Date.now() };
  const ms = S.mounts = S.mounts || [];
  if (ms.length >= MAX_MOUNTS){
    const small = ms.reduce((a, b) => (b.lb < a.lb ? b : a));
    if (small.lb >= m.lb){ toast("Your wall is full. Take a fish down in the Lodge first.", 2800); return false; }
    ms.splice(ms.indexOf(small), 1);
  }
  ms.push(m); save(); SFX.land(); toast("🖼️ Mounted on your Lodge wall!"); return true;
}
// the Derby: one contest a week for the whole family; the category changes every week
const DERBY = [
  { key:"bass",  name:"Biggest bass",            unit:"lb", ok: f => f.id === "largemouth" || f.id === "smallmouth" },
  { key:"cat",   name:"Heaviest catfish",        unit:"lb", ok: f => f.sp.shape === "cat" },
  { key:"count", name:"Most fish caught",        unit:"n" },
  { key:"big",   name:"Biggest fish of any kind", unit:"lb", ok: () => true },
  { key:"sun",   name:"Biggest sunfish or crappie", unit:"lb", ok: f => f.sp.shape === "sun" },
  { key:"kinds", name:"Most different kinds of fish", unit:"k" },
  { key:"trout", name:"Biggest trout",           unit:"lb", ok: f => f.id === "trout" }
];
function weekStart(off = 0){ const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + off * 7); return d; }
const weekKey = (off = 0) => dayKey(weekStart(off));
const derbyFor = wk => { const n = Math.round((new Date(wk.replace(/-/g, "/")).getTime()) / 6048e5); return DERBY[((n % DERBY.length) + DERBY.length) % DERBY.length]; };
function rollDerby(){ const wk = weekKey(); if (!S.derby || S.derby.wk !== wk){ if (S.derby && S.derby.score) S.derbyLast = S.derby; S.derby = { wk, score:0, best:"", kinds:[] }; } return S.derby; }
function derbyCatch(f){
  if (f.nightLegend || f.boss) return;
  const D = rollDerby(), c = derbyFor(D.wk);
  if (c.unit === "n"){ D.score++; D.best = D.score + " fish"; }
  else if (c.unit === "k"){ if (!D.kinds.includes(f.id)){ D.kinds.push(f.id); D.score = D.kinds.length; D.best = D.score + " kinds"; } }
  else if (c.ok(f)){ const lb = fishLb(f); if (lb > D.score){ D.score = +lb.toFixed(2); D.best = fmtLb(lb) + " " + f.sp.name; } }
}
// everyone's score this week (or another week), best first
function derbyBoard(wk){
  return LL.players().map(p => { const g = p.game || {}, e = [g.derby, g.derbyLast].find(x => x && x.wk === wk);
    return { name: p.name, id: p.id, score: e ? e.score : 0, best: e ? e.best : "" }; }).sort((a, b) => b.score - a.score);
}
// last week's winner gets a prize the next time they play
function derbyPrize(){
  const wk = weekKey(-1), me = LL.player(); if (!me || (S.derbyPaid || {})[wk]) return null;
  const b = derbyBoard(wk); if (!b.length || !b[0].score || b[0].id !== me.id || (b[1] && b[1].score === b[0].score)) return null;
  S.derbyPaid = Object.assign({}, S.derbyPaid, { [wk]: 1 }); S.derbyWins = (S.derbyWins || 0) + 1; S.coins += 100; save();
  return derbyFor(wk);
}
function derbyCard(){
  const D = rollDerby(), c = derbyFor(D.wk), b = derbyBoard(D.wk), medals = ["🥇", "🥈", "🥉"];
  const left = Math.max(0, Math.ceil((weekStart(1) - Date.now()) / 864e5));
  return `<div class="card"><b>🏆 Family Derby: ${c.name}</b> <span class="muted">ends in ${left} day${left === 1 ? "" : "s"} · winner gets 🪙100</span>
    ${b.map((r, i) => `<div class="job"><span>${r.score ? medals[i] || "▫️" : "▫️"} ${LL.esc(r.name)}</span><span>${r.score ? r.best : "no catch yet"}</span></div>`).join("")}</div>`;
}
function renderLodge(){
  $("lodgeCoins").textContent = "🪙 " + S.coins;
  const box = $("lodgeBody"); box.innerHTML = "";
  // the wall
  const wall = document.createElement("div"); wall.className = "wall";
  const ms = (S.mounts || []).slice().sort((a, b) => b.lb - a.lb);
  if (!ms.length) wall.innerHTML = `<p class="wallnote">Your wall is empty. After a great catch, tap <b>🖼️ Mount it</b> on the catch screen.</p>`;
  ms.forEach(m => {
    const sp = mountSp(m); if (!sp) return;
    const pl = document.createElement("div"); pl.className = "plaque";
    pl.appendChild(fishIcon(sp, 220, 100));
    pl.insertAdjacentHTML("beforeend", `<div class="brass">${sp.name}<br><small>${m.inches} in · ${fmtLb(m.lb)} · ${lakeById(m.lake).name}</small></div><button class="down" aria-label="Take it down">✕</button><button class="down pr" aria-label="Print a certificate">🖨️</button>`);
    pl.querySelector(".pr").onclick = () => printCertificate({ sp, inches: m.inches, lb: m.lb, lake: lakeById(m.lake).name, t: m.t });
    pl.querySelector(".down").onclick = () => { if (!pl.classList.contains("arm")){ pl.classList.add("arm"); pl.querySelector(".down").textContent = "Take down?"; return; }
      S.mounts.splice(S.mounts.indexOf(m), 1); save(); renderLodge(); };
    wall.appendChild(pl);
  });
  box.appendChild(wall);
  lodgeExtras(box);
  box.insertAdjacentHTML("beforeend", derbyCard());
  box.insertAdjacentHTML("beforeend", prizeLadderCard());
  // my records
  let big = null;
  for (const id of Object.keys(S.dex)){ const sp = SPECIES[id]; if (!sp) continue; const lb = weightLb(sp, S.dex[id].best); if (!big || lb > big.lb) big = { lb, name: sp.name, inches: S.dex[id].best }; }
  const looks = Object.values(S.dex).filter(d => d.v).length, me = LL.player();
  box.insertAdjacentHTML("beforeend", `<div class="card"><b>🏅 ${me ? LL.esc(me.name) + "'s" : "My"} records</b>
    <div class="job"><span>🐟 Fish landed</span><span>${S.landed || 0}</span></div>
    <div class="job"><span>📖 Fishdex</span><span>${dexCaughtCount()}/${DEX_ORDER.length} · 🥇 ${goldCount()}</span></div>
    <div class="job"><span>🐳 Biggest fish</span><span>${big ? big.name + ", " + fmtLb(big.lb) : "—"}</span></div>
    <div class="job"><span>🔥 Longest streak</span><span>${S.bestStreak || 0} casts</span></div>
    <div class="job"><span>✨ Rare looks</span><span>${looks}/${Object.keys(VARIANTS).length}</span></div>
    <div class="job"><span>🌙 Night Legends</span><span>${Object.keys(S.legends || {}).length}/${LAKES.length}</span></div>
    <div class="job"><span>⚔️ Bosses</span><span>${Object.keys(S.bosses || {}).length}/${LAKES.length}</span></div>
    <div class="job"><span>🎁 Treasure chests</span><span>${S.treasures || 0}</span></div>
    <div class="job"><span>🏆 Derby wins</span><span>${S.derbyWins || 0}</span></div></div>`);
  // the family board: who holds the record for each fish
  const ps = LL.players().filter(p => p.game && p.game.dex);
  const rows = DEX_ORDER.filter(id => !SPECIES[id].legend).map(id => {
    let top = null; for (const p of ps){ const d = p.game.dex[id]; if (d && (!top || d.best > top.best)) top = { name: p.name, best: d.best }; }
    return `<div class="job"><span>${SPECIES[id].name}</span><span>${top ? "👑 " + LL.esc(top.name) + " · " + top.best.toFixed(1) + " in" : "—"}</span></div>`; }).join("");
  box.insertAdjacentHTML("beforeend", `<div class="card"><b>👨‍👩‍👧 Family records</b> <span class="muted">the biggest of each fish anyone in the family has caught</span>${rows}</div>`);
}

// =====================================================================
//  PLAYERS: who's fishing? (accounts, picture locks and online save live in ll-core.js)
// =====================================================================
function showTitle(){
  const p = LL.player();
  if (p){ $("whoPic").innerHTML = avatarSvg(p, 40); $("whoName").textContent = p.name + (titleOf() ? " · " + titleOf() : ""); $("btnPlay").textContent = "🎣 Let's Fish, " + p.name + "!"; }
  showScreen("title");
}
function signIn(p){ trip = null; visit = null; pending = null; modalQueue = []; $("modal").classList.remove("show"); bindPlayer(p); showTitle(); }
function signOut(){ trip = null; visit = null; pending = null; modalQueue = []; $("modal").classList.remove("show"); LL.leave(); S = defaultSave(); showScreen("title"); LL.profiles(signIn); }
$("btnWho").onclick = () => { SFX.click(); signOut(); };
$("btnBug").onclick = () => { SFX.click(); LL.report(); };
// "Get the app": install Lake Legends like an app (its own window and icon) on a Mac, PC, iPad or phone
let installEvt = null;
const installed = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("btnApp").style.display = installed() ? "none" : ""; });
window.addEventListener("appinstalled", () => { installEvt = null; $("btnApp").style.display = "none"; toast("🎣 Lake Legends is installed! Find it with your other apps."); });
if (!installed()) $("btnApp").style.display = "";
$("btnApp").onclick = async () => {
  SFX.click();
  if (installEvt){ installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; return; }
  const ua = navigator.userAgent, ipad = /iPad|iPhone/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1), safari = /Safari/.test(ua) && !/Chrome|Chromium|Edg/.test(ua);
  infoModal(`<div style="font-size:3em">💻</div><h3>Get the Lake Legends app</h3>
    <div style="text-align:left">${ipad ? `<p><b>On an iPad or iPhone:</b> tap the Share button <b>⬆️</b>, then <b>Add to Home Screen</b>.</p>`
      : safari ? `<p><b>On a Mac in Safari:</b> click <b>File</b> in the menu bar, then <b>Add to Dock…</b>, then <b>Add</b>.</p>`
      : `<p><b>In Chrome or Edge:</b> click the install icon <b>⊕</b> at the right end of the address bar (or the <b>⋮</b> menu → <b>Cast, save and share</b> → <b>Install page as app</b>), then <b>Install</b>.</p>`}
    <p class="muted">The game opens in its own window with its own icon.</p>
    ${ipad || safari ? `<p class="muted"><b>Grown-ups:</b> an app added from Safari keeps its own save. Turn on online save in the Parent Corner first, then in the new app open <b>Parents</b> and type your family code under "Already have a family code" so everyone's players come along.</p>` : `<p class="muted">Your players and progress come along.</p>`}</div>`, "Got it");
};
window.LL_SCREEN = () => state === "fishing" && trip ? "fishing at " + trip.lake.name + (trip.boss ? " (boss)" : "") : state;
// an online sync can remove the player (a parent did it on another device) or a parent can start them over
LL.onChange(() => {
  const p = LL.player();
  if (!p){ if (!document.getElementById("llOv")) signOut(); return; }
  if (p.game !== S){ bindPlayer(p); if (state !== "title"){ trip = null; visit = null; showTitle(); } }
});
window.LL_AVATAR = (p, size) => avatarSvg(p, size);
window.LL_SAFE = () => state !== "fishing" && state !== "results" && !$("modal").classList.contains("show");
// one line per player for the Parent Corner
window.LL_KID = g => {
  if (!g || !g.up) return "";
  const n = DEX_ORDER.filter(id => g.dex && g.dex[id]).length, bosses = Object.keys(g.bosses || {}).length;
  let big = null;
  for (const id of Object.keys(g.dex || {})){ const sp = SPECIES[id]; if (!sp) continue; const lb = weightLb(sp, g.dex[id].best); if (!big || lb > big.lb) big = { lb, name: sp.name, inches: g.dex[id].best }; }
  return "🪙 " + (g.coins || 0) + " · 📖 " + n + "/" + DEX_ORDER.length + " fish · 🗺️ " + (g.lakes || []).length + "/" + LAKES.length + " lakes · ⚔️ " + bosses + "/" + LAKES.length + " bosses · 🐟 " + (g.landed || 0) + " landed"
    + (big ? "<br>Biggest: " + big.name + ", " + big.inches.toFixed(1) + " in (" + fmtLb(big.lb) + ")" : "");
};
{ const p = LL.sessionPlayer(); if (p) signIn(p); else LL.profiles(signIn); }
</script>
