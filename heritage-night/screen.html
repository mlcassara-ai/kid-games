<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover Lebanon — Big Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: TV at any size. Left 3/4 = the quiz stage, right 1/4 = leaderboard with the QR code at its foot. Sized in vh so it scales. */
:root {
  --ground: #0c3326; --ground-2: #124434; --panel: #0a2a1f; --line: rgba(255,255,255,.12);
  --ink: #ffffff; --ink-soft: #c9ddd3; --red: #e23b2e; --cedar: #2fb36b; --gold: #f6b93b;
  --a0: #e5483c; --a1: #2f7fd8; --a2: #e9a51e; --a3: #1f9e5c;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); cursor: none; }
.wrap { display: grid; grid-template-columns: 3fr 1fr; grid-template-rows: 100%; height: 100%; }

/* ---------- stage ---------- */
.stage { position: relative; display: flex; flex-direction: column; padding: 3.2vh 3.6vw 3vh; min-width: 0;
  background: radial-gradient(120% 90% at 30% 10%, var(--ground-2), var(--ground) 70%); }
.top { display: flex; align-items: center; gap: 1.4vw; }
.flag { height: 6.2vh; width: auto; border-radius: .6vh; box-shadow: 0 .4vh 1.2vh rgba(0,0,0,.35); flex: none; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 5.4vh; line-height: .95; letter-spacing: .02em; }
.brand p { margin: .3vh 0 0; font-size: 2.1vh; color: var(--ink-soft); letter-spacing: .14em; text-transform: uppercase; }
.pill { margin-left: auto; font-family: var(--display); font-weight: 800; font-size: 2.8vh; padding: .5vh 1.6vw; border-radius: 99px;
  background: rgba(255,255,255,.1); border: 1px solid var(--line); white-space: nowrap; }
.pill.q { background: var(--red); border-color: transparent; }
.pill.r { background: var(--cedar); border-color: transparent; }
.bar { height: 1.1vh; margin-top: 2.4vh; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; }
.body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }

.fact { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 3vw; }
.fact .emo { font-size: 22vh; line-height: 1; filter: drop-shadow(0 1vh 2vh rgba(0,0,0,.35)); }
.fact .kicker { font-family: var(--display); font-weight: 800; color: var(--gold); font-size: 3.4vh; letter-spacing: .06em; text-transform: uppercase; }
.fact .txt { font-size: 5.2vh; line-height: 1.28; font-weight: 700; text-wrap: balance; margin-top: 1vh; }
.fact .next { margin-top: 3vh; font-size: 2.6vh; color: var(--ink-soft); }

.qtext { font-family: var(--display); font-weight: 800; font-size: 6vh; line-height: 1.12; text-wrap: balance; margin: 0 0 3.4vh; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 2vh 1.4vw; }
.opt { display: flex; align-items: center; gap: 1.4vw; min-height: 14vh; padding: 1.6vh 1.6vw; border-radius: 1.8vh;
  font-size: 3.9vh; font-weight: 700; line-height: 1.15; box-shadow: 0 .7vh 0 rgba(0,0,0,.28); transition: opacity .4s, transform .4s, filter .4s; }
.opt .shp { flex: none; width: 6.6vh; height: 6.6vh; display: grid; place-items: center; border-radius: 1vh; background: rgba(0,0,0,.18); font-size: 3.6vh; }
.o0 { background: var(--a0); } .o1 { background: var(--a1); } .o2 { background: var(--a2); color: #2a1a00; } .o3 { background: var(--a3); }
.reveal .opt.no { opacity: .22; filter: grayscale(.7); transform: scale(.97); }
.reveal .opt.yes { transform: scale(1.03); outline: .6vh solid #fff; outline-offset: .2vh; }
.opt .tick { margin-left: auto; font-size: 5vh; }
.status { display: flex; gap: 2vw; align-items: center; margin-top: 3vh; font-size: 3vh; font-weight: 700; color: var(--ink-soft); min-height: 4.6vh; }
.status b { color: var(--ink); font-family: var(--display); font-size: 4vh; }
.status .fast { color: var(--gold); }

/* ---------- leaderboard ---------- */
.side { display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); padding: 3.2vh 1.4vw 2.4vh; min-width: 0; min-height: 0; overflow: hidden; }
.side h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 4.2vh; display: flex; align-items: baseline; gap: .6vw; }
.side h2 small { margin-left: auto; font-family: var(--body); font-weight: 700; font-size: 2vh; color: var(--ink-soft); }
.board { list-style: none; margin: 1.6vh 0 0; padding: 0; display: flex; flex-direction: column; gap: .7vh; flex: 1; min-height: 0; overflow: hidden; }
.row { display: grid; grid-template-columns: 4.4vh 4.4vh 1fr auto; align-items: center; gap: .8vw; padding: .55vh .6vw; border-radius: 1.2vh;
  background: rgba(255,255,255,.06); font-size: 2.5vh; font-weight: 700; }
.row .rk { width: 4.4vh; height: 4.4vh; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 2.4vh; background: rgba(255,255,255,.12); }
.row:nth-child(1) .rk { background: var(--gold); color: #3a2600; }
.row:nth-child(2) .rk { background: #d9e2e8; color: #26323a; }
.row:nth-child(3) .rk { background: #d68a4c; color: #3b1d05; }
.row .av { font-size: 3.2vh; text-align: center; }
.row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .sc { font-variant-numeric: tabular-nums; font-family: var(--display); font-weight: 800; font-size: 2.8vh; }
.row .up { color: var(--cedar); font-size: 1.8vh; margin-left: .3vw; }
.row.new { animation: pop .8s ease-out; }
@keyframes pop { from { background: rgba(246,185,59,.55); } to { background: rgba(255,255,255,.06); } }
.empty { color: var(--ink-soft); font-size: 2.4vh; line-height: 1.4; padding: 1vh .4vw; }
.join { margin-top: 1.6vh; background: #fff; color: #0b2a20; border-radius: 2vh; padding: 1.8vh; display: grid; justify-items: center; gap: 1vh; }
.join { flex: none; } .join .qr { width: 100%; max-width: 24vh; aspect-ratio: 1; }
.join .qr svg { width: 100%; height: 100%; display: block; }
.join b { font-family: var(--display); font-weight: 800; font-size: 3.4vh; line-height: 1; }
.join span { font-size: 1.35vh; text-align: center; white-space: nowrap; color: #3d5a4e; }
.toast { position: fixed; left: 3.6vw; bottom: 3vh; max-width: 40vw; background: var(--gold); color: #3a2600; border-radius: 1.4vh;
  padding: 1.2vh 1vw; font-weight: 700; font-size: 2.3vh; box-shadow: 0 1vh 2vh rgba(0,0,0,.35); transform: translateY(160%); opacity: 0; transition: transform .45s, opacity .45s; z-index: 5; }
.toast.on { opacity: 1; }
.toast.on { transform: none; }
.net { position: fixed; left: 1vw; bottom: .8vh; font-size: 1.5vh; color: var(--ink-soft); opacity: .7; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var SHAPES = ['▲', '◆', '●', '■'];
  var players = {}, lastRanks = {}, seen = null, shownKey = '', lastPoll = 0, polling = false, toastQ = [], toastBusy = false;

  function renderStage(ph) {
    var q = HN.questionFor(ph.cycle), key = ph.cycle + ph.name, body = $('body'), pill = $('pill');
    if (key !== shownKey) {
      shownKey = key;
      pill.className = 'pill' + (ph.name === 'question' ? ' q' : ph.name === 'reveal' ? ' r' : '');
      pill.textContent = ph.name === 'fact' ? 'Did you know?' : ph.name === 'question' ? 'Answer on your phone!' : 'Answer';
      if (ph.name === 'fact') {
        body.className = 'body';
        body.innerHTML = '<div class="fact"><div class="emo">' + q.e + '</div><div><div class="kicker">Did you know?</div><div class="txt">' + HN.esc(q.f) +
          '</div><div class="next" id="next"></div></div></div>';
      } else {
        body.className = 'body' + (ph.name === 'reveal' ? ' reveal' : '');
        body.innerHTML = '<h2 class="qtext">' + HN.esc(q.q) + '</h2><div class="opts">' + q.opts.map(function (o, i) {
          var cls = ph.name === 'reveal' ? (i === q.right ? ' yes' : ' no') : '';
          return '<div class="opt o' + i + cls + '"><span class="shp">' + SHAPES[i] + '</span><span>' + HN.esc(o) + '</span>' + (ph.name === 'reveal' && i === q.right ? '<span class="tick">✓</span>' : '') + '</div>';
        }).join('') + '</div><div class="status" id="status"></div>';
        renderBoard(); // scores only move on screen once the answer is shown
      }
    }
    var nx = $('next'); if (nx) nx.textContent = 'Question in ' + Math.ceil(ph.left / 1000) + '…';
    $('bar').style.transform = 'scaleX(' + Math.max(0, ph.left / ph.len) + ')';
    var st = $('status');
    if (st) {
      var answered = 0, right = 0, fast = null;
      for (var k in players) { var p = players[k]; if (p.q === ph.cycle) { answered++; if (p.k) { right++; if (!fast || p.t < fast.t) fast = p; } } }
      st.innerHTML = ph.name === 'question'
        ? '<span>⏱ <b>' + Math.ceil(ph.left / 1000) + '</b></span><span>✋ <b>' + answered + '</b> answered</span>'
        : '<span>🎉 <b>' + right + '</b> got it right</span>' + (fast ? '<span class="fast">⚡ Fastest: ' + HN.esc(fast.a + ' ' + fast.n) + '</span>' : '');
    }
  }

  function renderBoard() {
    var list = HN.rank(players), top = list.slice(0, 8), b = $('board');
    $('count').textContent = list.length ? list.length + (list.length === 1 ? ' player' : ' players') : '';
    if (!list.length) return;
    var ranks = {};
    list.forEach(function (p, i) { ranks[p.id] = i; });
    b.innerHTML = top.map(function (p, i) {
      var was = lastRanks[p.id], up = was != null && was > i;
      return '<li class="row' + (up ? ' new' : '') + '"><span class="rk">' + (i + 1) + '</span><span class="av">' + HN.esc(p.a) + '</span><span class="nm">' + HN.esc(p.n) +
        (up ? '<span class="up">▲</span>' : '') + '</span><span class="sc">' + p.s.toLocaleString() + '</span></li>';
    }).join('');
    lastRanks = ranks;
  }

  function toast(msg) { toastQ.push(msg); if (!toastBusy) nextToast(); }
  function nextToast() {
    var m = toastQ.shift(), t = $('toast'); if (!m) { toastBusy = false; return; }
    toastBusy = true; t.textContent = m; t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); setTimeout(nextToast, 500); }, toastQ.length > 3 ? 1400 : 2600);
  }

  async function poll() {
    if (polling) return; polling = true;
    try {
      players = await HN.allPlayers();
      if (seen) { var fresh = Object.keys(players).filter(function (k) { return !seen[k]; }); fresh.slice(0, 6).forEach(function (k) { toast(players[k].a + ' ' + players[k].n + ' joined!'); }); }
      seen = {}; for (var k in players) seen[k] = 1;
      var ph = HN.phase(); if (ph.name !== 'question' || !Object.keys(lastRanks).length) renderBoard();
      $('net').textContent = '';
    } catch (e) { $('net').textContent = 'Reconnecting…'; }
    polling = false;
  }

  function tick() {
    var ph = HN.phase(); renderStage(ph);
    if (Date.now() - lastPoll > 2500) { lastPoll = Date.now(); poll(); }
  }
  HN.syncClock(); setInterval(HN.syncClock, 5 * 60000);
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
  tick(); setInterval(tick, 200);
})();
</script>
