<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover Lebanon — Big Screen</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c3326">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: TV at any size. Left 3/4 = the quiz stage, right 1/4 = leaderboard with the QR code at its foot. Sized in vh so it scales. */
:root {
  /* the design is a 16:9 picture scaled to fit: 1 --u is 1% of its height, 1 --w is 1% of its width, on any screen shape */
  --u: min(1vh, 0.5625vw); --w: min(1vw, 1.7778vh);
  --ground: #0c3326; --ground-2: #124434; --panel: #0a2a1f; --line: rgba(255,255,255,.12);
  --ink: #ffffff; --ink-soft: #c9ddd3; --red: #e23b2e; --cedar: #2fb36b; --gold: #f6b93b;
  --a0: #e5483c; --a1: #2f7fd8; --a2: #e9a51e; --a3: #1f9e5c;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); cursor: none; }
.wrap { display: grid; grid-template-columns: 3fr 1fr; grid-template-rows: 100%; height: 100%; }

/* ---------- stage ---------- */
.stage { position: relative; display: flex; flex-direction: column; padding: calc(3.2 * var(--u)) calc(3.6 * var(--w)) calc(3 * var(--u)); min-width: 0;
  background: radial-gradient(120% 90% at 30% 10%, var(--ground-2), var(--ground) 70%); }
.top { display: flex; align-items: center; gap: calc(1.4 * var(--w)); }
.flag { height: calc(6.2 * var(--u)); width: auto; border-radius: calc(.6 * var(--u)); box-shadow: 0 calc(.4 * var(--u)) calc(1.2 * var(--u)) rgba(0,0,0,.35); flex: none; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: calc(5.4 * var(--u)); line-height: .95; letter-spacing: .02em; }
.brand p { margin: calc(.3 * var(--u)) 0 0; font-size: calc(2.1 * var(--u)); color: var(--ink-soft); letter-spacing: .14em; text-transform: uppercase; }
.pill { font-family: var(--display); font-weight: 800; font-size: calc(2.8 * var(--u)); padding: calc(.5 * var(--u)) calc(1.6 * var(--w)); border-radius: 99px;
  background: rgba(255,255,255,.1); border: 1px solid var(--line); white-space: nowrap; }
.pill.q { background: var(--red); border-color: transparent; }
.pill.r { background: var(--cedar); border-color: transparent; }
.body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }

.fact { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: calc(3 * var(--w)); }
.fact .emo { font-size: calc(22 * var(--u)); line-height: 1; filter: drop-shadow(0 calc(1 * var(--u)) calc(2 * var(--u)) rgba(0,0,0,.35)); }
.fact .kicker { font-family: var(--display); font-weight: 800; color: var(--gold); font-size: calc(3.4 * var(--u)); letter-spacing: .06em; text-transform: uppercase; }
.fact .txt { font-size: calc(5.2 * var(--u)); line-height: 1.28; font-weight: 700; text-wrap: balance; margin-top: calc(1 * var(--u)); }
.fact .next { margin-top: calc(3 * var(--u)); font-size: calc(2.6 * var(--u)); color: var(--ink-soft); }

.qtext { font-family: var(--display); font-weight: 800; font-size: calc(6 * var(--u)); line-height: 1.12; text-wrap: balance; margin: 0 0 calc(3.4 * var(--u)); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: calc(2 * var(--u)) calc(1.4 * var(--w)); }
.opt { display: flex; align-items: center; gap: calc(1.4 * var(--w)); min-height: calc(14 * var(--u)); padding: calc(1.6 * var(--u)) calc(1.6 * var(--w)); border-radius: calc(1.8 * var(--u));
  font-size: calc(3.9 * var(--u)); font-weight: 700; line-height: 1.15; box-shadow: 0 calc(.7 * var(--u)) 0 rgba(0,0,0,.28); transition: opacity .4s, transform .4s, filter .4s; }
.opt .shp { flex: none; width: calc(6.6 * var(--u)); height: calc(6.6 * var(--u)); display: grid; place-items: center; border-radius: calc(1 * var(--u)); background: rgba(0,0,0,.18); font-size: calc(3.6 * var(--u)); }
.o0 { background: var(--a0); } .o1 { background: var(--a1); } .o2 { background: var(--a2); color: #2a1a00; } .o3 { background: var(--a3); }
.reveal .opt.no { opacity: .22; filter: grayscale(.7); transform: scale(.97); }
.reveal .opt.yes { transform: scale(1.03); outline: calc(.6 * var(--u)) solid #fff; outline-offset: calc(.2 * var(--u)); }
.opt .tick { margin-left: auto; font-size: calc(5 * var(--u)); }
.status { display: flex; gap: calc(2 * var(--w)); align-items: center; margin-top: calc(3 * var(--u)); font-size: calc(3 * var(--u)); font-weight: 700; color: var(--ink-soft); min-height: calc(4.6 * var(--u)); }
.status b { color: var(--ink); font-family: var(--display); font-size: calc(4 * var(--u)); }
.status .fast { color: var(--gold); }

/* ---------- leaderboard ---------- */
.side { display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); padding: calc(3.2 * var(--u)) calc(1.4 * var(--w)) calc(2.4 * var(--u)); min-width: 0; min-height: 0; overflow: hidden; }
.side h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: calc(4.2 * var(--u)); display: flex; align-items: baseline; gap: calc(.6 * var(--w)); }
.side .who { font-family: var(--display); font-weight: 800; font-size: calc(2.4 * var(--u)); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); line-height: 1; }
.side.gr .who { color: #7fb8ff; }
.side.gr .stars { background: rgba(47,127,216,.14); border-color: rgba(127,184,255,.4); } .side.gr .stars h3 { color: #7fb8ff; }
.side.gr .row:nth-child(1) .rk { background: #7fb8ff; color: #0b2340; }
.board.swap, .stars.swap { animation: swapIn .6s ease-out; }
@keyframes swapIn { from { opacity: 0; transform: translateX(calc(4 * var(--w))); } to { opacity: 1; transform: none; } }
.side h2 small { margin-left: auto; font-family: var(--body); font-weight: 700; font-size: calc(2 * var(--u)); color: var(--ink-soft); }
.board { list-style: none; margin: calc(1.6 * var(--u)) 0 0; padding: 0; display: flex; flex-direction: column; gap: calc(.7 * var(--u)); flex: 1; min-height: 0; overflow: hidden; }
.row { display: grid; grid-template-columns: calc(4.4 * var(--u)) calc(4.4 * var(--u)) 1fr auto; align-items: center; gap: calc(.8 * var(--w)); padding: calc(.55 * var(--u)) calc(.6 * var(--w)); border-radius: calc(1.2 * var(--u));
  background: rgba(255,255,255,.06); font-size: calc(2.5 * var(--u)); font-weight: 700; }
.row .rk { width: calc(4.4 * var(--u)); height: calc(4.4 * var(--u)); border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: calc(2.4 * var(--u)); background: rgba(255,255,255,.12); }
.row:nth-child(1) .rk { background: var(--gold); color: #3a2600; }
.row:nth-child(2) .rk { background: #d9e2e8; color: #26323a; }
.row:nth-child(3) .rk { background: #d68a4c; color: #3b1d05; }
.row .av { font-size: calc(3.2 * var(--u)); text-align: center; }
.row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .sc { font-variant-numeric: tabular-nums; font-family: var(--display); font-weight: 800; font-size: calc(2.8 * var(--u)); }
.row .up { color: var(--cedar); font-size: calc(1.8 * var(--u)); margin-left: calc(.3 * var(--w)); }
.row.new { animation: pop .8s ease-out; }
@keyframes pop { from { background: rgba(246,185,59,.55); } to { background: rgba(255,255,255,.06); } }
.empty { color: var(--ink-soft); font-size: calc(2.4 * var(--u)); line-height: 1.4; padding: calc(1 * var(--u)) calc(.4 * var(--w)); }
/* the join box: a glowing white QR tile and "Scan to play!" in gold, in a gold-framed card that matches the screen */
.join { flex: none; margin-top: calc(1.4 * var(--u)); display: flex; align-items: center; justify-content: center; gap: calc(1.1 * var(--w));
  padding: calc(1.5 * var(--u)) calc(1 * var(--w)); border-radius: calc(1.9 * var(--u)); background: linear-gradient(135deg, #124434, #0c3326);
  border: calc(.2 * var(--u)) solid rgba(246,185,59,.55); box-shadow: 0 0 0 calc(.55 * var(--u)) rgba(246,185,59,.08), 0 calc(.9 * var(--u)) calc(2.4 * var(--u)) rgba(0,0,0,.4); }
.join .tile { flex: none; background: #fff; border-radius: calc(1.4 * var(--u)); padding: calc(.9 * var(--u)); box-shadow: 0 0 calc(2 * var(--u)) rgba(246,185,59,.55); }
.join .qr { width: calc(11 * var(--u)); aspect-ratio: 1; } .join .qr svg { width: 100%; height: 100%; display: block; }
.join .txt { display: flex; flex-direction: column; gap: calc(.5 * var(--u)); }
.join .ph { font-size: calc(3.4 * var(--u)); line-height: 1; }
.join b { display: block; font-family: var(--display); font-weight: 800; font-size: calc(4.1 * var(--u)); line-height: .92; color: var(--gold); }
.join .any { font-size: calc(1.6 * var(--u)); font-weight: 700; color: var(--ink-soft); }
/* all-night stars: the top 3 kids of the whole night, playing or not */
.stars { flex: none; margin-top: calc(1.2 * var(--u)); padding: calc(1 * var(--u)) calc(.8 * var(--w)); border-radius: calc(1.4 * var(--u)); background: rgba(246,185,59,.12); border: 1px solid rgba(246,185,59,.35); }
.stars h3 { margin: 0 0 calc(.5 * var(--u)); font-family: var(--display); font-weight: 800; font-size: calc(2.2 * var(--u)); color: var(--gold); }
.stars div { display: grid; grid-template-columns: calc(3 * var(--u)) calc(3.4 * var(--u)) 1fr auto; gap: calc(.5 * var(--w)); align-items: center; font-size: calc(2 * var(--u)); font-weight: 700; line-height: 1.5; }
.stars .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.stars .sc { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }
/* ---------- Kids vs Grown-ups tug-of-war (bottom of the stage) ---------- */
.tug { flex: none; display: grid; grid-template-columns: 27% 1fr 27%; align-items: center; gap: calc(1.4 * var(--w)); margin-top: calc(2 * var(--u)); padding: calc(1.4 * var(--u)) calc(1.4 * var(--w));
  border-radius: calc(2 * var(--u)); background: rgba(0,0,0,.22); border: 1px solid var(--line); }
.team { display: grid; gap: calc(.2 * var(--u)); line-height: 1.05; }
.team.gr { text-align: right; }
.team b { font-family: var(--display); font-weight: 800; font-size: calc(3.6 * var(--u)); }
.team span { font-size: calc(1.9 * var(--u)); color: var(--ink-soft); font-weight: 700; }
.team.lead b { color: var(--gold); }
.rope { position: relative; height: calc(9 * var(--u)); }
.rope::before { content: ""; position: absolute; left: calc(5.5 * var(--w)); right: calc(5.5 * var(--w)); top: 40%; height: calc(1.2 * var(--u)); margin-top: calc(-.6 * var(--u)); border-radius: 99px;
  background: repeating-linear-gradient(115deg, #c79a5b 0 calc(1.1 * var(--u)), #a87b40 calc(1.1 * var(--u)) calc(2.2 * var(--u))); box-shadow: 0 calc(.4 * var(--u)) calc(.8 * var(--u)) rgba(0,0,0,.35); }
.rope .mid { position: absolute; left: 50%; top: 5%; bottom: 30%; width: calc(.4 * var(--u)); margin-left: calc(-.2 * var(--u)); background: rgba(255,255,255,.55); border-radius: 99px; }
.rope .knot { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -62%); font-size: calc(6 * var(--u)); line-height: 1; transition: left 1.4s cubic-bezier(.3,1.4,.5,1); }
.rope .pl { position: absolute; top: 40%; transform: translateY(-58%); font-size: calc(3.6 * var(--u)); line-height: 1; letter-spacing: calc(-.6 * var(--u)); white-space: nowrap; transition: transform .5s; }
.rope .pl.k { left: 0; transform-origin: left bottom; } .rope .pl.g { right: 0; transform-origin: right bottom; }
.rope.pk .pl.k { transform: translateY(-58%) rotate(-12deg); } .rope.pg .pl.g { transform: translateY(-58%) rotate(12deg); }
.rope .say { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; font-family: var(--display); font-weight: 800; font-size: calc(2.2 * var(--u)); color: var(--gold); }
.row .gd { display: block; font-size: calc(1.6 * var(--u)); font-weight: 700; color: var(--ink-soft); line-height: 1.1; }
/* ---------- rounds, double points, round champion ---------- */
.clock { position: relative; flex: none; margin-left: auto; width: calc(9.5 * var(--u)); height: calc(9.5 * var(--u)); }
.clock svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.clock .bg { fill: rgba(0,0,0,.25); stroke: rgba(255,255,255,.12); stroke-width: 8; }
.clock .arc { fill: none; stroke: var(--gold); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .2s linear, stroke .3s; }
.clock.q .arc { stroke: var(--red); } .clock.r .arc { stroke: var(--cedar); }
.clock b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: calc(4.2 * var(--u)); line-height: 1; font-variant-numeric: tabular-nums; }
.clock.q.hurry b { color: #ffb3ab; animation: tick 1s ease-in-out infinite; }
@keyframes tick { 50% { transform: scale(1.12); } }
.clock + .tr { margin-left: calc(1.4 * var(--w)); }
.tr { margin-left: auto; min-width: calc(21.5 * var(--w)); display: grid; justify-items: end; gap: calc(.8 * var(--u)); }
.rnd { font-family: var(--display); font-weight: 800; font-size: calc(2.4 * var(--u)); color: var(--ink-soft); white-space: nowrap; }
.dbl { align-self: flex-start; background: var(--gold); color: #3a2600; border-radius: 99px; padding: calc(.6 * var(--u)) calc(1.6 * var(--w)); margin-bottom: calc(2 * var(--u));
  font-family: var(--display); font-weight: 800; font-size: calc(3.4 * var(--u)); letter-spacing: .04em; animation: zap 1s ease-in-out infinite alternate; }
@keyframes zap { from { transform: scale(1); } to { transform: scale(1.06); } }
.prize { margin-top: calc(1.4 * var(--u)); font-family: var(--display); font-weight: 800; font-size: calc(2.8 * var(--u)); color: var(--gold); }
.row .fire { margin-right: calc(.3 * var(--w)); }
.champ { position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column; align-items: center; justify-content: center; gap: calc(2.4 * var(--u));
  background: radial-gradient(90% 80% at 50% 40%, rgba(246,185,59,.3), transparent 70%), #0a2a1f; text-align: center; }
.champ.on { display: flex; animation: champIn .6s ease-out; }
@keyframes champIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.champ h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: calc(8 * var(--u)); line-height: 1; color: var(--gold); }
.champ .sub { font-size: calc(2.8 * var(--u)); color: var(--ink-soft); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.champ .win { display: grid; justify-items: center; gap: calc(.6 * var(--u)); }
.champ .win .av { font-size: calc(18 * var(--u)); line-height: 1; filter: drop-shadow(0 calc(1 * var(--u)) calc(2 * var(--u)) rgba(0,0,0,.4)); }
.champ .win .nm { font-family: var(--display); font-weight: 800; font-size: calc(6.4 * var(--u)); line-height: 1; }
.champ .win .pt { font-family: var(--display); font-weight: 800; font-size: calc(4 * var(--u)); color: var(--gold); }
.champ .rest { display: flex; gap: calc(3 * var(--w)); font-size: calc(3 * var(--u)); font-weight: 700; }
.champ .rest span b { color: var(--gold); font-family: var(--display); }
body.mouse { cursor: auto; }
.tools { position: fixed; left: calc(1 * var(--w)); bottom: calc(.8 * var(--u)); z-index: 6; display: flex; gap: calc(.5 * var(--w)); }
.reset { font: inherit; font-size: calc(1.5 * var(--u)); font-weight: 700; color: var(--ink-soft); background: rgba(255,255,255,.08);
  border: 1px solid var(--line); border-radius: 99px; padding: calc(.4 * var(--u)) calc(1 * var(--w)); cursor: pointer; opacity: .35; transition: opacity .3s; }
.reset:hover, .reset:focus-visible { opacity: 1; }
.reset.inst { opacity: .9; background: var(--gold); color: #3a2600; border-color: transparent; }
.reset[hidden] { display: none; }
.toast { position: fixed; left: calc(3.6 * var(--w)); bottom: calc(19.5 * var(--u)); max-width: calc(40 * var(--w)); background: var(--gold); color: #3a2600; border-radius: calc(1.4 * var(--u));
  padding: calc(1.2 * var(--u)) calc(1 * var(--w)); font-weight: 700; font-size: calc(2.3 * var(--u)); box-shadow: 0 calc(1 * var(--u)) calc(2 * var(--u)) rgba(0,0,0,.35); transform: translateY(160%); opacity: 0; transition: transform .45s, opacity .45s; z-index: 5; }
.toast.on { opacity: 1; }
.toast.on { transform: none; }
.net { position: fixed; left: calc(24 * var(--w)); bottom: calc(.8 * var(--u)); font-size: calc(1.5 * var(--u)); color: var(--ink-soft); opacity: .7; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="stage" id="stage">
    <div class="top">
      <svg class="flag" viewBox="0 0 30 20" aria-label="Flag of Lebanon"><rect width="30" height="20" fill="#e23b2e"/><rect y="5" width="30" height="10" fill="#fff"/>
        <g fill="#1f9e5c"><path d="M15 5.6l2.6 3.2h-1.3l2.4 2.6h-1.5l2.6 2.4H10.2l2.6-2.4h-1.5l2.4-2.6h-1.3z"/><rect x="14.5" y="13.8" width="1" height="1.2"/></g></svg>
      <div class="brand"><h1>Discover Lebanon</h1><p>Family Heritage Night</p></div>
      <div class="clock" id="clock" aria-label="Seconds left"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="arc" id="arc" cx="50" cy="50" r="44" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><b id="secs"></b></div>
      <div class="tr"><div class="pill" id="pill">Did you know?</div><div class="rnd" id="rnd"></div></div>
    </div>
    <div class="body" id="body"></div>
    <div class="champ" id="champ" aria-live="polite"></div>
    <div class="tug" aria-label="Kids versus Grown-ups tug-of-war">
      <div class="team kid" id="tkid"><b>🧒 Kids</b><span id="tkidn"></span></div>
      <div class="rope" id="rope"><div class="pl k" id="plk">🤖🤖🤖</div><div class="mid"></div><div class="knot" id="knot">🌲</div><div class="pl g" id="plg">🤖🤖🤖</div><div class="say" id="say"></div></div>
      <div class="team gr" id="tgr"><b>Grown-ups 🧑</b><span id="tgrn"></span></div>
    </div>
  </section>
  <aside class="side">
    <div class="who" id="who">🧒 Kids</div>
    <h2>Playing Now <small id="count"></small></h2>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var SHAPES = ['▲', '◆', '●', '■'];
  var players = {}, seen = null, shownKey = '', lastPoll = 0, polling = false, toastQ = [], toastBusy = false, champFor = -1;

  function renderStage(ph) {
    var q = HN.questionFor(ph.cycle), key = ph.cycle + ph.name, body = $('body'), pill = $('pill');
    if (key !== shownKey) {
      shownKey = key;
      var qn = HN.qInRound(ph.cycle), dbl = HN.isDouble(ph.cycle) && ph.name !== 'reveal' ? '<div class="dbl">⚡ DOUBLE POINTS!</div>' : '';
      var rl = roundLabel(ph.cycle);
      $('rnd').textContent = (rl ? 'Round ' + rl + ' · ' : '') + 'Question ' + qn + ' of ' + HN.ROUND;
      $('champ').className = 'champ';
      if (ph.name === 'reveal' && qn === HN.ROUND && champFor !== ph.cycle) {   // last question of the round: crown the champion
        champFor = ph.cycle; lastPoll = 0;
        setTimeout(function () { showChamp(ph.cycle); }, HN.FAST ? 900 : 1500);
      }
      if (ph.name === 'reveal' && rope.c < ph.cycle) {   // one tug-of-war pull per question, once the answers are in
        lastPoll = 0;
        setTimeout(function () { applyPull(ph.cycle); }, HN.FAST ? 900 : 1500);
      }
      pill.className = 'pill' + (ph.name === 'question' ? ' q' : ph.name === 'reveal' ? ' r' : '');
      pill.textContent = ph.name === 'fact' ? 'Did you know?' : ph.name === 'question' ? 'Answer on your phone!' : 'Answer';
      if (ph.name === 'fact') {
        var left = HN.ROUND - qn + 1;
        body.className = 'body';
        body.innerHTML = dbl + '<div class="fact"><div class="emo">' + q.e + '</div><div><div class="kicker">Did you know?</div><div class="txt">' + HN.esc(q.f) +
          '</div><div class="next" id="next"></div><div class="prize">' + (left === 1 ? 'Round Champion after this question! 🏆' : 'Next Round Champion in ' + left + ' questions! 🏆') + '</div></div></div>';
        renderBoard();   // the side board may change turn (Kids / Grown-ups) with each new question
      } else {
        body.className = 'body' + (ph.name === 'reveal' ? ' reveal' : '');
        body.innerHTML = dbl + '<h2 class="qtext">' + HN.esc(q.q) + '</h2><div class="opts">' + q.opts.map(function (o, i) {
          var cls = ph.name === 'reveal' ? (i === q.right ? ' yes' : ' no') : '';
          return '<div class="opt o' + i + cls + '"><span class="shp">' + SHAPES[i] + '</span><span>' + HN.esc(o) + '</span>' + (ph.name === 'reveal' && i === q.right ? '<span class="tick">✓</span>' : '') + '</div>';
        }).join('') + '</div><div class="status" id="status"></div>';
        renderBoard(); // scores only move on screen once the answer is shown
      }
    }
    var nx = $('next'); if (nx) nx.textContent = 'Get ready, the question is next!';
    /* the countdown clock: seconds left in this part (fact, question or answer), coloured to match */
    var secs = Math.max(0, Math.ceil(ph.left / 1000));
    $('secs').textContent = secs;
    $('arc').setAttribute('stroke-dashoffset', (100 * (1 - Math.max(0, ph.left / ph.len))).toFixed(1));
    $('clock').className = 'clock' + (ph.name === 'question' ? ' q' + (secs <= 5 ? ' hurry' : '') : ph.name === 'reveal' ? ' r' : '');
    var st = $('status');
    if (st) {
      var answered = 0, right = 0, fast = null;
      for (var k in players) { var p = players[k]; if (p.q === ph.cycle) { answered++; if (p.k) { right++; if (!HN.isGrown(p) && (!fast || p.t < fast.t)) fast = p; } } }
      st.innerHTML = ph.name === 'question'
        ? '<span>✋ <b>' + answered + '</b> answered</span>'
        : '<span>🎉 <b>' + right + '</b> got it right</span>' + (fast ? '<span class="fast">⚡ Fastest: ' + HN.esc(fast.a + ' ' + fast.n) + '</span>' : '');
    }
  }

  /* The side board takes turns, F1-style: Kids on even questions, Grown-ups on odd ones (during the fact and question only;
     every answer reveal shows Kids). The grown-up turn is skipped until a real grown-up has joined. */
  var boardView = 'kids', lastRanksBy = { kids: {}, grown: {} };
  function viewFor(ph, all) {
    var hasGrown = all.some(function (p) { return p.g === 'a'; });
    return hasGrown && ph.name !== 'reveal' && ph.cycle % 2 ? 'grown' : 'kids';
  }
  function renderBoard() {
    renderTug();
    /* "Playing now": players of this view who answered at least one of the last 5 questions, ranked by their all-night points.
       Someone who stops drops off and comes back with their points the moment they answer again. */
    var ph = HN.phase(), cyc = ph.cycle, active = function (p) { return p.q >= cyc - 5; };
    var all = HN.rank(players), view = viewFor(ph, all), grown = view === 'grown';
    var group = all.filter(function (p) { return (p.g === 'a') === grown; }), list = group.filter(active), top = list.slice(0, 12), b = $('board');
    var switched = view !== boardView; boardView = view;
    var lastRanks = lastRanksBy[view];
    document.querySelector('.side').className = 'side' + (grown ? ' gr' : '');
    $('who').textContent = grown ? '🧑 Grown-ups' : '🧒 Kids';
    $('count').textContent = group.length ? list.length + ' playing' : '';
    var st = $('stars'), best = group.filter(function (p) { return p.s > 0; }).slice(0, 3);
    st.hidden = !best.length;
    st.innerHTML = '<h3>⭐ All-night stars</h3>' + best.map(function (p, i) {
      return '<div><span>' + ['🥇', '🥈', '🥉'][i] + '</span><span>' + HN.esc(p.a) + '</span><span class="nm">' + HN.esc(p.n) + '</span><span class="sc">' + p.s.toLocaleString() + '</span></div>';
    }).join('');
    if (switched) { [b, st].forEach(function (el) { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }); }
    if (!list.length) { b.innerHTML = '<li class="empty">' + (all.length ? 'Answer a question on your phone to get on the board!' : 'No players yet. Scan the code to join!') + '</li>'; lastRanksBy[view] = {}; return; }
    var ranks = {};
    list.forEach(function (p, i) { ranks[p.id] = i; });
    b.innerHTML = top.map(function (p, i) {
      var was = lastRanks[p.id], up = !switched && was != null && was > i;
      return '<li class="row' + (up ? ' new' : '') + '"><span class="rk">' + (i + 1) + '</span><span class="av">' + HN.esc(p.a) + '</span><span class="nm">' + (HN.onFire(p, cyc) ? '<span class="fire">🔥</span>' : '') + HN.esc(p.n) + (p.g && !grown ? '<span class="gd">' + HN.esc(HN.gradeLabel(p.g)) + '</span>' : '') +
        (up ? '<span class="up">▲</span>' : '') + '</span><span class="sc">' + p.s.toLocaleString() + '</span></li>';
    }).join('');
    lastRanksBy[view] = ranks;
  }


  /* "Round X" counts from the first round this screen saw today (only the screen shows it; phones use the absolute round) */
  var roundReset = new URLSearchParams(location.search).get('round') === '1';   // ?round=1 starts counting at Round 1 again
  function roundLabel(cycle) {
    if (!HN.isSynced()) return 0;   // wait for the server clock before fixing Round 1
    var r = HN.roundOf(cycle), k = 'heritagenight.round0.' + HN.EVENT, st = HN.lsGet(k);
    if (!st || r < st.r0 || r - st.r0 > 200 || roundReset) { roundReset = false; st = { r0: r }; HN.lsSet(k, st); }   // fresh start after ~12 hours away
    return r - st.r0 + 1;
  }
  function showChamp(cycle) {
    var ph = HN.phase(); if (ph.cycle !== cycle || ph.name !== 'reveal') return;
    var top = HN.kidsOnly(HN.roundTop(players, HN.roundOf(cycle))).slice(0, 3), c = $('champ');
    if (!top.length) return;
    var w = top[0];
    c.innerHTML = '<div class="sub">Round ' + (roundLabel(cycle) || '') + ' complete</div><h2>🏆 Round Champion!</h2>' +
      '<div class="win"><div class="av">' + HN.esc(w.a) + '</div><div class="nm">' + HN.esc(w.n) + '</div><div class="pt">' + w.rs.toLocaleString() + ' points this round</div></div>' +
      (top.length > 1 ? '<div class="rest">' + top.slice(1).map(function (p, i) { return '<span>' + (i ? '🥉' : '🥈') + ' ' + HN.esc(p.a + ' ' + p.n) + ' <b>' + p.rs.toLocaleString() + '</b></span>'; }).join('') + '</div>' : '');
    c.className = 'champ on';
  }

  /* the tug-of-war: the rope's position (-8 grown-ups .. +8 kids) is kept on this screen; each question adds one pull (HN.pull) */
  var ROPE_KEY = 'heritagenight.rope.' + HN.EVENT, rope = HN.lsGet(ROPE_KEY) || { c: -1, pos: 0, say: '' };
  function applyPull(cycle) {
    var ph = HN.phase(); if (ph.cycle !== cycle || rope.c >= cycle) return;
    var pl = HN.pull(players, cycle), pos = HN.movePos(rope.pos, pl);
    rope = { c: cycle, pos: pos, say: !pl.winner ? 'A tie! Nobody moves.' : pos === rope.pos && pl.robotOnly ? '🤖 Robots pulled, but not strong enough!'
      : pl.winner === 'kids' ? 'Kids won that pull! 💪' : 'Grown-ups won that pull! 💪', w: pl.winner };
    HN.lsSet(ROPE_KEY, rope);
    renderTug(true);
  }
  function renderTug(justPulled) {
    var t = HN.pull(players, HN.phase().cycle), r = $('rope');
    $('knot').style.left = (50 - rope.pos * 4) + '%';   // kids pull left
    $('tkidn').textContent = t.kids + (t.kids === 1 ? ' kid' : ' kids') + (t.kidBots ? ' + 🤖 ' + t.kidBots + (t.kidBots === 1 ? ' robot' : ' robots') : '');
    $('tgrn').textContent = t.grown + (t.grown === 1 ? ' grown-up' : ' grown-ups') + (t.grownBots ? ' + 🤖 ' + t.grownBots + (t.grownBots === 1 ? ' robot' : ' robots') : '');
    $('plk').textContent = t.kids ? (t.kidBots ? '🧒🧒🤖' : '🧒🧒🧒') : '🤖🤖🤖';
    $('plg').textContent = t.grown ? (t.grownBots ? '🤖🧑🧑' : '🧑🧑🧑') : '🤖🤖🤖';
    $('tkid').className = 'team kid' + (rope.pos > 0 ? ' lead' : '');
    $('tgr').className = 'team gr' + (rope.pos < 0 ? ' lead' : '');
    $('say').textContent = rope.say || 'Every question is a pull!';
    if (justPulled && rope.w) { r.className = 'rope ' + (rope.w === 'kids' ? 'pk' : 'pg'); setTimeout(function () { r.className = 'rope'; }, 1600); }
  }

  function toast(msg) { toastQ.push(msg); if (!toastBusy) nextToast(); }
  function nextToast() {
    var m = toastQ.shift(), t = $('toast'); if (!m) { toastBusy = false; return; }
    toastBusy = true; t.textContent = m; t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); setTimeout(nextToast, 500); }, toastQ.length > 3 ? 1400 : 2600);
  }

  async function poll() {
    if (polling) return; polling = true;
    try {
      players = await HN.allPlayers();
      if (seen) { var fresh = Object.keys(players).filter(function (k) { return !seen[k]; }); fresh.slice(0, 6).forEach(function (k) { toast(players[k].a + ' ' + players[k].n + ' joined!'); }); }
      seen = {}; for (var k in players) seen[k] = 1;
      var ph = HN.phase(); if (ph.name !== 'question' || !Object.keys(lastRanksBy[boardView]).length) renderBoard();
      $('net').textContent = '';
    } catch (e) { $('net').textContent = 'Reconnecting…'; }
    polling = false;
  }

  function tick() {
    var ph = HN.phase(); renderStage(ph);
    if (Date.now() - lastPoll > 2500) { lastPoll = Date.now(); poll(); }
  }
  /* 🔄 Reset: empties the leaderboard and the rope; every phone is sent back to pick a buddy */
  $('reset').onclick = async function () {
    if (!confirm('Reset the game?\n\nThis clears EVERY score, the leaderboard and the tug-of-war. Everyone will join again on their phone.')) return;
    $('reset').disabled = true;
    try {
      await HN.resetAll();
      players = {}; lastRanksBy = { kids: {}, grown: {} }; seen = null; roundReset = true; champFor = -1;
      rope = { c: HN.phase().cycle, pos: 0, say: '' }; HN.lsSet(ROPE_KEY, rope);
      $('board').innerHTML = '<li class="empty">No players yet. Scan the code to join!</li>';
      renderBoard(); shownKey = ''; toast('🔄 New game! Scan the code to join.');
    } catch (e) { alert('Could not reset. Check the internet connection and try again.'); }
    $('reset').disabled = false;
  };
  var mouseT = 0;   // the mouse pointer shows for a few seconds after it moves, so the Reset button can be reached
  document.addEventListener('mousemove', function () { document.body.classList.add('mouse'); clearTimeout(mouseT); mouseT = setTimeout(function () { document.body.classList.remove('mouse'); }, 3000); });
  /* full screen (button or F) and installing as a desktop app (Chrome / Edge) */
  function toggleFull() {
    var d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { var el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
  }
  document.addEventListener('keydown', function (e) { if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) { try { toggleFull(); } catch (er) {} } });
  var installEvt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; $('install').hidden = false; });
  window.addEventListener('appinstalled', function () { $('install').hidden = true; });
  $('install').onclick = function () { if (installEvt) { installEvt.prompt(); installEvt = null; $('install').hidden = true; } };
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () {});
  HN.syncClock(); setInterval(HN.syncClock, 5 * 60000);
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
  tick(); setInterval(tick, 200);
})();
</script>
</body>
