<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discover Lebanon Quiz</title>
<meta name="theme-color" content="#0c3326">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Phone: one column. Join card, then a play view that follows the big screen: fact -> four big answer buttons -> result. */
:root {
  --ground: #0c3326; --ground-2: #124434; --line: rgba(255,255,255,.14);
  --ink: #ffffff; --ink-soft: #c9ddd3; --red: #e23b2e; --cedar: #2fb36b; --gold: #f6b93b;
  --a0: #e5483c; --a1: #2f7fd8; --a2: #e9a51e; --a3: #1f9e5c;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(130% 80% at 50% 0%, var(--ground-2), var(--ground) 70%) fixed, var(--ground); color: var(--ink); font-family: var(--body);
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: 16px 20px; gap: 16px; }
.flag { width: 60px; height: 40px; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,.35); }
h1 { font-family: var(--display); font-weight: 800; font-size: 2.1rem; line-height: 1; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-soft); text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; font-weight: 700; margin-top: 4px; }
.head { display: flex; align-items: center; gap: 12px; }

/* join */
.card { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 20px; padding: 22px 18px; display: grid; justify-items: center; gap: 12px; text-align: center; }
.card .lbl { color: var(--ink-soft); font-weight: 700; font-size: .95rem; }
.big-av { font-size: 5.4rem; line-height: 1; }
.big-nm { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.05; }
button { font: inherit; cursor: pointer; border: 0; color: inherit; }
.btn { width: 100%; border-radius: 16px; padding: 16px; font-family: var(--display); font-weight: 800; font-size: 1.4rem; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.btn.go { background: var(--gold); color: #3a2600; }
.btn.alt { background: rgba(255,255,255,.12); font-size: 1.1rem; padding: 12px; box-shadow: none; }
.btn:focus-visible, .ans:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.steps { display: flex; align-items: center; justify-content: space-between; color: var(--ink-soft); font-weight: 700; font-size: .95rem; }
.steps .dots { display: flex; gap: 6px; } .steps .dots i { width: 28px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.18); }
.steps .dots i.on { background: var(--gold); }
.step-t { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1.05; }
.mini { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; justify-self: start; } .mini span { font-size: 2rem; }
.team-tag { background: rgba(246,185,59,.18); color: var(--gold); border-radius: 99px; padding: 6px 14px; font-weight: 700; }
.wait { text-align: center; display: grid; gap: 10px; justify-items: center; padding-top: 30px; }
.wait .emo { font-size: 4.4rem; line-height: 1; } .wait .t { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.05; }
.wait .n { font-family: var(--display); font-weight: 800; font-size: 3rem; color: var(--gold); }
.pick-lbl { color: var(--ink-soft); font-weight: 700; font-size: .95rem; justify-self: start; }
.avs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.avs button, .grades button { background: rgba(255,255,255,.09); border-radius: 14px; border: 2px solid transparent; }
.avs button { font-size: 2.2rem; line-height: 1; padding: 10px 0; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.grades button { font-family: var(--display); font-weight: 800; font-size: 1.25rem; padding: 10px 0; }
.grades button.wide { grid-column: span 4; }
.avs button.on, .grades button.on { border-color: var(--gold); background: rgba(246,185,59,.22); }
.btn.go:disabled { opacity: .45; box-shadow: none; transform: none; }
.dbl { align-self: center; background: var(--gold); color: #3a2600; border-radius: 99px; padding: 6px 16px; font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: .03em; }
.fire { background: rgba(229,72,60,.25); border: 2px solid #e5483c; border-radius: 14px; padding: 8px 14px; font-weight: 700; font-size: 1.1rem; }
.team { background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 1rem; }
.how { color: var(--ink-soft); font-size: .95rem; line-height: 1.45; text-align: left; margin: 0; padding-left: 1.2em; }

/* play */
.me { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.me .av { font-size: 2.2rem; }
.me .nm { font-weight: 700; font-size: 1.05rem; line-height: 1.15; min-width: 0; }
.me .nm small { display: block; color: var(--ink-soft); font-weight: 400; font-size: .85rem; }
.me .sc { font-family: var(--display); font-weight: 800; font-size: 1.6rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); transform-origin: left; }
.panel { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.kick { font-family: var(--display); font-weight: 800; color: var(--gold); letter-spacing: .06em; text-transform: uppercase; font-size: 1rem; }
.fact-e { font-size: 4rem; line-height: 1; }
.fact-t { font-size: 1.3rem; line-height: 1.4; font-weight: 700; margin: 0; }
.soft { color: var(--ink-soft); font-size: 1rem; margin: 0; }
.q { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.12; margin: 0; text-wrap: balance; }
.answers { display: grid; gap: 12px; }
.ans { display: flex; align-items: center; gap: 12px; text-align: left; border-radius: 16px; padding: 16px 14px; min-height: 72px; font-size: 1.2rem; font-weight: 700;
  box-shadow: 0 5px 0 rgba(0,0,0,.3); transition: opacity .3s, transform .15s; }
.ans .shp { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: rgba(0,0,0,.18); font-size: 1.3rem; }
.ans.o0 { background: var(--a0); } .ans.o1 { background: var(--a1); } .ans.o2 { background: var(--a2); color: #2a1a00; } .ans.o3 { background: var(--a3); }
.ans:active { transform: translateY(3px); }
.locked .ans { opacity: .3; } .locked .ans.pick { opacity: 1; outline: 4px solid #fff; outline-offset: 2px; }
.result { text-align: center; display: grid; gap: 8px; justify-items: center; padding-top: 10px; }
.result .emo { font-size: 4.6rem; line-height: 1; }
.result .t { font-family: var(--display); font-weight: 800; font-size: 2.2rem; line-height: 1.05; }
.result .pts { font-family: var(--display); font-weight: 800; font-size: 1.8rem; color: var(--gold); }
.rankbox { margin-top: 6px; background: rgba(255,255,255,.08); border-radius: 16px; padding: 12px 18px; font-size: 1.15rem; font-weight: 700; }
.rankbox b { font-family: var(--display); font-size: 1.8rem; color: var(--gold); }
.net { text-align: center; color: var(--ink-soft); font-size: .85rem; min-height: 1em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="hn-core.js?v=15"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var SHAPES = ['▲', '◆', '●', '■'];
  var KEY = 'heritagenight.me.' + HN.EVENT;
  var FLAG = '<svg class="flag" viewBox="0 0 30 20" aria-label="Flag of Lebanon"><rect width="30" height="20" fill="#e23b2e"/><rect y="5" width="30" height="10" fill="#fff"/><g fill="#1f9e5c"><path d="M15 5.6l2.6 3.2h-1.3l2.4 2.6h-1.5l2.6 2.4H10.2l2.6-2.4h-1.5l2.4-2.6h-1.3z"/><rect x="14.5" y="13.8" width="1" height="1.2"/></g></svg>';
  var me = HN.lsGet(KEY), draft = null, pickAv = 0, pickG = '', joinStep = 1, taken = {}, shownKey = '', dirty = false, saving = false, rankInfo = null, rankFor = -1, teamLine = '';

  function save() { HN.lsSet(KEY, me); }
  function rid(n) { var a = new Uint8Array(n), s = ''; crypto.getRandomValues(a); for (var i = 0; i < n; i++) s += 'abcdefghijklmnopqrstuvwxyz0123456789'[a[i] % 36]; return s; }
  function entry() { return { z: me.z, n: me.n, a: me.a, g: me.g, na: me.na || 0, r: me.r == null ? -1 : me.r, rs: me.rs || 0, st: me.st || 0, s: me.s, c: me.c, j: me.j, q: me.q == null ? -1 : me.q, k: !!me.k, t: me.t || 0 }; }
  async function push() {
    if (saving) { dirty = true; return; }
    saving = true; dirty = false;
    try { var r = await HN.saveEntry(me.pid, entry()); if (r.reset) { saving = false; startOver(); return; } if (me.z == null) { me.z = r.z; save(); } net(''); }
    catch (e) { dirty = true; net('Having trouble connecting… your points are saved on this phone.'); }
    saving = false;
    if (dirty) setTimeout(push, 1500);
  }
  /* the big screen pressed Reset: this player belongs to the old game, so join again */
  function startOver() {
    me = null; draft = null; pickG = ''; joinStep = 1; rankInfo = null; teamLine = ''; shownKey = '';
    try { localStorage.removeItem(KEY); } catch (e) {}
    joinView(); net('🔄 New game! Pick your buddy and grade to join.');
  }
  function net(t) { var n = document.getElementById('net'); if (n) n.textContent = t; }
  function wake() { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }

  /* ---------- join ---------- */
  /* Joining is three steps: 1 pick a character (the game makes a matching name, 🎲 for another), 2 pick your grade
     (TK-5th or Grown-up picks the team), 3 ready to play. A player saved before grades existed only sees step 2.
     A new player who joins during a question or an answer waits for the next fact card (me.from). */
  function stepHead(n, title) {
    return '<div class="steps"><span>Step ' + n + ' of 3</span><div class="dots">' + [1, 2, 3].map(function (i) { return '<i class="' + (i <= n ? 'on' : '') + '"></i>'; }).join('') + '</div></div>' +
      '<h2 class="step-t">' + title + '</h2>';
  }
  function joinView() {
    var regrade = !!(me && me.pid);
    if (regrade && joinStep === 1) joinStep = 2;
    if (!regrade && !draft) { pickAv = Math.floor(Math.random() * HN.AVATARS.length); draft = HN.newName(taken, pickAv); }
    var shown = regrade ? me : draft, html = '';
    if (joinStep === 1) {
      html = stepHead(1, 'Pick a character') +
        '<div class="card"><div class="big-av">' + HN.esc(shown.a) + '</div><div class="big-nm">' + HN.esc(shown.n) + '</div>' +
        '<button class="btn alt" id="reroll">🎲 Different name</button><div class="avs">' +
        HN.AVATARS.map(function (x, i) { return '<button data-av="' + i + '" class="' + (i === pickAv ? 'on' : '') + '" aria-label="' + HN.esc(x[1]) + '">' + x[0] + '</button>'; }).join('') + '</div>' +
        '<button class="btn go" id="next">Next →</button></div>';
    } else if (joinStep === 2) {
      html = stepHead(2, 'Pick your grade') +
        '<div class="card"><div class="mini"><span>' + HN.esc(shown.a) + '</span>' + HN.esc(shown.n) + '</div><div class="grades">' +
        HN.GRADES.map(function (g) { return '<button data-g="' + g[0] + '" class="' + (g[0] === 'a' ? 'wide ' : '') + (g[0] === pickG ? 'on' : '') + '">' + (g[0] === 'a' ? '🧑 I’m a grown-up' : g[1]) + '</button>'; }).join('') + '</div>' +
        '<button class="btn go" id="next"' + (pickG ? '' : ' disabled') + '>' + (pickG ? 'Next →' : 'Pick your grade') + '</button>' +
        (regrade ? '' : '<button class="btn alt" id="back">← Back</button>') + '</div>';
    } else {
      html = stepHead(3, 'Ready to play!') +
        '<div class="card"><div class="big-av">' + HN.esc(shown.a) + '</div><div class="big-nm">' + HN.esc(shown.n) + '</div>' +
        '<div class="team-tag">' + (pickG === 'a' ? '🧑 Grown-ups team' : '🧒 Kids team · ' + HN.esc(HN.gradeLabel(pickG))) + '</div>' +
        '<ol class="how"><li>Read the fun fact on the big screen and remember it.</li><li>The next question is about that fact. Tap your answer here.</li><li>Right answers score points. Faster answers score more!</li><li>Kids and grown-ups pull a tug-of-war on the big screen. Help your team win!</li></ol>' +
        '<button class="btn go" id="go">Let’s play!</button><button class="btn alt" id="back">← Back</button></div>';
    }
    app.innerHTML = '<div class="head">' + FLAG + '<div><h1>Discover Lebanon</h1><div class="sub">Family Heritage Night</div></div></div>' + html + '<div class="net" id="net"></div>';
    var on = function (id, fn) { var el = document.getElementById(id); if (el) el.onclick = fn; };
    on('reroll', function () { draft = HN.newName(taken, pickAv); joinView(); });
    Array.prototype.forEach.call(app.querySelectorAll('[data-av]'), function (b) { b.onclick = function () { pickAv = +b.getAttribute('data-av'); draft = HN.newName(taken, pickAv); joinView(); }; });
    Array.prototype.forEach.call(app.querySelectorAll('[data-g]'), function (b) { b.onclick = function () { pickG = b.getAttribute('data-g'); joinView(); }; });
    on('next', function () { if (joinStep === 2 && !pickG) return; joinStep++; joinView(); });
    on('back', function () { joinStep--; joinView(); });
    on('go', function () {
      if (!pickG) return;
      var ph = HN.phase(), from = ph.name === 'fact' ? ph.cycle : ph.cycle + 1;   // never drop in mid-question
      if (regrade) me.g = pickG;
      else me = { pid: rid(16), n: draft.n, a: draft.a, g: pickG, s: 0, c: 0, na: 0, j: Date.now(), q: -1, from: from };
      joinStep = 1; save(); wake(); shownKey = ''; push(); tick();
    });
  }


  /* ---------- play ---------- */
  function header(ph) {
    var r = rankInfo ? ' · #' + rankInfo.r + ' of ' + rankInfo.n : '';
    return '<div class="me"><span class="av">' + HN.esc(me.a) + '</span><span class="nm">' + HN.esc(me.n) + '<small>' + HN.esc(HN.gradeLabel(me.g)) + ' · ' + me.c + ' right' + r + '</small></span><span class="sc" id="sc">' + (me.shown || 0).toLocaleString() + '</span></div>' +
      '<div class="bar"><i id="bar"></i></div>';
  }
  function answer(ph, i) {
    var cur = HN.phase();
    if (cur.name !== 'question' || cur.cycle !== ph.cycle || me.q === ph.cycle) return;
    var q = HN.questionFor(ph.cycle), ms = Math.max(0, HN.now() - cur.qStart), ok = i === q.right, round = HN.roundOf(ph.cycle);
    if (me.r !== round) { me.r = round; me.rs = 0; }          // new round: round score starts again
    if (me.q !== ph.cycle - 1) me.st = 0;                       // missed the last question: streak is over
    me.st = ok ? (me.st || 0) + 1 : 0;
    me.q = ph.cycle; me.na = (me.na || 0) + 1; me.pick = i; me.k = ok; me.t = ms; me.gain = ok ? HN.award(ms, me.st, ph.cycle) : 0;
    if (ok) { me.s += me.gain; me.rs += me.gain; me.c++; }
    save(); push(); shownKey = ''; render(cur);
  }
  function teamText(t) {
    var mine = me.g === 'a' ? 'grown' : 'kids';
    if (!t.winner) return '🪢 That pull was a tie!';
    if (t.winner === mine) return t.robotOnly ? '🤖 Your robot helpers pulled for you!' : '💪 Your team won that pull in the tug-of-war!';
    return (t.winner === 'kids' ? 'The kids' : 'The grown-ups') + ' won that pull. 😬 Pull harder next time!';
  }
  function rankHtml() { return 'You’re <b>#' + rankInfo.r + '</b> of ' + rankInfo.n + (rankInfo.w || ''); }
  async function fetchRank(cycle) {
    rankFor = cycle;
    try {
      var all = await HN.allPlayers();
      if (!me) return;
      if (me.z != null && HN.game() != null && HN.game() !== me.z) { startOver(); return; }
      var grown = me.g === 'a', list = HN.rank(all).filter(function (p) { return (p.g === 'a') === grown; }), idx = -1;   // ranked within your own team
      teamLine = teamText(HN.pull(all, cycle)); var tb = document.getElementById('team'); if (tb) tb.textContent = teamLine;
      list.forEach(function (p, i) { if (p.id === me.pid) idx = i; });
      if (idx >= 0) { rankInfo = { r: idx + 1, n: list.length, w: grown ? ' grown-ups' : ' kids' }; var rb = document.getElementById('rank'); if (rb) rb.innerHTML = rankHtml(); }
    } catch (e) {}
  }
  function waitView() {
    var t = HN.now(), n = 0; while (n < 120 && HN.phase(t + n * 250).cycle < me.from) n++;   // seconds until the next fact card
    var secs = Math.ceil(n / 4);
    if (shownKey !== 'wait') {
      shownKey = 'wait';
      app.innerHTML = header(HN.phase()) + '<div class="panel"><div class="wait"><div class="emo">' + HN.esc(me.a) + '</div><div class="t">You’re in!</div>' +
        '<p class="soft">The game is in the middle of a question. You’ll join when the next fun fact starts. Get ready to remember it!</p><div class="n" id="wn"></div></div></div><div class="net" id="net"></div>';
    }
    var wn = document.getElementById('wn'); if (wn) wn.textContent = secs;
  }
  function render(ph) {
    if (me.from != null && ph.cycle < me.from) { waitView(); return; }
    var key = ph.cycle + ph.name + (me.q === ph.cycle ? 'a' : '');
    if (key !== shownKey) {
      shownKey = key;
      var q = HN.questionFor(ph.cycle), html = '';
      if (ph.name === 'reveal') { me.shown = me.s; if (me.q !== ph.cycle && me.st) { me.st = 0; push(); } }
      var dbl = HN.isDouble(ph.cycle) && ph.name !== 'reveal' ? '<div class="dbl">⚡ DOUBLE POINTS!</div>' : '';
      if (ph.name === 'fact') {
        var fc = HN.factFor(ph.cycle);
        html = dbl + '<div class="kick">Did you know?</div><div class="fact-e">' + fc.e + '</div><p class="fact-t">' + HN.esc(fc.f) + '</p><p class="soft" id="next"></p>';
      } else if (ph.name === 'question') {
        var mine = me.q === ph.cycle;
        html = dbl + '<div class="kick">🧠 Remember the last fact?</div><p class="q">' + HN.esc(q.q) + '</p><div class="answers' + (mine ? ' locked' : '') + '">' + q.opts.map(function (o, i) {
          return '<button class="ans o' + i + (mine && me.pick === i ? ' pick' : '') + '" data-i="' + i + '"' + (mine ? ' disabled' : '') + '><span class="shp">' + SHAPES[i] + '</span><span>' + HN.esc(o) + '</span></button>';
        }).join('') + '</div><p class="soft" style="text-align:center">' + (mine ? 'Locked in! Watch the big screen…' : 'Tap fast for bonus points!') + '</p>';
      } else {
        var did = me.q === ph.cycle;
        html = '<div class="result">' + (!did ? '<div class="emo">⏰</div><div class="t">Missed that one</div><p class="soft">The answer was <b>' + HN.esc(q.opts[q.right]) + '</b>. Get ready for the next one!</p>'
          : me.k ? '<div class="emo">🎉</div><div class="t">Correct!</div><div class="pts">+' + me.gain.toLocaleString() + (HN.isDouble(ph.cycle) ? ' ⚡ double!' : '') + '</div>' +
            (me.st >= HN.STREAK_AT ? '<div class="fire">🔥 On fire! ' + me.st + ' in a row (+10)</div>' : '')
          : '<div class="emo">🌲</div><div class="t">Not this time</div><p class="soft">The answer was <b>' + HN.esc(q.opts[q.right]) + '</b>.</p>') +
          '<div class="rankbox" id="rank">' + (rankInfo ? rankHtml() : 'Checking your place…') + '</div><div class="team" id="team">' + HN.esc(teamLine) + '</div></div>';
        if (rankFor !== ph.cycle) setTimeout(function () { fetchRank(ph.cycle); }, 1200);
      }
      app.innerHTML = header(ph) + '<div class="panel">' + html + '</div><div class="net" id="net"></div>';
      Array.prototype.forEach.call(app.querySelectorAll('.ans'), function (b) {
        b.addEventListener('pointerdown', function () { answer(ph, +b.getAttribute('data-i')); });
        b.addEventListener('click', function () { answer(ph, +b.getAttribute('data-i')); });
      });
      if (ph.name === 'reveal') save();
    }
    var nx = document.getElementById('next'); if (nx) nx.textContent = '🧠 Remember this! You’ll be asked about it after the next question. (' + Math.ceil(ph.left / 1000) + ')';
    var bar = document.getElementById('bar'); if (bar) bar.style.transform = 'scaleX(' + Math.max(0, ph.left / ph.len) + ')';
  }
  function tick() { if (me && me.g) render(HN.phase()); }

  if (me && me.pid && me.z === undefined) me.z = '';   // saved before Reset existed: belongs to the first game
  if (me && me.pid && me.g) { me.shown = me.shown == null ? me.s : me.shown; push(); tick(); }
  else {
    joinView();
    HN.allPlayers().then(function (all) { for (var k in all) taken[all[k].n] = 1; if (draft && taken[draft.n] && !me) { draft = HN.newName(taken, pickAv); joinView(); } }).catch(function () {});
  }
  setInterval(tick, 200);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && me) { wake(); shownKey = ''; tick(); } });
})();
</script>
</body>
</html>
