<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discover Lebanon Quiz</title>
<meta name="theme-color" content="#0c3326">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Phone: one column. Join card, then a play view that follows the big screen: fact -> four big answer buttons -> result. */
:root {
  --ground: #0c3326; --ground-2: #124434; --line: rgba(255,255,255,.14);
  --ink: #ffffff; --ink-soft: #c9ddd3; --red: #e23b2e; --cedar: #2fb36b; --gold: #f6b93b;
  --a0: #e5483c; --a1: #2f7fd8; --a2: #e9a51e; --a3: #1f9e5c;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(130% 80% at 50% 0%, var(--ground-2), var(--ground) 70%) fixed, var(--ground); color: var(--ink); font-family: var(--body);
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: 16px 20px; gap: 16px; }
.flag { width: 60px; height: 40px; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,.35); }
h1 { font-family: var(--display); font-weight: 800; font-size: 2.1rem; line-height: 1; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-soft); text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; font-weight: 700; margin-top: 4px; }
.head { display: flex; align-items: center; gap: 12px; }

/* join */
.card { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 20px; padding: 22px 18px; display: grid; justify-items: center; gap: 12px; text-align: center; }
.card .lbl { color: var(--ink-soft); font-weight: 700; font-size: .95rem; }
.big-av { font-size: 5.4rem; line-height: 1; }
.big-nm { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.05; }
button { font: inherit; cursor: pointer; border: 0; color: inherit; }
.btn { width: 100%; border-radius: 16px; padding: 16px; font-family: var(--display); font-weight: 800; font-size: 1.4rem; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.btn.go { background: var(--gold); color: #3a2600; }
.btn.alt { background: rgba(255,255,255,.12); font-size: 1.1rem; padding: 12px; box-shadow: none; }
.btn:focus-visible, .ans:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.how { color: var(--ink-soft); font-size: .95rem; line-height: 1.45; text-align: left; margin: 0; padding-left: 1.2em; }

/* play */
.me { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.me .av { font-size: 2.2rem; }
.me .nm { font-weight: 700; font-size: 1.05rem; line-height: 1.15; min-width: 0; }
.me .nm small { display: block; color: var(--ink-soft); font-weight: 400; font-size: .85rem; }
.me .sc { font-family: var(--display); font-weight: 800; font-size: 1.6rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); transform-origin: left; }
.panel { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.kick { font-family: var(--display); font-weight: 800; color: var(--gold); letter-spacing: .06em; text-transform: uppercase; font-size: 1rem; }
.fact-e { font-size: 4rem; line-height: 1; }
.fact-t { font-size: 1.3rem; line-height: 1.4; font-weight: 700; margin: 0; }
.soft { color: var(--ink-soft); font-size: 1rem; margin: 0; }
.q { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.12; margin: 0; text-wrap: balance; }
.answers { display: grid; gap: 12px; }
.ans { display: flex; align-items: center; gap: 12px; text-align: left; border-radius: 16px; padding: 16px 14px; min-height: 72px; font-size: 1.2rem; font-weight: 700;
  box-shadow: 0 5px 0 rgba(0,0,0,.3); transition: opacity .3s, transform .15s; }
.ans .shp { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: rgba(0,0,0,.18); font-size: 1.3rem; }
.ans.o0 { background: var(--a0); } .ans.o1 { background: var(--a1); } .ans.o2 { background: var(--a2); color: #2a1a00; } .ans.o3 { background: var(--a3); }
.ans:active { transform: translateY(3px); }
.locked .ans { opacity: .3; } .locked .ans.pick { opacity: 1; outline: 4px solid #fff; outline-offset: 2px; }
.result { text-align: center; display: grid; gap: 8px; justify-items: center; padding-top: 10px; }
.result .emo { font-size: 4.6rem; line-height: 1; }
.result .t { font-family: var(--display); font-weight: 800; font-size: 2.2rem; line-height: 1.05; }
.result .pts { font-family: var(--display); font-weight: 800; font-size: 1.8rem; color: var(--gold); }
.rankbox { margin-top: 6px; background: rgba(255,255,255,.08); border-radius: 16px; padding: 12px 18px; font-size: 1.15rem; font-weight: 700; }
.rankbox b { font-family: var(--display); font-size: 1.8rem; color: var(--gold); }
.net { text-align: center; color: var(--ink-soft); font-size: .85rem; min-height: 1em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="hn-core.js?v=2"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var SHAPES = ['▲', '◆', '●', '■'];
  var KEY = 'heritagenight.me.' + HN.EVENT;
  var FLAG = '<svg class="flag" viewBox="0 0 30 20" aria-label="Flag of Lebanon"><rect width="30" height="20" fill="#e23b2e"/><rect y="5" width="30" height="10" fill="#fff"/><g fill="#1f9e5c"><path d="M15 5.6l2.6 3.2h-1.3l2.4 2.6h-1.5l2.6 2.4H10.2l2.6-2.4h-1.5l2.4-2.6h-1.3z"/><rect x="14.5" y="13.8" width="1" height="1.2"/></g></svg>';
  var me = HN.lsGet(KEY), draft = null, taken = {}, shownKey = '', dirty = false, saving = false, rankInfo = null, rankFor = -1;

  function save() { HN.lsSet(KEY, me); }
  function rid(n) { var a = new Uint8Array(n), s = ''; crypto.getRandomValues(a); for (var i = 0; i < n; i++) s += 'abcdefghijklmnopqrstuvwxyz0123456789'[a[i] % 36]; return s; }
  function entry() { return { n: me.n, a: me.a, s: me.s, c: me.c, j: me.j, q: me.q == null ? -1 : me.q, k: !!me.k, t: me.t || 0 }; }
  async function push() {
    if (saving) { dirty = true; return; }
    saving = true; dirty = false;
    try { await HN.saveEntry(me.pid, entry()); net(''); }
    catch (e) { dirty = true; net('Having trouble connecting… your points are saved on this phone.'); }
    saving = false;
    if (dirty) setTimeout(push, 1500);
  }
  function net(t) { var n = document.getElementById('net'); if (n) n.textContent = t; }
  function wake() { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }

  /* ---------- join ---------- */
  function joinView() {
    if (!draft) draft = HN.newName(taken);
    app.innerHTML = '<div class="head">' + FLAG + '<div><h1>Discover Lebanon</h1><div class="sub">Family Heritage Night</div></div></div>' +
      '<div class="card"><div class="lbl">Your player name</div><div class="big-av">' + HN.esc(draft.a) + '</div><div class="big-nm">' + HN.esc(draft.n) + '</div>' +
      '<button class="btn alt" id="reroll">🎲 Pick a different name</button><button class="btn go" id="go">Let’s play!</button></div>' +
      '<ol class="how"><li>Read the fun fact on the big screen.</li><li>When the question comes, tap your answer here.</li><li>Right answers score points. Faster answers score more!</li></ol>' +
      '<div class="net" id="net"></div>';
    document.getElementById('reroll').onclick = function () { draft = HN.newName(taken); joinView(); };
    document.getElementById('go').onclick = function () {
      me = { pid: rid(16), n: draft.n, a: draft.a, s: 0, c: 0, j: Date.now(), q: -1 };
      save(); wake(); shownKey = ''; push(); tick();
    };
  }

  /* ---------- play ---------- */
  function header(ph) {
    var r = rankInfo ? ' · #' + rankInfo.r + ' of ' + rankInfo.n : '';
    return '<div class="me"><span class="av">' + HN.esc(me.a) + '</span><span class="nm">' + HN.esc(me.n) + '<small>' + me.c + ' right' + r + '</small></span><span class="sc" id="sc">' + (me.shown || 0).toLocaleString() + '</span></div>' +
      '<div class="bar"><i id="bar"></i></div>';
  }
  function answer(ph, i) {
    var cur = HN.phase();
    if (cur.name !== 'question' || cur.cycle !== ph.cycle || me.q === ph.cycle) return;
    var q = HN.questionFor(ph.cycle), ms = Math.max(0, HN.now() - cur.qStart), ok = i === q.right;
    me.q = ph.cycle; me.pick = i; me.k = ok; me.t = ms; me.gain = ok ? HN.points(ms) : 0;
    if (ok) { me.s += me.gain; me.c++; }
    save(); push(); shownKey = ''; render(cur);
  }
  async function fetchRank(cycle) {
    rankFor = cycle;
    try {
      var list = HN.rank(await HN.allPlayers()), idx = -1;
      list.forEach(function (p, i) { if (p.id === me.pid) idx = i; });
      if (idx >= 0) { rankInfo = { r: idx + 1, n: list.length }; var rb = document.getElementById('rank'); if (rb) rb.innerHTML = 'You’re <b>#' + rankInfo.r + '</b> of ' + rankInfo.n; }
    } catch (e) {}
  }
  function render(ph) {
    var key = ph.cycle + ph.name + (me.q === ph.cycle ? 'a' : '');
    if (key !== shownKey) {
      shownKey = key;
      var q = HN.questionFor(ph.cycle), html = '';
      if (ph.name === 'reveal') me.shown = me.s;
      if (ph.name === 'fact') {
        html = '<div class="kick">Did you know?</div><div class="fact-e">' + q.e + '</div><p class="fact-t">' + HN.esc(q.f) + '</p><p class="soft" id="next"></p>';
      } else if (ph.name === 'question') {
        var mine = me.q === ph.cycle;
        html = '<p class="q">' + HN.esc(q.q) + '</p><div class="answers' + (mine ? ' locked' : '') + '">' + q.opts.map(function (o, i) {
          return '<button class="ans o' + i + (mine && me.pick === i ? ' pick' : '') + '" data-i="' + i + '"' + (mine ? ' disabled' : '') + '><span class="shp">' + SHAPES[i] + '</span><span>' + HN.esc(o) + '</span></button>';
        }).join('') + '</div><p class="soft" style="text-align:center">' + (mine ? 'Locked in! Watch the big screen…' : 'Tap fast for bonus points!') + '</p>';
      } else {
        var did = me.q === ph.cycle;
        html = '<div class="result">' + (!did ? '<div class="emo">⏰</div><div class="t">Missed that one</div><p class="soft">The answer was <b>' + HN.esc(q.opts[q.right]) + '</b>. Get ready for the next one!</p>'
          : me.k ? '<div class="emo">🎉</div><div class="t">Correct!</div><div class="pts">+' + me.gain.toLocaleString() + '</div>'
          : '<div class="emo">🌲</div><div class="t">Not this time</div><p class="soft">The answer was <b>' + HN.esc(q.opts[q.right]) + '</b>.</p>') +
          '<div class="rankbox" id="rank">' + (rankInfo ? 'You’re <b>#' + rankInfo.r + '</b> of ' + rankInfo.n : 'Checking your place…') + '</div></div>';
        if (rankFor !== ph.cycle) setTimeout(function () { fetchRank(ph.cycle); }, 1200);
      }
      app.innerHTML = header(ph) + '<div class="panel">' + html + '</div><div class="net" id="net"></div>';
      Array.prototype.forEach.call(app.querySelectorAll('.ans'), function (b) {
        b.addEventListener('pointerdown', function () { answer(ph, +b.getAttribute('data-i')); });
        b.addEventListener('click', function () { answer(ph, +b.getAttribute('data-i')); });
      });
      if (ph.name === 'reveal') save();
    }
    var nx = document.getElementById('next'); if (nx) nx.textContent = 'Question in ' + Math.ceil(ph.left / 1000) + '… look up at the big screen!';
    var bar = document.getElementById('bar'); if (bar) bar.style.transform = 'scaleX(' + Math.max(0, ph.left / ph.len) + ')';
  }
  function tick() { if (me) render(HN.phase()); }

  if (me && me.pid) { me.shown = me.shown == null ? me.s : me.shown; push(); tick(); }
  else {
    joinView();
    HN.allPlayers().then(function (all) { for (var k in all) taken[all[k].n] = 1; if (draft && taken[draft.n] && !me) { draft = HN.newName(taken); joinView(); } }).catch(function () {});
  }
  setInterval(tick, 200);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && me) { wake(); shownKey = ''; tick(); } });
})();
</script>
</body>
</html>
